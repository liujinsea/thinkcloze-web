<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SAT教学语言" />
<meta name="theme-color" content="#3157d5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>SAT教学语言练习</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#70758a;--line:#e6e7ef;--primary:#3157d5;--good:#0a8f5a;--bad:#ce2f45;--chip:#eef2ff;--warn:#fff8df;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.94);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:4px 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
button,select,input{font:inherit}
.tab,.btn{border:0;border-radius:14px;padding:11px 10px;background:#fff;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.tab.active,.btn.primary{background:var(--primary);color:#fff}
.btn{width:100%;margin:6px 0;font-weight:650}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(28,32,54,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--chip);padding:5px 9px;font-size:12px;color:#293b8f;margin:3px}
.promptLabel{color:var(--muted);font-size:13px;margin-top:12px}
.term{font-size:30px;font-weight:800;line-height:1.22;margin:18px 0 14px;overflow-wrap:anywhere}
.answer{font-size:22px;line-height:1.42;margin:16px 0;color:#213f98;font-weight:760;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;line-height:1.55;background:#fafafd;border-radius:14px;padding:10px;margin-top:10px}
select,input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.num{font-size:22px;font-weight:800}
.label{font-size:12px;color:var(--muted)}
.option{width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;line-height:1.35;overflow-wrap:anywhere}
.option.correct{border-color:var(--good);background:#eefaf5}
.option.wrong{border-color:var(--bad);background:#fff0f2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn.star{background:var(--warn);border:1px solid #f0d36a;color:#765a00}
.btn.done{background:#eefaf5;border:1px solid #9dddbf;color:#075f3b}
.listItem{padding:12px 0;border-bottom:1px solid var(--line)}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
.center{text-align:center}
.speakBtn{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;font-size:13px;background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none;margin:2px 0 8px}
.content-top{display:none;align-items:center;gap:12px;margin:0 0 10px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.content-top .btn{width:auto;margin:0;padding:8px 12px}
.content-title{font-weight:800;color:var(--muted)}
body.subject-view .panel,body.subject-view .content-top{display:none}
body.subject-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.subject-view .tabs,body.subject-view .subject-back{display:none}
.subject-menu{display:none}
body.subject-view .subject-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:28px 0 0}
.subject-card{min-height:190px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);text-align:left;box-shadow:0 16px 34px rgba(28,32,54,.08)}
.subject-card-title{font-size:24px;font-weight:800;line-height:1.15}
.subject-card-meta{color:var(--muted);font-size:14px;line-height:1.5}
.subject-card-action{display:inline-flex;align-items:center;justify-content:center;width:fit-content;min-height:40px;border-radius:6px;background:var(--primary);color:#fff;padding:0 16px;font-size:16px;font-weight:700}
.subject-back{display:inline-flex;width:auto;margin:18px 0 0;padding:8px 12px}
body.menu-view .panel{display:none}
body.content-view header{display:none}
body.content-view .content-top{display:flex}
body.content-view #study .study-setup{display:block}
body.subject-view .app{max-width:980px;padding:44px 18px 28px}
body.subject-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.subject-view .sub{font-size:16px;max-width:780px}
body.menu-view .app{max-width:980px;padding:44px 18px 28px}
body.menu-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.menu-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.menu-view .sub{font-size:16px;max-width:780px}
body.menu-view .tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0 0}
body.menu-view .tab{min-height:92px;display:flex;align-items:flex-end;justify-content:flex-start;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:18px;font-weight:800;text-align:left;box-shadow:0 10px 26px rgba(28,32,54,.06)}
@media (min-width:900px){
  .app{max-width:980px;padding:14px 18px 28px}
  h1{font-size:20px;margin:2px 0 4px}
  .sub{font-size:12px}
  .tabs{gap:8px;margin:10px 0 8px}
  .tab,.btn{border-radius:12px;padding:8px 9px;font-size:14px}
  .card{border-radius:18px;padding:14px;margin:10px 0}
  .term{font-size:26px;margin:14px 0 12px;line-height:1.18}
  .answer{font-size:18px;margin:10px 0}
  .note{font-size:13px;line-height:1.4;padding:8px;margin-top:8px}
  select,input{padding:9px;border-radius:12px;margin:4px 0 8px;font-size:14px}
  .stats{gap:8px}
  .stat{border-radius:14px;padding:8px}
  .num{font-size:18px}
  .label{font-size:11px}
  .option{margin:6px 0;padding:10px 12px;border-radius:13px;font-size:15px;line-height:1.3}
  .actions{gap:8px;margin-top:8px}
  .actions .btn{font-size:14px;padding:8px 9px}
  .pill{font-size:11px;padding:4px 8px}
  .listItem{padding:9px 0}
  body.menu-view .app{padding-top:38px}
}
@media (max-width:480px){
  .app{padding:14px 12px 36px}
  .term{font-size:26px}
  .answer{font-size:20px}
  .option{padding:13px;font-size:16px}
  .stats{gap:7px}
  .stat{padding:9px 5px}
  .label{font-size:11px}
  body.subject-view .app{padding:24px 14px 24px}
  body.subject-view h1{font-size:28px}
  body.subject-view .sub{font-size:14px}
  body.menu-view .app{padding:24px 14px 24px}
  body.menu-view h1{font-size:28px}
  body.menu-view .sub{font-size:14px}
  body.menu-view .tabs{grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  body.menu-view .tab{min-height:74px;border-radius:16px;padding:14px;font-size:16px}
  body.subject-view .subject-menu{grid-template-columns:1fr;gap:10px;margin-top:20px}
  .subject-card{min-height:172px;padding:18px}
}
</style>
</head>
<body class="menu-view"><div class="app">
<header>
  <h1 id="appTitle">SAT教学语言练习</h1>
  <div class="sub" id="appSub">请选择科目：Reading / SAT阅读2.0 / Writing / SAT文法V2.0 / Math</div>
  <button class="btn ghost subject-back" id="subjectBackBtn" type="button">返回科目选择</button>
  <div class="tabs">
    <button class="tab" data-tab="study">背诵</button>
    <button class="tab" data-tab="quiz">测验</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="wrong">错题</button>
    <button class="tab" data-tab="list">句表</button>
  </div>
</header>
<section class="subject-menu" id="subjectMenu" aria-label="选择科目"></section>
<div class="content-top"><button class="btn ghost" id="backToMenu" type="button">返回Teacher主页</button><div class="content-title" id="contentTitle"></div></div>

<section id="study" class="panel">
  <div class="card study-setup">
    <label for="scope">选择范围</label>
    <select id="scope"></select>
    <div class="stats">
      <div class="stat"><div class="num" id="totalN">0</div><div class="label">待练</div></div>
      <div class="stat"><div class="num" id="knownN">0</div><div class="label">已掌握</div></div>
      <div class="stat"><div class="num" id="wrongN">0</div><div class="label">错题</div></div>
      <div class="stat"><div class="num" id="dueN">0</div><div class="label">今日复习</div></div>
    </div>
  </div>
  <div class="card center">
    <div id="cardMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="studyTerm">-</div>
    <button class="btn primary" id="showBtn">显示英文</button>
    <div id="answerBox" class="hidden">
      <div class="answer" id="studyMeaning"></div>
      <button class="speakBtn" id="studySpeakBtn" type="button">朗读英文</button>
      <div class="note" id="studyNote"></div>
      <button class="btn good" id="knowBtn">已掌握</button>
      <button class="btn bad" id="dontKnowBtn">还不熟 / 加入错题</button>
    </div>
    <button class="btn ghost" id="nextBtn">下一张</button>
  </div>
</section>

<section id="quiz" class="panel">
  <div class="hidden">
    <label for="quizScope">测验范围</label>
    <select id="quizScope"></select>
    <button class="btn primary" id="startQuiz">开始 / 下一题</button>
  </div>
  <div class="card">
    <div id="quizMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="quizTerm">点击开始</div>
    <div id="options"></div>
    <div class="actions">
      <button class="btn bad" id="favQuizBtn">未掌握</button>
      <button class="btn done" id="knownQuizBtn">已掌握</button>
    </div>
    <div id="quizFeedback" class="note hidden"></div>
  </div>
</section>

<section id="review" class="panel">
  <div class="card">
    <div class="row"><strong>间隔复习</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="startReview">开始今日复习</button></div>
  </div>
  <div class="card">
    <div id="reviewMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="reviewTerm">今日到期表达会显示在这里</div>
    <div id="reviewOptions"></div>
    <div id="reviewFeedback" class="note hidden"></div>
  </div>
  <div class="card" id="reviewList"></div>
</section>

<section id="wrong" class="panel">
  <div class="card">
    <div class="row"><strong>错题本</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="wrongQuizBtn">错题集中测验</button><button class="btn ghost" style="width:auto;padding:9px 12px" id="clearWrong">清空</button></div>
  </div>
  <div class="card" id="wrongList"></div>
</section>

<section id="list" class="panel">
  <div class="card">
    <input id="search" placeholder="搜索中文 / 英文 / Unit / ID" />
    <select id="listScope"></select>
  </div>
  <div class="card" id="cardList"></div>
</section>
</div>

<script>
const SOURCE_CARDS = [{"ID":"G001","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先观察选项之间的区别。","English":"First, compare the answer choices.","Keywords":"","Example":""},{"ID":"G002","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"你注意到了什么区别？","English":"What differences do you notice?","Keywords":"","Example":""},{"ID":"G003","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"仔细比较选项。","English":"Compare the choices carefully.","Keywords":"","Example":""},{"ID":"G004","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要急着选答案。","English":"Don't rush to choose an answer.","Keywords":"","Example":""},{"ID":"G005","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注选项中变化的部分。","English":"Pay attention to what changes from one option to another.","Keywords":"","Example":""},{"ID":"G006","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"这道题考什么？","English":"What is being tested here?","Keywords":"","Example":""},{"ID":"G007","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"我们一步一步来。","English":"Let's work through it step by step.","Keywords":"","Example":""},{"ID":"G008","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先判断考点。","English":"Let's identify the issue first.","Keywords":"","Example":""},{"ID":"G009","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格前面的词。","English":"Look at the word immediately before the blank.","Keywords":"","Example":""},{"ID":"G010","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格后面的词。","English":"Look at the word immediately after the blank.","Keywords":"","Example":""},{"ID":"G011","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"把句子大声读出来。","English":"Read the sentence aloud.","Keywords":"","Example":""},{"ID":"G012","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要依赖语感。","English":"Don't rely on your ear alone.","Keywords":"","Example":""},{"ID":"G013","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"语法优先，意思其次。","English":"Grammar comes first; meaning comes second.","Keywords":"","Example":""},{"ID":"G014","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先保证句子结构正确。","English":"Make sure the sentence structure is correct first.","Keywords":"","Example":""},{"ID":"G015","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"然后再检查意思是否通顺。","English":"Then check whether the meaning works.","Keywords":"","Example":""},{"ID":"G016","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"这道题考察句子边界。","English":"This question tests sentence boundaries.","Keywords":"","Example":""},{"ID":"G017","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先分析句子结构。","English":"Let's analyze the sentence structure first.","Keywords":"","Example":""},{"ID":"G018","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"我们有一个独立分句还是两个独立分句？","English":"Do we have one independent clause or two independent clauses?","Keywords":"","Example":""},{"ID":"G019","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个完整句吗？","English":"Is this a complete sentence?","Keywords":"","Example":""},{"ID":"G020","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句可以独立成句。","English":"This clause can stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G021","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句不能独立成句。","English":"This clause cannot stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G022","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个残句。","English":"This is a sentence fragment.","Keywords":"","Example":""},{"ID":"G023","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个连写句。","English":"This is a run-on sentence.","Keywords":"","Example":""},{"ID":"G024","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个逗号拼接错误。","English":"This is a comma splice.","Keywords":"","Example":""},{"ID":"G025","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句子已经完整了。","English":"The sentence is already complete.","Keywords":"","Example":""},{"ID":"G026","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要句号。","English":"We do not need a period here.","Keywords":"","Example":""},{"ID":"G027","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要分号。","English":"We do not need a semicolon here.","Keywords":"","Example":""},{"ID":"G028","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句号可以分隔两个完整句。","English":"A period can separate two complete sentences.","Keywords":"","Example":""},{"ID":"G029","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"分号可以连接两个相关的独立分句。","English":"A semicolon can join two closely related independent clauses.","Keywords":"","Example":""},{"ID":"G030","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"逗号不能单独连接两个独立分句。","English":"A comma alone cannot join two independent clauses.","Keywords":"","Example":""},{"ID":"G031","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里需要更强的停顿。","English":"We need a stronger break here.","Keywords":"","Example":""},{"ID":"G032","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不应该断开句子。","English":"We should not break the sentence here.","Keywords":"","Example":""},{"ID":"G033","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先找主句在哪里。","English":"First, find the main clause.","Keywords":"","Example":""},{"ID":"G034","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"哪个部分承载句子的主要意思？","English":"Which part carries the main meaning of the sentence?","Keywords":"","Example":""},{"ID":"G035","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个结构在语法上不完整。","English":"This structure is grammatically incomplete.","Keywords":"","Example":""},{"ID":"G036","Subject":"Grammar","Unit":"Punctuation","Level":1,"Chinese":"这道题考察标点。","English":"This question tests punctuation.","Keywords":"","Example":""},{"ID":"G037","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"标点不是随机的。","English":"Punctuation is not random.","Keywords":"","Example":""},{"ID":"G038","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"每个标点都有语法功能。","English":"Every punctuation mark has a grammatical function.","Keywords":"","Example":""},{"ID":"G039","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号前面必须是完整句。","English":"A colon must follow a complete sentence.","Keywords":"","Example":""},{"ID":"G040","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号后面通常是解释、例子或列表。","English":"A colon usually introduces an explanation, an example, or a list.","Keywords":"","Example":""},{"ID":"G041","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"破折号可以强调补充信息。","English":"A dash can emphasize additional information.","Keywords":"","Example":""},{"ID":"G042","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"一对破折号可以插入非必要信息。","English":"A pair of dashes can set off nonessential information.","Keywords":"","Example":""},{"ID":"G043","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"逗号可以隔开非必要信息。","English":"Commas can set off nonessential information.","Keywords":"","Example":""},{"ID":"G044","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"如果这里有一个逗号，通常还需要另一个逗号。","English":"If we have one comma here, we usually need another comma.","Keywords":"","Example":""},{"ID":"G045","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个插入语应该被逗号隔开。","English":"This interruption should be set off by commas.","Keywords":"","Example":""},{"ID":"G046","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子仍然成立。","English":"If we remove this part, the sentence still works.","Keywords":"","Example":""},{"ID":"G047","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是非必要信息。","English":"Therefore, this information is nonessential.","Keywords":"","Example":""},{"ID":"G048","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子意思不完整。","English":"If we remove this part, the sentence becomes incomplete.","Keywords":"","Example":""},{"ID":"G049","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是必要信息。","English":"Therefore, this information is essential.","Keywords":"","Example":""},{"ID":"G050","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这里的逗号会打断主语和动词。","English":"This comma would separate the subject from the verb.","Keywords":"","Example":""},{"ID":"G051","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"主语和动词之间通常不需要逗号。","English":"We normally do not put a comma between the subject and the verb.","Keywords":"","Example":""},{"ID":"G052","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"动词和宾语之间不能随便加逗号。","English":"We should not place a comma between the verb and its object.","Keywords":"","Example":""},{"ID":"G053","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个标点会制造不必要的停顿。","English":"This punctuation creates an unnecessary break.","Keywords":"","Example":""},{"ID":"G054","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点使用正确。","English":"This option uses punctuation correctly.","Keywords":"","Example":""},{"ID":"G055","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点破坏了句子结构。","English":"This punctuation breaks the sentence structure.","Keywords":"","Example":""},{"ID":"G056","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"这道题考察主谓一致。","English":"This question tests subject-verb agreement.","Keywords":"","Example":""},{"ID":"G057","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"先找主语。","English":"Let's identify the subject first.","Keywords":"","Example":""},{"ID":"G058","Subject":"Grammar","Unit":"Agreement","Level":2,"Chinese":"不要看离动词最近的名词。","English":"Don't look at the noun closest to the verb.","Keywords":"","Example":" ding","Unit":"Paired Texts and Data","Level":2,"Chinese":"第二篇如何回应第一篇？","English":"How does the second passage respond to the first?","Keywords":"","Example":""},{"ID":"R096","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"这是图表题。","English":"This is a data question.","Keywords":"","Example":""},{"ID":"R097","Subject":"Reading","Unit":"Paired Texts and Data","Level":1,"Chinese":"先读图表标题。","English":"Read the title of the graph first.","Keywords":"","Example":""},{"ID":"R098","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"看横轴和纵轴。","English":"Look at the x-axis and the y-axis.","Keywords":"","Example":""},{"ID":"R099","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"这个数据支持哪个说法？","English":"Which claim does this data support?","Keywords":"","Example":""},{"ID":"R100","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"这个数据削弱哪个说法？","English":"Which claim does this data weaken?","Keywords":"","Example":""},{"ID":"R101","Subject":"Reading","Unit":"Paired Texts and Data","Level":1,"Chinese":"不要忽略单位。","English":"Do not ignore the units.","Keywords":"","Example":""},{"ID":"R102","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"比较趋势，而不是单个数字。","English":"Compare the trend, not just one number.","Keywords":"","Example":""},{"ID":"R103","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"这个选项和图表不一致。","English":"This choice is inconsistent with the graph.","Keywords":"","Example":""},{"ID":"R104","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"图表支持原文中的观点。","English":"The graph supports the claim in the passage.","Keywords":"","Example":""},{"ID":"R105","Subject":"Reading","Unit":"Paired Texts and Data","Level":2,"Chinese":"图表和原文形成对比。","English":"The graph contrasts with the passage.","Keywords":"","Example":""},{"ID":"G001","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先看选项差异，不要先看原句。","English":"Start with the answer choices, not the sentence.","Keywords":"strategy, answer choices","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G002","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"选项差异会告诉我们这题在考什么。","English":"The differences among the choices tell us what is being tested.","Keywords":"strategy, issue","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G003","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先判断考点，再判断答案。","English":"Identify the issue first, and then choose the answer.","Keywords":"strategy, issue","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G004","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先不要凭语感选。","English":"Do not choose by feel first.","Keywords":"strategy, grammar first","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G005","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"SAT 文法题要先看结构，再看意思。","English":"In SAT grammar, check structure first and meaning second.","Keywords":"structure, meaning","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G006","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"把句子主干找出来。","English":"Find the core structure of the sentence.","Keywords":"core sentence, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G007","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先找主语和谓语。","English":"Find the subject and the verb first.","Keywords":"subject, verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G008","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先判断空格前后能不能连在一起。","English":"First decide whether the words before and after the blank can connect.","Keywords":"blank, connection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G009","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"不要被中间的修饰语带偏。","English":"Do not be distracted by the modifier in the middle.","Keywords":"modifier, distraction","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G010","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先把插入成分拿掉看主干。","English":"Remove the interruption and look at the core sentence.","Keywords":"interruption, core","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G011","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"这道题不是问哪个更像中文，而是问哪个英语结构合法。","English":"This question is not about what sounds natural in Chinese; it is about what is grammatically legal in English.","Keywords":"grammar, legal structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G012","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"每个选项都要回到原句里检查。","English":"Put each choice back into the sentence and check it.","Keywords":"substitution, checking","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G013","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"不要只看空格本身，要看整个句子。","English":"Do not look only at the blank; look at the whole sentence.","Keywords":"whole sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G014","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"这类题通常有一个语法硬规则。","English":"This type of question usually depends on a hard grammar rule.","Keywords":"rule, grammar","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G015","Subject":"GrammarV2","Unit":"General","Level":1,"Chinese":"先排除结构错误的选项。","English":"Eliminate choices with structural errors first.","Keywords":"elimination, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G016","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"如果两个选项都通顺，优先选择结构更准确、表达更简洁的选项。","English":"If two choices both make sense, prefer the one that is structurally accurate and concise.","Keywords":"conciseness, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G017","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"这里我们要问：这个词在句子中承担什么功能？","English":"Here we should ask: what function does this word serve in the sentence?","Keywords":"function, syntax","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G018","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是标点，所以这不是词义题，而是句子结构题。","English":"The choices differ in punctuation, so this is not a vocabulary question; it is a sentence-structure question.","Keywords":"punctuation, sentence structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G019","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是动词形式，所以要检查主语、时态和语态。","English":"The choices differ in verb form, so check the subject, tense, and voice.","Keywords":"verb form, tense, voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G020","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是代词，所以要回到前文找先行词。","English":"The choices differ in pronoun form, so go back and find the antecedent.","Keywords":"pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G021","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是连接词，所以要判断前后逻辑关系。","English":"The choices differ in transition words, so determine the logical relationship.","Keywords":"transition, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G022","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是单复数，所以要找真正控制它的名词。","English":"The choices differ in number, so find the noun that controls it.","Keywords":"number, head noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G023","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"选项变化的是从句结构，所以要判断这是独立句、从属句还是修饰语。","English":"The choices differ in clause structure, so decide whether it is an independent clause, a dependent clause, or a modifier.","Keywords":"clause, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G024","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"先把错误类型说清楚，再解释为什么正确答案成立。","English":"Name the error type first, then explain why the correct answer works.","Keywords":"explanation, error type","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G025","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"正确答案必须同时满足语法、逻辑和简洁性。","English":"The correct answer must satisfy grammar, logic, and concision at the same time.","Keywords":"grammar, logic, concision","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G026","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"不要为了保留原文信息而牺牲语法结构。","English":"Do not sacrifice grammatical structure just to keep the wording of the original sentence.","Keywords":"structure, wording","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G027","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"如果一个选项制造了新错误，即使意思接近也要排除。","English":"If a choice creates a new error, eliminate it even if the meaning is close.","Keywords":"new error, elimination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G028","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"这不是找最漂亮的表达，而是找最不出错的表达。","English":"We are not looking for the prettiest wording; we are looking for the wording that does not create an error.","Keywords":"accuracy, SAT style","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G029","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"把答案读回去时，要检查空格两边是否同时成立。","English":"When you read the answer back into the sentence, check both sides of the blank.","Keywords":"checking, both sides","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G030","Subject":"GrammarV2","Unit":"General","Level":2,"Chinese":"先做语法判断，最后再用语义确认。","English":"Make the grammar decision first, and use meaning only to confirm it at the end.","Keywords":"grammar first, meaning check","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G031","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"这道题考句子边界。","English":"This question tests sentence boundaries.","Keywords":"sentence boundaries","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G032","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"先判断空格前是不是完整句。","English":"First decide whether the part before the blank is a complete sentence.","Keywords":"complete sentence, before blank","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G033","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"再判断空格后是不是完整句。","English":"Then decide whether the part after the blank is a complete sentence.","Keywords":"complete sentence, after blank","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G034","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"完整句必须有主语和限定谓语。","English":"A complete sentence must have a subject and a finite verb.","Keywords":"complete sentence, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G035","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"一个独立分句可以单独成句。","English":"An independent clause can stand alone as a sentence.","Keywords":"independent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G036","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"从属分句不能单独成句。","English":"A dependent clause cannot stand alone as a sentence.","Keywords":"dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G037","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是残句，不是完整句。","English":"This is a fragment, not a complete sentence.","Keywords":"fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G038","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是连写句，两个完整句被硬接在一起。","English":"This is a run-on sentence; two complete sentences are joined incorrectly.","Keywords":"run-on","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G039","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是逗号拼接，逗号不能单独连接两个完整句。","English":"This is a comma splice; a comma alone cannot join two complete sentences.","Keywords":"comma splice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G040","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"句号可以分开两个完整句。","English":"A period can separate two complete sentences.","Keywords":"period, independent clauses","Example":"IC. IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G041","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"分号可以连接两个相关的独立分句。","English":"A semicolon can join two closely related independent clauses.","Keywords":"semicolon, independent clauses","Example":"IC; IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G042","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"逗号加并列连词可以连接两个完整句。","English":"A comma plus a coordinating conjunction can join two complete sentences.","Keywords":"comma, FANBOYS","Example":"IC, and IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G043","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"只有逗号不够。","English":"A comma alone is not enough.","Keywords":"comma splice","Example":"IC, IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G044","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"只有连接词也不够，标点也要正确。","English":"The conjunction alone is not enough; the punctuation must also be correct.","Keywords":"conjunction, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G045","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":1,"Chinese":"句子已经完整了，不要再硬加一个谓语。","English":"The sentence is already complete; do not force in another predicate.","Keywords":"extra verb, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G046","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果空格前后都是完整句，不能用普通逗号。","English":"If both sides of the blank are complete sentences, we cannot use an ordinary comma.","Keywords":"comma splice, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G047","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果后一部分只是补充说明，不一定需要独立成句。","English":"If the second part only adds explanation, it does not always need to be an independent sentence.","Keywords":"supplement, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G048","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果前面是完整设定，冒号后可以给出解释或列表。","English":"If the first part is a complete setup, a colon can introduce an explanation or a list.","Keywords":"colon, complete setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G049","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果前面不是完整句，冒号通常不能直接使用。","English":"If the setup before the colon is not a complete sentence, a colon usually cannot be used.","Keywords":"colon, incomplete setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G050","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"however、therefore、consequently 这类副词不能像 and 一样直接连接两个完整句。","English":"Adverbs such as however, therefore, and consequently cannot connect two complete sentences the way and can.","Keywords":"conjunctive adverb","Example":"IC; however, IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G051","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"连接副词前面通常需要句号或分号。","English":"A conjunctive adverb usually needs a period or a semicolon before it.","Keywords":"conjunctive adverb, semicolon","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G052","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"because 开头会把完整句降级为从属分句。","English":"Starting with because turns the clause into a dependent clause.","Keywords":"because, subordination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G053","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"although、while、when 这类词会制造从属关系。","English":"Words like although, while, and when create subordination.","Keywords":"subordinator, dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G054","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"从属结构可以解决连写句，但不能改变原句逻辑。","English":"Subordination can fix a run-on, but it must not change the intended logic.","Keywords":"subordination, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G055","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"that 从句如果作主语，后面还需要主句谓语。","English":"If a that-clause is the subject, the sentence still needs a main verb afterward.","Keywords":"that-clause, subject","Example":"That the result changed was surprising.","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G056","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"动名词短语可以作主语，但后面仍然需要谓语。","English":"A gerund phrase can serve as the subject, but it still needs a verb after it.","Keywords":"gerund phrase, subject","Example":"Analyzing the data shows...","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G057","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"分词短语不是完整句，因为它没有限定谓语。","English":"A participial phrase is not a complete sentence because it has no finite verb.","Keywords":"participle, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G058","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"同位语短语只是补充名词，不是完整句。","English":"An appositive phrase only renames a noun; it is not a complete sentence.","Keywords":"appositive, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G059","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"介词短语不能单独构成完整句。","English":"A prepositional phrase cannot form a complete sentence by itself.","Keywords":"prepositional phrase, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G060","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里的问题不是意思不通，而是缺少句子主干。","English":"The problem here is not meaning; the sentence is missing its core structure.","Keywords":"missing core, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G061","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不能用分号，因为分号两边必须都是独立分句。","English":"We cannot use a semicolon here because both sides of a semicolon must be independent clauses.","Keywords":"semicolon, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G062","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不能用句号，因为句号后面不是完整句。","English":"We cannot use a period here because what follows is not a complete sentence.","Keywords":"period, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G063","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里可以用破折号，因为后面是补充解释，而不是另一个主句。","English":"A dash can work here because the second part is an explanation, not another main clause.","Keywords":"dash, explanation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G064","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"先把句子切成左右两块，再判断每一块能不能独立。","English":"Split the sentence into the left side and the right side, and check whether each side can stand alone.","Keywords":"chunking, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G065","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果一个选项让句子只剩从句，它就是残句。","English":"If a choice leaves the sentence as only a dependent clause, it creates a fragment.","Keywords":"fragment, dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G066","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果一个选项让两个主句没有合法连接，它就是连写句。","English":"If a choice leaves two main clauses without a legal connection, it creates a run-on.","Keywords":"run-on, main clauses","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G067","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"两个完整句之间要么强断开，要么合法连接。","English":"Between two complete sentences, either separate them fully or connect them legally.","Keywords":"boundary, legal connection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G068","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"冒号不是万能连接符，它需要前面有完整设定。","English":"A colon is not a universal connector; it needs a complete setup before it.","Keywords":"colon, setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G069","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"破折号可以插入补充信息，但不能修复所有句子边界错误。","English":"A dash can insert extra information, but it cannot fix every sentence-boundary error.","Keywords":"dash, boundaries","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G070","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"句子边界题最怕只凭停顿感。","English":"In boundary questions, relying only on pauses is dangerous.","Keywords":"pause, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G071","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"标点不是用来表示你读到哪里喘气的，而是用来表示结构关系的。","English":"Punctuation does not simply show where you pause; it shows structural relationships.","Keywords":"punctuation, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G072","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果读起来像两个句子，就检查是否有两个独立分句。","English":"If it sounds like two sentences, check whether there are two independent clauses.","Keywords":"IC, checking","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G073","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"选项中的标点必须和左右结构匹配。","English":"The punctuation in the choice must match the structure on both sides.","Keywords":"punctuation, matching","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G074","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"不要把非限定动词误认为句子的谓语。","English":"Do not mistake a non-finite verb for the main verb of the sentence.","Keywords":"finite vs non-finite","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G075","Subject":"GrammarV2","Unit":"Sentence Boundaries","Level":2,"Chinese":"一个句子可以很长，但主干必须只有合法的连接方式。","English":"A sentence can be long, but its core clauses must be connected legally.","Keywords":"long sentence, connection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G076","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"这道题考标点。","English":"This question tests punctuation.","Keywords":"punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G077","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"先不要问哪里需要停顿，要问这里是什么结构。","English":"Do not ask where to pause first; ask what structure we have here.","Keywords":"punctuation, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G078","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"逗号不能随便放在主语和谓语之间。","English":"A comma cannot be placed randomly between a subject and its verb.","Keywords":"comma, subject-verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G079","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"逗号不能切断动词和宾语。","English":"A comma cannot separate a verb from its object.","Keywords":"comma, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G080","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"逗号不能切断介词和宾语。","English":"A comma cannot separate a preposition from its object.","Keywords":"comma, preposition-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G081","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"必要信息通常不需要逗号。","English":"Essential information usually does not need commas.","Keywords":"essential information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G082","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"非必要信息通常用逗号隔开。","English":"Nonessential information is usually set off with commas.","Keywords":"nonessential information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G083","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"同位语如果是补充信息，就要用逗号隔开。","English":"If an appositive is extra information, set it off with commas.","Keywords":"appositive, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G084","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"同位语如果是必要信息，就不要加逗号。","English":"If an appositive is essential, do not add commas.","Keywords":"essential appositive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G085","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"冒号后面通常是解释、例子或列表。","English":"A colon usually introduces an explanation, an example, or a list.","Keywords":"colon, list","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G086","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"冒号前面要有完整句。","English":"A colon needs a complete sentence before it.","Keywords":"colon, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G087","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"分号两边都要是完整句。","English":"Both sides of a semicolon must be complete sentences.","Keywords":"semicolon, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G088","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"破折号可以表示补充说明。","English":"A dash can introduce or set off extra information.","Keywords":"dash, extra information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G089","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"成对破折号要成对收口。","English":"A pair of dashes must open and close the interruption.","Keywords":"paired dashes","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G090","Subject":"GrammarV2","Unit":"Punctuation","Level":1,"Chinese":"成对逗号也要成对收口。","English":"A pair of commas must open and close the interruption.","Keywords":"paired commas","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G091","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"如果中间是插入成分，前后标点要对称。","English":"If the middle part is an interruption, the punctuation around it must be balanced.","Keywords":"interruption, balanced punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G092","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"这个逗号会把主语和谓语切开，所以要排除。","English":"This comma separates the subject from the verb, so eliminate it.","Keywords":"comma, subject-verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G093","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"这个逗号会把动词和宾语切开，所以不合法。","English":"This comma separates the verb from its object, so it is not grammatical.","Keywords":"comma, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G094","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"这个冒号把动词和宾语切开了，所以不能选。","English":"This colon separates the verb from its object, so it cannot be correct.","Keywords":"colon, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G095","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"这个冒号把介词和宾语切开了，所以不能选。","English":"This colon separates the preposition from its object, so it cannot be correct.","Keywords":"colon, preposition-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G096","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"冒号前如果只是短语，后面再完整也不行。","English":"If the words before the colon are only a phrase, the colon does not work even if the words after it are complete.","Keywords":"colon, phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G097","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"冒号后可以是不完整结构，只要它解释前面的完整设定。","English":"After a colon, the information can be a fragment if it explains the complete setup before it.","Keywords":"colon, explanation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G098","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"复杂列表中，如果项目内部已经有逗号，可以用分号分隔大项目。","English":"In a complex list, if the items already contain commas, semicolons can separate the major items.","Keywords":"complex list, semicolon","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G099","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"分号不是高级逗号，它有明确的句子边界功能。","English":"A semicolon is not a fancy comma; it has a specific sentence-boundary function.","Keywords":"semicolon, boundary","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G100","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"逗号加 and 可以连接两个完整句，但逗号不能省。","English":"A comma plus and can connect two complete sentences, but the comma cannot be omitted.","Keywords":"comma FANBOYS","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G101","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"如果 and 只是连接两个词或短语，前面不一定需要逗号。","English":"If and joins only two words or phrases, a comma is not necessarily needed before it.","Keywords":"and, phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G102","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"这里的逗号不是为了好看，而是为了标出非限制性信息。","English":"The comma is not decorative; it marks nonrestrictive information.","Keywords":"nonrestrictive, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G103","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"which 引导非限制性从句时，前面通常要有逗号。","English":"When which introduces a nonrestrictive clause, it usually needs a comma before it.","Keywords":"which, nonrestrictive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G104","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"that 引导必要信息时，前面通常不加逗号。","English":"When that introduces essential information, it usually does not take a comma before it.","Keywords":"that, essential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G105","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"who 或 which 从句如果只是补充身份，就需要隔开。","English":"If a who- or which-clause only adds extra identification, set it off.","Keywords":"relative clause, nonessential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G106","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"如果从句限制名词范围，就不要用逗号隔开。","English":"If the clause restricts the noun, do not set it off with commas.","Keywords":"restrictive clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G107","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"破折号后面可以给出突然的补充或强调。","English":"A dash can introduce a sudden addition or emphasis.","Keywords":"dash, emphasis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G108","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"破折号不能用来连接两个完全没有结构关系的句子。","English":"A dash should not be used to connect two sentences with no clear structural relationship.","Keywords":"dash, sentence relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G109","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"如果前面已经有开口破折号，后面要看是否需要闭合。","English":"If there is an opening dash before, check whether the interruption needs to be closed.","Keywords":"closing dash","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G110","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"括号中的信息是附加信息，不应影响主谓一致。","English":"Information in parentheses is extra and should not affect subject-verb agreement.","Keywords":"parentheses, agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G111","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"引号和标点不改变句子主干。","English":"Quotation marks and punctuation do not change the core grammar of the sentence.","Keywords":"quotation, core grammar","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G112","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"撇号 s 表示单数所有格或不规则复数所有格。","English":"Apostrophe-s marks singular possession or possession for irregular plurals.","Keywords":"apostrophe s, possessive","Example":"artist's work","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G113","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"s 后加撇号通常表示规则复数所有格。","English":"An apostrophe after s usually marks possession for a regular plural noun.","Keywords":"plural possessive","Example":"artists' works","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G114","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"its 是所有格，it's 是 it is 或 it has。","English":"Its is possessive; it's means it is or it has.","Keywords":"its, it's","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G115","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"标点题要检查标点两边的语法单位。","English":"For punctuation questions, check the grammatical unit on each side of the punctuation.","Keywords":"punctuation, units","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G116","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"不要因为句子长就随便加逗号。","English":"Do not add a comma just because the sentence is long.","Keywords":"comma, long sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G117","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"短介词短语开头时，逗号有时不是硬性要求。","English":"After a short introductory prepositional phrase, a comma is sometimes not required.","Keywords":"introductory phrase, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G118","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"较长的句首修饰语后面通常需要逗号。","English":"A longer introductory modifier usually takes a comma after it.","Keywords":"introductory modifier, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G119","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"句首分词短语后面通常用逗号。","English":"An introductory participial phrase is usually followed by a comma.","Keywords":"participial phrase, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G120","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"如果中间插入成分删掉后句子仍然完整，说明它是补充信息。","English":"If the sentence remains complete after the inserted part is removed, that part is extra information.","Keywords":"interruption, nonessential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G121","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"逗号不能替代 that 或其他从句连接词。","English":"A comma cannot replace that or another clause connector.","Keywords":"comma, clause connector","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G122","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"分号后如果接的是短语，就会形成残句。","English":"If a semicolon is followed by a phrase, it creates a fragment.","Keywords":"semicolon, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G123","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"冒号后面的列表必须和前面的名词或设定对应。","English":"The list after a colon must correspond to the noun or setup before it.","Keywords":"colon, list alignment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G124","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"标点正确不代表句意一定正确，最后还要检查逻辑。","English":"Correct punctuation does not guarantee correct meaning; check the logic at the end.","Keywords":"punctuation, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G125","Subject":"GrammarV2","Unit":"Punctuation","Level":2,"Chinese":"标点错误通常可以用结构测试快速排除。","English":"Punctuation errors can usually be eliminated quickly with a structure test.","Keywords":"structure test, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G126","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"这道题考从句结构。","English":"This question tests clause structure.","Keywords":"clause structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G127","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"先判断这是主句还是从句。","English":"First decide whether this is a main clause or a subordinate clause.","Keywords":"main clause, subordinate clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G128","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"关系从句修饰前面的名词。","English":"A relative clause modifies the noun before it.","Keywords":"relative clause, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G129","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"who 通常指人。","English":"Who usually refers to people.","Keywords":"who, people","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G130","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"which 通常指物或整件事。","English":"Which usually refers to things or an entire idea.","Keywords":"which, thing","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G131","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"that 通常引导必要信息。","English":"That usually introduces essential information.","Keywords":"that, essential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G132","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"when 修饰时间。","English":"When modifies time.","Keywords":"when, time","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G133","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"where 修饰地点。","English":"Where modifies place.","Keywords":"where, place","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G134","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"whom 作宾语，不作主语。","English":"Whom functions as an object, not as a subject.","Keywords":"whom, object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G135","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"whose 表示所属关系。","English":"Whose expresses possession.","Keywords":"whose, possession","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G136","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"that 从句可以作名词性成分。","English":"A that-clause can function as a noun element.","Keywords":"that-clause, noun clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G137","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"whether 引导是否关系。","English":"Whether introduces an whether-or-not relationship.","Keywords":"whether, noun clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G138","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"which 不会自动把后面的内容变成合法从句；从句内部也要完整。","English":"Which does not automatically make the following words a legal clause; the clause itself must be structurally complete.","Keywords":"which, clause structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G139","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"关系代词在从句里也要承担语法功能。","English":"The relative pronoun must serve a grammatical function inside the clause.","Keywords":"relative pronoun, function","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G140","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"如果从句已经有主语，就不要再用 who 作主语。","English":"If the clause already has a subject, do not use who as another subject.","Keywords":"who, subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G141","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"如果从句缺宾语，whom 或 which 可能在从句里作宾语。","English":"If the clause is missing an object, whom or which may serve as the object inside the clause.","Keywords":"whom, which, object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G142","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"非限制性关系从句前面通常用逗号，不能随意换成 that。","English":"A nonrestrictive relative clause usually takes a comma and should not be freely changed to that.","Keywords":"nonrestrictive, that","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G143","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"限制性关系从句锁定名词范围，不能随意用逗号隔开。","English":"A restrictive relative clause narrows the noun's meaning and should not be randomly set off with commas.","Keywords":"restrictive, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G144","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"关系从句收口后，主句还要有自己的谓语。","English":"After the relative clause closes, the main clause still needs its own predicate.","Keywords":"closing comma, main predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G145","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"不要把关系从句里的动词当作主句谓语。","English":"Do not treat the verb inside a relative clause as the main verb.","Keywords":"relative clause, main verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G146","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"when 从句要对应时间名词，而不是普通物体名词。","English":"A when-clause should correspond to a time noun, not an ordinary object noun.","Keywords":"when, time noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G147","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"where 从句要对应地点或抽象位置。","English":"A where-clause should correspond to a physical or abstract location.","Keywords":"where, location","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G148","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"which 指代整件事时，前面通常要有完整想法。","English":"When which refers to a whole idea, the previous part usually needs to express a complete idea.","Keywords":"which, whole idea","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G149","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"that 主语从句很长时，不要忘记后面的主句谓语。","English":"When a that-clause is a long subject, do not forget the main verb after it.","Keywords":"that subject clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G150","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"名词性从句可以作主语、宾语或表语。","English":"A noun clause can function as a subject, object, or complement.","Keywords":"noun clause, function","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G151","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"从句内部也要遵守主谓一致。","English":"The clause itself must also follow subject-verb agreement.","Keywords":"clause, agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G152","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"如果一个选项删掉了必要的从句连接词，句子可能变成连写句。","English":"If a choice removes a needed clause connector, the sentence may become a run-on.","Keywords":"connector, run-on","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G153","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"如果一个选项增加了多余的关系代词，句子可能缺少主句谓语。","English":"If a choice adds an unnecessary relative pronoun, the sentence may lack a main verb.","Keywords":"relative pronoun, missing predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G154","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"which 从句如果是插入信息，前后标点要闭合。","English":"If a which-clause is an interruption, the punctuation around it must close properly.","Keywords":"which, closing punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G155","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"关系副词不是随便选的，要看先行词类型。","English":"Relative adverbs are not interchangeable; choose them according to the antecedent type.","Keywords":"relative adverb, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G156","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"这个从句回答的是时间、地点还是原因？","English":"Does this clause answer a question of time, place, or reason?","Keywords":"clause meaning, adverbial","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G157","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"because 引导原因，so 引导结果，二者不能重复堆叠。","English":"Because introduces a cause, and so introduces a result; do not stack both unnecessarily.","Keywords":"because, so","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G158","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"although 已经表示让步，不要再用 but 重复转折。","English":"Although already signals concession, so do not repeat the contrast with but.","Keywords":"although, but","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G159","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"as 可以表示时间、原因或方式，要根据句意确认。","English":"As can signal time, cause, or manner, so confirm its meaning from context.","Keywords":"as, context","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G160","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"while 可以表示同时发生，也可以表示对比。","English":"While can signal simultaneous action or contrast.","Keywords":"while, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G161","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"since 可以表示时间，也可以表示原因。","English":"Since can signal time or cause.","Keywords":"since, time, cause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G162","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"从句选择题要同时检查连接词含义和语法功能。","English":"For clause questions, check both the connector's meaning and its grammatical function.","Keywords":"connector, function","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G163","Subject":"GrammarV2","Unit":"Clauses & Relative Structures","Level":2,"Chinese":"不能只因为中文都能翻译成“的”就随便选关系词。","English":"Do not choose a relative word just because several options can be translated as '的' in Chinese.","Keywords":"relative words, Chinese translation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G164","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"这道题考一致性。","English":"This question tests agreement.","Keywords":"agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G165","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"先找真正的主语。","English":"Find the real subject first.","Keywords":"subject-verb agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G166","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"动词要和主语一致。","English":"The verb must agree with the subject.","Keywords":"subject-verb agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G167","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"代词要和先行词一致。","English":"The pronoun must agree with its antecedent.","Keywords":"pronoun agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G168","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"名词单复数要和语义一致。","English":"The noun number must match the meaning.","Keywords":"noun number","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G169","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"所有格要和拥有者一致。","English":"The possessive form must match the possessor.","Keywords":"possessive agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G170","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"中间的介词短语不决定谓语单复数。","English":"The prepositional phrase in the middle does not control the verb number.","Keywords":"prepositional phrase, SVA","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G171","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"插入成分不改变主语。","English":"An interruption does not change the subject.","Keywords":"interruption, subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G172","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"each 通常按单数处理。","English":"Each is usually treated as singular.","Keywords":"each, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G173","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"every 通常按单数处理。","English":"Every is usually treated as singular.","Keywords":"every, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G174","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"复合主语用 and 连接时通常用复数动词。","English":"A compound subject joined by and usually takes a plural verb.","Keywords":"compound subject, and","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G175","Subject":"GrammarV2","Unit":"Agreement","Level":1,"Chinese":"就近一致要看 or、nor 旁边最近的主语。","English":"For proximity agreement, look at the subject closest to or or nor.","Keywords":"or, nor, proximity agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G176","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"of 后面的名词常常是干扰项，不一定控制谓语。","English":"The noun after of is often a distractor and may not control the verb.","Keywords":"of-phrase, distractor","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G177","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"主语核心是单数，即使后面跟着复数名词，谓语仍用单数。","English":"If the head of the subject is singular, the verb is singular even if a plural noun follows.","Keywords":"head noun, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G178","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"主语核心是复数，即使后面跟着单数名词，谓语仍用复数。","English":"If the head of the subject is plural, the verb is plural even if a singular noun follows.","Keywords":"head noun, plural","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G179","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"each of which 后面的动词通常跟 each，按单数。","English":"After each of which, the verb usually agrees with each and is singular.","Keywords":"each of which, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G180","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"one of the plural noun 后面如果修饰 one，动词用单数。","English":"After one of the plural noun, if the relative clause modifies one, the verb is singular.","Keywords":"one of, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G181","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"one of the plural noun 后面如果修饰复数名词，动词可能用复数。","English":"After one of the plural noun, if the relative clause modifies the plural noun, the verb may be plural.","Keywords":"one of, relative clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G182","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"collective noun 要看它表示整体还是成员。","English":"For a collective noun, decide whether it refers to a unit or to individual members.","Keywords":"collective noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G183","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"data 在现代英语中常可按复数或不可数概念处理，但 SAT 通常会给出清楚线索。","English":"Data can be treated as plural or mass in modern English, but the SAT usually gives a clear clue.","Keywords":"data, agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G184","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"neither of 和 either of 常按单数处理，除非语境明确要求复数。","English":"Neither of and either of are often treated as singular unless the context clearly requires plural.","Keywords":"neither of, either of","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G185","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"not only...but also 的动词通常靠近后面的主语判断。","English":"With not only...but also, the verb often agrees with the nearer subject.","Keywords":"not only but also, proximity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G186","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"there is / there are 要看后面的真正主语。","English":"With there is or there are, look at the real subject after the verb.","Keywords":"there is, there are","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G187","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"主语如果是 gerund phrase，整体按单数。","English":"If the subject is a gerund phrase, treat the whole phrase as singular.","Keywords":"gerund subject, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G188","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"主语如果是 that-clause，整体按单数。","English":"If the subject is a that-clause, treat the whole clause as singular.","Keywords":"that-clause, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G189","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"主语如果是两个并列名词，通常按复数。","English":"If the subject consists of two coordinated nouns, it is usually plural.","Keywords":"coordinated nouns, plural","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G190","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"指代单数概念时用 it 或 its，不用 they 或 their。","English":"Use it or its for a singular idea, not they or their.","Keywords":"it, its, they, their","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G191","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"指代复数名词时用 they 或 their。","English":"Use they or their for plural nouns.","Keywords":"they, their, plural","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G192","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"指代整件事时，this 或 it 要有清晰先行内容。","English":"When this or it refers to an entire idea, the reference must be clear.","Keywords":"this, it, reference","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G193","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"代词不能指代模糊的一整段内容。","English":"A pronoun should not refer vaguely to an entire block of text.","Keywords":"vague pronoun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G194","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"所有格 his、her、its、their 要看拥有者是谁。","English":"For his, her, its, and their, identify the possessor.","Keywords":"possessive pronoun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G195","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"their 不能指代单数机构名，除非语境把机构当作成员集合。","English":"Their should not refer to a singular organization unless the context treats it as a group of members.","Keywords":"their, organization","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G196","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"名词前的修饰语不决定名词单复数。","English":"Modifiers before a noun do not determine the noun's number.","Keywords":"modifier, noun number","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G197","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"真正控制单复数的是中心名词。","English":"The head noun controls the number.","Keywords":"head noun, number","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G198","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"如果后文说 these 或 several，前面的名词通常需要复数。","English":"If the context says these or several, the noun is usually plural.","Keywords":"these, several, plural","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G199","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"如果后文说 one 或 a single，前面的名词通常需要单数。","English":"If the context says one or a single, the noun is usually singular.","Keywords":"one, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G200","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"一致性题要把干扰修饰删掉，再看主干。","English":"For agreement questions, remove distracting modifiers and check the core.","Keywords":"agreement, core sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G201","Subject":"GrammarV2","Unit":"Agreement","Level":2,"Chinese":"不要让离谓语最近的名词骗你。","English":"Do not be fooled by the noun closest to the verb.","Keywords":"nearby noun, distractor","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G202","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"这道题考名词、代词或所有格。","English":"This question tests nouns, pronouns, or possessives.","Keywords":"nouns, pronouns, possessives","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G203","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"先找这个名词是单数还是复数。","English":"First decide whether this noun should be singular or plural.","Keywords":"noun number","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G204","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"先找这个代词指代谁。","English":"First find what this pronoun refers to.","Keywords":"pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G205","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"先判断这里是不是所属关系。","English":"First decide whether this is a possessive relationship.","Keywords":"possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G206","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"名词所有格表示“谁的”。","English":"A possessive noun shows ownership or association.","Keywords":"possessive noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G207","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"its 没有撇号。","English":"The possessive its has no apostrophe.","Keywords":"its","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G208","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"it's 有撇号，意思是 it is 或 it has。","English":"It's has an apostrophe and means it is or it has.","Keywords":"it's","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G209","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":1,"Chinese":"their 是所有格，there 是地点，they're 是 they are。","English":"Their is possessive, there refers to place, and they're means they are.","Keywords":"their, there, they're","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G210","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不要只看 s，要判断这是复数还是所有格。","English":"Do not just look for s; decide whether it marks plural number or possession.","Keywords":"s, plural, possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G211","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"规则复数所有格通常是 s 后加撇号。","English":"A regular plural possessive usually places the apostrophe after s.","Keywords":"plural possessive","Example":"students' books","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G212","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chin

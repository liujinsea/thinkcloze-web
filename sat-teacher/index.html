nit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果选项证据比 claim 更强或更弱，都要谨慎。","English":"If the evidence is stronger or weaker than the claim, be careful.","Keywords":"strength, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R334","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"正确证据通常与 claim 形成一一对应关系。","English":"The correct evidence usually forms a one-to-one correspondence with the claim.","Keywords":"one-to-one correspondence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R335","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"让学生把 claim 分成关键词，再逐个在引文中找对应。","English":"Ask students to split the claim into keywords and match each one to the quotation.","Keywords":"student prompt, keyword matching","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R336","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果证据需要额外解释才能勉强成立，通常不是最直接答案。","English":"If the evidence needs extra explanation to barely work, it is usually not the most direct answer.","Keywords":"direct evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R337","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"quotation 题中，选项的细节越具体，越要检查它是否服务 claim。","English":"In quotation questions, the more specific a choice is, the more we need to check whether it serves the claim.","Keywords":"specific detail, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R338","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"最后测试：这个引文如果放在 claim 后面，能不能自然作为证明？","English":"Final test: if this quotation follows the claim, can it naturally serve as proof?","Keywords":"proof test","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R339","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"if true 题的选项是假设为真的新增证据。","English":"In an 'if true' question, each choice is new evidence assumed to be true.","Keywords":"if true, new evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R340","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"先看题干问 support 还是 weaken。","English":"First check whether the stem asks for support or weaken.","Keywords":"support, weaken","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R341","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"先找 researchers' conclusion。","English":"Identify the researchers' conclusion first.","Keywords":"researchers' conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R342","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"支持题要让结论更可信。","English":"A support choice makes the conclusion more credible.","Keywords":"support, credible","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R343","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"削弱题要让结论更不稳。","English":"A weaken choice makes the conclusion less secure.","Keywords":"weaken, less secure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R344","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"不要选只是重复原文背景的内容。","English":"Do not choose something that merely repeats the background in the text.","Keywords":"background, repetition","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R345","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"科学题先找实验对象。","English":"In a science question, identify the experimental object first.","Keywords":"experiment object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R346","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"再找分组或条件。","English":"Then identify the groups or conditions.","Keywords":"group, condition","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R347","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"再找观察结果。","English":"Then identify the observed result.","Keywords":"observed result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R348","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":1,"Chinese":"比较题要同时看比较对象和结果方向。","English":"In a comparison, check both the comparison objects and the direction of the result.","Keywords":"comparison, result direction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R349","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"support 可以是补充证据、解释机制、排除替代解释或加强逻辑链。","English":"Support can add evidence, explain a mechanism, rule out an alternative explanation, or strengthen the logical chain.","Keywords":"strengthen, mechanism, alternative explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R350","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"weaken 可以是打断因果、提出替代原因、提供反例或质疑方法。","English":"Weaken can break a causal link, offer an alternative cause, provide a counterexample, or question the method.","Keywords":"weaken, alternative cause, counterexample","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R351","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果结论是因果关系，支持项可以补桥，削弱项可以断桥。","English":"If the conclusion is causal, a support choice can bridge the gap, and a weaken choice can break the bridge.","Keywords":"causal bridge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R352","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果结论来自实验，先检查自变量和因变量。","English":"If the conclusion comes from an experiment, check the independent and dependent variables first.","Keywords":"independent variable, dependent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R353","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"自变量是研究者改变或比较的条件。","English":"The independent variable is the condition the researchers change or compare.","Keywords":"independent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R354","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"因变量是研究者观察、测量或记录的结果。","English":"The dependent variable is the result the researchers observe, measure, or record.","Keywords":"dependent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R355","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"正确选项常常提供正确组别之间的正确比较。","English":"The correct choice often provides the correct comparison between the correct groups.","Keywords":"group comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R356","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"只描述单组结果而没有比较，通常不能证明比较性结论。","English":"A result from one group alone usually cannot prove a comparative conclusion.","Keywords":"one group, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R357","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项比较对象错，即使结果听起来科学也不能选。","English":"If the comparison objects are wrong, we cannot choose it even if the result sounds scientific.","Keywords":"wrong object, science","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R358","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项的结果方向和结论相反，它就是削弱而不是支持。","English":"If the result direction is opposite to the conclusion, it weakens rather than supports.","Keywords":"direction, support weaken","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R359","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"premise 是已给理由，conclusion 是要推出的观点。","English":"A premise is the given reason; a conclusion is the point to be drawn from it.","Keywords":"premise, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R360","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"看到 therefore/thus/suggest，后面常是结论。","English":"When you see 'therefore,' 'thus,' or 'suggest,' what follows is often the conclusion.","Keywords":"conclusion indicator","Example":"therefore, thus, suggest","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R361","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"看到 because/due to/given that，附近常是前提。","English":"When you see 'because,' 'due to,' or 'given that,' the nearby information is often a premise.","Keywords":"premise indicator","Example":"because, due to, given that","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R362","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"deductive reasoning 要求结论从前提中稳定推出。","English":"Deductive reasoning requires the conclusion to follow reliably from the premises.","Keywords":"deductive reasoning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R363","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"if true 题不能凭常识判断哪件事可能发生，只看它对 claim 的作用。","English":"In an if-true question, do not judge what is likely in real life; judge its effect on the claim.","Keywords":"claim effect","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R364","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项和 claim 之间需要太多中间步骤，它不够 direct。","English":"If a choice needs too many intermediate steps to affect the claim, it is not direct enough.","Keywords":"directness","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R365","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"削弱不等于证明结论一定错，只要让它变弱即可。","English":"Weaken does not mean proving the conclusion false; it only needs to make it less convincing.","Keywords":"weaken, less convincing","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R366","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"支持不等于证明结论百分百正确，只要提高可信度即可。","English":"Support does not mean proving the conclusion completely true; it only needs to increase credibility.","Keywords":"support, credibility","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R367","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"最后用一句话说：这个选项怎样改变 claim 的可信度？","English":"Finally, say in one sentence: how does this choice change the credibility of the claim?","Keywords":"student prompt, credibility","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R368","Subject":"ReadingV2","Unit":"Textual Evidence - If True","Level":2,"Chinese":"错题复盘时要标明：比较对象错、变量错、方向错，还是 claim 找错。","English":"In review, label the error: wrong comparison object, wrong variable, wrong direction, or wrong claim.","Keywords":"error log, if true","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R369","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"图表题第一步永远是读标题。","English":"The first step in a data question is always to read the title.","Keywords":"chart title","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R370","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"再读横轴、纵轴和单位。","English":"Then read the x-axis, y-axis, and units.","Keywords":"axis, units","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R371","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"看清图例代表什么。","English":"Make sure you understand what the legend represents.","Keywords":"legend","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R372","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"先确定文本要证明什么，再去图表找数据。","English":"First identify what the text needs to prove, then go to the graph for data.","Keywords":"claim, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R373","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"不要先看图表乱猜题意。","English":"Do not look at the graph first and guess the task.","Keywords":"graph, task","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R374","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"柱状图常用来比较类别差异。","English":"Bar charts are often used to compare categories.","Keywords":"bar chart, category","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R375","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"折线图常用来看变化趋势。","English":"Line graphs are often used to show trends over time.","Keywords":"line graph, trend","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R376","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"表格常用来精确查找对象和数值。","English":"Tables are often used to look up objects and exact values.","Keywords":"table, exact value","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R377","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"选项里的数据要和图表完全对应。","English":"The data in the choice must match the graph exactly.","Keywords":"data accuracy","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R378","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"比较方向要看清是 increase 还是 decrease。","English":"Check whether the direction is an increase or a decrease.","Keywords":"increase, decrease","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R379","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"最大值、最小值和异常值都要注意。","English":"Pay attention to maximum values, minimum values, and outliers.","Keywords":"maximum, minimum, outlier","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R380","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":1,"Chinese":"单位看错，答案通常就会错。","English":"If you misread the unit, the answer will usually be wrong.","Keywords":"unit error","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R381","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"quantitative evidence 不是单纯读数，而是用数据完成论证。","English":"Quantitative evidence is not just reading numbers; it is using data to complete an argument.","Keywords":"quantitative evidence, argument","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R382","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"补全例子时，选项要提供一个符合文本观点的数据例子。","English":"When completing an example, the choice must provide a data example that fits the text's claim.","Keywords":"complete example, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R383","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"补全观点时，选项要用数据表达文本结论。","English":"When completing a claim, the choice must use the data to express the text's conclusion.","Keywords":"complete claim, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R384","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"支持/削弱图表题要先判文本 claim 的方向。","English":"For support or weaken data questions, identify the direction of the text's claim first.","Keywords":"support, weaken, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R385","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"数据正确但不能支持 claim，也不能选。","English":"Even if the data are correct, we cannot choose the option if they do not support the claim.","Keywords":"data correct, irrelevant","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R386","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"比较对象必须一致，不能把年份、组别或类别换掉。","English":"The comparison objects must be consistent; do not switch years, groups, or categories.","Keywords":"comparison object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R387","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"趋势题要看整体趋势，不要只抓一个点。","English":"For a trend question, look at the overall trend, not just one point.","Keywords":"trend, single point","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R388","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果文本说 higher，但图表显示 lower，方向就是反的。","English":"If the text says 'higher' but the graph shows 'lower,' the direction is opposite.","Keywords":"higher, lower","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R389","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果选项只描述绝对值，但题干需要比较，它不够。","English":"If a choice gives only an absolute value but the stem requires a comparison, it is not enough.","Keywords":"absolute value, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R390","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果选项比较了两个无关类别，它是对象错位。","English":"If a choice compares two irrelevant categories, it has an object mismatch.","Keywords":"irrelevant category","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R391","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"读图时把目标变量、目标对象和支持方向写在旁边。","English":"When reading the graph, write down the target variable, target object, and support direction.","Keywords":"target variable, target object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R392","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"讲图表题时，让学生先用英文说出 one data sentence。","English":"When teaching a data question, ask students to produce one data sentence in English first.","Keywords":"student prompt, data sentence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R393","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"Locate data 是第一层，Interpret data 是第二层，Use data to evaluate claim 是第三层。","English":"Locate data is level one; Interpret data is level two; Use data to evaluate a claim is level three.","Keywords":"locate data, interpret data, evaluate claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R394","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果题干问 best illustrates，答案要能作为最清楚的例子。","English":"If the stem asks what best illustrates the claim, the answer must work as the clearest example.","Keywords":"illustrate, example","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R395","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"不要把未满足需求下降读成满足需求下降。","English":"Do not misread a decrease in unmet need as a decrease in met need.","Keywords":"unmet need, misreading","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R396","Subject":"ReadingV2","Unit":"Quantitative Evidence","Level":2,"Chinese":"最后检查：数据数值、单位、对象、方向、相关性都对吗？","English":"Final check: are the number, unit, object, direction, and relevance all correct?","Keywords":"final check, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R397","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"推断题要根据文本推出，不是自由猜测。","English":"An inference must be drawn from the text; it is not free guessing.","Keywords":"inference, text-based","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R398","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"先找已知前提。","English":"Find the given premises first.","Keywords":"premise","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R399","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"再判断能推出什么最稳的结论。","English":"Then decide what conclusion can be most safely drawn.","Keywords":"safe conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R400","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"most logically completes 通常要求补结论。","English":"'Most logically completes' usually asks us to complete a conclusion.","Keywords":"logically completes, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R401","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"不要把可能性说成必然性。","English":"Do not turn a possibility into a certainty.","Keywords":"possibility, certainty","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R402","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"不要加入文本没有的原因。","English":"Do not add a cause that is not in the text.","Keywords":"added cause","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R403","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"如果有时间词，先画时间轴。","English":"If there are time words, draw a timeline first.","Keywords":"timeline","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R404","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"before, after, predate, precede 都要小心顺序。","English":"Be careful with sequence words such as before, after, predate, and precede.","Keywords":"time sequence","Example":"before, after, predate, precede","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R405","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"实验推断要看结果指向什么结论。","English":"For an experimental inference, see what conclusion the results point to.","Keywords":"experiment, result, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R406","Subject":"ReadingV2","Unit":"Inference","Level":1,"Chinese":"文学推断要看人物行为和语气。","English":"For a literary inference, look at character actions and tone.","Keywords":"literary inference, tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R407","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"推断题的正确答案通常是文本信息向前走一步。","English":"The correct answer to an inference question usually moves one step beyond the stated information.","Keywords":"one-step inference","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R408","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"如果答案需要两三步想象，它就太远。","English":"If an answer needs two or three imagined steps, it goes too far.","Keywords":"too far","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R409","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"事实观点推断要区分背景、前提和待填结论。","English":"In a fact-and-claim inference, distinguish background, premises, and the missing conclusion.","Keywords":"background, premise, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R410","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"实验推断要区分实验目的、设计、结果和研究者解释。","English":"In an experimental inference, distinguish purpose, design, result, and researchers' explanation.","Keywords":"experiment, design, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R411","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"时间顺序推断要检查每个事件相对于其他事件的位置。","English":"For a time-sequence inference, check where each event stands relative to the others.","Keywords":"event order","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R412","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"如果文本评价实验设计，结论可能与有效性或局限有关。","English":"If the text evaluates an experimental design, the conclusion may concern validity or limitations.","Keywords":"validity, limitation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R413","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"syllogism 要找到 major premise, minor premise, and conclusion。","English":"In a syllogism, identify the major premise, minor premise, and conclusion.","Keywords":"syllogism, major premise, minor premise","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R414","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"middle term 是把两个前提连接起来的共同项。","English":"The middle term is the shared term that connects the two premises.","Keywords":"middle term, syllogism","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R415","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"deductive reasoning 要求结论不能超出前提。","English":"Deductive reasoning requires the conclusion not to exceed the premises.","Keywords":"deductive reasoning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R416","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"synthesis 推断需要把两处信息合并。","English":"A synthesis inference requires combining information from two places.","Keywords":"synthesis, combine","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R417","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"如果选项和文本都谈同一主题，但没有逻辑推出关系，不能选。","English":"If a choice and the text share the same topic but lack a logical connection, we cannot choose it.","Keywords":"topic, logic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R418","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"推断题要特别检查限定词：may, can, likely, some, many。","English":"In inference questions, pay special attention to qualifiers such as may, can, likely, some, and many.","Keywords":"qualifier","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R419","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"如果结论太绝对，和原文的谨慎语气不匹配，就排除。","English":"If the conclusion is too absolute and does not match the text's cautious tone, eliminate it.","Keywords":"absolute, cautious tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R420","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"如果结论引入新对象，它通常是新信息。","English":"If the conclusion introduces a new object, it is usually new information.","Keywords":"new object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R421","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"让学生说出：文本给了哪两个前提？答案怎么从它们推出？","English":"Ask students: what two premises does the text give, and how does the answer follow from them?","Keywords":"student prompt, premises","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R422","Subject":"ReadingV2","Unit":"Inference","Level":2,"Chinese":"最后检查答案是否最合理，而不是仅仅有可能。","English":"Finally, check whether the answer is the most reasonable one, not merely possible.","Keywords":"most reasonable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R423","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"科学实验文本先找研究对象。","English":"In a science experiment text, identify the research object first.","Keywords":"research object","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R424","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"再找研究目的。","English":"Then identify the research purpose.","Keywords":"research purpose","Example":"to determine / investigate / test / explore","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R425","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"再找实验方法。","English":"Then identify the method.","Keywords":"method","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R426","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"再找实验结果。","English":"Then identify the result.","Keywords":"result","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R427","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"最后找结论。","English":"Finally, identify the conclusion.","Keywords":"conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R428","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"实验目的常由 to determine, investigate, test, explore 引出。","English":"The purpose is often introduced by to determine, investigate, test, or explore.","Keywords":"purpose signal","Example":"to determine, investigate, test, explore","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R429","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"实验对象常是 subjects, samples, participants, groups。","English":"The objects often appear as subjects, samples, participants, or groups.","Keywords":"subjects, samples, participants","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R430","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"分组词包括 one group, other group, condition, treatment, control。","English":"Grouping words include one group, other group, condition, treatment, and control.","Keywords":"group, control","Example":"one group / other group / condition / treatment / control","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R431","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"自变量是被改变或比较的条件。","English":"The independent variable is the condition being changed or compared.","Keywords":"independent variable","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R432","Subject":"ReadingV2","Unit":"Science Experiments","Level":1,"Chinese":"因变量是被观察或测量的结果。","English":"The dependent variable is the result being observed or measured.","Keywords":"dependent variable","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R433","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"科学实验题的核心不是背知识，而是识别变量关系。","English":"The core of science experiment questions is not memorizing science; it is identifying variable relationships.","Keywords":"variable relationship","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R434","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"先问：研究者想验证什么？","English":"First ask: what did the researchers want to test?","Keywords":"research question","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R435","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"再问：他们怎么设计比较？","English":"Then ask: how did they design the comparison?","Keywords":"experimental design","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R436","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"再问：他们观察到了什么？","English":"Then ask: what did they observe?","Keywords":"observation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R437","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"最后问：这个结果支持了什么结论？","English":"Finally ask: what conclusion does this result support?","Keywords":"result, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R438","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"control group 是对照组，用来判断处理条件是否产生影响。","English":"A control group is used as a comparison point to judge whether the treatment has an effect.","Keywords":"control group, treatment","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R439","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"treatment 是实验组接受的处理。","English":"The treatment is the condition applied to the experimental group.","Keywords":"treatment","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R440","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"如果没有对照，就很难证明差异来自这个因素。","English":"Without a control, it is difficult to prove that the difference comes from this factor.","Keywords":"control, causal inference","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R441","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"如果样本对象换了，结论可能不能直接套用。","English":"If the sample object changes, the conclusion may not directly apply.","Keywords":"sample, generalization","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R442","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"如果因变量换了，选项可能就不再支持原结论。","English":"If the dependent variable changes, the choice may no longer support the original conclusion.","Keywords":"dependent variable, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R443","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"结果词包括 finding, result, data, observation, evidence, outcome。","English":"Result words include finding, result, data, observation, evidence, and outcome.","Keywords":"result words","Example":"finding, result, data, observation, evidence, outcome","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R444","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"结论词包括 suggest, indicate, conclude, prove, believe。","English":"Conclusion words include suggest, indicate, conclude, prove, and believe.","Keywords":"conclusion words","Example":"suggest, indicate, conclude, prove, believe","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R445","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"suggest 比 prove 更谨慎，选项语气也要匹配。","English":"'Suggest' is more cautious than 'prove,' and the choice's tone should match that caution.","Keywords":"suggest, prove, tone","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R446","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"科学文本中的限制条件不能忽略，因为它决定结论范围。","English":"Limitations in a scientific text matter because they define the scope of the conclusion.","Keywords":"limitation, scope","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R447","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"实验题错选通常不是因为科学知识，而是因为变量或比较对象错。","English":"Errors in experiment questions usually come from variables or comparison objects, not from science knowledge.","Keywords":"error source, variables","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R448","Subject":"ReadingV2","Unit":"Science Experiments","Level":2,"Chinese":"让学生画一个变量框：对象、条件、结果、结论。","English":"Ask students to draw a variable box: object, condition, result, conclusion.","Keywords":"student prompt, variable box","Example":"Object / Condition / Result / Conclusion","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R449","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"小说文本先找人物。","English":"In fiction, identify the characters first.","Keywords":"fiction, character","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R450","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"再找人物之间的关系。","English":"Then identify the relationships among the characters.","Keywords":"character relationship","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R451","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"再看人物发生了什么变化。","English":"Then see what changes happen to the characters.","Keywords":"character change","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R452","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"场景不是背景板，它常常服务人物或情节。","English":"Setting is not just background; it often serves character or plot.","Keywords":"setting, plot","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R453","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"情节要和人物行为一起看。","English":"Plot should be read together with character actions.","Keywords":"plot, action","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R454","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"人物心理不一定直接说出来，要从动作和语言推。","English":"A character's mind is not always stated directly; infer it from actions and speech.","Keywords":"character psychology","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R455","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"如果只有一个人物，重点看他的情感或行为变化。","English":"If there is only one character, focus on changes in emotion or behavior.","Keywords":"one character, change","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R456","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"如果有多个人物，先理清谁对谁做了什么。","English":"If there are multiple characters, first clarify who does what to whom.","Keywords":"multiple characters","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R457","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"叙述视角会影响我们获得的信息。","English":"Narrative perspective affects what information we receive.","Keywords":"narrative perspective","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R458","Subject":"ReadingV2","Unit":"Fiction","Level":1,"Chinese":"不要把读者自己的评价当成作者给出的信息。","English":"Do not treat the reader's own judgment as information given by the author.","Keywords":"reader judgment, text evidence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R459","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"文学题常考人物心理、关系变化、场景功能和情感态度。","English":"Literary questions often test character psychology, relationship changes, setting function, and emotional attitude.","Keywords":"literary question types","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R460","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"场景描写常用来烘托人物情绪或铺垫冲突。","English":"Setting description often highlights a character's emotion or prepares a conflict.","Keywords":"setting, emotion, conflict","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R461","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"如果选项的情绪比文本更强烈，通常是过度解读。","English":"If a choice's emotion is stronger than the text's, it is usually an overinterpretation.","Keywords":"emotion, overinterpretation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R462","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"人物没有说出口的想法可以从 hesitation, silence, gesture 中推。","English":"Unspoken thoughts can be inferred from hesitation, silence, or gestures.","Keywords":"gesture, silence, inference","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R463","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"动作描写可以是人物态度的证据。","English":"An action description can serve as evidence of a character's attitude.","Keywords":"action, attitude","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R464","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"对话中的语气词和转折常提示关系变化。","English":"Tone words and contrasts in dialogue often signal changes in relationships.","Keywords":"dialogue, tone","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R465","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"文学细节题要回到具体句子，不要凭故事套路。","English":"For literary detail questions, return to the exact sentence; do not rely on story patterns.","Keywords":"literary detail, exact sentence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R466","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"文学主旨要概括核心情境，而不是抽象到空泛主题。","English":"A literary central idea should summarize the core situation, not jump to an empty abstract theme.","Keywords":"core situation, theme","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R467","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"人物关系题要检查选项中的双方身份是否正确。","English":"In character-relationship questions, check whether the identities of both sides are correct.","Keywords":"relationship, identity","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R468","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"如果选项加入了文本没有的动机，它就是新信息。","English":"If a choice adds a motive not given in the text, it is new information.","Keywords":"motive, new information","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R469","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"文学 purpose 题要问：作者为什么描写这个场景或动作？","English":"For a literary purpose question, ask: why does the author describe this setting or action?","Keywords":"literary purpose","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R470","Subject":"ReadingV2","Unit":"Fiction","Level":2,"Chinese":"让学生标出人物、动作、情绪、变化四项。","English":"Ask students to mark four things: character, action, emotion, and change.","Keywords":"student prompt, literary markers","Example":"Character / Action / Emotion / Change","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R471","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"诗歌先看标题和导言。","English":"For a poem, look at the title and introduction first.","Keywords":"poem, title, introduction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R472","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"标题可能提示主题、对象或情感。","English":"The title may suggest the theme, object, or emotion.","Keywords":"title, theme, emotion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R473","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"先判断诗歌是抒情还是叙事。","English":"First decide whether the poem is lyrical or narrative.","Keywords":"lyrical, narrative","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R474","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"抓主要对象，不要被单个意象带跑。","English":"Identify the main object; do not be distracted by a single image.","Keywords":"main object, imagery","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R475","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"抓情感基调是积极、消极还是复杂。","English":"Identify whether the emotional tone is positive, negative, or mixed.","Keywords":"emotional tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R476","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"重复的词或意象通常很重要。","English":"Repeated words or images are usually important.","Keywords":"repetition, imagery","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R477","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"转折处常常改变诗歌情感方向。","English":"A turn often changes the emotional direction of the poem.","Keywords":"turn, emotional shift","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R478","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"古词不必逐词翻译，但关键词必须抓住。","English":"You do not need to translate every archaic word, but you must catch the key words.","Keywords":"archaic words, keywords","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R479","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"戏剧文本先看说话人和对话关系。","English":"In drama, first identify the speaker and the dialogue relationship.","Keywords":"drama, speaker","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R480","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":1,"Chinese":"戏剧中的潜台词常常通过语气和回应体现。","English":"Subtext in drama often appears through tone and response.","Keywords":"subtext, tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R481","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌题不要因为语言抽象就放弃证据。","English":"Do not give up on evidence just because the language of a poem is abstract.","Keywords":"poem, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R482","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"意象要回到它共同指向的情感或主题。","English":"Images must be connected back to the emotion or theme they collectively point to.","Keywords":"imagery, theme","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R483","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"如果诗歌有导言，导言通常提供时代、人物或场景背景。","English":"If a poem has an introduction, it often provides historical, personal, or setting background.","Keywords":"introduction, context","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R484","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌主旨题要避免把一个意象当作全文主题。","English":"In a poem central idea question, avoid treating one image as the whole theme.","Keywords":"central idea, image","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R485","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌目的题要判断作者是在纪念、赞美、质疑、哀悼还是反思。","English":"For a poem purpose question, decide whether the speaker is commemorating, praising, questioning, mourning, or reflecting.","Keywords":"poem purpose verbs","Example":"commemorate, praise, question, mourn, reflect","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R486","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"特殊群体或历史语境题要避免现代常识过度套入。","English":"For special groups or historical contexts, avoid overapplying modern assumptions.","Keywords":"historical context, assumption","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R487","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"缩写和古词可以影响语气，但不能脱离上下文解释。","English":"Contractions and archaic words may affect tone, but they must be interpreted in context.","Keywords":"contraction, archaic word","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R488","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"戏剧文本要注意冲突、回应和人物之间的信息差。","English":"In drama, pay attention to conflict, response, and information gaps between characters.","Keywords":"conflict, information gap","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R489","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"人物台词的功能可能是试探、拒绝、转移话题或表达让步。","English":"A character's line may function to test, reject, shift the topic, or make a concession.","Keywords":"dialogue function","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R490","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"如果选项把复杂情感简化成单一情绪，要谨慎。","English":"If a choice reduces a complex emotion to one simple feeling, be careful.","Keywords":"complex emotion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R491","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"让学生先说：speaker 对对象的态度是什么？","English":"Ask students first: what is the speaker's attitude toward the object?","Keywords":"student prompt, speaker attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R492","Subject":"ReadingV2","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌和戏剧题仍然要回到文本证据，不靠文学感觉选。","English":"Even in poetry and drama questions, return to textual evidence instead of choosing by literary feeling.","Keywords":"textual evidence, literature","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R493","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"错题不要只改答案，要写错因。","English":"Do not just correct the answer; write down the cause of the error.","Keywords":"error cause","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R494","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在题型识别，还是错在文本理解？","English":"Was the error caused by question-type recognition or text comprehension?","Keywords":"question type, comprehension","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R495","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在定位，还是错在选项比较？","English":"Was the error caused by locating the information or comparing the choices?","Keywords":"locating, choice comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R496","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在词汇、长句、逻辑还是证据？","English":"Was the error caused by vocabulary, long sentences, logic, or evidence?","Keywords":"vocabulary, long sentence, logic, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R497","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"复盘时先复述正确答案为什么对。","English":"In review, first restate why the correct answer is right.","Keywords":"correct answer, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R498","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"再说自己的选项为什么错。","English":"Then explain why your original choice is wrong.","Keywords":"wrong answer, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R499","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"最后总结下次遇到同类题怎么做。","English":"Finally, summarize what to do next time with the same question type.","Keywords":"next step, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R500","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":1,"Chinese":"每道错题都要留下一个可执行提醒。","English":"Each wrong question should leave one actionable reminder.","Keywords":"actionable reminder","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R501","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"错题标签建议用：词义、长句、逻辑、定位、证据不完整、图表读错、观点方向错、过度推断。","English":"Suggested error tags: vocabulary, long sentence, logic, locating, incomplete evidence, data misreading, wrong viewpoint direction, over-inference.","Keywords":"error tags","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R502","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"重题变体要关注变的是结论、比较对象、问法还是选项角度。","English":"For repeated question variants, check whether the conclusion, comparison object, question stem, or choice angle has changed.","Keywords":"question variant","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R503","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"复盘不是重新讲文章，而是提炼方法。","English":"Review is not reteaching the passage; it is extracting the method.","Keywords":"review, method","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R504","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"如果学生说‘我没看懂’，要进一步问：没看懂词、句子、逻辑，还是选项？","English":"If a student says, 'I didn't understand it,' ask further: was it the vocabulary, sentence, logic, or choices?","Keywords":"student prompt, diagnosis","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R505","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"如果学生说‘我粗心’，要追问粗心具体发生在哪一步。","English":"If a student says, 'I was careless,' ask exactly which step the carelessness occurred in.","Keywords":"carelessness, step","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R506","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"每次复盘都要把一道题放回知识点地图里。","English":"Every review should place the question back onto the knowledge map.","Keywords":"knowledge map, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R507","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"教师语言训练也要复盘：这句话是否能直接指导学生下一步？","English":"Teacher-language practice should also be reviewed: does this sentence directly guide the student's next step?","Keywords":"teacher language, instruction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R508","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"把高频错误转换成固定课堂口令。","English":"Turn repeated errors into fixed classroom prompts.","Keywords":"classroom prompt","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R509","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"一节课结束前，让学生说出今天最重要的三个判断动作。","English":"Before the end of class, ask students to name the three most important judgment actions from today.","Keywords":"closing review, judgment actions","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R510","Subject":"ReadingV2","Unit":"Review & Error Logging","Level":2,"Chinese":"最终目标是让学生能独立说出：题型、目标、证据关系、排除理由。","English":"The final goal is for students to independently state the question type, target, evidence relationship, and elimination reason.","Keywords":"independent explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"}];

  {key:"ReadingV2",label:"SAT阅读2.0",subjects:["ReadingV2"],description:"阅读教师语言详尽更新版"},
  {key:"Writing",label:"Writing",subjects:["Grammar"],description:"文法与表达题课堂语言"},
  {key:"GrammarV2",label:"SAT文法V2.0",subjects:["GrammarV2"],description:"文法教师语言详尽更新版"},
  {key:"Math",label:"Math",subjects:["Math"],description:"数学题讲解课堂表达"}
];
let activeSubjectKey = null;
const CARDS = SOURCE_CARDS.map((c, i) => ({
  id: i + 1,
  code: c.ID,
  subject: c.Subject,
  unit: c.Unit,
  level: Number(c.Level) || 0,
  term: c.Chinese,
  meaning: c.English,
  note: displaySubjectName(c.Subject) + " · " + c.Unit + " · Level " + c.Level + " · " + c.ID
}));
const STORAGE_KEY = "sat_teacher_language_state_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"known":[],"wrong":[],"favorite":[],"idx":0,"correctCounts":{},"review":{}}');
state.known ||= [];
state.wrong ||= [];
state.favorite ||= [];
state.idx ||= 0;
state.correctCounts ||= {};
state.review ||= {};

function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
function byId(id){return document.getElementById(id);}
function escapeHtml(str){return String(str || "").replace(/[&<>"']/g, function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
function enc(str){return encodeURIComponent(str);}
function dec(str){return decodeURIComponent(str);}
function sample(arr,n){return [...arr].sort(function(){return Math.random() - 0.5;}).slice(0,n);}
function uniqueByMeaning(arr){const seen = new Set(); return arr.filter(function(w){if(seen.has(w.meaning)) return false; seen.add(w.meaning); return true;});}
function activeSubjectGroup(){return SUBJECT_GROUPS.find(function(g){return g.key === activeSubjectKey;}) || null;}
function activeSubjectLabel(){const group = activeSubjectGroup(); return group ? group.label : "";}
function currentCards(){const group = activeSubjectGroup(); return group ? CARDS.filter(function(w){return group.subjects.includes(w.subject);}) : CARDS;}
function subjects(){return [...new Set(currentCards().map(function(w){return w.subject;}))];}
function unitsForSubject(subject){return [...new Set(currentCards().filter(function(w){return w.subject === subject;}).map(function(w){return w.unit;}))];}

function speakEnglish(text, silent){
  if(!("speechSynthesis" in window)){if(!silent) alert("当前浏览器不支持发音功能"); return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.86;
  speechSynthesis.speak(u);
}
function speakButton(text){return '<button class="speakBtn" type="button" data-speak="' + escapeHtml(text) + '">朗读英文</button>';}

function scopeOptions(sel){
  const prefix = activeSubjectLabel() || "全部";
  let html = '<option value="all">' + escapeHtml(prefix) + ' 全部表达</option><option value="level:1">Level 1 必须会</option><option value="level:2">Level 2 高频补充</option><option value="favorite">收藏句</option><option value="wrong">错题本</option><option value="due">今日复习</option>';
  subjects().forEach(function(subject){
    const subjectLabel = displaySubjectName(subject);
    html += '<optgroup label="' + escapeHtml(subjectLabel) + '">';
    html += '<option value="subject:' + enc(subject) + '">' + escapeHtml(subjectLabel) + ' 全部</option>';
    unitsForSubject(subject).forEach(function(unit){
      html += '<option value="unit:' + enc(subject) + '|' + enc(unit) + '">' + escapeHtml(subjectLabel + ' · ' + unit) + '</option>';
    });
    html += '</optgroup>';
  });
  sel.innerHTML = html;
}
function refreshScopes(){["scope","quizScope","listScope"].forEach(function(id){scopeOptions(byId(id));});}
refreshScopes();

function baseFiltered(scope){
  const source = currentCards();
  let arr = source;
  if(scope === "favorite") arr = source.filter(function(w){return state.favorite.includes(w.id);});
  else if(scope === "wrong") arr = source.filter(function(w){return state.wrong.includes(w.id);});
  else if(scope === "due") arr = dueReviewCards();
  else if(scope && scope.indexOf("level:") === 0){
    const level = Number(scope.split(":")[1]);
    arr = source.filter(function(w){return w.level === level;});
  } else if(scope && scope.indexOf("subject:") === 0){
    const subject = dec(scope.slice(8));
    arr = source.filter(function(w){return w.subject === subject;});
  } else if(scope && scope.indexOf("unit:") === 0){
    const parts = scope.slice(5).split("|");
    const subject = dec(parts[0]);
    const unit = dec(parts[1] || "");
    arr = source.filter(function(w){return w.subject === subject && w.unit === unit;});
  }
  return arr;
}
function filtered(scope){return baseFiltered(scope);}
function practiceFiltered(scope){return baseFiltered(scope).filter(function(w){return !state.known.includes(w.id);});}
function correctCount(id){return Math.min(state.correctCounts[id] || 0, 5);}
const REVIEW_INTERVALS = [1,3,7,15,30];
function todayStart(){const d = new Date(); d.setHours(0,0,0,0); return d.getTime();}
function addDays(days){const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + days); return d.getTime();}
function reviewInfo(id){return state.review[id] || null;}
function isDue(w){const r = reviewInfo(w.id); return r && r.due <= todayStart() && state.known.includes(w.id);}
function dueReviewCards(){return currentCards().filter(isDue);}
function scheduleReview(id, stage){const safeStage = stage || 0; const interval = REVIEW_INTERVALS[Math.min(safeStage, REVIEW_INTERVALS.length - 1)]; state.review[id] = {stage:safeStage,due:addDays(interval),last:Date.now()};}
function markKnown(id){state.known = [...new Set([...state.known,id])]; state.correctCounts[id] = 5; state.wrong = state.wrong.filter(function(x){return x !== id;}); if(!state.review[id]) scheduleReview(id,0);}
function failReview(id){state.wrong = [...new Set([...state.wrong,id])]; state.known = state.known.filter(function(x){return x !== id;}); state.correctCounts[id] = 0; delete state.review[id];}
function chip(w){
  return '<span class="pill">' + escapeHtml(displaySubjectName(w.subject)) + '</span><span class="pill">' + escapeHtml(w.unit) + '</span><span class="pill">Level ' + w.level + '</span><span class="pill">' + escapeHtml(w.code) + '</span>' +
    (state.favorite.includes(w.id) ? '<span class="pill">已收藏</span>' : '') +
    (state.known.includes(w.id) ? '<span class="pill">已掌握</span>' : '<span class="pill">正确 ' + correctCount(w.id) + '/5</span>') +
    (isDue(w) ? '<span class="pill">今日复习</span>' : '');
}
function updateStats(){
  const scope = byId("scope").value;
  const arr = filtered(scope);
  byId("totalN").textContent = practiceFiltered(scope).length;
  byId("knownN").textContent = arr.filter(function(w){return state.known.includes(w.id);}).length;
  byId("wrongN").textContent = currentCards().filter(function(w){return state.wrong.includes(w.id);}).length;
  byId("dueN").textContent = dueReviewCards().length;
}

let current = null;
function pickStudy(){
  const arr = practiceFiltered(byId("scope").value);
  if(!arr.length){
    current = null;
    byId("cardMeta").innerHTML = "";
    byId("studyTerm").textContent = "当前范围没有待练表达";
    byId("studyMeaning").textContent = "";
    byId("studyNote").textContent = "已掌握的表达不会再显示。";
    byId("answerBox").classList.add("hidden");
    updateStats();
    return;
  }
  state.idx = (state.idx || 0) % arr.length;
  current = arr[state.idx++];
  save();
  byId("cardMeta").innerHTML = chip(current);
  byId("studyTerm").textContent = current.term;
  byId("studyMeaning").textContent = current.meaning;
  byId("studySpeakBtn").onclick = function(){speakEnglish(current.meaning);};
  byId("studyNote").textContent = current.note;
  byId("answerBox").classList.add("hidden");
  updateStats();
}
byId("showBtn").onclick = function(){byId("answerBox").classList.remove("hidden");};
byId("nextBtn").onclick = pickStudy;
byId("scope").onchange = function(){state.idx = 0; pickStudy(); renderWrong();};
byId("knowBtn").onclick = function(){if(current){markKnown(current.id); save(); pickStudy(); renderWrong(); renderReview(); renderList();}};
byId("dontKnowBtn").onclick = function(){if(current){state.wrong = [...new Set([...state.wrong,current.id])]; save(); pickStudy(); renderWrong(); updateStats(); renderList();}};

let quizCurrent = null;
let quizAutoTimer = null;
function optionMeaningsFor(card){
  let pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning && w.subject === card.subject;}));
  if(pool.length < 3) pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning;}));
  return sample([card.meaning].concat(sample(pool,3).map(function(w){return w.meaning;})),4);
}
function updateQuizActionButtons(){
  const disabled = !quizCurrent;
  byId("favQuizBtn").textContent = "未掌握";
  byId("knownQuizBtn").textContent = "已掌握";
  byId("favQuizBtn").disabled = disabled;
  byId("knownQuizBtn").disabled = disabled;
}
function startQuiz(){
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  const arr = practiceFiltered(byId("quizScope").value);
  if(arr.length < 1){
    quizCurrent = null;
    byId("quizTerm").textContent = "待测表达不足";
    byId("quizMeta").innerHTML = "已掌握的表达不会再显示。";
    byId("options").innerHTML = "";
    byId("quizFeedback").classList.add("hidden");
    updateQuizActionButtons();
    return;
  }
  quizCurrent = sample(arr,1)[0];
  byId("quizMeta").innerHTML = chip(quizCurrent);
  byId("quizTerm").textContent = quizCurrent.term;
  byId("options").innerHTML = "";
  byId("quizFeedback").classList.add("hidden");
  byId("quizFeedback").innerHTML = "";
  updateQuizActionButtons();
}
byId("startQuiz").onclick = startQuiz;
byId("favQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  state.wrong = [...new Set([...state.wrong,quizCurrent.id])];
  state.known = state.known.filter(function(x){return x !== quizCurrent.id;});
  state.correctCounts[quizCurrent.id] = 0;
  delete state.review[quizCurrent.id];
  save();
  byId("quizFeedback").innerHTML = "英文：" + escapeHtml(quizCurrent.meaning) + " " + speakButton(quizCurrent.meaning);
  byId("quizFeedback").classList.remove("hidden");
  byId("quizMeta").innerHTML = chip(quizCurrent);
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  quizAutoTimer = setTimeout(startQuiz, 1100);
};
byId("knownQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  markKnown(quizCurrent.id);
  save();
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  startQuiz();
};

let reviewCurrent = null;
function startReview(){
  const arr = dueReviewCards();
  if(!arr.length){
    reviewCurrent = null;
    byId("reviewTerm").textContent = "今天没有到期复习表达";
    byId("reviewMeta").innerHTML = "";
    byId("reviewOptions").innerHTML = "";
    byId("reviewFeedback").classList.add("hidden");
    renderReview();
    updateStats();
    return;
  }
  reviewCurrent = sample(arr,1)[0];
  byId("reviewMeta").innerHTML = chip(reviewCurrent);
  byId("reviewTerm").textContent = reviewCurrent.term;
  const opts = optionMeaningsFor(reviewCurrent);
  byId("reviewOptions").innerHTML = opts.map(function(o){return '<button class="option reviewOption">' + escapeHtml(o) + '</button>';}).join("");
  byId("reviewFeedback").classList.add("hidden");
  [...document.querySelectorAll(".reviewOption")].forEach(function(b){
    b.onclick = function(){
      const ok = b.textContent === reviewCurrent.meaning;
      [...document.querySelectorAll(".reviewOption")].forEach(function(x){x.disabled = true;});
      b.classList.add(ok ? "correct" : "wrong");
      if(ok){
        const r = reviewInfo(reviewCurrent.id) || {stage:0};
        const nextStage = Math.min((r.stage || 0) + 1, REVIEW_INTERVALS.length - 1);
        scheduleReview(reviewCurrent.id, nextStage);
        byId("reviewFeedback").innerHTML = "复习正确，下次间隔：" + REVIEW_INTERVALS[nextStage] + " 天。 " + speakButton(reviewCurrent.meaning);
        setTimeout(startReview, 900);
      } else {
        failReview(reviewCurrent.id);
        [...document.querySelectorAll(".reviewOption")].forEach(function(x){if(x.textContent === reviewCurrent.meaning)x.classList.add("correct");});
        byId("reviewFeedback").innerHTML = "复习错误，已放回错题本。正确答案：" + escapeHtml(reviewCurrent.meaning) + " " + speakButton(reviewCurrent.meaning);
      }
      byId("reviewFeedback").classList.remove("hidden");
      save();
      renderWrong();
      renderReview();
      updateStats();
      renderList();
    };
  });
}
function renderReview(){
  const arr = dueReviewCards();
  byId("reviewList").innerHTML = arr.length ? '<div class="small">今日到期 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '</div>';}).join("") : '<div class="small">今天没有到期复习表达。</div>';
}
byId("startReview").onclick = startReview;

function renderWrong(){
  const arr = currentCards().filter(function(w){return state.wrong.includes(w.id);});
  byId("wrongList").innerHTML = arr.length ? arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("") : "暂无错题。";
}
byId("clearWrong").onclick = function(){
  const activeIds = new Set(currentCards().map(function(w){return w.id;}));
  state.wrong = state.wrong.filter(function(id){return !activeIds.has(id);});
  save(); renderWrong(); updateStats(); renderList();
};
byId("wrongQuizBtn").onclick = function(){
  openPanel("quiz", {scope:"wrong"});
};

function renderList(){
  const scope = byId("listScope").value;
  const kw = byId("search").value.trim().toLowerCase();
  const arr = filtered(scope).filter(function(w){return (w.term + " " + w.meaning + " " + displaySubjectName(w.subject) + " " + w.subject + " " + w.unit + " " + w.code).toLowerCase().includes(kw);});
  byId("cardList").innerHTML = '<div class="small">显示 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("");
}
byId("search").oninput = renderList;
byId("listScope").onchange = renderList;
const PANEL_TITLES = {study:"背诵",quiz:"测验",review:"复习",wrong:"错题",list:"句表"};
function renderSubjectMenu(){
  byId("subjectMenu").innerHTML = SUBJECT_GROUPS.map(function(group){
    const groupCards = CARDS.filter(function(w){return group.subjects.includes(w.subject);});
    const unitCount = new Set(groupCards.map(function(w){return w.unit;})).size;
    return '<button class="subject-card" type="button" data-subject-entry="' + escapeHtml(group.key) + '">' +
      '<div><div class="subject-card-title">' + escapeHtml(group.label) + '</div>' +
      '<div class="subject-card-meta">' + escapeHtml(group.description) + '，共 ' + groupCards.length + ' 张表达卡，' + unitCount + ' 个知识点。</div></div>' +
      '<span class="subject-card-action">进入练习</span></button>';
  }).join("");
}
function updateHeader(){
  const group = activeSubjectGroup();
  if(group){
    byId("appTitle").textContent = group.label + " 教学语言练习";
    byId("appSub").textContent = group.description + " · " + currentCards().length + " 张课堂表达卡";
  } else {
    byId("appTitle").textContent = "SAT教学语言练习";
    byId("appSub").textContent = "请选择科目：Reading / Writing / Math";
  }
}
function showSubjectMenu(){
  activeSubjectKey = null;
  updateHeader();
  document.body.classList.add("subject-view");
  document.body.classList.remove("menu-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
}
function selectSubject(key){
  if(!SUBJECT_GROUPS.some(function(group){return group.key === key;})) return;
  activeSubjectKey = key;
  refreshScopes();
  state.idx = 0;
  updateHeader();
  showMenu();
}
function openPanel(tabName, opts){
  opts = opts || {};
  if(!PANEL_TITLES[tabName]) return;
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  document.body.classList.remove("menu-view","subject-view");
  document.body.classList.add("content-view");
  document.body.classList.toggle("study-view", tabName === "study");
  document.body.classList.toggle("quiz-view", tabName === "quiz");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  const tab = document.querySelector('[data-tab="' + tabName + '"]');
  if(tab) tab.classList.add("active");
  byId(tabName).classList.add("active");
  byId("contentTitle").textContent = PANEL_TITLES[tabName];
  if(tabName === "study"){
    byId("scope").value = opts.scope || "all";
    if(!byId("scope").value) byId("scope").value = "all";
    state.idx = opts.keepPosition ? state.idx : state.idx || 0;
    pickStudy();
  }
  if(tabName === "quiz"){
    byId("quizScope").value = opts.scope || "all";
    if(!byId("quizScope").value) byId("quizScope").value = "all";
    startQuiz();
  }
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
function showMenu(){
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  updateHeader();
  document.body.classList.add("menu-view");
  document.body.classList.remove("subject-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    openPanel(t.dataset.tab);
  };
});
byId("subjectMenu").addEventListener("click", function(e){
  const btn = e.target.closest("[data-subject-entry]");
  if(btn) selectSubject(btn.dataset.subjectEntry);
});
byId("subjectBackBtn").onclick = showSubjectMenu;
byId("backToMenu").onclick = showMenu;
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-speak]");
  if(btn){e.preventDefault(); speakEnglish(btn.dataset.speak);}
});
renderList();
renderWrong();
renderReview();
updateStats();
renderSubjectMenu();
showSubjectMenu();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>
</body></html>

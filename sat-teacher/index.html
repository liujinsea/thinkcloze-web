ese":"单数所有格通常是名词后加 apostrophe-s。","English":"A singular possessive usually adds apostrophe-s after the noun.","Keywords":"singular possessive","Example":"student's book","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G213","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不规则复数如果不以 s 结尾，所有格仍加 apostrophe-s。","English":"If an irregular plural does not end in s, its possessive still takes apostrophe-s.","Keywords":"irregular plural, possessive","Example":"children's books","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G214","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"抽象名词也可以有所有格关系。","English":"An abstract noun can also be part of a possessive relationship.","Keywords":"abstract noun, possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G215","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果后面是 properties、effects、features 这类名词，要看谁拥有这些属性。","English":"If the following noun is properties, effects, or features, identify what possesses those features.","Keywords":"possessive relationship","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G216","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"名词作形容词修饰另一个名词时，通常不用所有格。","English":"When a noun acts as an adjective modifying another noun, it often does not take a possessive form.","Keywords":"noun modifier","Example":"research methods","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G217","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不要把名词修饰语误写成所有格。","English":"Do not turn a noun modifier into a possessive form unnecessarily.","Keywords":"noun modifier, possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G218","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"可数名词单数前通常需要限定词。","English":"A singular count noun usually needs a determiner.","Keywords":"count noun, determiner","Example":"a method","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G219","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"复数名词可以表示一类事物。","English":"A plural noun can refer to a category in general.","Keywords":"plural noun, general category","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G220","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不可数名词通常不直接加复数 s。","English":"A mass noun usually does not take a plural s directly.","Keywords":"mass noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G221","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词 this 单独使用时，指代要非常清楚。","English":"When this is used alone, its reference must be very clear.","Keywords":"this, reference","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G222","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果 this 后面加名词，指代通常更清楚。","English":"If this is followed by a noun, the reference is usually clearer.","Keywords":"this + noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G223","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"which 指代整件事时，比单独 this 更依赖前文结构。","English":"When which refers to a whole idea, it depends heavily on the previous structure.","Keywords":"which, reference","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G224","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词一致不是看最近的名词，而是看真正的先行词。","English":"Pronoun agreement is not about the nearest noun; it is about the real antecedent.","Keywords":"pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G225","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果一个代词可能指代两个名词，它就是有歧义的。","English":"If a pronoun could refer to two nouns, it is ambiguous.","Keywords":"ambiguous pronoun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G226","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"人称代词要和人或物的类别匹配。","English":"A personal pronoun must match whether the antecedent is a person or a thing.","Keywords":"personal pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G227","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"possessive pronoun 后面通常要接名词。","English":"A possessive pronoun is usually followed by a noun.","Keywords":"possessive pronoun","Example":"their findings","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G228","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"possessive adjective 和 possessive noun 的功能要区分。","English":"Distinguish the function of a possessive adjective and a possessive noun.","Keywords":"possessive adjective, possessive noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G229","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词题不要跳过前一句，先行词常在前一句。","English":"Do not skip the previous sentence in pronoun questions; the antecedent is often there.","Keywords":"previous sentence, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G230","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果选项只是改变代词形式，核心任务就是找先行词。","English":"If the choices only change the pronoun form, the main task is to find the antecedent.","Keywords":"pronoun form, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G231","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"这道题考动词形式。","English":"This question tests verb form.","Keywords":"verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G232","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"这道题考时态。","English":"This question tests tense.","Keywords":"tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G233","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先找主语，再选动词形式。","English":"Find the subject first, and then choose the verb form.","Keywords":"subject, verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G234","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先判断动作发生在什么时间。","English":"First decide when the action happens.","Keywords":"timeline, tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G235","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先看上下文给出的时间线索。","English":"Look at the time clues in the context first.","Keywords":"time clues","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G236","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"动词要和主语在人称和数上一致。","English":"The verb must agree with the subject in person and number.","Keywords":"subject-verb agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G237","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"主动语态表示主语执行动作。","English":"The active voice means the subject performs the action.","Keywords":"active voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G238","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"被动语态表示主语承受动作。","English":"The passive voice means the subject receives the action.","Keywords":"passive voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G239","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"情态动词后面用动词原形。","English":"After a modal verb, use the base form of the verb.","Keywords":"modal, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G240","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"助动词后面的形式要匹配。","English":"The verb form after an auxiliary must match the auxiliary.","Keywords":"auxiliary, verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G241","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在时不一定表示正在发生，也可以表示事实或常态。","English":"The present tense does not always mean happening now; it can express a fact or general condition.","Keywords":"present tense, general truth","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G242","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去时表示过去某个时间发生的动作或状态。","English":"The past tense describes an action or state at a past time.","Keywords":"past tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G243","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在完成时连接过去和现在。","English":"The present perfect connects the past with the present.","Keywords":"present perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G244","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去完成时表示在另一个过去动作之前已经完成。","English":"The past perfect shows that something was completed before another past action.","Keywords":"past perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G245","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"将来完成时表示到未来某时为止已经完成。","English":"The future perfect shows that something will be completed by a future time.","Keywords":"future perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G246","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去进行时可以表示过去某一阶段正在进行的趋势。","English":"The past progressive can describe an ongoing trend during a past period.","Keywords":"past progressive, trend","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G247","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在进行时强调正在进行或临时状态。","English":"The present progressive emphasizes an ongoing or temporary action.","Keywords":"present progressive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G248","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"完成进行时强调持续到某个时间点的过程。","English":"A perfect progressive tense emphasizes a process continuing up to a time point.","Keywords":"perfect progressive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G249","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果句子说 by the time，就要检查完成时。","English":"If the sentence uses by the time, check whether a perfect tense is needed.","Keywords":"by the time, perfect tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G250","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果句子有 earlier、previously、already，要检查时间先后。","English":"If the sentence has earlier, previously, or already, check the sequence of events.","Keywords":"time order, earlier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G251","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果两个过去动作有明确先后，较早的动作可能用过去完成时。","English":"If two past actions have a clear order, the earlier action may need the past perfect.","Keywords":"past perfect, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G252","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果只是列举同一过去时间的动作，普通过去时通常足够。","English":"If the actions are simply listed in the same past period, the simple past is usually enough.","Keywords":"simple past, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G253","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"时态要和文章叙述时间保持一致。","English":"The tense must stay consistent with the passage's time frame.","Keywords":"tense consistency","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G254","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"研究发现通常可以用过去时，因为研究动作发生在过去。","English":"A research finding can use the past tense because the study took place in the past.","Keywords":"research, past tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G255","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"科学事实或作品内容常用现在时。","English":"Scientific facts or the content of a work often use the present tense.","Keywords":"general truth, present tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G256","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"作品、文章、理论本身仍然存在时，常用现在时描述。","English":"When a work, article, or theory still exists, we often describe it in the present tense.","Keywords":"literary present, present tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G257","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"被动语态需要 be 动词加过去分词。","English":"The passive voice requires be plus a past participle.","Keywords":"passive, past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G258","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果主语是动作承受者，被动语态可能更合理。","English":"If the subject receives the action, the passive voice may be more logical.","Keywords":"passive voice, receiver","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G259","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果主语是动作执行者，主动语态更直接。","English":"If the subject performs the action, the active voice is more direct.","Keywords":"active voice, actor","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G260","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"不要把过去分词误当成过去式谓语。","English":"Do not mistake a past participle for a simple past verb.","Keywords":"past participle, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G261","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"has/have 后面要接过去分词。","English":"Has or have must be followed by a past participle.","Keywords":"present perfect, participle","Example":"has shown","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G262","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"had 后面要接过去分词。","English":"Had must be followed by a past participle.","Keywords":"past perfect, participle","Example":"had shown","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G263","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"will 后面接动词原形，不接三单或过去式。","English":"Will is followed by the base form, not a third-person singular or past-tense form.","Keywords":"will, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G264","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"can、could、may、might 后面接动词原形。","English":"Can, could, may, and might are followed by the base form.","Keywords":"modal, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G265","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"to 后面通常接动词原形构成不定式。","English":"To is usually followed by a base verb to form an infinitive.","Keywords":"infinitive, base verb","Example":"to analyze","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G266","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"介词后面如果接动词，通常用动名词。","English":"After a preposition, a verb usually appears as a gerund.","Keywords":"preposition, gerund","Example":"by analyzing","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G267","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"时态题不要只看空格附近，要看整段时间线。","English":"In tense questions, do not look only near the blank; look at the whole timeline.","Keywords":"timeline, context","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G268","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果没有明确时间变化，不要随便切换时态。","English":"If there is no clear time shift, do not switch tense randomly.","Keywords":"tense shift","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G269","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 is/are/was/were，要同时检查主语和时间。","English":"If the choices differ among is, are, was, and were, check both subject number and time.","Keywords":"be verb, subject, tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G270","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 has/have/had，要检查主语和时间先后。","English":"If the choices differ among has, have, and had, check both subject number and time order.","Keywords":"has, have, had","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G271","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 active/passive，要问主语是做动作还是被动作影响。","English":"If the choices differ between active and passive, ask whether the subject does or receives the action.","Keywords":"active passive, subject role","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G272","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 single verb 和 verb phrase，要检查是否多出谓语。","English":"If the choices differ between a single verb and a verb phrase, check whether an extra predicate is created.","Keywords":"verb phrase, extra predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G273","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"这道题考限定动词和非限定动词。","English":"This question tests finite and non-finite verbs.","Keywords":"finite, non-finite","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G274","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"限定动词可以作句子的谓语。","English":"A finite verb can serve as the predicate of a sentence.","Keywords":"finite verb, predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G275","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"非限定动词不能单独作谓语。","English":"A non-finite verb cannot serve as the predicate by itself.","Keywords":"non-finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G276","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"现在分词通常是 -ing 形式。","English":"A present participle usually has the -ing form.","Keywords":"present participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G277","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"过去分词通常是 -ed 或不规则形式。","English":"A past participle usually has an -ed or irregular form.","Keywords":"past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G278","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"动名词本质上是动词形式作名词。","English":"A gerund is a verb form functioning as a noun.","Keywords":"gerund, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G279","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"不定式通常是 to 加动词原形。","English":"An infinitive is usually to plus the base form of a verb.","Keywords":"infinitive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G280","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"如果一个句子没有限定谓语，它就是残句。","English":"If a sentence has no finite verb, it is a fragment.","Keywords":"finite verb, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G281","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"如果一个句子有两个谓语但没有合法连接，它就是连写或结构错误。","English":"If a sentence has two predicates without a legal connection, it is a run-on or structural error.","Keywords":"two predicates, run-on","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G282","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"分词短语可以修饰名词，但不能替代主句谓语。","English":"A participial phrase can modify a noun, but it cannot replace the main predicate.","Keywords":"participle modifier, predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G283","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"主语内部的分词短语不能变成第二个谓语。","English":"A participial phrase inside the subject cannot become a second predicate.","Keywords":"participle inside subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G284","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"主语后的 examining、including、using 这类词常常只是修饰语。","English":"Words such as examining, including, and using after the subject are often modifiers only.","Keywords":"-ing modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G285","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"过去分词短语常表示被动或完成的修饰关系。","English":"A past participial phrase often expresses passive or completed modification.","Keywords":"past participle modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G286","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"现在分词短语常表示主动或正在进行的修饰关系。","English":"A present participial phrase often expresses active or ongoing modification.","Keywords":"present participle modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G287","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"动名词短语作主语时，整个短语按单数处理。","English":"When a gerund phrase is the subject, the whole phrase is treated as singular.","Keywords":"gerund subject, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G288","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"不定式可以作目的状语，也可以作名词性成分。","English":"An infinitive can express purpose or function as a noun element.","Keywords":"infinitive, purpose, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G289","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"to do 作主语时，整体按单数。","English":"When a to-infinitive functions as the subject, the whole phrase is singular.","Keywords":"infinitive subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G290","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"to do 作宾语时，要看前面的动词是否允许接不定式。","English":"When a to-infinitive functions as an object, check whether the previous verb allows an infinitive.","Keywords":"infinitive object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G291","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"介词后如果接动词，通常要用 -ing。","English":"If a verb follows a preposition, it usually appears in the -ing form.","Keywords":"preposition + gerund","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G292","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"by doing 表示通过某种方式。","English":"By doing means by means of doing something.","Keywords":"by doing, method","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G293","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"in doing so 表示通过前一个动作产生后面的结果。","English":"In doing so means that the later result is achieved through the previous action.","Keywords":"in doing so, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G294","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"having done 强调动作发生在主句动作之前。","English":"Having done emphasizes that the action happened before the main action.","Keywords":"having done, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G295","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"being done 表示被动且正在发生或作为状态。","English":"Being done expresses passive meaning and ongoing action or state.","Keywords":"being done, passive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G296","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"done 放在名词后面时，通常是过去分词后置修饰。","English":"When done follows a noun, it is usually a postposed past-participial modifier.","Keywords":"postmodifier, past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G297","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"doing 放在名词后面时，通常是现在分词后置修饰。","English":"When doing follows a noun, it is usually a postposed present-participial modifier.","Keywords":"postmodifier, present participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G298","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"独立主格结构有自己的名词和非限定动词，但不是完整句。","English":"An absolute phrase has its own noun and non-finite verb, but it is not a complete sentence.","Keywords":"absolute phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G299","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"独立主格不能再加一个限定谓语，否则结构会失控。","English":"An absolute phrase should not take an extra finite verb; otherwise the structure breaks down.","Keywords":"absolute phrase, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G300","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"选择 -ing 还是 -ed，要看被修饰名词和动作的主动被动关系。","English":"To choose -ing or -ed, check whether the modified noun performs or receives the action.","Keywords":"-ing vs -ed, voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G301","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"选择 to do 还是 doing，要看前面的动词、介词和句子功能。","English":"To choose to do or doing, check the previous verb, preposition, and sentence function.","Keywords":"infinitive vs gerund","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G302","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"这道题考修饰语。","English":"This question tests modifiers.","Keywords":"modifiers","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G303","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"先判断这个修饰语修饰谁。","English":"First decide what this modifier modifies.","Keywords":"modifier target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G304","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"修饰语要靠近它修饰的对象。","English":"A modifier should stay close to what it modifies.","Keywords":"modifier placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G305","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"句首修饰语后面要接它真正修饰的主语。","English":"An introductory modifier should be followed by the noun it actually modifies.","Keywords":"introductory modifier, logical subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G306","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"形容词修饰名词。","English":"An adjective modifies a noun.","Keywords":"adjective, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G307","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"副词修饰动词、形容词或整个句子。","English":"An adverb modifies a verb, an adjective, or an entire sentence.","Keywords":"adverb, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G308","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"介词短语可以作后置修饰。","English":"A prepositional phrase can work as a postmodifier.","Keywords":"prepositional phrase, postmodifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G309","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"分词短语可以作后置修饰。","English":"A participial phrase can work as a postmodifier.","Keywords":"participial phrase, postmodifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G310","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果句首修饰语和后面的主语逻辑不匹配，就是 dangling modifier。","English":"If the introductory modifier does not logically match the following subject, it is a dangling modifier.","Keywords":"dangling modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G311","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"看到 unlike 或 like 开头，要检查比较对象是否同类。","English":"When you see unlike or like at the beginning, check whether the compared items are parallel in type.","Keywords":"unlike, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G312","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"unlike 后面不是随便接名词，而是要接可比较对象。","English":"After unlike, the noun must be a comparable item, not just any noun.","Keywords":"unlike, comparable item","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G313","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰人就接人，修饰作品就接作品。","English":"If the modifier describes a person, the noun should be a person; if it describes a work, the noun should be a work.","Keywords":"logical subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G314","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要让修饰语错误地挂到最近的名词上。","English":"Do not let the modifier attach incorrectly to the nearest noun.","Keywords":"misplaced modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G315","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果修饰语位置改变导致意思改变，要选最清晰的位置。","English":"If modifier placement changes the meaning, choose the clearest placement.","Keywords":"modifier placement, clarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G316","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"only 的位置会改变句意。","English":"The position of only can change the meaning.","Keywords":"only, modifier placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G317","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"almost、even、also 这类副词位置要和修饰对象一致。","English":"Adverbs such as almost, even, and also must be placed next to what they modify.","Keywords":"adverb placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G318","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"形容词不能直接修饰动作。","English":"An adjective cannot directly modify an action.","Keywords":"adjective vs adverb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G319","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"副词不能当作名词前的形容词使用，除非是固定表达。","English":"An adverb cannot be used as a pre-noun adjective unless it is part of a fixed expression.","Keywords":"adverb, adjective","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G320","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果选项在 adjective 和 adverb 之间变化，先找被修饰对象。","English":"If the choices differ between adjective and adverb forms, first find what is being modified.","Keywords":"adjective/adverb, target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G321","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"后置修饰语要紧跟它修饰的名词，否则会产生歧义。","English":"A postmodifier should follow the noun it modifies; otherwise ambiguity can result.","Keywords":"postmodifier, ambiguity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G322","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"非限制性修饰语只是补充说明，不改变名词范围。","English":"A nonrestrictive modifier only adds information and does not narrow the noun.","Keywords":"nonrestrictive modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G323","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"限制性修饰语限定名词范围，是必要信息。","English":"A restrictive modifier narrows the noun and is essential information.","Keywords":"restrictive modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G324","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"必要修饰语删掉后，名词身份或范围会不清楚。","English":"If an essential modifier is removed, the noun's identity or scope becomes unclear.","Keywords":"essential modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G325","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"非必要修饰语删掉后，句子主干仍然清楚。","English":"If a nonessential modifier is removed, the core sentence remains clear.","Keywords":"nonessential modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G326","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语题要同时检查位置、对象和逻辑。","English":"For modifier questions, check placement, target, and logic together.","Keywords":"modifier, placement, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G327","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要把解释性修饰语误当成主句。","English":"Do not mistake an explanatory modifier for the main clause.","Keywords":"modifier, main clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G328","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果修饰语里有动词，先判断它是限定动词还是分词。","English":"If the modifier contains a verb, first decide whether it is finite or participial.","Keywords":"modifier, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G329","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"过去分词修饰通常表示被动关系。","English":"Past-participle modification usually expresses a passive relationship.","Keywords":"past participle, passive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G330","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"现在分词修饰通常表示主动关系。","English":"Present-participle modification usually expresses an active relationship.","Keywords":"present participle, active","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G331","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"with + 名词 + 分词 可以构成伴随结构。","English":"With plus a noun plus a participle can form an accompanying phrase.","Keywords":"with phrase, absolute-like","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G332","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语越长，越要确认它挂在哪个名词上。","English":"The longer the modifier is, the more carefully we must confirm what it attaches to.","Keywords":"long modifier, attachment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G333","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果一个选项造成“谁做动作”不清楚，就要排除。","English":"If a choice makes it unclear who performs the action, eliminate it.","Keywords":"logical actor, clarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G334","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语不能改变原文事实关系。","English":"A modifier should not change the factual relationship in the sentence.","Keywords":"modifier, factual relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G335","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要为了简洁而制造修饰对象错误。","English":"Do not create a modifier-target error for the sake of concision.","Keywords":"concision, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G336","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"这道题考平行结构。","English":"This question tests parallel structure.","Keywords":"parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G337","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"并列的内容要形式一致。","English":"Items in a series should have matching forms.","Keywords":"parallel forms","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G338","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"先找并列信号词。","English":"First find the parallel signal word.","Keywords":"signal word, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G339","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"and 连接的两边要平行。","English":"The two sides joined by and should be parallel.","Keywords":"and, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G340","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"or 连接的两边要平行。","English":"The two sides joined by or should be parallel.","Keywords":"or, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G341","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"both...and 连接的两边要平行。","English":"The two sides of both...and should be parallel.","Keywords":"both and, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G342","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"either...or 连接的两边要平行。","English":"The two sides of either...or should be parallel.","Keywords":"either or, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G343","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"neither...nor 连接的两边要平行。","English":"The two sides of neither...nor should be parallel.","Keywords":"neither nor, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G344","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"not only...but also 连接的两边要平行。","English":"The two sides of not only...but also should be parallel.","Keywords":"not only but also","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G345","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"from...to...to 结构里每一项要保持同一形式。","English":"In a from...to...to structure, each item should keep the same form.","Keywords":"from to, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G346","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"先圈出并列结构的左边，再找右边对应部分。","English":"Circle the left side of the parallel structure first, then find the matching right side.","Keywords":"parallel pairs","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G347","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行不只是词性相同，还要语法功能相同。","English":"Parallelism is not only about the same part of speech; the grammatical function must also match.","Keywords":"function, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G348","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"名词和名词平行，动名词和动名词平行，不定式和不定式平行。","English":"Nouns should parallel nouns, gerunds should parallel gerunds, and infinitives should parallel infinitives.","Keywords":"parallel forms","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G349","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果左边是 to do，右边通常也要保持 to do 或共享 to。","English":"If the left side uses to do, the right side usually keeps to do or shares the to.","Keywords":"infinitive, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G350","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果左边是 doing，右边通常也要用 doing。","English":"If the left side uses doing, the right side usually uses doing as well.","Keywords":"gerund, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G351","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"从句级平行要求两个从句结构对应。","English":"Clause-level parallelism requires the two clauses to match structurally.","Keywords":"clause-level parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G352","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"比较结构要比较同类对象。","English":"A comparison must compare like with like.","Keywords":"comparison, like items","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G353","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"不能拿作者和作品比较。","English":"Do not compare an author with a work.","Keywords":"comparison, logical pair","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G354","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"不能拿方法和研究者比较。","English":"Do not compare a method with a researcher.","Keywords":"comparison, logical pair","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G355","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"more than 后面要接可比较的对象。","English":"After more than, use a comparable item.","Keywords":"more than, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G356","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"as...as 结构两边要平行。","English":"The two sides of an as...as comparison should be parallel.","Keywords":"as as, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G357","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"than 后面经常省略重复部分，但省略后仍要结构清楚。","English":"After than, repeated words may be omitted, but the remaining structure must be clear.","Keywords":"than, ellipsis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G358","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"unlike 后面要接被比较对象，而不是原因或动作。","English":"After unlike, use the item being compared, not a reason or an action.","Keywords":"unlike, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G359","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"like 表示相似，unlike 表示不同；二者都要求对象同类。","English":"Like signals similarity and unlike signals difference; both require comparable items.","Keywords":"like, unlike","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G360","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"the same as 和 different from 后面也要接同类对象。","English":"The same as and different from must also be followed by comparable items.","Keywords":"same as, different from","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G361","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行结构中的所有格也要保持一致。","English":"Possessive forms in a parallel structure should also remain consistent.","Keywords":"possessive, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G362","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果第一个项目是 their + noun，后面项目也可能需要同样的所有格逻辑。","English":"If the first item is their plus a noun, later items may need the same possessive logic.","Keywords":"possessive pronoun, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G363","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"并列列表中的每一项要能接到同一个前置结构上。","English":"Each item in a list should fit the same introductory structure.","Keywords":"list, shared structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G364","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果某一项接不上前面的动词或介词，就破坏平行。","English":"If one item cannot attach to the same verb or preposition, parallelism breaks.","Keywords":"parallelism, attachment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G365","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行题不要只看最近两项，要看整组列表。","English":"For parallelism questions, do not look only at the nearest two items; check the whole list.","Keywords":"list, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G366","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"标点有时会帮你看出列表边界。","English":"Punctuation can help reveal the boundaries of a list.","Keywords":"punctuation, list boundary","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G367","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行结构既要形式平行，也要逻辑平行。","English":"Parallel structure must be both formally and logically parallel.","Keywords":"formal, logical parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G368","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果一个选项让两边功能不对等，就要排除。","English":"If a choice makes the two sides functionally unequal, eliminate it.","Keywords":"function, elimination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G369","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"比较题最后要问：X 到底和谁比？","English":"At the end of a comparison question, ask: what exactly is X being compared with?","Keywords":"comparison, target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G370","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"这道题考逻辑过渡。","English":"This question tests transition logic.","Keywords":"transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G371","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"先判断前后句关系。","English":"First determine the relationship between the two sentences.","Keywords":"relationship, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G372","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"不要先翻译选项，先判断逻辑。","English":"Do not translate the choices first; identify the logic first.","Keywords":"logic, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G373","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"前后是顺承、转折、因果还是举例？","English":"Is the relationship continuation, contrast, cause-effect, or example?","Keywords":"transition types","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G374","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"however 表示转折。","English":"However signals contrast.","Keywords":"however, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G375","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"therefore 表示结果。","English":"Therefore signals result.","Keywords":"therefore, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G376","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"for example 表示举例。","English":"For example introduces an example.","Keywords":"example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G377","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"in addition 表示补充。","English":"In addition signals addition.","Keywords":"addition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G378","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"similarly 表示相似。","English":"Similarly signals similarity.","Keywords":"similarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G379","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"by contrast 表示对比。","English":"By contrast signals contrast.","Keywords":"contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G380","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"nevertheless 表示让步转折。","English":"Nevertheless signals concession or contrast.","Keywords":"concession","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G381","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"specifically 表示具体说明。","English":"Specifically introduces a more specific explanation.","Keywords":"specification","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G382","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句支持前一句，通常是补充或例证关系。","English":"If the second sentence supports the first, the relationship is usually addition or example.","Keywords":"support, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G383","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句和前一句相反，通常是转折关系。","English":"If the second sentence goes against the first, the relationship is usually contrast.","Keywords":"contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G384","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句解释原因，可能需要 because 或 since 类逻辑。","English":"If the second sentence explains the reason, a cause relationship may be needed.","Keywords":"cause, reason","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G385","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出结果，可能需要 therefore、thus 或 consequently。","English":"If the second sentence gives a result, therefore, thus, or consequently may be needed.","Keywords":"result, conclusion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G386","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出更具体的信息，specifically 或 for example 可能成立。","English":"If the second sentence gives more specific information, specifically or for example may work.","Keywords":"specific, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G387","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句扩大范围，in addition 或 moreover 可能成立。","English":"If the second sentence adds another point, in addition or moreover may work.","Keywords":"addition, moreover","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G388","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句承认例外但仍保持原观点，nevertheless 可能成立。","English":"If the second sentence acknowledges an exception but keeps the main point, nevertheless may work.","Keywords":"concession, nevertheless","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G389","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句只是换句话说，in other words 可能成立。","English":"If the second sentence restates the idea, in other words may work.","Keywords":"restatement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G390","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出目的，to this end 或 for this purpose 可能成立。","English":"If the second sentence gives a purpose, to this end or for this purpose may work.","Keywords":"purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G391","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"in doing so 表示通过前一个动作产生后面的结果。","English":"In doing so means the later result comes through the previous action.","Keywords":"in doing so, action-result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G392","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"as a result 强调结果，不是举例。","English":"As a result emphasizes result, not example.","Keywords":"as a result, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G393","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"for instance 强调例子，不是因果。","English":"For instance emphasizes an example, not cause and effect.","Keywords":"for instance, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G394","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"on the other hand 用于对照另一个方面。","English":"On the other hand introduces a contrasting aspect.","Keywords":"on the other hand, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G395","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"conversely 表示相反方向的对应关系。","English":"Conversely signals a reverse or opposite relationship.","Keywords":"conversely, reverse relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G396","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"meanwhile 表示同时发生，不能随便表示转折。","English":"Meanwhile indicates simultaneous events; it does not automatically mean contrast.","Keywords":"meanwhile, time","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G397","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"subsequently 表示随后发生。","English":"Subsequently means afterward in time.","Keywords":"subsequently, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G398","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"previously 表示此前。","English":"Previously means at an earlier time.","Keywords":"previously, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G399","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"first、next、finally 表示顺序。","English":"First, next, and finally signal sequence.","Keywords":"sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G400","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"instead 表示替代或相反选择。","English":"Instead signals replacement or an alternative.","Keywords":"instead, alternative","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G401","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"rather 表示更准确地说或相反。","English":"Rather can mean more accurately or instead.","Keywords":"rather, correction","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G402","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"indeed 表示强调或进一步证实。","English":"Indeed signals emphasis or further confirmation.","Keywords":"indeed, emphasis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G403","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"transition 题不能只看空格后半句，要看前后两句。","English":"In transition questions, do not look only after the blank; read both sides.","Keywords":"transition, context","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G404","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"正确过渡词要让第二句话顺着前一句发展。","English":"The correct transition must make the second sentence develop naturally from the first.","Keywords":"development, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G405","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果两个选项都表示转折，要比较转折强度和具体关系。","English":"If two choices both signal contrast, compare the strength and the exact type of contrast.","Keywords":"contrast, nuance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G406","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果两个选项都表示因果，要看谁是原因谁是结果。","English":"If two choices both signal cause-effect, determine which side is the cause and which is the result.","Keywords":"cause-effect, direction","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G407","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"不要因为中文都能翻成“因此”就忽略英文逻辑差异。","English":"Do not ignore English logic just because several choices can be translated as 'therefore' in Chinese.","Keywords":"translation, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G408","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"过渡词必须连接思想，不只是填一个顺耳的词。","English":"A transition must connect ideas, not merely sound smooth.","Keywords":"transition, ideas","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G409","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常反转前后逻辑。","English":"Wrong choices often reverse the logical relationship.","Keywords":"distractor, reverse logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G410","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常把例子误当原因。","English":"Wrong choices often treat an example as a cause.","Keywords":"distractor, example vs cause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G411","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常把对比误当补充。","English":"Wrong choices often treat contrast as addition.","Keywords":"distractor, contrast vs addition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G412","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"先用中文说出关系，再匹配英文过渡词。","English":"State the relationship in Chinese first, and then match it to the English transition.","Keywords":"translation strategy, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G413","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"这道题考修辞综合。","English":"This question tests rhetorical synthesis.","Keywords":"rhetorical synthesis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G414","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"先读题干任务。","English":"Read the prompt task first.","Keywords":"prompt task","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G415","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要先读所有笔记。","English":"Do not read all the notes first.","Keywords":"notes, strategy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G416","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"题干让我们做什么？","English":"What does the prompt ask us to do?","Keywords":"task, prompt","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G417","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"只选和任务相关的信息。","English":"Use only the information relevant to the task.","Keywords":"relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G418","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要加入笔记里没有的信息。","English":"Do not add information that is not in the notes.","Keywords":"notes, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G419","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要选信息正确但不完成任务的选项。","English":"Do not choose an option that is factually correct but does not complete the task.","Keywords":"task, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G420","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"先确定目标：介绍、比较、支持、总结还是说明方法。","English":"First identify the goal: introduce, compare, support, conclude, or describe a method.","Keywords":"task types","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G421","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 present the aim，要找研究目的。","English":"If the task is to present the aim, look for the purpose of the study.","Keywords":"aim, purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G422","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 describe the method，要找研究怎么做。","English":"If the task is to describe the method, look for how the study was conducted.","Keywords":"methodology","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G423","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 support a claim，要找能够直接支持观点的证据。","English":"If the task is to support a claim, find evidence that directly supports that claim.","Keywords":"support a claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G424","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make a claim，要选有明确判断的句子。","English":"If the task is to make a claim, choose a sentence with a clear assertion.","Keywords":"make a claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G425","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make and support a claim，答案必须同时有观点和证据。","English":"If the task is to make and support a claim, the answer must include both a claim and evidence.","Keywords":"claim + support","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G426","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 compare data，要精准比较两组数据。","English":"If the task is to compare data, compare the two sets of data precisely.","Keywords":"compare data","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G427","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 indicate location，要找地点信息。","English":"If the task is to indicate location, use location information.","Keywords":"location","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G428","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 provide historical overview，要按时间线组织信息。","English":"If the task is to provide a historical overview, organize information along a timeline.","Keywords":"historical overview","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G429","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 describe a process，要说明步骤或机制。","English":"If the task is to describe a process, explain the steps or mechanism.","Keywords":"process","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G430","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make a generalization，要选概括性强的表述。","English":"If the task is to make a generalization, choose a broad statement.","Keywords":"generalization","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G431","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 conclude，要选能收束前文的句子。","English":"If the task is to conclude, choose a sentence that wraps up the preceding information.","Keywords":"conclusion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G432","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 introduce a topic，不要直接跳到细节。","English":"If the task is to introduce a topic, do not jump directly to details.","Keywords":"introduce topic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G433","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 emphasize a similarity，要找共同点。","English":"If the task is to emphasize a similarity, look for a shared feature.","Keywords":"similarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G434","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 emphasize a difference，要找差异点。","English":"If the task is to emphasize a difference, look for a contrast.","Keywords":"difference, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G435","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务要求 quote a researcher，要保留研究者和观点的对应关系。","English":"If the task requires quoting or citing a researcher, keep the researcher matched with the claim.","Keywords":"researcher, claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G436","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"notes 里的年份、地点、人名不能随意混配。","English":"Do not mix years, locations, and names from different notes randomly.","Keywords":"notes, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G437","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"一个选项可能语法正确，但信息组合不符合任务。","English":"A choice may be grammatically correct but combine information in a way that misses the task.","Keywords":"task mismatch","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G438","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"一个选项可能用了相关信息，但重点放错。","English":"A choice may use relevant information but put the emphasis in the wrong place.","Keywords":"emphasis, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G439","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 support，答案不能只是重复 claim。","English":"If the prompt asks for support, the answer cannot merely repeat the claim.","Keywords":"support, claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G440","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 claim，答案不能只有事实碎片。","English":"If the prompt asks for a claim, the answer cannot be only a fragment of facts.","Keywords":"claim, fact fragments","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G441","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 method，答案不能只写研究结果。","English":"If the prompt asks for a method, the answer cannot only state the result.","Keywords":"method, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G442","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 result，答案不能只写研究目的。","English":"If the prompt asks for a result, the answer cannot only state the purpose.","Keywords":"result, purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G443","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 compare，答案不能只写其中一方。","English":"If the prompt asks for a comparison, the answer cannot mention only one side.","Keywords":"comparison, one-sided","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G444","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果选项出现绝对词，要确认笔记是否支持。","English":"If a choice uses an absolute word, confirm that the notes support it.","Keywords":"absolute language, notes","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G445","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"选择最精准完成任务的句子，不是信息最多的句子。","English":"Choose the sentence that most precisely completes the task, not the one with the most information.","Keywords":"precision, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G446","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"修辞综合题的核心是 task fit。","English":"The core of a rhetorical synthesis question is task fit.","Keywords":"task fit","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G447","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"先把题干任务翻译成一个明确动作。","English":"First translate the prompt task into one clear action.","Keywords":"task action","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G448","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"再从笔记里筛选能够完成这个动作的信息。","English":"Then select the notes that can perform that action.","Keywords":"notes selection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G449","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"最后检查答案有没有多余或错配信息。","English":"Finally check whether the answer contains extra or mismatched information.","Keywords":"extra information, mismatch","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G450","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"不要因为某个选项包含关键词就立刻选。","English":"Do not choose an option immediately just because it contains a keyword.","Keywords":"keyword trap","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G451","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"关键词要服务于任务，而不是替代任务。","English":"Keywords must serve the task; they do not replace the task.","Keywords":"keyword, task","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G452","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果四个选项都来自笔记，差别就在任务完成度。","English":"If all four choices are based on the notes, the difference lies in how well they complete the task.","Keywords":"task completion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G453","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"答案越长不一定越好，越贴合任务才越好。","English":"A longer answer is not necessarily better; the answer that best fits the task is better.","Keywords":"length, task fit","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"}];
function displaySubjectName(subject){return subject === "Grammar" ? "Writing" : subject === "GrammarV2" ? "SAT文法V2.0" : subject;}
const SUBJECT_GROUPS = [
  {key:"Reading",label:"Reading",subjects:["Reading"],description:"阅读讲解与文本分析课堂表达"},
  {key:"Writing",label:"Writing",subjects:["Grammar"],description:"文法与表达题课堂语言"},
  {key:"GrammarV2",label:"SAT文法V2.0",subjects:["GrammarV2"],description:"文法教师语言详尽更新版"},
  {key:"Math",label:"Math",subjects:["Math"],description:"数学题讲解课堂表达"}
];
let activeSubjectKey = null;
const CARDS = SOURCE_CARDS.map((c, i) => ({
  id: i + 1,
  code: c.ID,
  subject: c.Subject,
  unit: c.Unit,
  level: Number(c.Level) || 0,
  term: c.Chinese,
  meaning: c.English,
  note: displaySubjectName(c.Subject) + " · " + c.Unit + " · Level " + c.Level + " · " + c.ID
}));
const STORAGE_KEY = "sat_teacher_language_state_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"known":[],"wrong":[],"favorite":[],"idx":0,"correctCounts":{},"review":{}}');
state.known ||= [];
state.wrong ||= [];
state.favorite ||= [];
state.idx ||= 0;
state.correctCounts ||= {};
state.review ||= {};

function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
function byId(id){return document.getElementById(id);}
function escapeHtml(str){return String(str || "").replace(/[&<>"']/g, function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
function enc(str){return encodeURIComponent(str);}
function dec(str){return decodeURIComponent(str);}
function sample(arr,n){return [...arr].sort(function(){return Math.random() - 0.5;}).slice(0,n);}
function uniqueByMeaning(arr){const seen = new Set(); return arr.filter(function(w){if(seen.has(w.meaning)) return false; seen.add(w.meaning); return true;});}
function activeSubjectGroup(){return SUBJECT_GROUPS.find(function(g){return g.key === activeSubjectKey;}) || null;}
function activeSubjectLabel(){const group = activeSubjectGroup(); return group ? group.label : "";}
function currentCards(){const group = activeSubjectGroup(); return group ? CARDS.filter(function(w){return group.subjects.includes(w.subject);}) : CARDS;}
function subjects(){return [...new Set(currentCards().map(function(w){return w.subject;}))];}
function unitsForSubject(subject){return [...new Set(currentCards().filter(function(w){return w.subject === subject;}).map(function(w){return w.unit;}))];}

function speakEnglish(text, silent){
  if(!("speechSynthesis" in window)){if(!silent) alert("当前浏览器不支持发音功能"); return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.86;
  speechSynthesis.speak(u);
}
function speakButton(text){return '<button class="speakBtn" type="button" data-speak="' + escapeHtml(text) + '">朗读英文</button>';}

function scopeOptions(sel){
  const prefix = activeSubjectLabel() || "全部";
  let html = '<option value="all">' + escapeHtml(prefix) + ' 全部表达</option><option value="level:1">Level 1 必须会</option><option value="level:2">Level 2 高频补充</option><option value="favorite">收藏句</option><option value="wrong">错题本</option><option value="due">今日复习</option>';
  subjects().forEach(function(subject){
    const subjectLabel = displaySubjectName(subject);
    html += '<optgroup label="' + escapeHtml(subjectLabel) + '">';
    html += '<option value="subject:' + enc(subject) + '">' + escapeHtml(subjectLabel) + ' 全部</option>';
    unitsForSubject(subject).forEach(function(unit){
      html += '<option value="unit:' + enc(subject) + '|' + enc(unit) + '">' + escapeHtml(subjectLabel + ' · ' + unit) + '</option>';
    });
    html += '</optgroup>';
  });
  sel.innerHTML = html;
}
function refreshScopes(){["scope","quizScope","listScope"].forEach(function(id){scopeOptions(byId(id));});}
refreshScopes();

function baseFiltered(scope){
  const source = currentCards();
  let arr = source;
  if(scope === "favorite") arr = source.filter(function(w){return state.favorite.includes(w.id);});
  else if(scope === "wrong") arr = source.filter(function(w){return state.wrong.includes(w.id);});
  else if(scope === "due") arr = dueReviewCards();
  else if(scope && scope.indexOf("level:") === 0){
    const level = Number(scope.split(":")[1]);
    arr = source.filter(function(w){return w.level === level;});
  } else if(scope && scope.indexOf("subject:") === 0){
    const subject = dec(scope.slice(8));
    arr = source.filter(function(w){return w.subject === subject;});
  } else if(scope && scope.indexOf("unit:") === 0){
    const parts = scope.slice(5).split("|");
    const subject = dec(parts[0]);
    const unit = dec(parts[1] || "");
    arr = source.filter(function(w){return w.subject === subject && w.unit === unit;});
  }
  return arr;
}
function filtered(scope){return baseFiltered(scope);}
function practiceFiltered(scope){return baseFiltered(scope).filter(function(w){return !state.known.includes(w.id);});}
function correctCount(id){return Math.min(state.correctCounts[id] || 0, 5);}
const REVIEW_INTERVALS = [1,3,7,15,30];
function todayStart(){const d = new Date(); d.setHours(0,0,0,0); return d.getTime();}
function addDays(days){const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + days); return d.getTime();}
function reviewInfo(id){return state.review[id] || null;}
function isDue(w){const r = reviewInfo(w.id); return r && r.due <= todayStart() && state.known.includes(w.id);}
function dueReviewCards(){return currentCards().filter(isDue);}
function scheduleReview(id, stage){const safeStage = stage || 0; const interval = REVIEW_INTERVALS[Math.min(safeStage, REVIEW_INTERVALS.length - 1)]; state.review[id] = {stage:safeStage,due:addDays(interval),last:Date.now()};}
function markKnown(id){state.known = [...new Set([...state.known,id])]; state.correctCounts[id] = 5; state.wrong = state.wrong.filter(function(x){return x !== id;}); if(!state.review[id]) scheduleReview(id,0);}
function failReview(id){state.wrong = [...new Set([...state.wrong,id])]; state.known = state.known.filter(function(x){return x !== id;}); state.correctCounts[id] = 0; delete state.review[id];}
function chip(w){
  return '<span class="pill">' + escapeHtml(displaySubjectName(w.subject)) + '</span><span class="pill">' + escapeHtml(w.unit) + '</span><span class="pill">Level ' + w.level + '</span><span class="pill">' + escapeHtml(w.code) + '</span>' +
    (state.favorite.includes(w.id) ? '<span class="pill">已收藏</span>' : '') +
    (state.known.includes(w.id) ? '<span class="pill">已掌握</span>' : '<span class="pill">正确 ' + correctCount(w.id) + '/5</span>') +
    (isDue(w) ? '<span class="pill">今日复习</span>' : '');
}
function updateStats(){
  const scope = byId("scope").value;
  const arr = filtered(scope);
  byId("totalN").textContent = practiceFiltered(scope).length;
  byId("knownN").textContent = arr.filter(function(w){return state.known.includes(w.id);}).length;
  byId("wrongN").textContent = currentCards().filter(function(w){return state.wrong.includes(w.id);}).length;
  byId("dueN").textContent = dueReviewCards().length;
}

let current = null;
function pickStudy(){
  const arr = practiceFiltered(byId("scope").value);
  if(!arr.length){
    current = null;
    byId("cardMeta").innerHTML = "";
    byId("studyTerm").textContent = "当前范围没有待练表达";
    byId("studyMeaning").textContent = "";
    byId("studyNote").textContent = "已掌握的表达不会再显示。";
    byId("answerBox").classList.add("hidden");
    updateStats();
    return;
  }
  state.idx = (state.idx || 0) % arr.length;
  current = arr[state.idx++];
  save();
  byId("cardMeta").innerHTML = chip(current);
  byId("studyTerm").textContent = current.term;
  byId("studyMeaning").textContent = current.meaning;
  byId("studySpeakBtn").onclick = function(){speakEnglish(current.meaning);};
  byId("studyNote").textContent = current.note;
  byId("answerBox").classList.add("hidden");
  updateStats();
}
byId("showBtn").onclick = function(){byId("answerBox").classList.remove("hidden");};
byId("nextBtn").onclick = pickStudy;
byId("scope").onchange = function(){state.idx = 0; pickStudy(); renderWrong();};
byId("knowBtn").onclick = function(){if(current){markKnown(current.id); save(); pickStudy(); renderWrong(); renderReview(); renderList();}};
byId("dontKnowBtn").onclick = function(){if(current){state.wrong = [...new Set([...state.wrong,current.id])]; save(); pickStudy(); renderWrong(); updateStats(); renderList();}};

let quizCurrent = null;
let quizAutoTimer = null;
function optionMeaningsFor(card){
  let pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning && w.subject === card.subject;}));
  if(pool.length < 3) pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning;}));
  return sample([card.meaning].concat(sample(pool,3).map(function(w){return w.meaning;})),4);
}
function updateQuizActionButtons(){
  const disabled = !quizCurrent;
  byId("favQuizBtn").textContent = "未掌握";
  byId("knownQuizBtn").textContent = "已掌握";
  byId("favQuizBtn").disabled = disabled;
  byId("knownQuizBtn").disabled = disabled;
}
function startQuiz(){
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  const arr = practiceFiltered(byId("quizScope").value);
  if(arr.length < 1){
    quizCurrent = null;
    byId("quizTerm").textContent = "待测表达不足";
    byId("quizMeta").innerHTML = "已掌握的表达不会再显示。";
    byId("options").innerHTML = "";
    byId("quizFeedback").classList.add("hidden");
    updateQuizActionButtons();
    return;
  }
  quizCurrent = sample(arr,1)[0];
  byId("quizMeta").innerHTML = chip(quizCurrent);
  byId("quizTerm").textContent = quizCurrent.term;
  byId("options").innerHTML = "";
  byId("quizFeedback").classList.add("hidden");
  byId("quizFeedback").innerHTML = "";
  updateQuizActionButtons();
}
byId("startQuiz").onclick = startQuiz;
byId("favQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  state.wrong = [...new Set([...state.wrong,quizCurrent.id])];
  state.known = state.known.filter(function(x){return x !== quizCurrent.id;});
  state.correctCounts[quizCurrent.id] = 0;
  delete state.review[quizCurrent.id];
  save();
  byId("quizFeedback").innerHTML = "英文：" + escapeHtml(quizCurrent.meaning) + " " + speakButton(quizCurrent.meaning);
  byId("quizFeedback").classList.remove("hidden");
  byId("quizMeta").innerHTML = chip(quizCurrent);
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  quizAutoTimer = setTimeout(startQuiz, 1100);
};
byId("knownQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  markKnown(quizCurrent.id);
  save();
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  startQuiz();
};

let reviewCurrent = null;
function startReview(){
  const arr = dueReviewCards();
  if(!arr.length){
    reviewCurrent = null;
    byId("reviewTerm").textContent = "今天没有到期复习表达";
    byId("reviewMeta").innerHTML = "";
    byId("reviewOptions").innerHTML = "";
    byId("reviewFeedback").classList.add("hidden");
    renderReview();
    updateStats();
    return;
  }
  reviewCurrent = sample(arr,1)[0];
  byId("reviewMeta").innerHTML = chip(reviewCurrent);
  byId("reviewTerm").textContent = reviewCurrent.term;
  const opts = optionMeaningsFor(reviewCurrent);
  byId("reviewOptions").innerHTML = opts.map(function(o){return '<button class="option reviewOption">' + escapeHtml(o) + '</button>';}).join("");
  byId("reviewFeedback").classList.add("hidden");
  [...document.querySelectorAll(".reviewOption")].forEach(function(b){
    b.onclick = function(){
      const ok = b.textContent === reviewCurrent.meaning;
      [...document.querySelectorAll(".reviewOption")].forEach(function(x){x.disabled = true;});
      b.classList.add(ok ? "correct" : "wrong");
      if(ok){
        const r = reviewInfo(reviewCurrent.id) || {stage:0};
        const nextStage = Math.min((r.stage || 0) + 1, REVIEW_INTERVALS.length - 1);
        scheduleReview(reviewCurrent.id, nextStage);
        byId("reviewFeedback").innerHTML = "复习正确，下次间隔：" + REVIEW_INTERVALS[nextStage] + " 天。 " + speakButton(reviewCurrent.meaning);
        setTimeout(startReview, 900);
      } else {
        failReview(reviewCurrent.id);
        [...document.querySelectorAll(".reviewOption")].forEach(function(x){if(x.textContent === reviewCurrent.meaning)x.classList.add("correct");});
        byId("reviewFeedback").innerHTML = "复习错误，已放回错题本。正确答案：" + escapeHtml(reviewCurrent.meaning) + " " + speakButton(reviewCurrent.meaning);
      }
      byId("reviewFeedback").classList.remove("hidden");
      save();
      renderWrong();
      renderReview();
      updateStats();
      renderList();
    };
  });
}
function renderReview(){
  const arr = dueReviewCards();
  byId("reviewList").innerHTML = arr.length ? '<div class="small">今日到期 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '</div>';}).join("") : '<div class="small">今天没有到期复习表达。</div>';
}
byId("startReview").onclick = startReview;

function renderWrong(){
  const arr = currentCards().filter(function(w){return state.wrong.includes(w.id);});
  byId("wrongList").innerHTML = arr.length ? arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("") : "暂无错题。";
}
byId("clearWrong").onclick = function(){
  const activeIds = new Set(currentCards().map(function(w){return w.id;}));
  state.wrong = state.wrong.filter(function(id){return !activeIds.has(id);});
  save(); renderWrong(); updateStats(); renderList();
};
byId("wrongQuizBtn").onclick = function(){
  openPanel("quiz", {scope:"wrong"});
};

function renderList(){
  const scope = byId("listScope").value;
  const kw = byId("search").value.trim().toLowerCase();
  const arr = filtered(scope).filter(function(w){return (w.term + " " + w.meaning + " " + displaySubjectName(w.subject) + " " + w.subject + " " + w.unit + " " + w.code).toLowerCase().includes(kw);});
  byId("cardList").innerHTML = '<div class="small">显示 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("");
}
byId("search").oninput = renderList;
byId("listScope").onchange = renderList;
const PANEL_TITLES = {study:"背诵",quiz:"测验",review:"复习",wrong:"错题",list:"句表"};
function renderSubjectMenu(){
  byId("subjectMenu").innerHTML = SUBJECT_GROUPS.map(function(group){
    const groupCards = CARDS.filter(function(w){return group.subjects.includes(w.subject);});
    const unitCount = new Set(groupCards.map(function(w){return w.unit;})).size;
    return '<button class="subject-card" type="button" data-subject-entry="' + escapeHtml(group.key) + '">' +
      '<div><div class="subject-card-title">' + escapeHtml(group.label) + '</div>' +
      '<div class="subject-card-meta">' + escapeHtml(group.description) + '，共 ' + groupCards.length + ' 张表达卡，' + unitCount + ' 个知识点。</div></div>' +
      '<span class="subject-card-action">进入练习</span></button>';
  }).join("");
}
function updateHeader(){
  const group = activeSubjectGroup();
  if(group){
    byId("appTitle").textContent = group.label + " 教学语言练习";
    byId("appSub").textContent = group.description + " · " + currentCards().length + " 张课堂表达卡";
  } else {
    byId("appTitle").textContent = "SAT教学语言练习";
    byId("appSub").textContent = "请选择科目：Reading / Writing / Math";
  }
}
function showSubjectMenu(){
  activeSubjectKey = null;
  updateHeader();
  document.body.classList.add("subject-view");
  document.body.classList.remove("menu-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
}
function selectSubject(key){
  if(!SUBJECT_GROUPS.some(function(group){return group.key === key;})) return;
  activeSubjectKey = key;
  refreshScopes();
  state.idx = 0;
  updateHeader();
  showMenu();
}
function openPanel(tabName, opts){
  opts = opts || {};
  if(!PANEL_TITLES[tabName]) return;
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  document.body.classList.remove("menu-view","subject-view");
  document.body.classList.add("content-view");
  document.body.classList.toggle("study-view", tabName === "study");
  document.body.classList.toggle("quiz-view", tabName === "quiz");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  const tab = document.querySelector('[data-tab="' + tabName + '"]');
  if(tab) tab.classList.add("active");
  byId(tabName).classList.add("active");
  byId("contentTitle").textContent = PANEL_TITLES[tabName];
  if(tabName === "study"){
    byId("scope").value = opts.scope || "all";
    if(!byId("scope").value) byId("scope").value = "all";
    state.idx = opts.keepPosition ? state.idx : state.idx || 0;
    pickStudy();
  }
  if(tabName === "quiz"){
    byId("quizScope").value = opts.scope || "all";
    if(!byId("quizScope").value) byId("quizScope").value = "all";
    startQuiz();
  }
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
function showMenu(){
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  updateHeader();
  document.body.classList.add("menu-view");
  document.body.classList.remove("subject-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    openPanel(t.dataset.tab);
  };
});
byId("subjectMenu").addEventListener("click", function(e){
  const btn = e.target.closest("[data-subject-entry]");
  if(btn) selectSubject(btn.dataset.subjectEntry);
});
byId("subjectBackBtn").onclick = showSubjectMenu;
byId("backToMenu").onclick = showMenu;
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-speak]");
  if(btn){e.preventDefault(); speakEnglish(btn.dataset.speak);}
});
renderList();
renderWrong();
renderReview();
updateStats();
renderSubjectMenu();
showSubjectMenu();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SAT教学语言" />
<meta name="theme-color" content="#3157d5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>SAT教学语言练习</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#70758a;--line:#e6e7ef;--primary:#3157d5;--good:#0a8f5a;--bad:#ce2f45;--chip:#eef2ff;--warn:#fff8df;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.94);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:4px 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
button,select,input{font:inherit}
.tab,.btn{border:0;border-radius:14px;padding:11px 10px;background:#fff;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.tab.active,.btn.primary{background:var(--primary);color:#fff}
.btn{width:100%;margin:6px 0;font-weight:650}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(28,32,54,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--chip);padding:5px 9px;font-size:12px;color:#293b8f;margin:3px}
.promptLabel{color:var(--muted);font-size:13px;margin-top:12px}
.term{font-size:30px;font-weight:800;line-height:1.22;margin:18px 0 14px;overflow-wrap:anywhere}
.answer{font-size:22px;line-height:1.42;margin:16px 0;color:#213f98;font-weight:760;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;line-height:1.55;background:#fafafd;border-radius:14px;padding:10px;margin-top:10px}
select,input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.num{font-size:22px;font-weight:800}
.label{font-size:12px;color:var(--muted)}
.option{width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;line-height:1.35;overflow-wrap:anywhere}
.option.correct{border-color:var(--good);background:#eefaf5}
.option.wrong{border-color:var(--bad);background:#fff0f2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn.star{background:var(--warn);border:1px solid #f0d36a;color:#765a00}
.btn.done{background:#eefaf5;border:1px solid #9dddbf;color:#075f3b}
.listItem{padding:12px 0;border-bottom:1px solid var(--line)}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
.center{text-align:center}
.speakBtn{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;font-size:13px;background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none;margin:2px 0 8px}
.content-top{display:none;align-items:center;gap:12px;margin:0 0 10px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.content-top .btn{width:auto;margin:0;padding:8px 12px}
.content-title{font-weight:800;color:var(--muted)}
body.subject-view .panel,body.subject-view .content-top{display:none}
body.subject-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.subject-view .tabs,body.subject-view .subject-back{display:none}
.subject-menu{display:none}
body.subject-view .subject-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:28px 0 0}
.subject-card{min-height:190px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);text-align:left;box-shadow:0 16px 34px rgba(28,32,54,.08)}
.subject-card-title{font-size:24px;font-weight:800;line-height:1.15}
.subject-card-meta{color:var(--muted);font-size:14px;line-height:1.5}
.subject-card-action{display:inline-flex;align-items:center;justify-content:center;width:fit-content;min-height:40px;border-radius:6px;background:var(--primary);color:#fff;padding:0 16px;font-size:16px;font-weight:700}
.subject-back{display:inline-flex;width:auto;margin:18px 0 0;padding:8px 12px}
body.menu-view .panel{display:none}
body.content-view header{display:none}
body.content-view .content-top{display:flex}
body.content-view #study .study-setup{display:block}
body.subject-view .app{max-width:980px;padding:44px 18px 28px}
body.subject-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.subject-view .sub{font-size:16px;max-width:780px}
body.menu-view .app{max-width:980px;padding:44px 18px 28px}
body.menu-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.menu-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.menu-view .sub{font-size:16px;max-width:780px}
body.menu-view .tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0 0}
body.menu-view .tab{min-height:92px;display:flex;align-items:flex-end;justify-content:flex-start;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:18px;font-weight:800;text-align:left;box-shadow:0 10px 26px rgba(28,32,54,.06)}
@media (min-width:900px){
  .app{max-width:980px;padding:14px 18px 28px}
  h1{font-size:20px;margin:2px 0 4px}
  .sub{font-size:12px}
  .tabs{gap:8px;margin:10px 0 8px}
  .tab,.btn{border-radius:12px;padding:8px 9px;font-size:14px}
  .card{border-radius:18px;padding:14px;margin:10px 0}
  .term{font-size:26px;margin:14px 0 12px;line-height:1.18}
  .answer{font-size:18px;margin:10px 0}
  .note{font-size:13px;line-height:1.4;padding:8px;margin-top:8px}
  select,input{padding:9px;border-radius:12px;margin:4px 0 8px;font-size:14px}
  .stats{gap:8px}
  .stat{border-radius:14px;padding:8px}
  .num{font-size:18px}
  .label{font-size:11px}
  .option{margin:6px 0;padding:10px 12px;border-radius:13px;font-size:15px;line-height:1.3}
  .actions{gap:8px;margin-top:8px}
  .actions .btn{font-size:14px;padding:8px 9px}
  .pill{font-size:11px;padding:4px 8px}
  .listItem{padding:9px 0}
  body.menu-view .app{padding-top:38px}
}
@media (max-width:480px){
  .app{padding:14px 12px 36px}
  .term{font-size:26px}
  .answer{font-size:20px}
  .option{padding:13px;font-size:16px}
  .stats{gap:7px}
  .stat{padding:9px 5px}
  .label{font-size:11px}
  body.subject-view .app{padding:24px 14px 24px}
  body.subject-view h1{font-size:28px}
  body.subject-view .sub{font-size:14px}
  body.menu-view .app{padding:24px 14px 24px}
  body.menu-view h1{font-size:28px}
  body.menu-view .sub{font-size:14px}
  body.menu-view .tabs{grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  body.menu-view .tab{min-height:74px;border-radius:16px;padding:14px;font-size:16px}
  body.subject-view .subject-menu{grid-template-columns:1fr;gap:10px;margin-top:20px}
  .subject-card{min-height:172px;padding:18px}
}
</style>
</head>
<body class="menu-view"><div class="app">
<header>
  <h1 id="appTitle">SAT教学语言练习</h1>
  <div class="sub" id="appSub">请选择科目：Reading / Writing / Math / Reading 3.0 / Writing 3.0 / Math 3.0</div>
  <button class="btn ghost subject-back" id="subjectBackBtn" type="button">返回科目选择</button>
  <div class="tabs">
    <button class="tab" data-tab="study">背诵</button>
    <button class="tab" data-tab="quiz">测验</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="wrong">错题</button>
    <button class="tab" data-tab="list">句表</button>
  </div>
</header>
<section class="subject-menu" id="subjectMenu" aria-label="选择科目"></section>
<div class="content-top"><button class="btn ghost" id="backToMenu" type="button">返回Teacher主页</button><div class="content-title" id="contentTitle"></div></div>

<section id="study" class="panel">
  <div class="card study-setup">
    <label for="scope">选择范围</label>
    <select id="scope"></select>
    <div class="stats">
      <div class="stat"><div class="num" id="totalN">0</div><div class="label">待练</div></div>
      <div class="stat"><div class="num" id="knownN">0</div><div class="label">已掌握</div></div>
      <div class="stat"><div class="num" id="wrongN">0</div><div class="label">错题</div></div>
      <div class="stat"><div class="num" id="dueN">0</div><div class="label">今日复习</div></div>
    </div>
  </div>
  <div class="card center">
    <div id="cardMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="studyTerm">-</div>
    <button class="btn primary" id="showBtn">显示英文</button>
    <div id="answerBox" class="hidden">
      <div class="answer" id="studyMeaning"></div>
      <button class="speakBtn" id="studySpeakBtn" type="button">朗读英文</button>
      <div class="note" id="studyNote"></div>
      <button class="btn good" id="knowBtn">已掌握</button>
      <button class="btn bad" id="dontKnowBtn">还不熟 / 加入错题</button>
    </div>
    <button class="btn ghost" id="nextBtn">下一张</button>
  </div>
</section>

<section id="quiz" class="panel">
  <div class="hidden">
    <label for="quizScope">测验范围</label>
    <select id="quizScope"></select>
    <button class="btn primary" id="startQuiz">开始 / 下一题</button>
  </div>
  <div class="card">
    <div id="quizMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="quizTerm">点击开始</div>
    <div id="options"></div>
    <div class="actions">
      <button class="btn bad" id="favQuizBtn">未掌握</button>
      <button class="btn done" id="knownQuizBtn">已掌握</button>
    </div>
    <div id="quizFeedback" class="note hidden"></div>
  </div>
</section>

<section id="review" class="panel">
  <div class="card">
    <div class="row"><strong>间隔复习</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="startReview">开始今日复习</button></div>
  </div>
  <div class="card">
    <div id="reviewMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="reviewTerm">今日到期表达会显示在这里</div>
    <div id="reviewOptions"></div>
    <div id="reviewFeedback" class="note hidden"></div>
  </div>
  <div class="card" id="reviewList"></div>
</section>

<section id="wrong" class="panel">
  <div class="card">
    <div class="row"><strong>错题本</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="wrongQuizBtn">错题集中测验</button><button class="btn ghost" style="width:auto;padding:9px 12px" id="clearWrong">清空</button></div>
  </div>
  <div class="card" id="wrongList"></div>
</section>

<section id="list" class="panel">
  <div class="card">
    <input id="search" placeholder="搜索中文 / 英文 / Unit / ID" />
    <select id="listScope"></select>
  </div>
  <div class="card" id="cardList"></div>
</section>
</div>

<script>
const SOURCE_CARDS = [{"ID":"G001","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先观察选项之间的区别。","English":"First, compare the answer choices.","Keywords":"","Example":""},{"ID":"G002","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"你注意到了什么区别？","English":"What differences do you notice?","Keywords":"","Example":""},{"ID":"G003","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"仔细比较选项。","English":"Compare the choices carefully.","Keywords":"","Example":""},{"ID":"G004","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要急着选答案。","English":"Don't rush to choose an answer.","Keywords":"","Example":""},{"ID":"G005","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注选项中变化的部分。","English":"Pay attention to what changes from one option to another.","Keywords":"","Example":""},{"ID":"G006","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"这道题考什么？","English":"What is being tested here?","Keywords":"","Example":""},{"ID":"G007","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"我们一步一步来。","English":"Let's work through it step by step.","Keywords":"","Example":""},{"ID":"G008","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先判断考点。","English":"Let's identify the issue first.","Keywords":"","Example":""},{"ID":"G009","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格前面的词。","English":"Look at the word immediately before the blank.","Keywords":"","Example":""},{"ID":"G010","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格后面的词。","English":"Look at the word immediately after the blank.","Keywords":"","Example":""},{"ID":"G011","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"把句子大声读出来。","English":"Read the sentence aloud.","Keywords":"","Example":""},{"ID":"G012","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要依赖语感。","English":"Don't rely on your ear alone.","Keywords":"","Example":""},{"ID":"G013","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"语法优先，意思其次。","English":"Grammar comes first; meaning comes second.","Keywords":"","Example":""},{"ID":"G014","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先保证句子结构正确。","English":"Make sure the sentence structure is correct first.","Keywords":"","Example":""},{"ID":"G015","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"然后再检查意思是否通顺。","English":"Then check whether the meaning works.","Keywords":"","Example":""},{"ID":"G016","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"这道题考察句子边界。","English":"This question tests sentence boundaries.","Keywords":"","Example":""},{"ID":"G017","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先分析句子结构。","English":"Let's analyze the sentence structure first.","Keywords":"","Example":""},{"ID":"G018","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"我们有一个独立分句还是两个独立分句？","English":"Do we have one independent clause or two independent clauses?","Keywords":"","Example":""},{"ID":"G019","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个完整句吗？","English":"Is this a complete sentence?","Keywords":"","Example":""},{"ID":"G020","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句可以独立成句。","English":"This clause can stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G021","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句不能独立成句。","English":"This clause cannot stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G022","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个残句。","English":"This is a sentence fragment.","Keywords":"","Example":""},{"ID":"G023","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个连写句。","English":"This is a run-on sentence.","Keywords":"","Example":""},{"ID":"G024","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个逗号拼接错误。","English":"This is a comma splice.","Keywords":"","Example":""},{"ID":"G025","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句子已经完整了。","English":"The sentence is already complete.","Keywords":"","Example":""},{"ID":"G026","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要句号。","English":"We do not need a period here.","Keywords":"","Example":""},{"ID":"G027","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要分号。","English":"We do not need a semicolon here.","Keywords":"","Example":""},{"ID":"G028","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句号可以分隔两个完整句。","English":"A period can separate two complete sentences.","Keywords":"","Example":""},{"ID":"G029","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"分号可以连接两个相关的独立分句。","English":"A semicolon can join two closely related independent clauses.","Keywords":"","Example":""},{"ID":"G030","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"逗号不能单独连接两个独立分句。","English":"A comma alone cannot join two independent clauses.","Keywords":"","Example":""},{"ID":"G031","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里需要更强的停顿。","English":"We need a stronger break here.","Keywords":"","Example":""},{"ID":"G032","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不应该断开句子。","English":"We should not break the sentence here.","Keywords":"","Example":""},{"ID":"G033","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先找主句在哪里。","English":"First, find the main clause.","Keywords":"","Example":""},{"ID":"G034","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"哪个部分承载句子的主要意思？","English":"Which part carries the main meaning of the sentence?","Keywords":"","Example":""},{"ID":"G035","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个结构在语法上不完整。","English":"This structure is grammatically incomplete.","Keywords":"","Example":""},{"ID":"G036","Subject":"Grammar","Unit":"Punctuation","Level":1,"Chinese":"这道题考察标点。","English":"This question tests punctuation.","Keywords":"","Example":""},{"ID":"G037","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"标点不是随机的。","English":"Punctuation is not random.","Keywords":"","Example":""},{"ID":"G038","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"每个标点都有语法功能。","English":"Every punctuation mark has a grammatical function.","Keywords":"","Example":""},{"ID":"G039","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号前面必须是完整句。","English":"A colon must follow a complete sentence.","Keywords":"","Example":""},{"ID":"G040","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号后面通常是解释、例子或列表。","English":"A colon usually introduces an explanation, an example, or a list.","Keywords":"","Example":""},{"ID":"G041","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"破折号可以强调补充信息。","English":"A dash can emphasize additional information.","Keywords":"","Example":""},{"ID":"G042","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"一对破折号可以插入非必要信息。","English":"A pair of dashes can set off nonessential information.","Keywords":"","Example":""},{"ID":"G043","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"逗号可以隔开非必要信息。","English":"Commas can set off nonessential information.","Keywords":"","Example":""},{"ID":"G044","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"如果这里有一个逗号，通常还需要另一个逗号。","English":"If we have one comma here, we usually need another comma.","Keywords":"","Example":""},{"ID":"G045","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个插入语应该被逗号隔开。","English":"This interruption should be set off by commas.","Keywords":"","Example":""},{"ID":"G046","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子仍然成立。","English":"If we remove this part, the sentence still works.","Keywords":"","Example":""},{"ID":"G047","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是非必要信息。","English":"Therefore, this information is nonessential.","Keywords":"","Example":""},{"ID":"G048","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子意思不完整。","English":"If we remove this part, the sentence becomes incomplete.","Keywords":"","Example":""},{"ID":"G049","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是必要信息。","English":"Therefore, this information is essential.","Keywords":"","Example":""},{"ID":"G050","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这里的逗号会打断主语和动词。","English":"This comma would separate the subject from the verb.","Keywords":"","Example":""},{"ID":"G051","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"主语和动词之间通常不需要逗号。","English":"We normally do not put a comma between the subject and the verb.","Keywords":"","Example":""},{"ID":"G052","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"动词和宾语之间不能随便加逗号。","English":"We should not place a comma between the verb and its object.","Keywords":"","Example":""},{"ID":"G053","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个标点会制造不必要的停顿。","English":"This punctuation creates an unnecessary break.","Keywords":"","Example":""},{"ID":"G054","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点使用正确。","English":"This option uses punctuation correctly.","Keywords":"","Example":""},{"ID":"G055","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点破坏了句子结构。","English":"This punctuation breaks the sentence structure.","Keywords":"","Example":""},{"ID":"G056","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"这道题考察主谓一致。","English":"This question tests subject-verb agreement.","Keywords":"","Example":""},{"ID":"G057","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"先找主语。","English":"Let's identify the subject first.","Keywords":"","Example":""},{"ID":"G058","Subject":"Grammar","Unit":"Agreement","Level":2,"Chinese":"不要看离动词最近的名词。","English":"Don't look at the noun closest to the verb.","Keywords":"","Example":" 师语言更新"},{"ID":"G010","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"我们先把插入成分拿掉看主干。","English":"Notice that remove the interruption and look at the core sentence.","Keywords":"interruption, core","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G011","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"这道题不是问哪个更像中文，而是问哪个英语结构合法。","English":"Notice that this question is not about what sounds natural in Chinese; it is about what is grammatically legal in English.","Keywords":"grammar, legal structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G012","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"每个选项都要回到原句里检查。","English":"Notice that put each choice back into the sentence and check it.","Keywords":"substitution, checking","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G013","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"这里不要只看空格本身，要看整个句子。","English":"Don't look only at the blank; look at the whole sentence.","Keywords":"whole sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G014","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"看到这类题，通常有一个语法硬规则。","English":"Notice that this type of question usually depends on a hard grammar rule.","Keywords":"rule, grammar","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G015","Subject":"GrammarV3","Unit":"General","Level":1,"Chinese":"我们先排除结构错误的选项。","English":"Let's not choose yet. Start with the choices and ask what the question is really testing.","Keywords":"elimination, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G016","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"如果两个选项都通顺，优先选择结构更准确、表达更简洁的选项。","English":"If two choices both make sense, prefer the one that is structurally accurate and concise.","Keywords":"conciseness, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G017","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"这里我们要问：这个词在句子中承担什么功能？","English":"Here we should ask: what function does this word serve in the sentence?","Keywords":"function, syntax","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G018","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是标点，所以这不是词义题，而是句子结构题。","English":"Notice that the choices differ in punctuation, so this is not a vocabulary question; it is a sentence-structure question.","Keywords":"punctuation, sentence structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G019","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是动词形式，所以要检查主语、时态和语态。","English":"Notice that the choices differ in verb form, so check the subject, tense, and voice.","Keywords":"verb form, tense, voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G020","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是代词，所以要回到前文找先行词。","English":"Notice that the choices differ in pronoun form, so go back and find the antecedent.","Keywords":"pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G021","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是连接词，所以要判断前后逻辑关系。","English":"Notice that the choices differ in transition words, so determine the logical relationship.","Keywords":"transition, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G022","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是单复数，所以要找真正控制它的名词。","English":"Notice that the choices differ in number, so find the noun that controls it.","Keywords":"number, head noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G023","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"选项变化的是从句结构，所以要判断这是独立句、从属句还是修饰语。","English":"Notice that the choices differ in clause structure, so decide whether it is an independent clause, a dependent clause, or a modifier.","Keywords":"clause, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G024","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"我们先把错误类型说清楚，再解释为什么正确答案成立。","English":"Notice that name the error type first, then explain why the correct answer works.","Keywords":"explanation, error type","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G025","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"正确答案一定要同时满足语法、逻辑和简洁性。","English":"The right answer must satisfy grammar, logic, and concision at the same time.","Keywords":"grammar, logic, concision","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G026","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"这里不要为了保留原文信息而牺牲语法结构。","English":"Don't sacrifice grammatical structure just to keep the wording of the original sentence.","Keywords":"structure, wording","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G027","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"如果一个选项制造了新错误，即使意思接近也要排除。","English":"If a choice creates a new error, eliminate it even if the meaning is close.","Keywords":"new error, elimination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G028","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"这不是找最漂亮的表达，而是找最不出错的表达。","English":"Notice that we are not looking for the prettiest wording; we are looking for the wording that does not create an error.","Keywords":"accuracy, SAT style","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G029","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"我们先把答案读回去时，要检查空格两边是否同时成立。","English":"Notice that when you read the answer back into the sentence, check both sides of the blank.","Keywords":"checking, both sides","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G030","Subject":"GrammarV3","Unit":"General","Level":2,"Chinese":"我们先做语法判断，最后再用语义确认。","English":"Notice that make the grammar decision first, and use meaning only to confirm it at the end.","Keywords":"grammar first, meaning check","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G031","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"这道题考的是句子边界；先把这个考点认出来。","English":"For boundaries, first decide what is a complete sentence and what is not.","Keywords":"sentence boundaries","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G032","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"我们先判断空格前是不是完整句。","English":"Notice that first decide whether the part before the blank is a complete sentence.","Keywords":"complete sentence, before blank","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G033","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"再判断空格后是不是完整句。","English":"Notice that then decide whether the part after the blank is a complete sentence.","Keywords":"complete sentence, after blank","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G034","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"完整句一定要有主语和限定谓语。","English":"Notice that a complete sentence must have a subject and a finite verb.","Keywords":"complete sentence, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G035","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"一个独立分句可以单独成句。","English":"Notice that an independent clause can stand alone as a sentence.","Keywords":"independent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G036","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"从属分句不能单独成句。","English":"Notice that a dependent clause cannot stand alone as a sentence.","Keywords":"dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G037","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是残句，不是完整句。","English":"Notice that this is a fragment, not a complete sentence.","Keywords":"fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G038","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是连写句，两个完整句被硬接在一起。","English":"Notice that this is a run-on sentence; two complete sentences are joined incorrectly.","Keywords":"run-on","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G039","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"这是逗号拼接，逗号不能单独连接两个完整句。","English":"Notice that this is a comma splice; a comma alone cannot join two complete sentences.","Keywords":"comma splice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G040","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"句号可以分开两个完整句。","English":"For boundaries, first decide what is a complete sentence and what is not.","Keywords":"period, independent clauses","Example":"IC. IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G041","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"分号可以连接两个相关的独立分句。","English":"Notice that a semicolon can join two closely related independent clauses.","Keywords":"semicolon, independent clauses","Example":"IC; IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G042","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"逗号加并列连词可以连接两个完整句。","English":"Notice that a comma plus a coordinating conjunction can join two complete sentences.","Keywords":"comma, FANBOYS","Example":"IC, and IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G043","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"只有逗号不够。","English":"For boundaries, first decide what is a complete sentence and what is not.","Keywords":"comma splice","Example":"IC, IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G044","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"只有连接词也不够，标点也要正确。","English":"Notice that the conjunction alone is not enough; the punctuation must also be correct.","Keywords":"conjunction, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G045","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":1,"Chinese":"句子已经完整了，不要再硬加一个谓语。","English":"Notice that the sentence is already complete; don't force in another predicate.","Keywords":"extra verb, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G046","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果空格前后都是完整句，不能用普通逗号。","English":"If both sides of the blank are complete sentences, we cannot use an ordinary comma.","Keywords":"comma splice, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G047","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果后一部分只是补充说明，不一定需要独立成句。","English":"If the second part only adds explanation, it does not always need to be an independent sentence.","Keywords":"supplement, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G048","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果前面是完整设定，冒号后可以给出解释或列表。","English":"If the first part is a complete setup, a colon can introduce an explanation or a list.","Keywords":"colon, complete setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G049","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"看到如果前面不是完整句，冒号，通常不能直接使用。","English":"If the setup before the colon is not a complete sentence, a colon usually cannot be used.","Keywords":"colon, incomplete setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G050","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"however、therefore、consequently 这类副词不能像 and 一样直接连接两个完整句。","English":"Notice that adverbs such as however, therefore, and consequently cannot connect two complete sentences the way and can.","Keywords":"conjunctive adverb","Example":"IC; however, IC","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G051","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"看到连接副词，前面通常要用句号或分号。","English":"Notice that a conjunctive adverb usually needs a period or a semicolon before it.","Keywords":"conjunctive adverb, semicolon","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G052","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"because 开头会把完整句降级为从属分句。","English":"Notice that starting with because turns the clause into a dependent clause.","Keywords":"because, subordination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G053","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"although、while、when 这类词会制造从属关系。","English":"Notice that words like although, while, and when create subordination.","Keywords":"subordinator, dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G054","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"从属结构可以解决连写句，但不能改变原句逻辑。","English":"Notice that subordination can fix a run-on, but it must not change the intended logic.","Keywords":"subordination, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G055","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"that 从句如果作主语，后面还要主句谓语。","English":"If a that-clause is the subject, the sentence still needs a main verb afterward.","Keywords":"that-clause, subject","Example":"That the result changed was surprising.","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G056","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"动名词短语可以作主语，但后面仍然要谓语。","English":"Notice that a gerund phrase can serve as the subject, but it still needs a verb after it.","Keywords":"gerund phrase, subject","Example":"Analyzing the data shows...","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G057","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"分词短语不是完整句，因为它没有限定谓语。","English":"Notice that a participial phrase is not a complete sentence because it has no finite verb.","Keywords":"participle, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G058","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"同位语短语只是补充名词，不是完整句。","English":"Notice that an appositive phrase only renames a noun; it is not a complete sentence.","Keywords":"appositive, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G059","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"介词短语不能单独构成完整句。","English":"Notice that a prepositional phrase cannot form a complete sentence by itself.","Keywords":"prepositional phrase, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G060","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里的问题不是意思不通，而是缺少句子主干。","English":"Notice that the problem here is not meaning; the sentence is missing its core structure.","Keywords":"missing core, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G061","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不能用分号，因为分号两边一定要都是独立分句。","English":"Notice that we cannot use a semicolon here because both sides of a semicolon must be independent clauses.","Keywords":"semicolon, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G062","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不能用句号，因为句号后面不是完整句。","English":"Notice that we cannot use a period here because what follows is not a complete sentence.","Keywords":"period, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G063","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里可以用破折号，因为后面是补充解释，而不是另一个主句。","English":"Notice that a dash can work here because the second part is an explanation, not another main clause.","Keywords":"dash, explanation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G064","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"我们先把句子切成左右两块，再判断每一块能不能独立。","English":"Notice that split the sentence into the left side and the right side, and check whether each side can stand alone.","Keywords":"chunking, IC","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G065","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果一个选项让句子只剩从句，它就是残句。","English":"If a choice leaves the sentence as only a dependent clause, it creates a fragment.","Keywords":"fragment, dependent clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G066","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果一个选项让两个主句没有合法连接，它就是连写句。","English":"If a choice leaves two main clauses without a legal connection, it creates a run-on.","Keywords":"run-on, main clauses","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G067","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"两个完整句之间要么强断开，要么合法连接。","English":"Notice that between two complete sentences, either separate them fully or connect them legally.","Keywords":"boundary, legal connection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G068","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"冒号不是万能连接符，它要前面有完整设定。","English":"Notice that a colon is not a universal connector; it needs a complete setup before it.","Keywords":"colon, setup","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G069","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"破折号可以插入补充信息，但不能修复所有句子边界错误。","English":"Notice that a dash can insert extra information, but it cannot fix every sentence-boundary error.","Keywords":"dash, boundaries","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G070","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"句子边界题最怕只凭停顿感。","English":"In boundary questions, relying only on pauses is dangerous.","Keywords":"pause, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G071","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"标点不是用来表示你读到哪里喘气的，而是用来表示结构关系的。","English":"Notice that punctuation does not simply show where you pause; it shows structural relationships.","Keywords":"punctuation, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G072","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"如果读起来像两个句子，就检查是否有两个独立分句。","English":"If it sounds like two sentences, check whether there are two independent clauses.","Keywords":"IC, checking","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G073","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"选项中的标点一定要和左右结构匹配。","English":"Notice that the punctuation in the choice must match the structure on both sides.","Keywords":"punctuation, matching","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G074","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不要把非限定动词误认为句子的谓语。","English":"Don't mistake a non-finite verb for the main verb of the sentence.","Keywords":"finite vs non-finite","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G075","Subject":"GrammarV3","Unit":"Sentence Boundaries","Level":2,"Chinese":"一个句子可以很长，但主干一定要只有合法的连接方式。","English":"Notice that a sentence can be long, but its core clauses must be connected legally.","Keywords":"long sentence, connection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G076","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"这道题考的是标点；先把这个考点认出来。","English":"Don't choose punctuation by feel. Check the structure on both sides first.","Keywords":"punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G077","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"先别问哪里需要停顿，要问这里是什么结构。","English":"Don't ask where to pause first; ask what structure we have here.","Keywords":"punctuation, structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G078","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"逗号不能随便放在主语和谓语之间。","English":"Notice that a comma cannot be placed randomly between a subject and its verb.","Keywords":"comma, subject-verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G079","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"逗号不能切断动词和宾语。","English":"Notice that a comma cannot separate a verb from its object.","Keywords":"comma, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G080","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"逗号不能切断介词和宾语。","English":"Notice that a comma cannot separate a preposition from its object.","Keywords":"comma, preposition-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G081","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"看到必要信息，通常不需要逗号。","English":"Don't choose punctuation by feel. Check the structure on both sides first.","Keywords":"essential information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G082","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"看到非必要信息，通常用逗号隔开。","English":"Notice that nonessential information is usually set off with commas.","Keywords":"nonessential information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G083","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"同位语如果是补充信息，就要用逗号隔开。","English":"If an appositive is extra information, set it off with commas.","Keywords":"appositive, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G084","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"同位语如果是必要信息，就不要加逗号。","English":"If an appositive is essential, don't add commas.","Keywords":"essential appositive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G085","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"看到冒号后面，通常是解释、例子或列表。","English":"Notice that a colon usually introduces an explanation, an example, or a list.","Keywords":"colon, list","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G086","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"冒号前面要有完整句。","English":"Notice that a colon needs a complete sentence before it.","Keywords":"colon, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G087","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"分号两边都要是完整句。","English":"Notice that both sides of a semicolon must be complete sentences.","Keywords":"semicolon, complete sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G088","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"破折号可以表示补充说明。","English":"Notice that a dash can introduce or set off extra information.","Keywords":"dash, extra information","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G089","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"成对破折号要成对收口。","English":"Notice that a pair of dashes must open and close the interruption.","Keywords":"paired dashes","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G090","Subject":"GrammarV3","Unit":"Punctuation","Level":1,"Chinese":"成对逗号也要成对收口。","English":"Notice that a pair of commas must open and close the interruption.","Keywords":"paired commas","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G091","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"如果中间是插入成分，前后标点要对称。","English":"If the middle part is an interruption, the punctuation around it must be balanced.","Keywords":"interruption, balanced punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G092","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这个逗号会把主语和谓语切开，所以要排除。","English":"Notice that this comma separates the subject from the verb, so eliminate it.","Keywords":"comma, subject-verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G093","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这个逗号会把动词和宾语切开，所以不合法。","English":"Notice that this comma separates the verb from its object, so it is not grammatical.","Keywords":"comma, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G094","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这个冒号把动词和宾语切开了，所以不能选。","English":"Notice that this colon separates the verb from its object, so it cannot be correct.","Keywords":"colon, verb-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G095","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这个冒号把介词和宾语切开了，所以不能选。","English":"Notice that this colon separates the preposition from its object, so it cannot be correct.","Keywords":"colon, preposition-object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G096","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"冒号前如果只是短语，后面再完整也不行。","English":"If the words before the colon are only a phrase, the colon does not work even if the words after it are complete.","Keywords":"colon, phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G097","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"冒号后可以是不完整结构，只要它解释前面的完整设定。","English":"After a colon, the information can be a fragment if it explains the complete setup before it.","Keywords":"colon, explanation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G098","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"复杂列表中，如果项目内部已经有逗号，可以用分号分隔大项目。","English":"In a complex list, if the items already contain commas, semicolons can separate the major items.","Keywords":"complex list, semicolon","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G099","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"分号不是高级逗号，它有明确的句子边界功能。","English":"Notice that a semicolon is not a fancy comma; it has a specific sentence-boundary function.","Keywords":"semicolon, boundary","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G100","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"逗号加 and 可以连接两个完整句，但逗号不能省。","English":"Notice that a comma plus and can connect two complete sentences, but the comma cannot be omitted.","Keywords":"comma FANBOYS","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G101","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"如果 and 只是连接两个词或短语，前面不一定需要逗号。","English":"If and joins only two words or phrases, a comma is not necessarily needed before it.","Keywords":"and, phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G102","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这里的逗号不是为了好看，而是为了标出非限制性信息。","English":"Notice that the comma is not decorative; it marks nonrestrictive information.","Keywords":"nonrestrictive, comma","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G103","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"看到 which 引导非限制性从句时，前面，通常要有逗号。","English":"Notice that when which introduces a nonrestrictive clause, it usually needs a comma before it.","Keywords":"which, nonrestrictive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G104","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"看到 that 引导必要信息时，前面，通常不加逗号。","English":"Notice that when that introduces essential information, it usually does not take a comma before it.","Keywords":"that, essential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G105","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"who 或 which 从句如果只是补充身份，就要隔开。","English":"If a who- or which-clause only adds extra identification, set it off.","Keywords":"relative clause, nonessential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G106","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"如果从句限制名词范围，就不要用逗号隔开。","English":"If the clause restricts the noun, don't set it off with commas.","Keywords":"restrictive clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G107","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"破折号后面可以给出突然的补充或强调。","English":"Notice that a dash can introduce a sudden addition or emphasis.","Keywords":"dash, emphasis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G108","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"破折号不能用来连接两个完全没有结构关系的句子。","English":"Notice that a dash should not be used to connect two sentences with no clear structural relationship.","Keywords":"dash, sentence relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G109","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"如果前面已经有开口破折号，后面要看是否需要闭合。","English":"If there is an opening dash before, check whether the interruption needs to be closed.","Keywords":"closing dash","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G110","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"括号中的信息是附加信息，不应影响主谓一致。","English":"Notice that information in parentheses is extra and should not affect subject-verb agreement.","Keywords":"parentheses, agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G111","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"引号和标点不改变句子主干。","English":"Notice that quotation marks and punctuation don't change the core grammar of the sentence.","Keywords":"quotation, core grammar","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G112","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"撇号 s 表示单数所有格或不规则复数所有格。","English":"Notice that apostrophe-s marks singular possession or possession for irregular plurals.","Keywords":"apostrophe s, possessive","Example":"artist's work","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G113","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"看到 s 后加撇号，通常表示规则复数所有格。","English":"Notice that an apostrophe after s usually marks possession for a regular plural noun.","Keywords":"plural possessive","Example":"artists' works","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G114","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"its 是所有格，it's 是 it is 或 it has。","English":"Notice that its is possessive; it's means it is or it has.","Keywords":"its, it's","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G115","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"标点题要检查标点两边的语法单位。","English":"For punctuation questions, check the grammatical unit on each side of the punctuation.","Keywords":"punctuation, units","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G116","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"这里不要因为句子长就随便加逗号。","English":"Don't add a comma just because the sentence is long.","Keywords":"comma, long sentence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G117","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"短介词短语开头时，逗号有时不是硬性要求。","English":"After a short introductory prepositional phrase, ation, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G125","Subject":"GrammarV3","Unit":"Punctuation","Level":2,"Chinese":"看到标点错误，通常可以用结构测试快速排除。","English":"Notice that punctuation errors can usually be eliminated quickly with a structure test.","Keywords":"structure test, punctuation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G126","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"这道题考的是从句结构；先把这个考点认出来。","English":"When you see a clause, ask what it depends on or what it modifies.","Keywords":"clause structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G127","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"我们先判断这是主句还是从句。","English":"Notice that first decide whether this is a main clause or a subordinate clause.","Keywords":"main clause, subordinate clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G128","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"关系从句修饰前面的名词。","English":"Notice that a relative clause modifies the noun before it.","Keywords":"relative clause, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G129","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"看到 who，通常指人。","English":"When you see a clause, ask what it depends on or what it modifies.","Keywords":"who, people","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G130","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"看到 which，通常指物或整件事。","English":"Notice that which usually refers to things or an entire idea.","Keywords":"which, thing","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G131","Subject":"GrammarV3","Unit":"Clauses & Relative Structures","Level":1,"Chinese":"看到 that，通常引导必要信息。","English":"When you see a clause, ask what it depends on or what it modifies.","Keywords":"that, essential","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G132","Subject":"Gramm

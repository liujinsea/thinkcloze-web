ese":"单数所有格通常是名词后加 apostrophe-s。","English":"A singular possessive usually adds apostrophe-s after the noun.","Keywords":"singular possessive","Example":"student's book","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G213","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不规则复数如果不以 s 结尾，所有格仍加 apostrophe-s。","English":"If an irregular plural does not end in s, its possessive still takes apostrophe-s.","Keywords":"irregular plural, possessive","Example":"children's books","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G214","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"抽象名词也可以有所有格关系。","English":"An abstract noun can also be part of a possessive relationship.","Keywords":"abstract noun, possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G215","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果后面是 properties、effects、features 这类名词，要看谁拥有这些属性。","English":"If the following noun is properties, effects, or features, identify what possesses those features.","Keywords":"possessive relationship","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G216","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"名词作形容词修饰另一个名词时，通常不用所有格。","English":"When a noun acts as an adjective modifying another noun, it often does not take a possessive form.","Keywords":"noun modifier","Example":"research methods","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G217","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不要把名词修饰语误写成所有格。","English":"Do not turn a noun modifier into a possessive form unnecessarily.","Keywords":"noun modifier, possessive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G218","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"可数名词单数前通常需要限定词。","English":"A singular count noun usually needs a determiner.","Keywords":"count noun, determiner","Example":"a method","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G219","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"复数名词可以表示一类事物。","English":"A plural noun can refer to a category in general.","Keywords":"plural noun, general category","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G220","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"不可数名词通常不直接加复数 s。","English":"A mass noun usually does not take a plural s directly.","Keywords":"mass noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G221","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词 this 单独使用时，指代要非常清楚。","English":"When this is used alone, its reference must be very clear.","Keywords":"this, reference","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G222","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果 this 后面加名词，指代通常更清楚。","English":"If this is followed by a noun, the reference is usually clearer.","Keywords":"this + noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G223","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"which 指代整件事时，比单独 this 更依赖前文结构。","English":"When which refers to a whole idea, it depends heavily on the previous structure.","Keywords":"which, reference","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G224","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词一致不是看最近的名词，而是看真正的先行词。","English":"Pronoun agreement is not about the nearest noun; it is about the real antecedent.","Keywords":"pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G225","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果一个代词可能指代两个名词，它就是有歧义的。","English":"If a pronoun could refer to two nouns, it is ambiguous.","Keywords":"ambiguous pronoun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G226","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"人称代词要和人或物的类别匹配。","English":"A personal pronoun must match whether the antecedent is a person or a thing.","Keywords":"personal pronoun, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G227","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"possessive pronoun 后面通常要接名词。","English":"A possessive pronoun is usually followed by a noun.","Keywords":"possessive pronoun","Example":"their findings","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G228","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"possessive adjective 和 possessive noun 的功能要区分。","English":"Distinguish the function of a possessive adjective and a possessive noun.","Keywords":"possessive adjective, possessive noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G229","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"代词题不要跳过前一句，先行词常在前一句。","English":"Do not skip the previous sentence in pronoun questions; the antecedent is often there.","Keywords":"previous sentence, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G230","Subject":"GrammarV2","Unit":"Nouns, Pronouns & Possessives","Level":2,"Chinese":"如果选项只是改变代词形式，核心任务就是找先行词。","English":"If the choices only change the pronoun form, the main task is to find the antecedent.","Keywords":"pronoun form, antecedent","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G231","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"这道题考动词形式。","English":"This question tests verb form.","Keywords":"verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G232","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"这道题考时态。","English":"This question tests tense.","Keywords":"tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G233","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先找主语，再选动词形式。","English":"Find the subject first, and then choose the verb form.","Keywords":"subject, verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G234","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先判断动作发生在什么时间。","English":"First decide when the action happens.","Keywords":"timeline, tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G235","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"先看上下文给出的时间线索。","English":"Look at the time clues in the context first.","Keywords":"time clues","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G236","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"动词要和主语在人称和数上一致。","English":"The verb must agree with the subject in person and number.","Keywords":"subject-verb agreement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G237","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"主动语态表示主语执行动作。","English":"The active voice means the subject performs the action.","Keywords":"active voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G238","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"被动语态表示主语承受动作。","English":"The passive voice means the subject receives the action.","Keywords":"passive voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G239","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"情态动词后面用动词原形。","English":"After a modal verb, use the base form of the verb.","Keywords":"modal, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G240","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":1,"Chinese":"助动词后面的形式要匹配。","English":"The verb form after an auxiliary must match the auxiliary.","Keywords":"auxiliary, verb form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G241","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在时不一定表示正在发生，也可以表示事实或常态。","English":"The present tense does not always mean happening now; it can express a fact or general condition.","Keywords":"present tense, general truth","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G242","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去时表示过去某个时间发生的动作或状态。","English":"The past tense describes an action or state at a past time.","Keywords":"past tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G243","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在完成时连接过去和现在。","English":"The present perfect connects the past with the present.","Keywords":"present perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G244","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去完成时表示在另一个过去动作之前已经完成。","English":"The past perfect shows that something was completed before another past action.","Keywords":"past perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G245","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"将来完成时表示到未来某时为止已经完成。","English":"The future perfect shows that something will be completed by a future time.","Keywords":"future perfect","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G246","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"过去进行时可以表示过去某一阶段正在进行的趋势。","English":"The past progressive can describe an ongoing trend during a past period.","Keywords":"past progressive, trend","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G247","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"现在进行时强调正在进行或临时状态。","English":"The present progressive emphasizes an ongoing or temporary action.","Keywords":"present progressive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G248","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"完成进行时强调持续到某个时间点的过程。","English":"A perfect progressive tense emphasizes a process continuing up to a time point.","Keywords":"perfect progressive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G249","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果句子说 by the time，就要检查完成时。","English":"If the sentence uses by the time, check whether a perfect tense is needed.","Keywords":"by the time, perfect tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G250","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果句子有 earlier、previously、already，要检查时间先后。","English":"If the sentence has earlier, previously, or already, check the sequence of events.","Keywords":"time order, earlier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G251","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果两个过去动作有明确先后，较早的动作可能用过去完成时。","English":"If two past actions have a clear order, the earlier action may need the past perfect.","Keywords":"past perfect, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G252","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果只是列举同一过去时间的动作，普通过去时通常足够。","English":"If the actions are simply listed in the same past period, the simple past is usually enough.","Keywords":"simple past, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G253","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"时态要和文章叙述时间保持一致。","English":"The tense must stay consistent with the passage's time frame.","Keywords":"tense consistency","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G254","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"研究发现通常可以用过去时，因为研究动作发生在过去。","English":"A research finding can use the past tense because the study took place in the past.","Keywords":"research, past tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G255","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"科学事实或作品内容常用现在时。","English":"Scientific facts or the content of a work often use the present tense.","Keywords":"general truth, present tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G256","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"作品、文章、理论本身仍然存在时，常用现在时描述。","English":"When a work, article, or theory still exists, we often describe it in the present tense.","Keywords":"literary present, present tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G257","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"被动语态需要 be 动词加过去分词。","English":"The passive voice requires be plus a past participle.","Keywords":"passive, past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G258","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果主语是动作承受者，被动语态可能更合理。","English":"If the subject receives the action, the passive voice may be more logical.","Keywords":"passive voice, receiver","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G259","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果主语是动作执行者，主动语态更直接。","English":"If the subject performs the action, the active voice is more direct.","Keywords":"active voice, actor","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G260","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"不要把过去分词误当成过去式谓语。","English":"Do not mistake a past participle for a simple past verb.","Keywords":"past participle, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G261","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"has/have 后面要接过去分词。","English":"Has or have must be followed by a past participle.","Keywords":"present perfect, participle","Example":"has shown","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G262","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"had 后面要接过去分词。","English":"Had must be followed by a past participle.","Keywords":"past perfect, participle","Example":"had shown","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G263","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"will 后面接动词原形，不接三单或过去式。","English":"Will is followed by the base form, not a third-person singular or past-tense form.","Keywords":"will, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G264","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"can、could、may、might 后面接动词原形。","English":"Can, could, may, and might are followed by the base form.","Keywords":"modal, base form","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G265","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"to 后面通常接动词原形构成不定式。","English":"To is usually followed by a base verb to form an infinitive.","Keywords":"infinitive, base verb","Example":"to analyze","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G266","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"介词后面如果接动词，通常用动名词。","English":"After a preposition, a verb usually appears as a gerund.","Keywords":"preposition, gerund","Example":"by analyzing","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G267","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"时态题不要只看空格附近，要看整段时间线。","English":"In tense questions, do not look only near the blank; look at the whole timeline.","Keywords":"timeline, context","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G268","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果没有明确时间变化，不要随便切换时态。","English":"If there is no clear time shift, do not switch tense randomly.","Keywords":"tense shift","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G269","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 is/are/was/were，要同时检查主语和时间。","English":"If the choices differ among is, are, was, and were, check both subject number and time.","Keywords":"be verb, subject, tense","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G270","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 has/have/had，要检查主语和时间先后。","English":"If the choices differ among has, have, and had, check both subject number and time order.","Keywords":"has, have, had","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G271","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 active/passive，要问主语是做动作还是被动作影响。","English":"If the choices differ between active and passive, ask whether the subject does or receives the action.","Keywords":"active passive, subject role","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G272","Subject":"GrammarV2","Unit":"Verb Form & Tense","Level":2,"Chinese":"如果选项变化是 single verb 和 verb phrase，要检查是否多出谓语。","English":"If the choices differ between a single verb and a verb phrase, check whether an extra predicate is created.","Keywords":"verb phrase, extra predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G273","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"这道题考限定动词和非限定动词。","English":"This question tests finite and non-finite verbs.","Keywords":"finite, non-finite","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G274","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"限定动词可以作句子的谓语。","English":"A finite verb can serve as the predicate of a sentence.","Keywords":"finite verb, predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G275","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"非限定动词不能单独作谓语。","English":"A non-finite verb cannot serve as the predicate by itself.","Keywords":"non-finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G276","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"现在分词通常是 -ing 形式。","English":"A present participle usually has the -ing form.","Keywords":"present participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G277","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"过去分词通常是 -ed 或不规则形式。","English":"A past participle usually has an -ed or irregular form.","Keywords":"past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G278","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"动名词本质上是动词形式作名词。","English":"A gerund is a verb form functioning as a noun.","Keywords":"gerund, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G279","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":1,"Chinese":"不定式通常是 to 加动词原形。","English":"An infinitive is usually to plus the base form of a verb.","Keywords":"infinitive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G280","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"如果一个句子没有限定谓语，它就是残句。","English":"If a sentence has no finite verb, it is a fragment.","Keywords":"finite verb, fragment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G281","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"如果一个句子有两个谓语但没有合法连接，它就是连写或结构错误。","English":"If a sentence has two predicates without a legal connection, it is a run-on or structural error.","Keywords":"two predicates, run-on","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G282","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"分词短语可以修饰名词，但不能替代主句谓语。","English":"A participial phrase can modify a noun, but it cannot replace the main predicate.","Keywords":"participle modifier, predicate","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G283","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"主语内部的分词短语不能变成第二个谓语。","English":"A participial phrase inside the subject cannot become a second predicate.","Keywords":"participle inside subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G284","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"主语后的 examining、including、using 这类词常常只是修饰语。","English":"Words such as examining, including, and using after the subject are often modifiers only.","Keywords":"-ing modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G285","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"过去分词短语常表示被动或完成的修饰关系。","English":"A past participial phrase often expresses passive or completed modification.","Keywords":"past participle modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G286","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"现在分词短语常表示主动或正在进行的修饰关系。","English":"A present participial phrase often expresses active or ongoing modification.","Keywords":"present participle modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G287","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"动名词短语作主语时，整个短语按单数处理。","English":"When a gerund phrase is the subject, the whole phrase is treated as singular.","Keywords":"gerund subject, singular","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G288","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"不定式可以作目的状语，也可以作名词性成分。","English":"An infinitive can express purpose or function as a noun element.","Keywords":"infinitive, purpose, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G289","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"to do 作主语时，整体按单数。","English":"When a to-infinitive functions as the subject, the whole phrase is singular.","Keywords":"infinitive subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G290","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"to do 作宾语时，要看前面的动词是否允许接不定式。","English":"When a to-infinitive functions as an object, check whether the previous verb allows an infinitive.","Keywords":"infinitive object","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G291","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"介词后如果接动词，通常要用 -ing。","English":"If a verb follows a preposition, it usually appears in the -ing form.","Keywords":"preposition + gerund","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G292","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"by doing 表示通过某种方式。","English":"By doing means by means of doing something.","Keywords":"by doing, method","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G293","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"in doing so 表示通过前一个动作产生后面的结果。","English":"In doing so means that the later result is achieved through the previous action.","Keywords":"in doing so, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G294","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"having done 强调动作发生在主句动作之前。","English":"Having done emphasizes that the action happened before the main action.","Keywords":"having done, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G295","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"being done 表示被动且正在发生或作为状态。","English":"Being done expresses passive meaning and ongoing action or state.","Keywords":"being done, passive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G296","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"done 放在名词后面时，通常是过去分词后置修饰。","English":"When done follows a noun, it is usually a postposed past-participial modifier.","Keywords":"postmodifier, past participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G297","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"doing 放在名词后面时，通常是现在分词后置修饰。","English":"When doing follows a noun, it is usually a postposed present-participial modifier.","Keywords":"postmodifier, present participle","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G298","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"独立主格结构有自己的名词和非限定动词，但不是完整句。","English":"An absolute phrase has its own noun and non-finite verb, but it is not a complete sentence.","Keywords":"absolute phrase","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G299","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"独立主格不能再加一个限定谓语，否则结构会失控。","English":"An absolute phrase should not take an extra finite verb; otherwise the structure breaks down.","Keywords":"absolute phrase, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G300","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"选择 -ing 还是 -ed，要看被修饰名词和动作的主动被动关系。","English":"To choose -ing or -ed, check whether the modified noun performs or receives the action.","Keywords":"-ing vs -ed, voice","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G301","Subject":"GrammarV2","Unit":"Verbals & Finite Verbs","Level":2,"Chinese":"选择 to do 还是 doing，要看前面的动词、介词和句子功能。","English":"To choose to do or doing, check the previous verb, preposition, and sentence function.","Keywords":"infinitive vs gerund","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G302","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"这道题考修饰语。","English":"This question tests modifiers.","Keywords":"modifiers","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G303","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"先判断这个修饰语修饰谁。","English":"First decide what this modifier modifies.","Keywords":"modifier target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G304","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"修饰语要靠近它修饰的对象。","English":"A modifier should stay close to what it modifies.","Keywords":"modifier placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G305","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"句首修饰语后面要接它真正修饰的主语。","English":"An introductory modifier should be followed by the noun it actually modifies.","Keywords":"introductory modifier, logical subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G306","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"形容词修饰名词。","English":"An adjective modifies a noun.","Keywords":"adjective, noun","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G307","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"副词修饰动词、形容词或整个句子。","English":"An adverb modifies a verb, an adjective, or an entire sentence.","Keywords":"adverb, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G308","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"介词短语可以作后置修饰。","English":"A prepositional phrase can work as a postmodifier.","Keywords":"prepositional phrase, postmodifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G309","Subject":"GrammarV2","Unit":"Modifiers","Level":1,"Chinese":"分词短语可以作后置修饰。","English":"A participial phrase can work as a postmodifier.","Keywords":"participial phrase, postmodifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G310","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果句首修饰语和后面的主语逻辑不匹配，就是 dangling modifier。","English":"If the introductory modifier does not logically match the following subject, it is a dangling modifier.","Keywords":"dangling modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G311","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"看到 unlike 或 like 开头，要检查比较对象是否同类。","English":"When you see unlike or like at the beginning, check whether the compared items are parallel in type.","Keywords":"unlike, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G312","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"unlike 后面不是随便接名词，而是要接可比较对象。","English":"After unlike, the noun must be a comparable item, not just any noun.","Keywords":"unlike, comparable item","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G313","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰人就接人，修饰作品就接作品。","English":"If the modifier describes a person, the noun should be a person; if it describes a work, the noun should be a work.","Keywords":"logical subject","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G314","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要让修饰语错误地挂到最近的名词上。","English":"Do not let the modifier attach incorrectly to the nearest noun.","Keywords":"misplaced modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G315","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果修饰语位置改变导致意思改变，要选最清晰的位置。","English":"If modifier placement changes the meaning, choose the clearest placement.","Keywords":"modifier placement, clarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G316","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"only 的位置会改变句意。","English":"The position of only can change the meaning.","Keywords":"only, modifier placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G317","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"almost、even、also 这类副词位置要和修饰对象一致。","English":"Adverbs such as almost, even, and also must be placed next to what they modify.","Keywords":"adverb placement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G318","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"形容词不能直接修饰动作。","English":"An adjective cannot directly modify an action.","Keywords":"adjective vs adverb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G319","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"副词不能当作名词前的形容词使用，除非是固定表达。","English":"An adverb cannot be used as a pre-noun adjective unless it is part of a fixed expression.","Keywords":"adverb, adjective","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G320","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果选项在 adjective 和 adverb 之间变化，先找被修饰对象。","English":"If the choices differ between adjective and adverb forms, first find what is being modified.","Keywords":"adjective/adverb, target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G321","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"后置修饰语要紧跟它修饰的名词，否则会产生歧义。","English":"A postmodifier should follow the noun it modifies; otherwise ambiguity can result.","Keywords":"postmodifier, ambiguity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G322","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"非限制性修饰语只是补充说明，不改变名词范围。","English":"A nonrestrictive modifier only adds information and does not narrow the noun.","Keywords":"nonrestrictive modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G323","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"限制性修饰语限定名词范围，是必要信息。","English":"A restrictive modifier narrows the noun and is essential information.","Keywords":"restrictive modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G324","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"必要修饰语删掉后，名词身份或范围会不清楚。","English":"If an essential modifier is removed, the noun's identity or scope becomes unclear.","Keywords":"essential modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G325","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"非必要修饰语删掉后，句子主干仍然清楚。","English":"If a nonessential modifier is removed, the core sentence remains clear.","Keywords":"nonessential modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G326","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语题要同时检查位置、对象和逻辑。","English":"For modifier questions, check placement, target, and logic together.","Keywords":"modifier, placement, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G327","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要把解释性修饰语误当成主句。","English":"Do not mistake an explanatory modifier for the main clause.","Keywords":"modifier, main clause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G328","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果修饰语里有动词，先判断它是限定动词还是分词。","English":"If the modifier contains a verb, first decide whether it is finite or participial.","Keywords":"modifier, finite verb","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G329","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"过去分词修饰通常表示被动关系。","English":"Past-participle modification usually expresses a passive relationship.","Keywords":"past participle, passive","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G330","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"现在分词修饰通常表示主动关系。","English":"Present-participle modification usually expresses an active relationship.","Keywords":"present participle, active","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G331","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"with + 名词 + 分词 可以构成伴随结构。","English":"With plus a noun plus a participle can form an accompanying phrase.","Keywords":"with phrase, absolute-like","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G332","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语越长，越要确认它挂在哪个名词上。","English":"The longer the modifier is, the more carefully we must confirm what it attaches to.","Keywords":"long modifier, attachment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G333","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"如果一个选项造成“谁做动作”不清楚，就要排除。","English":"If a choice makes it unclear who performs the action, eliminate it.","Keywords":"logical actor, clarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G334","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"修饰语不能改变原文事实关系。","English":"A modifier should not change the factual relationship in the sentence.","Keywords":"modifier, factual relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G335","Subject":"GrammarV2","Unit":"Modifiers","Level":2,"Chinese":"不要为了简洁而制造修饰对象错误。","English":"Do not create a modifier-target error for the sake of concision.","Keywords":"concision, modifier","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G336","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"这道题考平行结构。","English":"This question tests parallel structure.","Keywords":"parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G337","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"并列的内容要形式一致。","English":"Items in a series should have matching forms.","Keywords":"parallel forms","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G338","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"先找并列信号词。","English":"First find the parallel signal word.","Keywords":"signal word, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G339","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"and 连接的两边要平行。","English":"The two sides joined by and should be parallel.","Keywords":"and, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G340","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"or 连接的两边要平行。","English":"The two sides joined by or should be parallel.","Keywords":"or, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G341","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"both...and 连接的两边要平行。","English":"The two sides of both...and should be parallel.","Keywords":"both and, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G342","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"either...or 连接的两边要平行。","English":"The two sides of either...or should be parallel.","Keywords":"either or, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G343","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"neither...nor 连接的两边要平行。","English":"The two sides of neither...nor should be parallel.","Keywords":"neither nor, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G344","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"not only...but also 连接的两边要平行。","English":"The two sides of not only...but also should be parallel.","Keywords":"not only but also","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G345","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":1,"Chinese":"from...to...to 结构里每一项要保持同一形式。","English":"In a from...to...to structure, each item should keep the same form.","Keywords":"from to, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G346","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"先圈出并列结构的左边，再找右边对应部分。","English":"Circle the left side of the parallel structure first, then find the matching right side.","Keywords":"parallel pairs","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G347","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行不只是词性相同，还要语法功能相同。","English":"Parallelism is not only about the same part of speech; the grammatical function must also match.","Keywords":"function, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G348","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"名词和名词平行，动名词和动名词平行，不定式和不定式平行。","English":"Nouns should parallel nouns, gerunds should parallel gerunds, and infinitives should parallel infinitives.","Keywords":"parallel forms","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G349","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果左边是 to do，右边通常也要保持 to do 或共享 to。","English":"If the left side uses to do, the right side usually keeps to do or shares the to.","Keywords":"infinitive, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G350","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果左边是 doing，右边通常也要用 doing。","English":"If the left side uses doing, the right side usually uses doing as well.","Keywords":"gerund, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G351","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"从句级平行要求两个从句结构对应。","English":"Clause-level parallelism requires the two clauses to match structurally.","Keywords":"clause-level parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G352","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"比较结构要比较同类对象。","English":"A comparison must compare like with like.","Keywords":"comparison, like items","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G353","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"不能拿作者和作品比较。","English":"Do not compare an author with a work.","Keywords":"comparison, logical pair","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G354","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"不能拿方法和研究者比较。","English":"Do not compare a method with a researcher.","Keywords":"comparison, logical pair","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G355","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"more than 后面要接可比较的对象。","English":"After more than, use a comparable item.","Keywords":"more than, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G356","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"as...as 结构两边要平行。","English":"The two sides of an as...as comparison should be parallel.","Keywords":"as as, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G357","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"than 后面经常省略重复部分，但省略后仍要结构清楚。","English":"After than, repeated words may be omitted, but the remaining structure must be clear.","Keywords":"than, ellipsis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G358","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"unlike 后面要接被比较对象，而不是原因或动作。","English":"After unlike, use the item being compared, not a reason or an action.","Keywords":"unlike, comparison","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G359","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"like 表示相似，unlike 表示不同；二者都要求对象同类。","English":"Like signals similarity and unlike signals difference; both require comparable items.","Keywords":"like, unlike","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G360","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"the same as 和 different from 后面也要接同类对象。","English":"The same as and different from must also be followed by comparable items.","Keywords":"same as, different from","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G361","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行结构中的所有格也要保持一致。","English":"Possessive forms in a parallel structure should also remain consistent.","Keywords":"possessive, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G362","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果第一个项目是 their + noun，后面项目也可能需要同样的所有格逻辑。","English":"If the first item is their plus a noun, later items may need the same possessive logic.","Keywords":"possessive pronoun, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G363","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"并列列表中的每一项要能接到同一个前置结构上。","English":"Each item in a list should fit the same introductory structure.","Keywords":"list, shared structure","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G364","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果某一项接不上前面的动词或介词，就破坏平行。","English":"If one item cannot attach to the same verb or preposition, parallelism breaks.","Keywords":"parallelism, attachment","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G365","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行题不要只看最近两项，要看整组列表。","English":"For parallelism questions, do not look only at the nearest two items; check the whole list.","Keywords":"list, parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G366","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"标点有时会帮你看出列表边界。","English":"Punctuation can help reveal the boundaries of a list.","Keywords":"punctuation, list boundary","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G367","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"平行结构既要形式平行，也要逻辑平行。","English":"Parallel structure must be both formally and logically parallel.","Keywords":"formal, logical parallelism","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G368","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"如果一个选项让两边功能不对等，就要排除。","English":"If a choice makes the two sides functionally unequal, eliminate it.","Keywords":"function, elimination","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G369","Subject":"GrammarV2","Unit":"Parallelism & Comparison","Level":2,"Chinese":"比较题最后要问：X 到底和谁比？","English":"At the end of a comparison question, ask: what exactly is X being compared with?","Keywords":"comparison, target","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G370","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"这道题考逻辑过渡。","English":"This question tests transition logic.","Keywords":"transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G371","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"先判断前后句关系。","English":"First determine the relationship between the two sentences.","Keywords":"relationship, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G372","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"不要先翻译选项，先判断逻辑。","English":"Do not translate the choices first; identify the logic first.","Keywords":"logic, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G373","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"前后是顺承、转折、因果还是举例？","English":"Is the relationship continuation, contrast, cause-effect, or example?","Keywords":"transition types","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G374","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"however 表示转折。","English":"However signals contrast.","Keywords":"however, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G375","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"therefore 表示结果。","English":"Therefore signals result.","Keywords":"therefore, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G376","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"for example 表示举例。","English":"For example introduces an example.","Keywords":"example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G377","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"in addition 表示补充。","English":"In addition signals addition.","Keywords":"addition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G378","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"similarly 表示相似。","English":"Similarly signals similarity.","Keywords":"similarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G379","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"by contrast 表示对比。","English":"By contrast signals contrast.","Keywords":"contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G380","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"nevertheless 表示让步转折。","English":"Nevertheless signals concession or contrast.","Keywords":"concession","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G381","Subject":"GrammarV2","Unit":"Transitions","Level":1,"Chinese":"specifically 表示具体说明。","English":"Specifically introduces a more specific explanation.","Keywords":"specification","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G382","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句支持前一句，通常是补充或例证关系。","English":"If the second sentence supports the first, the relationship is usually addition or example.","Keywords":"support, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G383","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句和前一句相反，通常是转折关系。","English":"If the second sentence goes against the first, the relationship is usually contrast.","Keywords":"contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G384","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句解释原因，可能需要 because 或 since 类逻辑。","English":"If the second sentence explains the reason, a cause relationship may be needed.","Keywords":"cause, reason","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G385","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出结果，可能需要 therefore、thus 或 consequently。","English":"If the second sentence gives a result, therefore, thus, or consequently may be needed.","Keywords":"result, conclusion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G386","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出更具体的信息，specifically 或 for example 可能成立。","English":"If the second sentence gives more specific information, specifically or for example may work.","Keywords":"specific, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G387","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句扩大范围，in addition 或 moreover 可能成立。","English":"If the second sentence adds another point, in addition or moreover may work.","Keywords":"addition, moreover","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G388","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句承认例外但仍保持原观点，nevertheless 可能成立。","English":"If the second sentence acknowledges an exception but keeps the main point, nevertheless may work.","Keywords":"concession, nevertheless","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G389","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句只是换句话说，in other words 可能成立。","English":"If the second sentence restates the idea, in other words may work.","Keywords":"restatement","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G390","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果后一句给出目的，to this end 或 for this purpose 可能成立。","English":"If the second sentence gives a purpose, to this end or for this purpose may work.","Keywords":"purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G391","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"in doing so 表示通过前一个动作产生后面的结果。","English":"In doing so means the later result comes through the previous action.","Keywords":"in doing so, action-result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G392","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"as a result 强调结果，不是举例。","English":"As a result emphasizes result, not example.","Keywords":"as a result, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G393","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"for instance 强调例子，不是因果。","English":"For instance emphasizes an example, not cause and effect.","Keywords":"for instance, example","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G394","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"on the other hand 用于对照另一个方面。","English":"On the other hand introduces a contrasting aspect.","Keywords":"on the other hand, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G395","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"conversely 表示相反方向的对应关系。","English":"Conversely signals a reverse or opposite relationship.","Keywords":"conversely, reverse relation","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G396","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"meanwhile 表示同时发生，不能随便表示转折。","English":"Meanwhile indicates simultaneous events; it does not automatically mean contrast.","Keywords":"meanwhile, time","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G397","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"subsequently 表示随后发生。","English":"Subsequently means afterward in time.","Keywords":"subsequently, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G398","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"previously 表示此前。","English":"Previously means at an earlier time.","Keywords":"previously, sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G399","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"first、next、finally 表示顺序。","English":"First, next, and finally signal sequence.","Keywords":"sequence","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G400","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"instead 表示替代或相反选择。","English":"Instead signals replacement or an alternative.","Keywords":"instead, alternative","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G401","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"rather 表示更准确地说或相反。","English":"Rather can mean more accurately or instead.","Keywords":"rather, correction","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G402","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"indeed 表示强调或进一步证实。","English":"Indeed signals emphasis or further confirmation.","Keywords":"indeed, emphasis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G403","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"transition 题不能只看空格后半句，要看前后两句。","English":"In transition questions, do not look only after the blank; read both sides.","Keywords":"transition, context","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G404","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"正确过渡词要让第二句话顺着前一句发展。","English":"The correct transition must make the second sentence develop naturally from the first.","Keywords":"development, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G405","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果两个选项都表示转折，要比较转折强度和具体关系。","English":"If two choices both signal contrast, compare the strength and the exact type of contrast.","Keywords":"contrast, nuance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G406","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"如果两个选项都表示因果，要看谁是原因谁是结果。","English":"If two choices both signal cause-effect, determine which side is the cause and which is the result.","Keywords":"cause-effect, direction","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G407","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"不要因为中文都能翻成“因此”就忽略英文逻辑差异。","English":"Do not ignore English logic just because several choices can be translated as 'therefore' in Chinese.","Keywords":"translation, logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G408","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"过渡词必须连接思想，不只是填一个顺耳的词。","English":"A transition must connect ideas, not merely sound smooth.","Keywords":"transition, ideas","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G409","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常反转前后逻辑。","English":"Wrong choices often reverse the logical relationship.","Keywords":"distractor, reverse logic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G410","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常把例子误当原因。","English":"Wrong choices often treat an example as a cause.","Keywords":"distractor, example vs cause","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G411","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"错误选项常常把对比误当补充。","English":"Wrong choices often treat contrast as addition.","Keywords":"distractor, contrast vs addition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G412","Subject":"GrammarV2","Unit":"Transitions","Level":2,"Chinese":"先用中文说出关系，再匹配英文过渡词。","English":"State the relationship in Chinese first, and then match it to the English transition.","Keywords":"translation strategy, transition","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G413","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"这道题考修辞综合。","English":"This question tests rhetorical synthesis.","Keywords":"rhetorical synthesis","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G414","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"先读题干任务。","English":"Read the prompt task first.","Keywords":"prompt task","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G415","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要先读所有笔记。","English":"Do not read all the notes first.","Keywords":"notes, strategy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G416","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"题干让我们做什么？","English":"What does the prompt ask us to do?","Keywords":"task, prompt","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G417","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"只选和任务相关的信息。","English":"Use only the information relevant to the task.","Keywords":"relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G418","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要加入笔记里没有的信息。","English":"Do not add information that is not in the notes.","Keywords":"notes, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G419","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"不要选信息正确但不完成任务的选项。","English":"Do not choose an option that is factually correct but does not complete the task.","Keywords":"task, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G420","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":1,"Chinese":"先确定目标：介绍、比较、支持、总结还是说明方法。","English":"First identify the goal: introduce, compare, support, conclude, or describe a method.","Keywords":"task types","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G421","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 present the aim，要找研究目的。","English":"If the task is to present the aim, look for the purpose of the study.","Keywords":"aim, purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G422","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 describe the method，要找研究怎么做。","English":"If the task is to describe the method, look for how the study was conducted.","Keywords":"methodology","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G423","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 support a claim，要找能够直接支持观点的证据。","English":"If the task is to support a claim, find evidence that directly supports that claim.","Keywords":"support a claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G424","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make a claim，要选有明确判断的句子。","English":"If the task is to make a claim, choose a sentence with a clear assertion.","Keywords":"make a claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G425","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make and support a claim，答案必须同时有观点和证据。","English":"If the task is to make and support a claim, the answer must include both a claim and evidence.","Keywords":"claim + support","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G426","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 compare data，要精准比较两组数据。","English":"If the task is to compare data, compare the two sets of data precisely.","Keywords":"compare data","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G427","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 indicate location，要找地点信息。","English":"If the task is to indicate location, use location information.","Keywords":"location","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G428","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 provide historical overview，要按时间线组织信息。","English":"If the task is to provide a historical overview, organize information along a timeline.","Keywords":"historical overview","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G429","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 describe a process，要说明步骤或机制。","English":"If the task is to describe a process, explain the steps or mechanism.","Keywords":"process","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G430","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 make a generalization，要选概括性强的表述。","English":"If the task is to make a generalization, choose a broad statement.","Keywords":"generalization","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G431","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 conclude，要选能收束前文的句子。","English":"If the task is to conclude, choose a sentence that wraps up the preceding information.","Keywords":"conclusion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G432","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 introduce a topic，不要直接跳到细节。","English":"If the task is to introduce a topic, do not jump directly to details.","Keywords":"introduce topic","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G433","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 emphasize a similarity，要找共同点。","English":"If the task is to emphasize a similarity, look for a shared feature.","Keywords":"similarity","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G434","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务是 emphasize a difference，要找差异点。","English":"If the task is to emphasize a difference, look for a contrast.","Keywords":"difference, contrast","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G435","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果任务要求 quote a researcher，要保留研究者和观点的对应关系。","English":"If the task requires quoting or citing a researcher, keep the researcher matched with the claim.","Keywords":"researcher, claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G436","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"notes 里的年份、地点、人名不能随意混配。","English":"Do not mix years, locations, and names from different notes randomly.","Keywords":"notes, accuracy","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G437","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"一个选项可能语法正确，但信息组合不符合任务。","English":"A choice may be grammatically correct but combine information in a way that misses the task.","Keywords":"task mismatch","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G438","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"一个选项可能用了相关信息，但重点放错。","English":"A choice may use relevant information but put the emphasis in the wrong place.","Keywords":"emphasis, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G439","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 support，答案不能只是重复 claim。","English":"If the prompt asks for support, the answer cannot merely repeat the claim.","Keywords":"support, claim","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G440","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 claim，答案不能只有事实碎片。","English":"If the prompt asks for a claim, the answer cannot be only a fragment of facts.","Keywords":"claim, fact fragments","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G441","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 method，答案不能只写研究结果。","English":"If the prompt asks for a method, the answer cannot only state the result.","Keywords":"method, result","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G442","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 result，答案不能只写研究目的。","English":"If the prompt asks for a result, the answer cannot only state the purpose.","Keywords":"result, purpose","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G443","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果题干要 compare，答案不能只写其中一方。","English":"If the prompt asks for a comparison, the answer cannot mention only one side.","Keywords":"comparison, one-sided","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G444","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果选项出现绝对词，要确认笔记是否支持。","English":"If a choice uses an absolute word, confirm that the notes support it.","Keywords":"absolute language, notes","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G445","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"选择最精准完成任务的句子，不是信息最多的句子。","English":"Choose the sentence that most precisely completes the task, not the one with the most information.","Keywords":"precision, relevance","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G446","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"修辞综合题的核心是 task fit。","English":"The core of a rhetorical synthesis question is task fit.","Keywords":"task fit","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G447","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"先把题干任务翻译成一个明确动作。","English":"First translate the prompt task into one clear action.","Keywords":"task action","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G448","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"再从笔记里筛选能够完成这个动作的信息。","English":"Then select the notes that can perform that action.","Keywords":"notes selection","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G449","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"最后检查答案有没有多余或错配信息。","English":"Finally check whether the answer contains extra or mismatched information.","Keywords":"extra information, mismatch","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G450","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"不要因为某个选项包含关键词就立刻选。","English":"Do not choose an option immediately just because it contains a keyword.","Keywords":"keyword trap","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G451","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"关键词要服务于任务，而不是替代任务。","English":"Keywords must serve the task; they do not replace the task.","Keywords":"keyword, task","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G452","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"如果四个选项都来自笔记，差别就在任务完成度。","English":"If all four choices are based on the notes, the difference lies in how well they complete the task.","Keywords":"task completion","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"G453","Subject":"GrammarV2","Unit":"Rhetorical Synthesis","Level":2,"Chinese":"答案越长不一定越好，越贴合任务才越好。","English":"A longer answer is not necessarily better; the answer that best fits the task is better.","Keywords":"length, task fit","Example":"","Source":"SAT文法V5.0 + SAT教师语言更新"},{"ID":"R001","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"先看题干，判断这道题到底要我们完成什么任务。","English":"Start with the question stem and decide what task the question is asking us to perform.","Keywords":"question stem, task","Example":"Which choice most logically completes the text?","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R002","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"不要一上来精读每个细节，先抓任务和目标。","English":"Do not read every detail deeply at first; identify the task and the target first.","Keywords":"task, target","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R003","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"这道题先判断题型，再决定读哪里。","English":"Identify the question type first, and then decide where to read.","Keywords":"question type, reading zone","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R004","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"读题时先圈出对象、观点或划线部分。","English":"When you read the question, mark the object, claim, or underlined portion first.","Keywords":"object, claim, underlined portion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R005","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"每道阅读题都要回答一个具体问题，不是泛泛理解全文。","English":"Every reading question asks a specific question; it is not just a general comprehension task.","Keywords":"specific question, comprehension","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R006","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"先抓主干，再处理修饰和例子。","English":"Find the core idea first, then deal with modifiers and examples.","Keywords":"core idea, modifiers","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R007","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"先看文本在说什么，再看选项怎么改写它。","English":"Understand what the text says first, then see how the choices paraphrase it.","Keywords":"paraphrase, choices","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R008","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"做题时要把原文、题干和选项三者连起来。","English":"Connect the text, the question stem, and the choices.","Keywords":"text, stem, choices","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R009","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"不要只看关键词，关键词只能帮助定位，不能代替理解。","English":"Do not rely only on keywords; they help with locating information, but they do not replace understanding.","Keywords":"keywords, locating, understanding","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R010","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"先确定答案方向，再比较选项细节。","English":"Determine the answer direction first, and then compare the details in the choices.","Keywords":"answer direction, choices","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R011","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"读完每个选项，都问自己：它有没有回答题干？","English":"After reading each choice, ask yourself: does it answer the question?","Keywords":"answer relevance","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R012","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":1,"Chinese":"正确选项通常不是原文复制，而是原文的准确改写。","English":"The correct choice is usually not a copy of the text; it is an accurate paraphrase.","Keywords":"accurate paraphrase","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R013","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"SAT 阅读的核心不是记住文章内容，而是建立证据关系。","English":"The core of SAT Reading is not memorizing the passage; it is building the evidence relationship.","Keywords":"evidence relationship","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R014","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"先用题干限定阅读范围，避免在无关句子里浪费时间。","English":"Use the question stem to limit the reading range, so we do not waste time on irrelevant sentences.","Keywords":"reading range, relevance","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R015","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"看到一个选项时，要同时检查内容、范围和逻辑方向。","English":"When you see a choice, check its content, scope, and logical direction at the same time.","Keywords":"content, scope, direction","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R016","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"如果两个选项都看起来对，比较哪个更完整、更直接、更贴合题干。","English":"If two choices seem possible, compare which one is more complete, more direct, and more aligned with the question stem.","Keywords":"complete, direct, aligned","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R017","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"不要把背景信息当成结论，背景通常只是服务后面的观点。","English":"Do not treat background information as the conclusion; background usually supports the later point.","Keywords":"background, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R018","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"例子不是目的本身，例子通常服务一个更抽象的观点。","English":"An example is not the purpose itself; it usually serves a more abstract point.","Keywords":"example, abstract point","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R019","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"遇到长文本时，先分句概括，再合并成整体逻辑。","English":"When the text is long, summarize sentence by sentence first, then combine the overall logic.","Keywords":"sentence summary, overall logic","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R020","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"每次排除选项都要说出证据，而不是只说感觉不对。","English":"Every time you eliminate a choice, give evidence; do not simply say it feels wrong.","Keywords":"elimination, evidence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R021","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"答案必须同时满足文本信息和题干任务。","English":"The answer must satisfy both the text information and the task in the question stem.","Keywords":"text information, task","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R022","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"做完后用一句话复盘：这题考的是哪种关系？","English":"After solving it, review in one sentence: what relationship is being tested here?","Keywords":"relationship, review","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R023","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"阅读题的速度来自流程稳定，不是来自跳读猜答案。","English":"Speed in Reading comes from a stable process, not from skimming and guessing.","Keywords":"process, speed","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R024","Subject":"ReadingV2","Unit":"General Reading Workflow","Level":2,"Chinese":"我们要训练的是可重复的方法，而不是这篇文章的运气。","English":"We are training a repeatable method, not relying on luck with this particular passage.","Keywords":"repeatable method","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R025","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 logical and precise，优先想到语境词汇题。","English":"When you see 'logical and precise,' think of Words in Context first.","Keywords":"logical and precise, WIC","Example":"Which choice completes the text with the most logical and precise word or phrase?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R026","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 function，先判断被问部分在文本中的作用。","English":"When you see 'function,' decide what role the referenced portion plays in the text.","Keywords":"function, role","Example":"Which choice best describes the function of the underlined sentence?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R027","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 main purpose，问的是作者为什么写这段。","English":"When you see 'main purpose,' the question is asking why the author wrote the text.","Keywords":"main purpose, author purpose","Example":"Which choice best states the main purpose of the text?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R028","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 central idea，问的是全文核心内容，不是某个细节。","English":"When you see 'central idea,' the question is asking for the core idea of the whole text, not one detail.","Keywords":"central idea, whole text","Example":"Which choice best states the central idea of the text?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R029","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 supports the claim，先找 claim，再找证据。","English":"When you see 'supports the claim,' identify the claim first, and then find the evidence.","Keywords":"support, claim, evidence","Example":"Which quotation from the text best supports the claim?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R030","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 if true，选项是新增事实，不是原文里已经说过的内容。","English":"When you see 'if true,' the choices are new facts, not information already stated in the text.","Keywords":"if true, new evidence","Example":"Which finding, if true, would most directly support the researchers' conclusion?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R031","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 graph 或 table，先读图表标题、单位和变量。","English":"When you see a graph or table, read the title, units, and variables first.","Keywords":"graph, table, variables","Example":"Based on the graph, which choice completes the text?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R032","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 Text 1 和 Text 2，先判断两篇的观点关系。","English":"When you see Text 1 and Text 2, identify the relationship between the two viewpoints first.","Keywords":"cross-text, viewpoint","Example":"Based on Text 2, how would the author of Text 2 respond to Text 1?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R033","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 most logically completes，通常要从前文推出结论。","English":"When you see 'most logically completes,' you usually need to infer a conclusion from the previous information.","Keywords":"logically completes, inference","Example":"Which choice most logically completes the text?","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R034","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":1,"Chinese":"看到 details，先定位题干中的具体对象。","English":"When you see a detail question, locate the specific object in the question stem first.","Keywords":"details, locate","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R035","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"不同题干对应不同证据关系，不能用同一个读法做所有题。","English":"Different stems require different evidence relationships; we cannot use the same reading approach for every question.","Keywords":"stem, evidence relationship","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R036","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"purpose 和 central idea 不一样：purpose 问写作功能，central idea 问主要内容。","English":"Purpose and central idea are different: purpose asks about the writing function, while central idea asks about the main content.","Keywords":"purpose, central idea","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R037","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"function 和 structure 不一样：function 问部分作用，structure 问整体组织方式。","English":"Function and structure are different: function asks about the role of a part, while structure asks about the organization of the whole text.","Keywords":"function, structure","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R038","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"support 和 weaken 的方向必须先判清楚，否则选项会读反。","English":"We must identify the direction of support or weaken first; otherwise, we may read the choices backward.","Keywords":"support, weaken, direction","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R039","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"Text 2 response 类题目要先确定谁回应谁。","English":"For a Text 2 response question, first determine who is responding to whom.","Keywords":"Text 2 response, responder","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R040","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"quotation 证据题要求具体引文，不能只选看起来主题相关的句子。","English":"In a quotation evidence question, we need a specific quotation, not just a sentence that seems related to the topic.","Keywords":"quotation, specific evidence","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R041","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"图表题的题干通常会告诉我们要补例子、补观点，还是评价 claim。","English":"In a data question, the stem usually tells us whether to complete an example, complete a claim, or evaluate a claim.","Keywords":"data task, example, claim","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R042","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"推断题不是自由发挥，而是在已给前提下推出最稳的结论。","English":"An inference question is not free interpretation; it asks for the safest conclusion from the given premises.","Keywords":"inference, premise","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R043","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"如果题干问 most directly，答案必须和目标关系非常近。","English":"If the stem says 'most directly,' the answer must have a very close relationship to the target.","Keywords":"most directly, direct evidence","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R044","Subject":"ReadingV2","Unit":"Question Stem Recognition","Level":2,"Chinese":"如果题干问 best，通常要比较完整性、准确性和范围。","English":"If the stem says 'best,' we usually need to compare completeness, accuracy, and scope.","Keywords":"best, completeness, scope","Example":"","Source":"SAT阅读讲义_vs_知识点汇总_差异对照报告"},{"ID":"R045","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"先找谓语动词，再反推主语。","English":"Find the main verb first, and then work backward to find the subject.","Keywords":"main verb, subject","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R046","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"这个长句先不要翻译，先切成几个信息块。","English":"Do not translate the whole long sentence first; divide it into information chunks.","Keywords":"chunking, long sentence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R047","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"把插入语先拿掉，主干会更清楚。","English":"Temporarily remove the interruption; the core sentence will become clearer.","Keywords":"interruption, core sentence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R048","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"介词短语通常是修饰，不要把它当成主干。","English":"A prepositional phrase is u

eneralization, CTE","Example":"Description → Generalization / Generalization → Specific Evidence","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R326","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"claim 中的形容词和态度词也要被证据支持。","English":"Notice that adjectives and attitude words in the claim also need to be supported by the evidence.","Keywords":"attitude word, adjective","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R327","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果引文只证明主题存在，但不能证明 claim 的评价，它不够。","English":"If a quotation only proves the topic exists but not the claim's evaluation, it is not enough.","Keywords":"evaluation, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R328","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果引文只支持 claim 的背景，不支持核心判断，它是干扰项。","English":"If a quotation supports only the background of the claim but not the core judgment, it is a distractor.","Keywords":"background, core judgment","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R329","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"双重否定的 claim 要先转成正向意思。","English":"For a claim with double negatives, convert it into a positive meaning first.","Keywords":"double negative","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R330","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"人物心理的证据可以来自动作、语言、环境反应，不一定直接说情绪。","English":"Notice that evidence for a character's psychology can come from actions, speech, or reactions to setting, not only direct emotion words.","Keywords":"character psychology","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R331","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"场景证据只有在它能说明人物或主题时才有用。","English":"Notice that setting evidence is useful only when it explains the character or theme.","Keywords":"setting, theme","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R332","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"科学证据要检查对象和结果是否都对应 claim。","English":"For scientific evidence, check whether both the object and the result match the claim.","Keywords":"science, object, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R333","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果选项证据比 claim 更强或更弱，都要谨慎。","English":"If the evidence is stronger or weaker than the claim, be careful.","Keywords":"strength, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R334","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"看到正确证据，通常与 claim 形成一一对应关系。","English":"Notice that the correct evidence usually forms a one-to-one correspondence with the claim.","Keywords":"one-to-one correspondence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R335","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"让学生把 claim 分成关键词，再逐个在引文中找对应。","English":"Notice that ask students to split the claim into keywords and match each one to the quotation.","Keywords":"student prompt, keyword matching","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R336","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"看到如果证据需要额外解释才能勉强成立，，通常不是最直接答案。","English":"If the evidence needs extra explanation to barely work, it is usually not the most direct answer.","Keywords":"direct evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R337","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"quotation 题中，选项的细节越具体，越要检查它是否服务 claim。","English":"In quotation questions, the more specific a choice is, the more we need to check whether it serves the claim.","Keywords":"specific detail, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R338","Subject":"ReadingV3","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"最后测试：这个引文如果放在 claim 后面，能不能自然作为证明？","English":"Final test: if this quotation follows the claim, can it naturally serve as proof?","Keywords":"proof test","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R339","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"if true 题的选项是假设为真的新增证据。","English":"In an 'if true' question, each choice is new evidence assumed to be true.","Keywords":"if true, new evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R340","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"我们先看题干问 support 还是 weaken。","English":"Notice that first check whether the stem asks for support or weaken.","Keywords":"support, weaken","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R341","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"我们先找 researchers' conclusion。","English":"Let's identify the researchers' conclusion first.","Keywords":"researchers' conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R342","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"支持题要让结论更可信。","English":"Notice that a support choice makes the conclusion more credible.","Keywords":"support, credible","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R343","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"削弱题要让结论更不稳。","English":"Notice that a weaken choice makes the conclusion less secure.","Keywords":"weaken, less secure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R344","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"这里不要选只是重复原文背景的内容。","English":"Don't choose something that merely repeats the background in the text.","Keywords":"background, repetition","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R345","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"科学题先找实验对象。","English":"In a science question, identify the experimental object first.","Keywords":"experiment object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R346","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"再找分组或条件。","English":"In an If True question, treat each choice as true and ask whether it strengthens or weakens the claim.","Keywords":"group, condition","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R347","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"再找观察结果。","English":"In an If True question, treat each choice as true and ask whether it strengthens or weakens the claim.","Keywords":"observed result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R348","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":1,"Chinese":"比较题要同时看比较对象和结果方向。","English":"In a comparison, check both the comparison objects and the direction of the result.","Keywords":"comparison, result direction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R349","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"support 可以是补充证据、解释机制、排除替代解释或加强逻辑链。","English":"Notice that support can add evidence, explain a mechanism, rule out an alternative explanation, or strengthen the logical chain.","Keywords":"strengthen, mechanism, alternative explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R350","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"weaken 可以是打断因果、提出替代原因、提供反例或质疑方法。","English":"Notice that weaken can break a causal link, offer an alternative cause, provide a counterexample, or question the method.","Keywords":"weaken, alternative cause, counterexample","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R351","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果结论是因果关系，支持项可以补桥，削弱项可以断桥。","English":"If the conclusion is causal, a support choice can bridge the gap, and a weaken choice can break the bridge.","Keywords":"causal bridge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R352","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果结论来自实验，先检查自变量和因变量。","English":"If the conclusion comes from an experiment, check the independent and dependent variables first.","Keywords":"independent variable, dependent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R353","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"自变量是研究者改变或比较的条件。","English":"Notice that the independent variable is the condition the researchers change or compare.","Keywords":"independent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R354","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"因变量是研究者观察、测量或记录的结果。","English":"Notice that the dependent variable is the result the researchers observe, measure, or record.","Keywords":"dependent variable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R355","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"正确选项常常提供正确组别之间的正确比较。","English":"The right choice often provides the correct comparison between the correct groups.","Keywords":"group comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R356","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"看到只描述单组结果而没有比较，，通常不能证明比较性结论。","English":"Notice that a result from one group alone usually cannot prove a comparative conclusion.","Keywords":"one group, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R357","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项比较对象错，即使结果听起来科学也不能选。","English":"If the comparison objects are wrong, we cannot choose it even if the result sounds scientific.","Keywords":"wrong object, science","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R358","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项的结果方向和结论相反，它就是削弱而不是支持。","English":"If the result direction is opposite to the conclusion, it weakens rather than supports.","Keywords":"direction, support weaken","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R359","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"premise 是已给理由，conclusion 是要推出的观点。","English":"Notice that a premise is the given reason; a conclusion is the point to be drawn from it.","Keywords":"premise, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R360","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"看到 therefore/thus/suggest，后面常是结论。","English":"When you see 'therefore,' 'thus,' or 'suggest,' what follows is often the conclusion.","Keywords":"conclusion indicator","Example":"therefore, thus, suggest","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R361","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"看到 because/due to/given that，附近常是前提。","English":"When you see 'because,' 'due to,' or 'given that,' the nearby information is often a premise.","Keywords":"premise indicator","Example":"because, due to, given that","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R362","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"deductive reasoning 要求结论从前提中稳定推出。","English":"Notice that deductive reasoning requires the conclusion to follow reliably from the premises.","Keywords":"deductive reasoning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R363","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"if true 题不能凭常识判断哪件事可能发生，只看它对 claim 的作用。","English":"In an if-true question, don't judge what is likely in real life; judge its effect on the claim.","Keywords":"claim effect","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R364","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"如果选项和 claim 之间需要太多中间步骤，它不够 direct。","English":"If a choice needs too many intermediate steps to affect the claim, it is not direct enough.","Keywords":"directness","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R365","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"削弱不等于证明结论一定错，只要让它变弱即可。","English":"Notice that weaken does not mean proving the conclusion false; it only needs to make it less convincing.","Keywords":"weaken, less convincing","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R366","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"支持不等于证明结论百分百正确，只要提高可信度即可。","English":"Notice that support does not mean proving the conclusion completely true; it only needs to increase credibility.","Keywords":"support, credibility","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R367","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"最后用一句话说：这个选项怎样改变 claim 的可信度？","English":"Finally, say in one sentence: how does this choice change the credibility of the claim?","Keywords":"student prompt, credibility","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R368","Subject":"ReadingV3","Unit":"Textual Evidence - If True","Level":2,"Chinese":"错题复盘时要标明：比较对象错、变量错、方向错，还是 claim 找错。","English":"In review, label the error: wrong comparison object, wrong variable, wrong direction, or wrong claim.","Keywords":"error log, if true","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R369","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"图表题第一步就看标题，别急着读数据。","English":"For data questions, read the title before you read the numbers.","Keywords":"chart title","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R370","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"再读横轴、纵轴和单位。","English":"For graph questions, read the title, axes, units, and legend before using the numbers.","Keywords":"axis, units","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R371","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"看清图例代表什么。","English":"Notice that make sure you understand what the legend represents.","Keywords":"legend","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R372","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"我们先确定文本要证明什么，再去图表找数据。","English":"Notice that first identify what the text needs to prove, then go to the graph for data.","Keywords":"claim, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R373","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"先别看图表乱猜题意。","English":"Don't look at the graph first and guess the task.","Keywords":"graph, task","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R374","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"柱状图常用来比较类别差异。","English":"Notice that bar charts are often used to compare categories.","Keywords":"bar chart, category","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R375","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"折线图常用来看变化趋势。","English":"Notice that line graphs are often used to show trends over time.","Keywords":"line graph, trend","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R376","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"表格常用来精确查找对象和数值。","English":"Notice that tables are often used to look up objects and exact values.","Keywords":"table, exact value","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R377","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"选项里的数据要和图表完全对应。","English":"Notice that the data in the choice must match the graph exactly.","Keywords":"data accuracy","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R378","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"比较方向要看清是 increase 还是 decrease。","English":"Let's check whether the direction is an increase or a decrease.","Keywords":"increase, decrease","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R379","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"最大值、最小值和异常值都要注意。","English":"Notice that pay attention to maximum values, minimum values, and outliers.","Keywords":"maximum, minimum, outlier","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R380","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":1,"Chinese":"看到单位看错，答案，通常就会错。","English":"If you misread the unit, the answer will usually be wrong.","Keywords":"unit error","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R381","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"quantitative evidence 不是单纯读数，而是用数据完成论证。","English":"Notice that quantitative evidence is not just reading numbers; it is using data to complete an argument.","Keywords":"quantitative evidence, argument","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R382","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"补全例子时，选项要提供一个符合文本观点的数据例子。","English":"Notice that when completing an example, the choice must provide a data example that fits the text's claim.","Keywords":"complete example, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R383","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"补全观点时，选项要用数据表达文本结论。","English":"Notice that when completing a claim, the choice must use the data to express the text's conclusion.","Keywords":"complete claim, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R384","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"支持/削弱图表题要先判文本 claim 的方向。","English":"For support or weaken data questions, identify the direction of the text's claim first.","Keywords":"support, weaken, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R385","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"数据正确但不能支持 claim，也不能选。","English":"Notice that even if the data are correct, we cannot choose the option if they don't support the claim.","Keywords":"data correct, irrelevant","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R386","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"比较对象一定要一致，不能把年份、组别或类别换掉。","English":"Notice that the comparison objects must be consistent; don't switch years, groups, or categories.","Keywords":"comparison object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R387","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"趋势题要看整体趋势，不要只抓一个点。","English":"For a trend question, look at the overall trend, not just one point.","Keywords":"trend, single point","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R388","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果文本说 higher，但图表显示 lower，方向就是反的。","English":"If the text says 'higher' but the graph shows 'lower,' the direction is opposite.","Keywords":"higher, lower","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R389","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果选项只描述绝对值，但题干需要比较，它不够。","English":"If a choice gives only an absolute value but the stem requires a comparison, it is not enough.","Keywords":"absolute value, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R390","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果选项比较了两个无关类别，它是对象错位。","English":"If a choice compares two irrelevant categories, it has an object mismatch.","Keywords":"irrelevant category","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R391","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"读图时把目标变量、目标对象和支持方向写在旁边。","English":"Notice that when reading the graph, write down the target variable, target object, and support direction.","Keywords":"target variable, target object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R392","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"讲图表题时，我们先用英文说出 one data sentence。","English":"Notice that when teaching a data question, ask students to produce one data sentence in English first.","Keywords":"student prompt, data sentence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R393","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"Locate data 是第一层，Interpret data 是第二层，Use data to evaluate claim 是第三层。","English":"Notice that locate data is level one; Interpret data is level two; Use data to evaluate a claim is level three.","Keywords":"locate data, interpret data, evaluate claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R394","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"如果题干问 best illustrates，答案要能作为最清楚的例子。","English":"If the stem asks what best illustrates the claim, the answer must work as the clearest example.","Keywords":"illustrate, example","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R395","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"这里不要把未满足需求下降读成满足需求下降。","English":"Don't misread a decrease in unmet need as a decrease in met need.","Keywords":"unmet need, misreading","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R396","Subject":"ReadingV3","Unit":"Quantitative Evidence","Level":2,"Chinese":"最后检查：数据数值、单位、对象、方向、相关性都对吗？","English":"Final check: are the number, unit, object, direction, and relevance all correct?","Keywords":"final check, data","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R397","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"推断题只能根据文本往前推一步，不能自由脑补。","English":"An inference is one logical step from the text, not a guess.","Keywords":"inference, text-based","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R398","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"我们先找已知前提。","English":"Let's find the given premises first.","Keywords":"premise","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R399","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"再判断能推出什么最稳的结论。","English":"Notice that then decide what conclusion can be most safely drawn.","Keywords":"safe conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R400","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"most logically completes 通常要求补结论。","English":"Notice that 'Most logically completes' usually asks us to complete a conclusion.","Keywords":"logically completes, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R401","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"这里不要把可能性说成必然性。","English":"Don't turn a possibility into a certainty.","Keywords":"possibility, certainty","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R402","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"这里不要加入文本没有的原因。","English":"Don't add a cause that is not in the text.","Keywords":"added cause","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R403","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"如果有时间词，先画时间轴。","English":"If there are time words, draw a timeline first.","Keywords":"timeline","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R404","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"before, after, predate, precede 都要小心顺序。","English":"Be careful with sequence words such as before, after, predate, and precede.","Keywords":"time sequence","Example":"before, after, predate, precede","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R405","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"实验推断要看结果指向什么结论。","English":"For an experimental inference, see what conclusion the results point to.","Keywords":"experiment, result, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R406","Subject":"ReadingV3","Unit":"Inference","Level":1,"Chinese":"文学推断要看人物行为和语气。","English":"For a literary inference, look at character actions and tone.","Keywords":"literary inference, tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R407","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"看到推断题的正确答案，通常是文本信息向前走一步。","English":"The right answer to an inference question usually moves one step beyond the stated information.","Keywords":"one-step inference","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R408","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"如果答案需要两三步想象，它就太远。","English":"If an answer needs two or three imagined steps, it goes too far.","Keywords":"too far","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R409","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"事实观点推断要区分背景、前提和待填结论。","English":"In a fact-and-claim inference, distinguish background, premises, and the missing conclusion.","Keywords":"background, premise, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R410","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"实验推断要区分实验目的、设计、结果和研究者解释。","English":"In an experimental inference, distinguish purpose, design, result, and researchers' explanation.","Keywords":"experiment, design, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R411","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"时间顺序推断要检查每个事件相对于其他事件的位置。","English":"For a time-sequence inference, check where each event stands relative to the others.","Keywords":"event order","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R412","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"如果文本评价实验设计，结论可能与有效性或局限有关。","English":"If the text evaluates an experimental design, the conclusion may concern validity or limitations.","Keywords":"validity, limitation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R413","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"syllogism 要找到 major premise, minor premise, and conclusion。","English":"In a syllogism, identify the major premise, minor premise, and conclusion.","Keywords":"syllogism, major premise, minor premise","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R414","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"middle term 是把两个前提连接起来的共同项。","English":"Notice that the middle term is the shared term that connects the two premises.","Keywords":"middle term, syllogism","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R415","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"deductive reasoning 要求结论不能超出前提。","English":"Notice that deductive reasoning requires the conclusion not to exceed the premises.","Keywords":"deductive reasoning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R416","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"synthesis 推断要把两处信息合并。","English":"Notice that a synthesis inference requires combining information from two places.","Keywords":"synthesis, combine","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R417","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"如果选项和文本都谈同一主题，但没有逻辑推出关系，不能选。","English":"If a choice and the text share the same topic but lack a logical connection, we cannot choose it.","Keywords":"topic, logic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R418","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"推断题要特别检查限定词：may, can, likely, some, many。","English":"In inference questions, pay special attention to qualifiers such as may, can, likely, some, and many.","Keywords":"qualifier","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R419","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"如果结论太绝对，和原文的谨慎语气不匹配，就排除。","English":"If the conclusion is too absolute and does not match the text's cautious tone, eliminate it.","Keywords":"absolute, cautious tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R420","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"看到如果结论引入新对象，它，通常是新信息。","English":"If the conclusion introduces a new object, it is usually new information.","Keywords":"new object","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R421","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"让学生说出：文本给了哪两个前提？答案怎么从它们推出？","English":"Ask students: what two premises does the text give, and how does the answer follow from them?","Keywords":"student prompt, premises","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R422","Subject":"ReadingV3","Unit":"Inference","Level":2,"Chinese":"最后检查答案是否最合理，而不是仅仅有可能。","English":"Notice that finally, check whether the answer is the most reasonable one, not merely possible.","Keywords":"most reasonable","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R423","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"科学实验文本先找研究对象，再看变量、结果和结论。","English":"For science experiments, find the research subject first, then the variables, result, and conclusion.","Keywords":"research object","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R424","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"再找研究目的。","English":"For science experiments, find the subjects, variables, results, and conclusion.","Keywords":"research purpose","Example":"to determine / investigate / test / explore","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R425","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"再找实验方法。","English":"For science experiments, find the subjects, variables, results, and conclusion.","Keywords":"method","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R426","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"再找实验结果。","English":"For science experiments, find the subjects, variables, results, and conclusion.","Keywords":"result","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R427","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"最后找结论。","English":"For science experiments, find the subjects, variables, results, and conclusion.","Keywords":"conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R428","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"实验目的常由 to determine, investigate, test, explore 引出。","English":"Notice that the purpose is often introduced by to determine, investigate, test, or explore.","Keywords":"purpose signal","Example":"to determine, investigate, test, explore","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R429","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"实验对象常是 subjects, samples, participants, groups。","English":"Notice that the objects often appear as subjects, samples, participants, or groups.","Keywords":"subjects, samples, participants","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R430","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"分组词包括one group, other group, condition, treatment, control。","English":"Notice that grouping words include one group, other group, condition, treatment, and control.","Keywords":"group, control","Example":"one group / other group / condition / treatment / control","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R431","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"自变量是被改变或比较的条件。","English":"Notice that the independent variable is the condition being changed or compared.","Keywords":"independent variable","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R432","Subject":"ReadingV3","Unit":"Science Experiments","Level":1,"Chinese":"因变量是被观察或测量的结果。","English":"Notice that the dependent variable is the result being observed or measured.","Keywords":"dependent variable","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R433","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"科学实验题的核心不是背知识，而是识别变量关系。","English":"Notice that the core of science experiment questions is not memorizing science; it is identifying variable relationships.","Keywords":"variable relationship","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R434","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"先问：研究者想验证什么？","English":"First ask: what did the researchers want to test?","Keywords":"research question","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R435","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"再问：他们怎么设计比较？","English":"Then ask: how did they design the comparison?","Keywords":"experimental design","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R436","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"再问：他们观察到了什么？","English":"Then ask: what did they observe?","Keywords":"observation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R437","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"最后问：这个结果支持了什么结论？","English":"Finally ask: what conclusion does this result support?","Keywords":"result, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R438","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"control group 是对照组，用来判断处理条件是否产生影响。","English":"Notice that a control group is used as a comparison point to judge whether the treatment has an effect.","Keywords":"control group, treatment","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R439","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"treatment 是实验组接受的处理。","English":"Notice that the treatment is the condition applied to the experimental group.","Keywords":"treatment","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R440","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"如果没有对照，就很难证明差异来自这个因素。","English":"Notice that without a control, it is difficult to prove that the difference comes from this factor.","Keywords":"control, causal inference","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R441","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"如果样本对象换了，结论可能不能直接套用。","English":"If the sample object changes, the conclusion may not directly apply.","Keywords":"sample, generalization","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R442","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"如果因变量换了，选项可能就不再支持原结论。","English":"If the dependent variable changes, the choice may no longer support the original conclusion.","Keywords":"dependent variable, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R443","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"结果词包括finding, result, data, observation, evidence, outcome。","English":"Notice that result words include finding, result, data, observation, evidence, and outcome.","Keywords":"result words","Example":"finding, result, data, observation, evidence, outcome","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R444","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"结论词包括suggest, indicate, conclude, prove, believe。","English":"Notice that conclusion words include suggest, indicate, conclude, prove, and believe.","Keywords":"conclusion words","Example":"suggest, indicate, conclude, prove, believe","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R445","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"suggest 比 prove 更谨慎，选项语气也要匹配。","English":"Notice that 'Suggest' is more cautious than 'prove,' and the choice's tone should match that caution.","Keywords":"suggest, prove, tone","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R446","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"科学文本中的限制条件不能忽略，因为它决定结论范围。","English":"Notice that limitations in a scientific text matter because they define the scope of the conclusion.","Keywords":"limitation, scope","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R447","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"看到实验题错选，通常不是因为科学知识，而是因为变量或比较对象错。","English":"Notice that errors in experiment questions usually come from variables or comparison objects, not from science knowledge.","Keywords":"error source, variables","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R448","Subject":"ReadingV3","Unit":"Science Experiments","Level":2,"Chinese":"让学生画一个变量框：对象、条件、结果、结论。","English":"Notice that ask students to draw a variable box: object, condition, result, conclusion.","Keywords":"student prompt, variable box","Example":"Object / Condition / Result / Conclusion","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R449","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"小说文本先找人物，再看人物之间的关系和情绪变化。","English":"For fiction, find the characters first, then track their relationships and feelings.","Keywords":"fiction, character","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R450","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"再找人物之间的关系。","English":"For fiction, track the characters, actions, relationships, and emotional shifts.","Keywords":"character relationship","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R451","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"再看人物发生了什么变化。","English":"Notice that then see what changes happen to the characters.","Keywords":"character change","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R452","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"场景不是背景板，它常常服务人物或情节。","English":"Notice that setting is not just background; it often serves character or plot.","Keywords":"setting, plot","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R453","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"情节要和人物行为一起看。","English":"Notice that plot should be read together with character actions.","Keywords":"plot, action","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R454","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"人物心理不一定直接说出来，要从动作和语言推。","English":"Notice that a character's mind is not always stated directly; infer it from actions and speech.","Keywords":"character psychology","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R455","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"如果只有一个人物，重点看他的情感或行为变化。","English":"If there is only one character, focus on changes in emotion or behavior.","Keywords":"one character, change","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R456","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"如果有多个人物，先理清谁对谁做了什么。","English":"If there are multiple characters, first clarify who does what to whom.","Keywords":"multiple characters","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R457","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"叙述视角会影响我们获得的信息。","English":"For fiction, track the characters, actions, relationships, and emotional shifts.","Keywords":"narrative perspective","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R458","Subject":"ReadingV3","Unit":"Fiction","Level":1,"Chinese":"这里不要把读者自己的评价当成作者给出的信息。","English":"Don't treat the reader's own judgment as information given by the author.","Keywords":"reader judgment, text evidence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R459","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"文学题常考人物心理、关系变化、场景功能和情感态度。","English":"Notice that literary questions often test character psychology, relationship changes, setting function, and emotional attitude.","Keywords":"literary question types","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R460","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"场景描写常用来烘托人物情绪或铺垫冲突。","English":"Notice that setting description often highlights a character's emotion or prepares a conflict.","Keywords":"setting, emotion, conflict","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R461","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"看到如果选项的情绪比文本更强烈，，通常是过度解读。","English":"If a choice's emotion is stronger than the text's, it is usually an overinterpretation.","Keywords":"emotion, overinterpretation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R462","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"人物没有说出口的想法可以从 hesitation, silence, gesture 中推。","English":"Notice that unspoken thoughts can be inferred from hesitation, silence, or gestures.","Keywords":"gesture, silence, inference","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R463","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"动作描写可以是人物态度的证据。","English":"Notice that an action description can serve as evidence of a character's attitude.","Keywords":"action, attitude","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R464","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"对话中的语气词和转折常提示关系变化。","English":"Notice that tone words and contrasts in dialogue often signal changes in relationships.","Keywords":"dialogue, tone","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R465","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"文学细节题要回到具体句子，不要凭故事套路。","English":"For literary detail questions, return to the exact sentence; don't rely on story patterns.","Keywords":"literary detail, exact sentence","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R466","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"文学主旨要概括核心情境，而不是抽象到空泛主题。","English":"Notice that a literary central idea should summarize the core situation, not jump to an empty abstract theme.","Keywords":"core situation, theme","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R467","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"人物关系题要检查选项中的双方身份是否正确。","English":"In character-relationship questions, check whether the identities of both sides are correct.","Keywords":"relationship, identity","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R468","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"如果选项加入了文本没有的动机，它就是新信息。","English":"If a choice adds a motive not given in the text, it is new information.","Keywords":"motive, new information","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R469","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"文学 purpose 题要问：作者为什么描写这个场景或动作？","English":"For a literary purpose question, ask: why does the author describe this setting or action?","Keywords":"literary purpose","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R470","Subject":"ReadingV3","Unit":"Fiction","Level":2,"Chinese":"让学生标出人物、动作、情绪、变化四项。","English":"Notice that ask students to mark four things: character, action, emotion, and change.","Keywords":"student prompt, literary markers","Example":"Character / Action / Emotion / Change","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R471","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"诗歌先看标题和导言，它们常常直接提示主题和语气。","English":"For a poem, start with the title and introduction; they often reveal the topic and tone.","Keywords":"poem, title, introduction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R472","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"标题可能提示主题、对象或情感。","English":"Notice that the title may suggest the theme, object, or emotion.","Keywords":"title, theme, emotion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R473","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"我们先判断诗歌是抒情还是叙事。","English":"Notice that first decide whether the poem is lyrical or narrative.","Keywords":"lyrical, narrative","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R474","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"抓主要对象，不要被单个意象带跑。","English":"Let's identify the main object; don't be distracted by a single image.","Keywords":"main object, imagery","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R475","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"抓情感基调是积极、消极还是复杂。","English":"Let's identify whether the emotional tone is positive, negative, or mixed.","Keywords":"emotional tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R476","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"看到重复的词或意象，通常很重要。","English":"For poetry and drama, look at the title, introduction, speaker, and emotional shift first.","Keywords":"repetition, imagery","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R477","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"转折处常常改变诗歌情感方向。","English":"Notice that a turn often changes the emotional direction of the poem.","Keywords":"turn, emotional shift","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R478","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"古词不必逐词翻译，但关键词一定要抓住。","English":"Notice that you don't need to translate every archaic word, but you must catch the key words.","Keywords":"archaic words, keywords","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R479","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"戏剧文本先看说话人和对话关系。","English":"In drama, first identify the speaker and the dialogue relationship.","Keywords":"drama, speaker","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R480","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":1,"Chinese":"戏剧中的潜台词常常通过语气和回应体现。","English":"Notice that subtext in drama often appears through tone and response.","Keywords":"subtext, tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R481","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌题不要因为语言抽象就放弃证据。","English":"Don't give up on evidence just because the language of a poem is abstract.","Keywords":"poem, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R482","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"意象要回到它共同指向的情感或主题。","English":"Notice that images must be connected back to the emotion or theme they collectively point to.","Keywords":"imagery, theme","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R483","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"看到如果诗歌有导言，导言，通常提供时代、人物或场景背景。","English":"If a poem has an introduction, it often provides historical, personal, or setting background.","Keywords":"introduction, context","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R484","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌主旨题要避免把一个意象当作全文主题。","English":"In a poem central idea question, avoid treating one image as the whole theme.","Keywords":"central idea, image","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R485","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌目的题要判断作者是在纪念、赞美、质疑、哀悼还是反思。","English":"For a poem purpose question, decide whether the speaker is commemorating, praising, questioning, mourning, or reflecting.","Keywords":"poem purpose verbs","Example":"commemorate, praise, question, mourn, reflect","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R486","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"特殊群体或历史语境题要避免现代常识过度套入。","English":"For special groups or historical contexts, avoid overapplying modern assumptions.","Keywords":"historical context, assumption","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R487","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"缩写和古词可以影响语气，但不能脱离上下文解释。","English":"Notice that contractions and archaic words may affect tone, but they must be interpreted in context.","Keywords":"contraction, archaic word","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R488","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"戏剧文本要注意冲突、回应和人物之间的信息差。","English":"In drama, pay attention to conflict, response, and information gaps between characters.","Keywords":"conflict, information gap","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R489","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"人物台词的功能可能是试探、拒绝、转移话题或表达让步。","English":"Notice that a character's line may function to test, reject, shift the topic, or make a concession.","Keywords":"dialogue function","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R490","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"如果选项把复杂情感简化成单一情绪，要谨慎。","English":"If a choice reduces a complex emotion to one simple feeling, be careful.","Keywords":"complex emotion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R491","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"让学生先说：speaker 对对象的态度是什么？","English":"Ask students first: what is the speaker's attitude toward the object?","Keywords":"student prompt, speaker attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R492","Subject":"ReadingV3","Unit":"Poetry & Drama","Level":2,"Chinese":"诗歌和戏剧题仍然要回到文本证据，不靠文学感觉选。","English":"Notice that even in poetry and drama questions, return to textual evidence instead of choosing by literary feeling.","Keywords":"textual evidence, literature","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R493","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"错题不要只改答案，要写清楚自己到底错在哪一步。","English":"Don't just fix the answer. Write down where the mistake happened.","Keywords":"error cause","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R494","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在题型识别，还是错在文本理解？","English":"Was the error caused by question-type recognition or text comprehension?","Keywords":"question type, comprehension","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R495","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在定位，还是错在选项比较？","English":"Was the error caused by locating the information or comparing the choices?","Keywords":"locating, choice comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R496","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"这道题错在词汇、长句、逻辑还是证据？","English":"Was the error caused by vocabulary, long sentences, logic, or evidence?","Keywords":"vocabulary, long sentence, logic, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R497","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"复盘时先复述正确答案为什么对。","English":"In review, first restate why the correct answer is right.","Keywords":"correct answer, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R498","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"再说自己的选项为什么错。","English":"Notice that then explain why your original choice is wrong.","Keywords":"wrong answer, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R499","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"最后总结下次遇到同类题怎么做。","English":"Notice that finally, summarize what to do next time with the same question type.","Keywords":"next step, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R500","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":1,"Chinese":"每道错题都要留下一个可执行提醒。","English":"Notice that each wrong question should leave one actionable reminder.","Keywords":"actionable reminder","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R501","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"错题标签建议用：词义、长句、逻辑、定位、证据不完整、图表读错、观点方向错、过度推断。","English":"Notice that suggested error tags: vocabulary, long sentence, logic, locating, incomplete evidence, data misreading, wrong viewpoint direction, over-inference.","Keywords":"error tags","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R502","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"重题变体要关注变的是结论、比较对象、问法还是选项角度。","English":"For repeated question variants, check whether the conclusion, comparison object, question stem, or choice angle has changed.","Keywords":"question variant","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R503","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"复盘不是重新讲文章，而是提炼方法。","English":"Notice that review is not reteaching the passage; it is extracting the method.","Keywords":"review, method","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R504","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"如果学生说‘我没看懂’，要进一步问：没看懂词、句子、逻辑，还是选项？","English":"If a student says, 'I didn't understand it,' ask further: was it the vocabulary, sentence, logic, or choices?","Keywords":"student prompt, diagnosis","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R505","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"如果学生说‘我粗心’，要追问粗心具体发生在哪一步。","English":"If a student says, 'I was careless,' ask exactly which step the carelessness occurred in.","Keywords":"carelessness, step","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R506","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"每次复盘都要把一道题放回知识点地图里。","English":"Notice that every review should place the question back onto the knowledge map.","Keywords":"knowledge map, review","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R507","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"教师语言训练也要复盘：这句话是否能直接指导学生下一步？","English":"Teacher-language practice should also be reviewed: does this sentence directly guide the student's next step?","Keywords":"teacher language, instruction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R508","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"我们先把高频错误转换成固定课堂口令。","English":"In review, don't just record the answer. Name the error: location, logic, evidence, or scope.","Keywords":"classroom prompt","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R509","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"一节课结束前，让如果你觉得出今天最重要的三个判断动作。","English":"Notice that before the end of class, ask students to name the three most important judgment actions from today.","Keywords":"closing review, judgment actions","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R510","Subject":"ReadingV3","Unit":"Review & Error Logging","Level":2,"Chinese":"最终目标是让学生能独立说出：题型、目标、证据关系、排除理由。","English":"Notice that the final goal is for students to independently state the question type, target, evidence relationship, and elimination reason.","Keywords":"independent explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"M001","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"先别急着算，先看题目到底问的是什么量。","English":"Don't start calculating yet. First, identify the target quantity.","Keywords":"task, read first","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M002","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"这道题的目标量是什么？","English":"What is the target quantity in this problem?","Keywords":"target quantity","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M003","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"我们先把已知条件和所求内容分开。","English":"Let's separate the given information from what we need to find.","Keywords":"given, target","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M004","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"数学题先别只想着算，很多时候第一步是建模。","English":"In SAT math, don't just calculate. First, model the situation.","Keywords":"modeling","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M005","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"先把文字翻译成数学关系，再动手计算。","English":"Let's translate the words into math before we calculate.","Keywords":"translation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M006","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"我们先判断这题属于哪个知识点。","English":"Remember, first, decide which math concept this problem is testing.","Keywords":"concept, test","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M007","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"这个题最短的入口在哪里？","English":"Where is the shortest entry point into this problem?","Keywords":"entry point","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M008","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"这里不要被长文字吓到，先找数字、单位和关系词。","English":"Don't be intimidated by the long text; look for numbers, units, and relationship words first.","Keywords":"word problem, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M009","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"我们先把题目中的每个量都标出来。","English":"Don't rush into calculation. Circle the given information and the target first.","Keywords":"quantity, label","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M010","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"如果题目给图，我们先读图，再代数计算。","English":"If the problem gives a figure, read the figure before doing algebra.","Keywords":"figure, algebra","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M011","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"如果有表格或图表，先看标题、单位和变量。","English":"If there is a table or graph, read the title, units, and variables first.","Keywords":"graph, table, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M012","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"我们先估算答案范围，避免算出离谱结果。","English":"Remember, estimate the answer range first so that we can avoid unreasonable results.","Keywords":"estimate, reasonableness","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M013","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"这一步我们是在简化，不是在求最终答案。","English":"Remember, at this step, we are simplifying, not finding the final answer yet.","Keywords":"simplify, process","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M014","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"每一步都要知道自己为什么这样做。","English":"For every step, know why you are doing it.","Keywords":"reasoning, process","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M015","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"这里不要只记公式，要知道公式里的每个量代表什么。","English":"Don't just memorize the formula; know what each quantity in the formula represents.","Keywords":"formula, meaning","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M016","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"如果答案是选择题，可以用反代或排除。","English":"If it is a multiple-choice question, we can use backsolving or elimination.","Keywords":"backsolving, elimination","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M017","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"如果题目问表达式，不一定需要算出变量。","English":"If the question asks for an expression, we may not need to solve for the variable.","Keywords":"expression, variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M018","Subject":"MathV3","Unit":"General Math Workflow","Level":1,"Chinese":"如果题目问解释，我们要解释斜率、截距或系数的实际含义。","English":"If the question asks for an interpretation, explain the real-world meaning of the slope, intercept, or coefficient.","Keywords":"interpretation, coefficient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M019","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"这道题真正考的是关系，不是计算量。","English":"Remember, this problem is really testing the relationship, not the amount of computation.","Keywords":"relationship, computation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M020","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"我们先选择方法：代数、图像、代入、还是估算。","English":"Remember, let's choose a method first: algebra, graphing, substitution, or estimation.","Keywords":"method choice","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M021","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"算完以后一定要回到题干，检查答案的单位和语境。","English":"After calculating, go back to the stem and check the units and context.","Keywords":"unit, context","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M022","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"如果两个选项都看起来合理，比较它们对题干条件的满足程度。","English":"If two choices look reasonable, compare how fully they satisfy the conditions in the question.","Keywords":"elimination, conditions","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M023","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"这个错误不是知识点不会，而是题干中的限制条件漏读了。","English":"Remember, this error is not a concept issue; it comes from missing a restriction in the question.","Keywords":"restriction, error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M024","Subject":"MathV3","Unit":"General Math Workflow","Level":2,"Chinese":"我们要把解题过程写成可检查的步骤，而不是心算一串结果。","English":"Remember, we should write the solution as checkable steps, not as a chain of mental arithmetic.","Keywords":"steps, check","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M025","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 a certain number，就先设成 x。","English":"When you see 'a certain number,' let it be x.","Keywords":"certain number, variable","Example":"a certain number → x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M026","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到看到 sum，，通常表示加法。","English":"When you see 'sum,' it usually indicates addition.","Keywords":"sum, addition","Example":"the sum of x and y → x + y","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M027","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 difference，要特别注意谁减谁。","English":"When you see 'difference,' pay close attention to the order of subtraction.","Keywords":"difference, subtraction","Example":"the difference between x and y → x - y","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M028","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 product，表示乘积。","English":"When you see 'product,' it means multiplication.","Keywords":"product, multiplication","Example":"the product of x and y → xy","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M029","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 quotient，表示除法结果。","English":"When you see 'quotient,' it means the result of division.","Keywords":"quotient, division","Example":"the quotient of x and y → x/y","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M030","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"more than 要把后面的量放在前面。","English":"For 'more than,' put the quantity after the phrase first.","Keywords":"more than, order","Example":"5 more than x → x + 5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M031","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"less than 的顺序最容易反。","English":"Remember: the order in 'less than' is the easiest to reverse by mistake.","Keywords":"less than, order","Example":"5 less than x → x - 5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M032","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 twice as much as，先想它表示的是2 倍。","English":"Remember, 'Twice as much as' means two times as much.","Keywords":"twice as much, ratio","Example":"P = 2J","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M033","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 twice more than，先想它表示的是比原来多两倍，也就是三倍。","English":"Remember, 'Twice more than' means two times more than the original amount, so the total is three times as much.","Keywords":"twice more than, total","Example":"P = 3J","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M034","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 for every，先想它表示的是比例关系。","English":"Translate the English math language into variables, operations, and equations first.","Keywords":"for every, ratio","Example":"5 books for every 2 books → 5:2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M035","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"at least 对应大于等于。","English":"Remember, 'At least' corresponds to greater than or equal to.","Keywords":"at least, inequality","Example":"at least 10 → x ≥ 10","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M036","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"at most 对应小于等于。","English":"Remember, 'At most' corresponds to less than or equal to.","Keywords":"at most, inequality","Example":"at most 10 → x ≤ 10","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M037","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"no less than 不是小于，而是大于等于。","English":"Remember, 'No less than' does not mean less than; it means greater than or equal to.","Keywords":"no less than, inequality","Example":"no less than 6 → x ≥ 6","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M038","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"no more than 不是大于，而是小于等于。","English":"Remember, 'No more than' does not mean greater than; it means less than or equal to.","Keywords":"no more than, inequality","Example":"no more than 6 → x ≤ 6","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M039","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"per 常常表示每单位，也就是除法或 rate。","English":"Remember, 'Per' often means for each unit, so it indicates division or a rate.","Keywords":"per, rate","Example":"miles per hour","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M040","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 percent of，先想它表示的是乘以这个百分数。","English":"Translate the English math language into variables, operations, and equations first.","Keywords":"percent of","Example":"20% of p → 0.2p","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M041","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"看到 discount off，先想它表示的是减少，不是剩余价格。","English":"Remember, 'Discount off' means the amount reduced, not the remaining price.","Keywords":"discount, percent","Example":"20% off price → discount = 0.2p","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M042","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":1,"Chinese":"remaining price 才是打折后的价格。","English":"Remember, 'Remaining price' is the price after the discount.","Keywords":"remaining price","Example":"20% off → final price = 0.8p","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M043","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"翻译文字题时，先找动词关系：is、has、costs、increases、decreases。","English":"Remember, when translating a word problem, first look for relationship verbs: is, has, costs, increases, and decreases.","Keywords":"relationship verbs","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M044","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"看到一句话中有两个关系时，，通常要列两个式子或一个方程组。","English":"If one sentence contains two relationships, we usually need two expressions or a system of equations.","Keywords":"two relationships, system","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M045","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"这里不要把英语顺序机械照搬成数学顺序。","English":"Don't mechanically copy the English word order into the mathematical order.","Keywords":"word order","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M046","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"我们先翻译局部短语，再合并成完整方程。","English":"Remember, translate smaller phrases first, then combine them into a complete equation.","Keywords":"phrase translation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M047","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"如果题目有单位换算，先把语言翻译成单位比例。","English":"If the problem involves unit conversion, translate the language into a unit ratio first.","Keywords":"unit conversion","Example":"1 foot = 12 inches","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M048","Subject":"MathV3","Unit":"Mathematical Language & Translation","Level":2,"Chinese":"翻译完成后读一遍式子，看它是否符合中文意思。","English":"After translating, read the equation back and check whether it matches the meaning of the sentence.","Keywords":"check translation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M049","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"我们先判断题目中的数属于整数、有理数还是实数。","English":"Remember, first, determine whether the numbers are integers, rational numbers, or real numbers.","Keywords":"number type","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M050","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 integer，先把它理解成“整数，可以是正数、负数或零”。","English":"Think of integer as a whole number; it can be positive, negative, or zero.","Keywords":"integer","Example":"..., -2, -1, 0, 1, 2, ...","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M051","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 whole numbers，先确认它包括零和正整数。","English":"Remember: whole numbers include zero and positive integers.","Keywords":"whole number","Example":"0, 1, 2, 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M052","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 positive numbers，先把它理解成“大于零的数”。","English":"For number-type questions, identify the number set before calculating.","Keywords":"positive number","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M053","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 negative numbers，先把它理解成“小于零的数”。","English":"For number-type questions, identify the number set before calculating.","Keywords":"negative number","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M054","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 even numbers，先把它理解成“能被 2 整除的整数”。","English":"For number-type questions, identify the number set before calculating.","Keywords":"even number, divisible","Example":"-4, -2, 0, 2, 4","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M055","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 odd numbers，先把它理解成“不能被 2 整除的整数”。","English":"Remember, odd numbers are integers not divisible by 2.","Keywords":"odd number","Example":"-3, -1, 1, 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M056","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"prime number 只有两个因子：1 和它本身。","English":"Remember, a prime number has exactly two factors: 1 and itself.","Keywords":"prime number, factor","Example":"2, 3, 5, 7","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M057","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 composite number，先把它理解成“大于 1 但不是质数的自然数”。","English":"Think of composite number as a natural number greater than 1 that is not prime.","Keywords":"composite number","Example":"4, 6, 8, 9","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M058","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 factor，先把它理解成“能整除原数的数”。","English":"Think of factor as a number that divides the original number evenly.","Keywords":"factor, divisor","Example":"Factors of 12: 1, 2, 3, 4, 6, 12","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M059","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 multiple，先把它理解成“某个数乘整数得到的结果”。","English":"Think of multiple as the result of multiplying a number by an integer.","Keywords":"multiple","Example":"Multiples of 5: 5, 10, 15","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M060","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"reciprocal 的核心是乘积等于 1。","English":"Remember: the key idea of reciprocals is that their product is 1.","Keywords":"reciprocal","Example":"2 and 1/2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M061","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"看到 absolute value，先想它表示的是到零的距离。","English":"For number-type questions, identify the number set before calculating.","Keywords":"absolute value, distance","Example":"|-5| = 5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M062","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"距离一定非负，所以绝对值不能小于零。","English":"Think of distance as always nonnegative, so an absolute value cannot be less than zero.","Keywords":"absolute value, nonnegative","Example":"|x| ≥ 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M063","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"consecutive integers 可以设成 x, x+1, x+2。","English":"Remember, consecutive integers can be written as x, x+1, and x+2.","Keywords":"consecutive integers","Example":"x, x+1, x+2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M064","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":1,"Chinese":"consecutive even 或 odd integers 间隔是 2。","English":"Remember, consecutive even or odd integers differ by 2.","Keywords":"consecutive even, odd","Example":"x, x+2, x+4","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M065","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"如果题目限定 positive integer，答案必须同时满足正数和整数。","English":"If the problem says 'positive integer,' the answer must be both positive and an integer.","Keywords":"restriction, positive integer","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M066","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"如果题目限定 real number，不能随便排除小数或负数。","English":"If the problem says 'real number,' don't automatically exclude decimals or negative numbers.","Keywords":"real number, restriction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M067","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"因子和倍数是一组反向关系：A 是 C 的因子，C 是 A 的倍数。","English":"Remember, factors and multiples are inverse relationships: A is a factor of C, and C is a multiple of A.","Keywords":"factor, multiple","Example":"3 is a factor of 12; 12 is a multiple of 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M068","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"判断奇偶时，先看变量本身有没有整数限制。","English":"Remember, when reasoning about odd and even numbers, first check whether the variable is restricted to integers.","Keywords":"parity, integer restriction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M069","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"质数题最容易漏掉 2，因为 2 是唯一的偶质数。","English":"Remember, prime number problems often trick students into forgetting that 2 is the only even prime number.","Keywords":"prime number, 2","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M070","Subject":"MathV3","Unit":"Arithmetic & Number Types","Level":2,"Chinese":"数列题设变量时，要让表达式自动体现连续性。","English":"Remember, when setting variables for a sequence, choose expressions that automatically show consecutiveness.","Keywords":"sequence, variable setup","Example":"x-2, x, x+2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M071","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"做 addition 时，结果叫 sum。","English":"Remember: the result of addition is called the sum.","Keywords":"addition, sum","Example":"a + b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M072","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"做 subtraction 时，结果叫 difference。","English":"Remember: the result of subtraction is called the difference.","Keywords":"subtraction, difference","Example":"a - b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M073","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"做 multiplication 时，结果叫 product。","English":"Remember: the result of multiplication is called the product.","Keywords":"multiplication, product","Example":"ab","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M074","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"做 division 时，结果叫 quotient。","English":"Remember: the result of division is called the quotient.","Keywords":"division, quotient","Example":"a/b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M075","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"division 中被除数是 dividend，除数是 divisor。","English":"In division, the number being divided is the dividend, and the number dividing it is the divisor.","Keywords":"dividend, divisor","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M076","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"分数中，上面是 numerator，下面是 denominator。","English":"In a fraction, the top number is the numerator, and the bottom number is the denominator.","Keywords":"numerator, denominator","Example":"3/5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M077","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"分母不能为零。","English":"For operations and decimals, check the operation, place value, and rounding requirement.","Keywords":"denominator, zero","Example":"x/(y-2), y ≠ 2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M078","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"看到 round to the nearest tenth，先想它表示的是四舍五入到十分位。","English":"Remember, round to the nearest tenth means round to one decimal place.","Keywords":"rounding, nearest tenth","Example":"3.46 → 3.5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M079","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"看到 nearest hundredth，先想它表示的是四舍五入到百分位。","English":"Remember, nearest hundredth means round to two decimal places.","Keywords":"rounding, hundredth","Example":"3.456 → 3.46","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M080","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"小数点左边是 ones digit，右边第一位是 tenths digit。","English":"Remember, the digit to the left of the decimal point is the ones digit, and the first digit to the right is the tenths digit.","Keywords":"digit, decimal","Example":"12.34","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M081","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"我们先化简分数，再判断是否需要小数。","English":"Remember, simplify the fraction first, then decide whether a decimal is needed.","Keywords":"fraction, decimal","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M082","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"通分的目标是让分母一致。","English":"Remember: the goal of finding a common denominator is to make the denominators the same.","Keywords":"common denominator","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M083","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"约分的本质是分子分母同时除以公因数。","English":"Remember, simplifying a fraction means dividing the numerator and denominator by a common factor.","Keywords":"simplify fraction, common factor","Example":"12/18 = 2/3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M084","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"指数运算前先确认底数。","English":"For operations and decimals, check the operation, place value, and rounding requirement.","Keywords":"base, exponent","Example":"3^2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M085","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"平方是 second power，立方是 third power。","English":"Think of square as the second power, and a cube is the third power.","Keywords":"power, square, cube","Example":"x², x³","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M086","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":1,"Chinese":"看到 square root，先把它理解成“平方根，cube root 是立方根”。","English":"Think of square root as a second root, and a cube root is a third root.","Keywords":"root, square root","Example":"√x, ∛x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M087","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":2,"Chinese":"运算顺序错，会让后面每一步都对但最终答案错。","English":"If the order of operations is wrong, every later step may look correct but the final answer will be wrong.","Keywords":"order of operations","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M088","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":2,"Chinese":"遇到负号和指数时，先判断负号是否在括号内。","English":"When you see a negative sign and an exponent, check whether the negative sign is inside the parentheses.","Keywords":"negative sign, exponent","Example":"(-3)^2 vs -3^2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M089","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":2,"Chinese":"除法可以改写成乘以倒数，这样更容易约分。","English":"Remember, division can be rewritten as multiplication by the reciprocal, which often makes simplification easier.","Keywords":"division, reciprocal","Example":"(a/b) ÷ (c/d)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M090","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Ro

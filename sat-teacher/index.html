ight.","Keywords":"not drawn to scale","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M361","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"角度追踪题要把已知角、平行线和三角形内角和连起来。","English":"In angle-chasing problems, connect known angles, parallel lines, and the triangle angle sum.","Keywords":"angle chasing","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M362","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"直角三角形题先判断是否要勾股、相似还是三角函数。","English":"For right triangle problems, first decide whether to use the Pythagorean theorem, similarity, or trigonometry.","Keywords":"right triangle strategy","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M363","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"面积题中，斜边不能随便当 height。","English":"In area problems, a slanted side cannot automatically be used as the height.","Keywords":"area, height","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M364","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"看到如果题目问 possible length，，通常要用三角形不等式给范围。","English":"If the problem asks for a possible length, use the triangle inequality to find the range.","Keywords":"possible length, inequality","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M365","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"看到 sin，先把它理解成“opposite over hypotenuse”。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"sine, opposite, hypotenuse","Example":"sin θ = opp/hyp","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M366","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"看到 cos，先把它理解成“adjacent over hypotenuse”。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"cosine, adjacent, hypotenuse","Example":"cos θ = adj/hyp","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M367","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"看到 tan，先把它理解成“opposite over adjacent”。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"tangent, opposite, adjacent","Example":"tan θ = opp/adj","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M368","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"SOH-CAH-TOA 可以帮我们记三角比。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"SOH CAH TOA","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M369","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"我们先根据角确定 opposite 和 adjacent。","English":"Remember, first identify the opposite and adjacent sides based on the angle.","Keywords":"opposite, adjacent","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M370","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"hypotenuse 永远是直角对面的边。","English":"Remember: the hypotenuse is always the side opposite the right angle.","Keywords":"hypotenuse","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M371","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"30-60-90 三角形有固定边长比例。","English":"Remember, a 30-60-90 triangle has a fixed side ratio.","Keywords":"30-60-90","Example":"1 : √3 : 2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M372","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"45-45-90 三角形也有固定边长比例。","English":"Remember, a 45-45-90 triangle also has a fixed side ratio.","Keywords":"45-45-90","Example":"1 : 1 : √2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M373","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"sin x 等于 cos 的余角。","English":"Remember, sine of an angle equals cosine of its complementary angle.","Keywords":"complementary angle","Example":"sin x = cos(90°-x)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M374","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"看到 degree，先把它理解成“角度单位”。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"degree","Example":"180°","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M375","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"看到 radian，先把它理解成“弧度单位”。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"radian","Example":"π radians","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M376","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"π radians 等于 180 degrees。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"radian, degree","Example":"π = 180°","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M377","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"unit circle 的半径是 1。","English":"For trig, identify opposite, adjacent, and hypotenuse, then check the quadrant.","Keywords":"unit circle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M378","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"单位圆上，cos 对应 x-coordinate。","English":"Remember, on the unit circle, cosine corresponds to the x-coordinate.","Keywords":"unit circle, cosine","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M379","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"单位圆上，sin 对应 y-coordinate。","English":"Remember, on the unit circle, sine corresponds to the y-coordinate.","Keywords":"unit circle, sine","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M380","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":1,"Chinese":"象限决定 sin 和 cos 的正负。","English":"Remember, the quadrant determines the signs of sine and cosine.","Keywords":"quadrant, signs","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M381","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":2,"Chinese":"三角函数题先别背数值，先确定三角形和角的位置。","English":"For trigonometry problems, don't start by memorizing values; first locate the triangle and the angle.","Keywords":"angle position","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M382","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":2,"Chinese":"如果已知 sin，题目问 cos 余角，可以直接用互余关系。","English":"If sine is given and the problem asks for cosine of the complementary angle, use the cofunction relationship directly.","Keywords":"cofunction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M383","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":2,"Chinese":"角超过 90 度时，要用单位圆理解正负号。","English":"Remember, when the angle is greater than 90 degrees, use the unit circle to understand the sign.","Keywords":"unit circle, sign","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M384","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":2,"Chinese":"弧度题先判断是否要换成角度。","English":"For radian problems, first decide whether conversion to degrees is needed.","Keywords":"radian conversion","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M385","Subject":"MathV3","Unit":"Trigonometry & Unit Circle Basics","Level":2,"Chinese":"看到如果题目只要比例，，通常不需要求具体边长。","English":"If the problem asks only for a ratio, we usually don't need exact side lengths.","Keywords":"ratio, trigonometry","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M386","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 radius，先把它理解成“半径”。","English":"Remember: the radius is the distance from the center to a point on the circle.","Keywords":"radius","Example":"r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M387","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 diameter，先把它理解成“直径，等于 2r”。","English":"Remember: the diameter is twice the radius.","Keywords":"diameter","Example":"d = 2r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M388","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 circumference，先把它理解成“圆周长”。","English":"For circles, start with the radius, central angle, and proportion.","Keywords":"circumference","Example":"C = 2πr","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M389","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 area of a circle，先把它理解成“πr²”。","English":"Remember: the area of a circle is pi r squared.","Keywords":"circle area","Example":"A = πr²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M390","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 arc，先把它理解成“圆弧”。","English":"Think of arc as part of the circumference of a circle.","Keywords":"arc","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M391","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 sector，先把它理解成“扇形”。","English":"Think of sector as a region of a circle bounded by two radii and an arc.","Keywords":"sector","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M392","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"arc length 用圆周长乘所占比例。","English":"Remember, arc length is the circumference multiplied by the fraction of the circle.","Keywords":"arc length, proportion","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M393","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"sector area 用圆面积乘所占比例。","English":"Remember, sector area is the area of the circle multiplied by the fraction of the circle.","Keywords":"sector area, proportion","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M394","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"所占比例可以用中心角除以 360 度。","English":"Remember, the fraction of the circle can be found by dividing the central angle by 360 degrees.","Keywords":"central angle, fraction","Example":"θ/360","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M395","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"如果用弧度，整圆是 2π。","English":"If radians are used, a full circle is 2 pi.","Keywords":"radian, full circle","Example":"2π","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M396","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 central angle，先把它理解成“圆心角”。","English":"Think of central angle as an angle whose vertex is the center of the circle.","Keywords":"central angle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M397","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"看到 inscribed angle，先把它理解成“圆周角”。","English":"Think of inscribed angle as an angle whose vertex lies on the circle.","Keywords":"inscribed angle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M398","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"同弧所对圆周角是圆心角的一半。","English":"Think of inscribed angle subtending the same arc as half the central angle.","Keywords":"inscribed angle, central angle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M399","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"circle equation 标准形式是 (x-a)²+(y-b)²=r²。","English":"Remember, the standard equation of a circle is x minus a squared plus y minus b squared equals r squared.","Keywords":"circle equation","Example":"(x-a)²+(y-b)²=r²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M400","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"圆心是 (a,b)，半径是 r。","English":"Remember: the center is (a, b), and the radius is r.","Keywords":"center, radius","Example":"(x-a)²+(y-b)²=r²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M401","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":1,"Chinese":"如果方程里有平方项，可以考虑配方找圆心。","English":"If the equation contains squared terms, consider completing the square to find the center.","Keywords":"complete square, circle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M402","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":2,"Chinese":"弧长和扇形面积都不是新公式，本质是比例。","English":"Remember, arc length and sector area are not new formulas; they are both based on proportion.","Keywords":"proportion, sector","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M403","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":2,"Chinese":"θ 的单位一定要和公式匹配：度数用360，弧度用2π。","English":"Remember, the unit of theta must match the formula: use 360 for degrees and 2 pi for radians.","Keywords":"degree, radian","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M404","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":2,"Chinese":"圆方程题先判断是找圆心、半径，还是代点验证。","English":"For circle equation problems, first decide whether we need the center, radius, or point substitution.","Keywords":"circle equation strategy","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M405","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":2,"Chinese":"如果题目问 diameter，不要算完 radius 就停。","English":"If the question asks for diameter, don't stop after finding the radius.","Keywords":"diameter, radius","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M406","Subject":"MathV3","Unit":"Circles, Arcs & Sectors","Level":2,"Chinese":"扇形题要先确定是求一维弧长还是二维面积。","English":"For sector problems, first determine whether the question asks for one-dimensional arc length or two-dimensional area.","Keywords":"arc length, sector area","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M407","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"coordinate plane 由 x-axis 和 y-axis 组成。","English":"Remember, the coordinate plane consists of the x-axis and the y-axis.","Keywords":"coordinate plane","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M408","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 origin，先把它理解成“原点”。","English":"Remember: the origin is the point where the axes intersect.","Keywords":"origin","Example":"(0,0)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M409","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 x-coordinate，先想它表示的是水平位置。","English":"For coordinate geometry, mark the points, lines, slope, distance, and midpoint.","Keywords":"x-coordinate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M410","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 y-coordinate，先想它表示的是竖直位置。","English":"For coordinate geometry, mark the points, lines, slope, distance, and midpoint.","Keywords":"y-coordinate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M411","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"distance formula 来自勾股定理。","English":"Remember, the distance formula comes from the Pythagorean theorem.","Keywords":"distance formula","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M412","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 midpoint，先把它理解成“两个坐标的平均值”。","English":"Remember: the midpoint is found by averaging the coordinates.","Keywords":"midpoint","Example":"((x1+x2)/2, (y1+y2)/2)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M413","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"parallel to x-axis 的线是 horizontal line。","English":"Think of line parallel to the x-axis as a horizontal line.","Keywords":"horizontal line","Example":"y = b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M414","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"parallel to y-axis 的线是 vertical line。","English":"Think of line parallel to the y-axis as a vertical line.","Keywords":"vertical line","Example":"x = a","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M415","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 perpendicular，先想它表示的是垂直。","English":"For coordinate geometry, mark the points, lines, slope, distance, and midpoint.","Keywords":"perpendicular","Example":"90°","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M416","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"rectangle 的对边相等且平行。","English":"Remember, opposite sides of a rectangle are equal and parallel.","Keywords":"rectangle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M417","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 square，先把它理解成“特殊的 rectangle”。","English":"Think of square as a special rectangle.","Keywords":"square, rectangle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M418","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"parallelogram 的对边平行。","English":"For coordinate geometry, mark the points, lines, slope, distance, and midpoint.","Keywords":"parallelogram","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M419","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 volume，先把它理解成“三维体积”。","English":"For coordinate geometry, mark the points, lines, slope, distance, and midpoint.","Keywords":"volume","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M420","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"看到 surface area，先把它理解成“所有表面的总面积”。","English":"Remember, surface area is the total area of all faces.","Keywords":"surface area","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M421","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":1,"Chinese":"dimension 指长度、宽度、高度这些维度。","English":"Remember, dimension refers to measurements such as length, width, and height.","Keywords":"dimension","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M422","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":2,"Chinese":"看到坐标题中图像信息和代数信息，通常可以互相转化。","English":"In coordinate geometry, graphical information and algebraic information can usually be converted into each other.","Keywords":"coordinate geometry, algebra","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M423","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":2,"Chinese":"如果题目问距离，先判断是否是水平、竖直，还是斜线距离。","English":"If the problem asks for distance, first decide whether it is horizontal, vertical, or diagonal distance.","Keywords":"distance, coordinate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M424","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":2,"Chinese":"如果两个点 x 相同，是竖直线；y 相同，是水平线。","English":"If two points have the same x-coordinate, the line is vertical; if they have the same y-coordinate, the line is horizontal.","Keywords":"same x, same y","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M425","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":2,"Chinese":"几何题中如果出现坐标，可以用代数方法减少视觉误判。","English":"If coordinates appear in a geometry problem, use algebraic methods to reduce visual misjudgment.","Keywords":"coordinates, geometry","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M426","Subject":"MathV3","Unit":"Coordinate & Other Geometry","Level":2,"Chinese":"立体几何题先区分 volume、surface area 和 lateral area。","English":"For solid geometry, first distinguish among volume, surface area, and lateral area.","Keywords":"solid geometry","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M427","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"imaginary number i 定义为 √-1。","English":"Remember: the imaginary number i is defined as the square root of negative one.","Keywords":"imaginary number, i","Example":"i = √-1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M428","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"i² 等于 -1。","English":"For complex numbers, handle the real part and imaginary part separately.","Keywords":"i squared","Example":"i² = -1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M429","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"complex number 标准形式是 a + bi。","English":"Remember: the standard form of a complex number is a plus bi.","Keywords":"complex number, standard form","Example":"a + bi","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M430","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"看到 a，先把它理解成“real part”。","English":"For complex numbers, handle the real part and imaginary part separately.","Keywords":"real part","Example":"a + bi","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M431","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"看到 bi，先把它理解成“imaginary part”。","English":"For complex numbers, handle the real part and imaginary part separately.","Keywords":"imaginary part","Example":"a + bi","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M432","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"复数加减时，实部和实部合并，虚部和虚部合并。","English":"Remember, when adding or subtracting complex numbers, combine real parts with real parts and imaginary parts with imaginary parts.","Keywords":"add, subtract complex numbers","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M433","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"复数乘法用分配律。","English":"Let's use the distributive property to multiply complex numbers.","Keywords":"multiply complex numbers, distribute","Example":"(a+bi)(c+di)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M434","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"i 的幂每 4 次循环一次。","English":"Remember, powers of i repeat in a cycle of four.","Keywords":"powers of i, cycle","Example":"i, -1, -i, 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M435","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"i³ 等于 -i。","English":"For complex numbers, handle the real part and imaginary part separately.","Keywords":"i cubed","Example":"i³ = -i","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M436","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"i⁴ 等于 1。","English":"For complex numbers, handle the real part and imaginary part separately.","Keywords":"i fourth","Example":"i⁴ = 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M437","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"看到 conjugate，先把它理解成“共轭复数”。","English":"Remember: the conjugate is the complex number with the opposite sign in the imaginary part.","Keywords":"conjugate","Example":"a-bi","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M438","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"a+bi 的共轭是 a-bi。","English":"Remember: the conjugate of a plus bi is a minus bi.","Keywords":"conjugate","Example":"a+bi → a-bi","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M439","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"共轭相乘可以消去虚部。","English":"Remember, multiplying by the conjugate can eliminate the imaginary part.","Keywords":"conjugate, division","Example":"(a+bi)(a-bi)=a²+b²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M440","Subject":"MathV3","Unit":"Complex Numbers","Level":1,"Chinese":"复数除法时，分子分母同乘分母的共轭。","English":"For complex division, multiply the numerator and denominator by the conjugate of the denominator.","Keywords":"complex division, conjugate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M441","Subject":"MathV3","Unit":"Complex Numbers","Level":2,"Chinese":"高次 i 的幂先除以 4，看余数。","English":"For a high power of i, divide the exponent by 4 and look at the remainder.","Keywords":"power of i, remainder","Example":"i^27","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M442","Subject":"MathV3","Unit":"Complex Numbers","Level":2,"Chinese":"复数题最常见错误是忘记把 i² 换成 -1。","English":"Remember: the most common complex-number error is forgetting to replace i squared with negative one.","Keywords":"i squared error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M443","Subject":"MathV3","Unit":"Complex Numbers","Level":2,"Chinese":"标准形式要求最后写成 a+bi，不能留下 i²。","English":"Remember, standard form requires the final answer to be written as a plus bi, with no i squared left.","Keywords":"standard form, simplify","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M444","Subject":"MathV3","Unit":"Complex Numbers","Level":2,"Chinese":"如果题目含 h 或 k 这样的参数，先按复数运算法则展开再比较实部虚部。","English":"If the problem includes parameters such as h or k, expand using complex-number rules and then compare real and imaginary parts.","Keywords":"parameter, real part, imaginary part","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M445","Subject":"MathV3","Unit":"Complex Numbers","Level":2,"Chinese":"复数也可以像实数一样加减乘，但除法要用共轭处理。","English":"Remember, complex numbers can be added, subtracted, and multiplied like real numbers, but division requires the conjugate.","Keywords":"complex operations","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M446","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 rate，先把它理解成“两个不同单位的比”。","English":"Think of rate as a ratio of two quantities with different units.","Keywords":"rate","Example":"miles per hour","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M447","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 ratio，先把它理解成“两个量之间的比较”。","English":"Think of ratio as a comparison between two quantities.","Keywords":"ratio","Example":"3:5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M448","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 proportion，先把它理解成“两个比相等”。","English":"Remember, a proportion states that two ratios are equal.","Keywords":"proportion","Example":"a/b = c/d","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M449","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 unit rate，先想它表示的是每 1 个单位对应多少。","English":"Remember, a unit rate tells us how much corresponds to one unit.","Keywords":"unit rate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M450","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 per，先想它表示的是每。","English":"For rates, ratios, units, and percent, make the units consistent before writing the equation.","Keywords":"per","Example":"dollars per pound","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M451","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"单位换算时，把转换关系写成分数。","English":"For unit conversion, write the conversion factor as a fraction.","Keywords":"unit conversion, fraction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M452","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"目标是让不要的单位抵消。","English":"Remember: the goal is to cancel the units we don't need.","Keywords":"unit cancellation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M453","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到大单位化小单位，通常乘。","English":"Remember, to convert from a larger unit to a smaller unit, we usually multiply.","Keywords":"unit conversion, multiply","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M454","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到小单位化大单位，通常除。","English":"Remember, to convert from a smaller unit to a larger unit, we usually divide.","Keywords":"unit conversion, divide","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M455","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 percent，先想它表示的是百分之几，要除以 100。","English":"Remember, percent means out of one hundred, so divide by 100.","Keywords":"percent","Example":"25% = 0.25","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M456","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"percent change 用change 除以 original。","English":"Remember, percent change is the change divided by the original amount.","Keywords":"percent change","Example":"(new-old)/old","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M457","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"increase by r percent 对应乘以 1+r。","English":"Remember, an increase by r percent corresponds to multiplying by 1 plus r.","Keywords":"percent increase","Example":"1+r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M458","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"decrease by r percent 对应乘以 1-r。","English":"Remember, a decrease by r percent corresponds to multiplying by 1 minus r.","Keywords":"percent decrease","Example":"1-r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M459","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 scale factor，先想它表示的是比例放大或缩小的倍数。","English":"Remember, a scale factor tells how many times larger or smaller a figure or quantity becomes.","Keywords":"scale factor","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M460","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 direct proportion，先想它表示的是一个量变大，另一个量按同样比例变大。","English":"Remember, direct proportion means one quantity increases in the same ratio as the other.","Keywords":"direct proportion","Example":"y = kx","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M461","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 inverse proportion，先想它表示的是一个量变大，另一个量按反比例变小。","English":"Remember, inverse proportion means one quantity increases while the other decreases proportionally.","Keywords":"inverse proportion","Example":"xy = k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M462","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"看到 simple interest，通常是本金乘利率乘时间。","English":"Remember, simple interest is usually principal times rate times time.","Keywords":"simple interest","Example":"I = Prt","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M463","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":1,"Chinese":"compound interest 每个周期都在新的总额上增长。","English":"Remember, compound interest grows on the new total after each period.","Keywords":"compound interest","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M464","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"比例题中，分子和分母的含义要保持一致。","English":"In proportion problems, the meanings of the numerator and denominator must stay consistent.","Keywords":"ratio consistency","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M465","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"rate 题一定要写单位，否则容易把分母分子反过来。","English":"For rate problems, always write the units; otherwise it is easy to reverse the numerator and denominator.","Keywords":"rate, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M466","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"百分比题的 base 是 original amount，不一定是题目最后给的数。","English":"In percent problems, the base is the original amount, which is not always the last number given.","Keywords":"percent base, original","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M467","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"连续百分比变化不能直接把百分数相加。","English":"Remember, successive percent changes cannot be handled by simply adding the percents.","Keywords":"successive percent change","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M468","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"看到如果价格先涨再跌同样百分比，，通常不会回到原价。","English":"If a price rises and then falls by the same percent, it usually does not return to the original price.","Keywords":"percent change trap","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M469","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"单位题中计算前先写 conversion chain。","English":"In unit problems, write the conversion chain before calculating.","Keywords":"conversion chain","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M470","Subject":"MathV3","Unit":"Rates, Ratios, Proportions, Units & Percent","Level":2,"Chinese":"比例尺、影子长度、地图距离本质上都是相似比例问题。","English":"Remember, scale, shadow length, and map distance problems are essentially similarity and proportion problems.","Keywords":"scale, proportion","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M471","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 probability，先想它表示的是事件发生的可能性。","English":"Remember, probability measures how likely an event is to occur.","Keywords":"probability","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M472","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到概率，通常等于 favorable outcomes 除以 total outcomes。","English":"Remember, probability is usually favorable outcomes divided by total outcomes.","Keywords":"favorable outcomes, total outcomes","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M473","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 sample space，先把它理解成“所有可能结果”。","English":"Remember: the sample space is the set of all possible outcomes.","Keywords":"sample space","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M474","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 event，先把它理解成“我们关注的结果集合”。","English":"Think of event as the set of outcomes we are interested in.","Keywords":"event","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M475","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 conditional probability，先把它理解成“在已知条件下的概率”。","English":"Remember, conditional probability is probability under a given condition.","Keywords":"conditional probability","Example":"P(A|B)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M476","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"P(A|B) 读作 A given B。","English":"Remember, P of A given B is read as the probability of A, given B.","Keywords":"P(A|B), given","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M477","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"given 后面的条件会缩小样本空间。","English":"Remember, the condition after 'given' reduces the sample space.","Keywords":"given, sample space","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M478","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"表格条件概率先圈定 given 的行或列。","English":"For conditional probability in a table, first isolate the row or column given by the condition.","Keywords":"table, conditional probability","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M479","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"分母一定要是条件范围内的总数。","English":"Remember, the denominator must be the total within the given condition.","Keywords":"denominator, condition","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M480","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"independent events 互不影响概率。","English":"For probability, define the sample space first; for conditional probability, shrink it first.","Keywords":"independent events","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M481","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"dependent events 的概率会受前一个结果影响。","English":"Remember, dependent events have probabilities affected by previous outcomes.","Keywords":"dependent events","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M482","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 with replacement，先想它表示的是放回，概率通常不变。","English":"Remember, with replacement means the item is put back, so the probability usually stays the same.","Keywords":"with replacement","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M483","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":1,"Chinese":"看到 without replacement，先想它表示的是不放回，样本空间会改变。","English":"Remember, without replacement means the item is not put back, so the sample space changes.","Keywords":"without replacement","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M484","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"条件概率最常见错误是分母仍然用总体。","English":"Remember, the most common error in conditional probability is still using the entire total as the denominator.","Keywords":"conditional probability error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M485","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"如果题目说 selected from those who...，those who 后面就是分母范围。","English":"If the problem says selected from those who..., the phrase after those who defines the denominator.","Keywords":"those who, denominator","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M486","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"概率表格题先判断是按行读、按列读，还是读交叉格。","English":"For probability table problems, first decide whether to read by row, by column, or by intersection cell.","Keywords":"probability table","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M487","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"如果事件互斥，不能同时发生。","English":"If events are mutually exclusive, they cannot happen at the same time.","Keywords":"mutually exclusive","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M488","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"如果题目问 not A，可以用1 - P(A)。","English":"If the problem asks for not A, we can use one minus P of A.","Keywords":"complement probability","Example":"1 - P(A)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M489","Subject":"MathV3","Unit":"Probability & Conditional Probability","Level":2,"Chinese":"概率答案应在 0 到 1 之间。","English":"Remember, a probability answer should be between 0 and 1.","Keywords":"probability range","Example":"0 ≤ P ≤ 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M490","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 mean，先把它理解成“平均数”。","English":"Remember: the mean is the average.","Keywords":"mean","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M491","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"mean 等于所有数相加再除以个数。","English":"Remember, the mean equals the sum of all values divided by the number of values.","Keywords":"mean formula","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M492","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 median，先把它理解成“中位数”。","English":"Remember: the median is the middle value.","Keywords":"median","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M493","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"求 median 前一定要先排序。","English":"Remember, before finding the median, order the data set.","Keywords":"median, order","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M494","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"如果数据个数是偶数，median 是中间两个数的平均。","English":"If there is an even number of data points, the median is the average of the two middle values.","Keywords":"median, even","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M495","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 mode，先把它理解成“出现次数最多的数”。","English":"Remember: the mode is the value that appears most often.","Keywords":"mode","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M496","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 range，先把它理解成“最大值减最小值”。","English":"Remember: the range is the maximum value minus the minimum value.","Keywords":"range","Example":"max - min","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M497","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"standard deviation 描述数据离平均数的分散程度。","English":"Remember, standard deviation describes how spread out the data are from the mean.","Keywords":"standard deviation, spread","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M498","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"数据越集中，standard deviation 越小。","English":"Remember, the more concentrated the data are, the smaller the standard deviation.","Keywords":"standard deviation, smaller","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M499","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"数据越分散，standard deviation 越大。","English":"Remember, the more spread out the data are, the larger the standard deviation.","Keywords":"standard deviation, larger","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M500","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 outlier，先把它理解成“明显偏离其他数据的值”。","English":"Think of outlier as a value that is far from the rest of the data.","Keywords":"outlier","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M501","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"outlier 会明显影响 mean。","English":"For statistics, ask whether we need center, spread, or a graph reading.","Keywords":"outlier, mean","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M502","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"median 对 outlier 更不敏感。","English":"Remember: the median is less sensitive to outliers.","Keywords":"median, outlier","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M503","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"histogram 显示频数或频率分布。","English":"Remember, a histogram shows the frequency or relative frequency distribution.","Keywords":"histogram, frequency","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M504","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"box plot 显示最小值、四分位数、中位数和最大值。","English":"Remember, a box plot shows the minimum, quartiles, median, and maximum.","Keywords":"box plot, quartile","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M505","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 Q1，先把它理解成“前一半数据的中位数”。","English":"Remember, Q1 is the median of the lower half of the data.","Keywords":"Q1","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M506","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 Q3，先把它理解成“后一半数据的中位数”。","English":"Remember, Q3 is the median of the upper half of the data.","Keywords":"Q3","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M507","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"看到 IQR，先把它理解成“Q3 减 Q1”。","English":"Remember: the interquartile range is Q3 minus Q1.","Keywords":"IQR","Example":"Q3 - Q1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M508","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"skewness 描述分布是否对称。","English":"For statistics, ask whether we need center, spread, or a graph reading.","Keywords":"skewness","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M509","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"right-skewed 分布右侧尾巴更长。","English":"Remember, a right-skewed distribution has a longer tail on the right.","Keywords":"right-skewed","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M510","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"left-skewed 分布左侧尾巴更长。","English":"Remember, a left-skewed distribution has a longer tail on the left.","Keywords":"left-skewed","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M511","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"margin of error 描述估计值可能偏离真实值的范围。","English":"Remember, the margin of error describes how far an estimate may be from the true value.","Keywords":"margin of error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M512","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"sample size 增大，margin of error 通常减小。","English":"Remember, as sample size increases, the margin of error usually decreases.","Keywords":"sample size, margin of error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M513","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":1,"Chinese":"confidence level 越高，margin of error 通常越大。","English":"Remember, a higher confidence level usually gives a larger margin of error.","Keywords":"confidence level, margin of error","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M514","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"看到统计题重点，通常不是套公式，而是理解数据变化。","English":"Remember, statistics problems usually focus not on applying formulas, but on understanding how the data change.","Keywords":"statistics, interpretation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M515","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"如果每个数据都加同一个数，mean 和 median 都会加同一个数。","English":"If the same number is added to every data point, the mean and median both increase by that number.","Keywords":"data transformation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M516","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"如果每个数据都乘同一个正数，mean、median、range、standard deviation 都按比例变化。","English":"If every data point is multiplied by the same positive number, the mean, median, range, and standard deviation scale by that factor.","Keywords":"scale, statistics","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M517","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"比较两组数据时，要分别看中心和离散程度。","English":"Remember, when comparing two data sets, examine both center and spread.","Keywords":"compare data sets","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M518","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"直方图纵轴只能表示频数或频率，不能当成数据本身。","English":"Remember, the vertical axis of a histogram shows frequency or relative frequency, not the data values themselves.","Keywords":"histogram, vertical axis","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M519","Subject":"MathV3","Unit":"Statistics: Center, Spread & Graphs","Level":2,"Chinese":"箱线图题不要误把箱子的长度当作人数。","English":"In box plot problems, don't mistake the length of the box for the number of data points.","Keywords":"box plot trap","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M520","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"scatterplot 显示两组数据之间的关系。","English":"Remember, a scatterplot shows the relationship between two sets of data.","Keywords":"scatterplot","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M521","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 positive association，先想它表示的是x 增加时 y 也通常增加。","English":"Remember, a positive association means that y generally increases as x increases.","Keywords":"positive association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M522","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 negative association，先想它表示的是x 增加时 y 通常减少。","English":"Remember, a negative association means that y generally decreases as x increases.","Keywords":"negative association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M523","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 no association，先想它表示的是没有明显关系。","English":"Remember, no association means there is no clear relationship.","Keywords":"no association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M524","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 linear association，先想它表示的是点大致沿直线分布。","English":"Remember, a linear association means the points roughly follow a line.","Keywords":"linear association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M525","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 nonlinear association，先想它表示的是关系不是直线型。","English":"Think of nonlinear association means the relationship as not linear.","Keywords":"nonlinear association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M526","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"strength 由点离趋势线的远近判断。","English":"Remember: the strength is judged by how close the points are to the trend line.","Keywords":"strength of association","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M527","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 line of best fit，先把它理解成“最能代表数据趋势的直线”。","English":"Remember, the line of best fit is the line that best represents the trend of the data.","Keywords":"line of best fit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M528","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"line of best fit 可用于预测未给出的 y 值。","English":"Remember, the line of best fit can be used to predict a y-value not included in the original data.","Keywords":"prediction, line of best fit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M529","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"实际点可以在拟合线上方、线上或下方。","English":"Remember, actual data points may be above, on, or below the line of best fit.","Keywords":"actual data, line of best fit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M530","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 residual，先把它理解成“实际值和预测值的差”。","English":"Think of residual as the difference between the actual value and the predicted value.","Keywords":"residual","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M531","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"correlation 不等于 causation。","English":"For scatterplots and sampling, separate correlation, prediction, random sampling, and random assignment.","Keywords":"correlation, causation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M532","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"random sample 能帮助样本代表总体。","English":"Remember, a random sample helps the sample represent the population.","Keywords":"random sample, generalization","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M533","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"random assignment 能支持因果结论。","English":"For scatterplots and sampling, separate correlation, prediction, random sampling, and random assignment.","Keywords":"random assignment, cause-effect","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M534","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 population，先把它理解成“总体”。","English":"Remember: the population is the entire group being studied.","Keywords":"population","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M535","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"看到 sample，先把它理解成“从总体中取出的部分”。","English":"Think of sample as a subset of the population.","Keywords":"sample","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M536","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"survey 结论能推广到谁，取决于抽样方式。","English":"Remember, who a survey conclusion can be generalized to depends on the sampling method.","Keywords":"survey, generalization","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M537","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":1,"Chinese":"experiment 的因果结论取决于是否随机分组。","English":"Think of causal conclusion from an experiment depends on whether there as random assignment.","Keywords":"experiment, random assignment","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M538","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"看到 association，先判断方向，再判断强弱。","English":"When you see association, first determine the direction and then the strength.","Keywords":"association, direction, strength","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M539","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"预测题要使用拟合线，不要随便选最近的点。","English":"For prediction problems, use the line of best fit, not just the nearest data point.","Keywords":"prediction, line of best fit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M540","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"外推 extrapolation 风险更高，因为超出了数据范围。","English":"Remember, extrapolation is riskier because it goes beyond the range of the data.","Keywords":"extrapolation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M541","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"抽样题要区分 generalization 和 cause-effect。","English":"In sampling questions, distinguish between generalization and cause-and-effect.","Keywords":"generalization, causation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M542","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"随机抽样回答能不能推广，随机分组回答能不能说明因果。","English":"Remember, random sampling answers whether we can generalize; random assignment answers whether we can infer causation.","Keywords":"random sample vs assignment","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M543","Subject":"MathV3","Unit":"Scatterplots, Regression & Sampling","Level":2,"Chinese":"如果样本有偏，不能把结论轻易推广到总体。","English":"If the sample is biased, we cannot confidently generalize the conclusion to the population.","Keywords":"biased sample","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M544","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"读图第一步先看标题，它告诉我们这张图在比较什么。","English":"Before reading the numbers, read the title and ask what the graph compares.","Keywords":"graph title","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M545","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"第二步看横轴和纵轴表示什么。","English":"Remember: the second step is to identify what the x-axis and y-axis represent.","Keywords":"x-axis, y-axis","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M546","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"第三步看单位。","English":"Remember: the third step is to check the units.","Keywords":"units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M547","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"第四步看图例。","English":"Remember: the fourth step is to read the legend.","Keywords":"legend","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M548","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"bar graph 适合比较类别。","English":"Think of bar graph as useful for comparing categories.","Keywords":"bar graph","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M549","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"line graph 适合看变化趋势。","English":"Think of line graph as useful for showing changes over time or another continuous variable.","Keywords":"line graph, trend","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M550","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"pie graph 适合看部分占整体的比例。","English":"Think of pie graph as useful for showing parts of a whole.","Keywords":"pie graph, part-whole","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M551","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"table 适合查找具体数值。","English":"Think of table as useful for looking up exact values.","Keywords":"table, exact value","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M552","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 key features，先确认它包括最大值、最小值、截距和变化趋势。","English":"Remember: key features include maximum, minimum, intercepts, and trends.","Keywords":"key features","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M553","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 maximum，先把它理解成“最大值”。","English":"Remember: the maximum is the greatest value.","Keywords":"maximum","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M554","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 minimum，先把它理解成“最小值”。","English":"Remember: the minimum is the least value.","Keywords":"minimum","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M555","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 increasing interval，先想它表示的是函数上升的区间。","English":"Think of increasing interval as where the function goes up.","Keywords":"increasing interval","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M556","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 decreasing interval，先想它表示的是函数下降的区间。","English":"Think of decreasing interval as where the function goes down.","Keywords":"decreasing interval","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M557","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":1,"Chinese":"看到 constant interval，先想它表示的是函数值不变。","English":"Think of constant interval as where the function value stays the same.","Keywords":"constant interval","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M558","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"读图题不要只看最高点，要看题目要求哪个变量。","English":"In graph questions, don't just look at the highest point; check which variable the question asks about.","Keywords":"target variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M559","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"选项中数据可能对，但对象或单位可能错。","English":"Remember, a choice may have the right number but the wrong object or unit.","Keywords":"data, object, unit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M560","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"比较题要确认比较的是同一时间、同一类别或同一单位。","English":"For comparison questions, confirm that we are comparing the same time, category, or unit.","Keywords":"comparison, same basis","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M561","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"趋势题关注整体方向，不要被一个局部波动带偏。","English":"For trend questions, focus on the overall direction and don't be misled by a local fluctuation.","Keywords":"trend, local fluctuation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M562","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"图表和文字同时出现时，先看文字要我们验证什么。","English":"Remember, when a graph and text appear together, first read what the text asks us to verify.","Keywords":"graph and text","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M563","Subject":"MathV3","Unit":"Graphs, Tables & Data Interpretation","Level":2,"Chinese":"如果图例有多个系列，先锁定题目要求的那一条。","English":"If the legend contains multiple series, first identify the series required by the question.","Keywords":"legend, series","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M564","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"能心算的题不要依赖计算器。","English":"Don't rely on the calculator for problems that can be done mentally.","Keywords":"calculator, mental math","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M565","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"计算器负责计算，不负责建模。","English":"Remember, the calculator handles computation; it does not build the model for us.","Keywords":"calculator, modeling","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M566","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"输入计算器前先加括号，保证运算顺序正确。","English":"Remember, before entering an expression into the calculator, add parentheses to preserve the correct order of operations.","Keywords":"calculator, parentheses","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M567","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"用计算器后也要检查答案是否合理。","English":"Remember, even after using the calculator, check whether the answer is reasonable.","Keywords":"calculator, reasonableness","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M568","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"如果题目是选择题，可以先估算排除。","English":"If the problem is multiple choice, estimate first to eliminate choices.","Keywords":"estimation, elimination","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M569","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"如果题目有复杂数字，可以尝试代入简单数理解结构。","English":"If the problem contains complicated numbers, try using simple numbers to understand the structure.","Keywords":"simple numbers, structure","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M570","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"反代法适合选项是具体数值的题。","English":"Remember, backsolving works well when the answer choices are specific numbers.","Keywords":"backsolving","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M571","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"代入法适合变量很多但关系简单的题。","English":"Remember, plugging in values works well when there are many variables but simple relationships.","Keywords":"plug in","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M572","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"画图可以帮助理解几何和函数题。","English":"Remember, drawing a diagram can help with geometry and function problems.","Keywords":"diagram","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M573","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"表格可以帮助整理 rate、ratio、word problem。","English":"Remember, a table can help organize rate, ratio, and word problems.","Keywords":"table, word problem","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M574","Subject":"MathV3","Unit":"Test Strategy, Calculator & Error Check","Level":1,"Chinese":"检查答案时先看符号。","English":"Remember, when checking an

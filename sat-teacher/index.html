unding","Level":2,"Chinese":"四舍五入题要看题目问的是答案精度，不是中间步骤精度。","English":"For rounding problems, check the required precision for the final answer, not just the intermediate steps.","Keywords":"rounding, final answer","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M091","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":2,"Chinese":"如果选项都是小数，估算可以先帮我们排除不合理答案。","English":"If all choices are decimals, estimation can help us eliminate unreasonable answers first.","Keywords":"estimation, decimals","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M092","Subject":"MathV3","Unit":"Operations, Fractions, Decimals & Rounding","Level":2,"Chinese":"用计算器时，也要先判断输入的是整个分数还是部分分数。","English":"Remember, when using a calculator, still check whether you are entering the whole fraction or only part of it.","Keywords":"calculator, fraction input","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M093","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"看到 linear equation，先确认最高次数是 1。","English":"In a linear equation, the highest power of the variable is 1.","Keywords":"linear equation, degree","Example":"2x + 3 = 9","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M094","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"解方程的目标是 isolate the variable。","English":"Remember: the goal of solving an equation is to isolate the variable.","Keywords":"isolate variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M095","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"等式两边做同样的操作，等式仍然成立。","English":"If we do the same operation on both sides, the equation remains true.","Keywords":"equation, balance","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M096","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"我们先合并同类项，再移项。","English":"Remember, combine like terms first, then move terms across the equation.","Keywords":"like terms, solve","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M097","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"有括号时，先分配再合并。","English":"Remember, when there are parentheses, distribute first and then combine like terms.","Keywords":"distribute, parentheses","Example":"3(x+2)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M098","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"移项时，符号会发生变化。","English":"Remember, when a term moves to the other side, its sign changes.","Keywords":"transpose, sign","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M099","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"如果变量在两边，先把变量项集中到同一边。","English":"If the variable appears on both sides, collect the variable terms on one side first.","Keywords":"variables both sides","Example":"3x + 2 = x + 8","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M100","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"如果系数是分数，可以先两边同乘公分母。","English":"If the coefficients are fractions, multiply both sides by the common denominator first.","Keywords":"fraction coefficients","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M101","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"解出来以后，代回原方程检查一遍。","English":"After solving, plug the value back into the original equation to check.","Keywords":"check solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M102","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"这里不要只看 x 的数值，还要看题目是否问 x 的表达式。","English":"Don't look only for the value of x; check whether the question asks for an expression involving x.","Keywords":"expression, target","Example":"Find 2x+3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M103","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"如果题目给的是等价方程，关注系数比例。","English":"If the problem gives equivalent equations, focus on the ratios of coefficients.","Keywords":"equivalent equation, ratio","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M104","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"方程中的 constant 是没有变量的项。","English":"Remember: the constant term is the term without a variable.","Keywords":"constant term","Example":"2x + 5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M105","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"看到 coefficient，先把它理解成“变量前面的数”。","English":"Think of coefficient as the number multiplying the variable.","Keywords":"coefficient","Example":"7x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M106","Subject":"MathV3","Unit":"Linear Equations","Level":1,"Chinese":"看到 solution，先把它理解成“让方程成立的值”。","English":"Think of solution as a value that makes the equation true.","Keywords":"solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M107","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"解线性方程时，每一步都应保持等价变形。","English":"Remember, when solving a linear equation, each step should be an equivalent transformation.","Keywords":"equivalent transformation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M108","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"如果最后得到矛盾式，说明无解。","English":"If we end with a contradiction, the equation has no solution.","Keywords":"no solution, contradiction","Example":"0 = 5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M109","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"如果最后得到恒等式，说明有无数个解。","English":"If we end with an identity, the equation has infinitely many solutions.","Keywords":"infinite solutions, identity","Example":"0 = 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M110","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"这里不要把化简错误当成解题方法问题，先检查符号和分配律。","English":"Don't treat a simplification error as a strategy problem; first check signs and distribution.","Keywords":"sign error, distribution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M111","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"选择题中可以把选项代回去，但要确认问的是哪个量。","English":"In multiple-choice questions, you can plug in the choices, but make sure you are checking the quantity being asked.","Keywords":"plug in, target","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M112","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"如果方程含参数，先找会让系数或常数满足条件的参数值。","English":"If the equation contains a parameter, first identify the parameter value that makes the coefficients or constants meet the condition.","Keywords":"parameter, coefficient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M113","Subject":"MathV3","Unit":"Linear Equations","Level":2,"Chinese":"有时候不用求 x，只要利用等式结构求目标表达式。","English":"Remember, sometimes we don't need to solve for x; we only need to use the structure of the equation to find the target expression.","Keywords":"structure, expression","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M114","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 slope，先想它表示的是y 对 x 的变化率。","English":"Remember, the slope represents the rate of change of y with respect to x.","Keywords":"slope, rate of change","Example":"m = Δy/Δx","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M115","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"slope 也可以叫 gradient 或 average rate。","English":"Remember, slope can also be called gradient or average rate.","Keywords":"slope, gradient, average rate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M116","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"我们先找两个点，再用rise over run 求斜率。","English":"Let's find two points first, then use rise over run to find the slope.","Keywords":"rise over run","Example":"(y2-y1)/(x2-x1)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M117","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"horizontal line 的斜率是 0。","English":"Remember, a horizontal line has a slope of zero.","Keywords":"horizontal line, slope","Example":"y = b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M118","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"vertical line 的斜率 undefined。","English":"For linear functions, explain what the slope and intercept mean in the context.","Keywords":"vertical line, undefined slope","Example":"x = a","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M119","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 slope-intercept form，先把它理解成“y = mx + b”。","English":"Remember: the slope-intercept form is y = mx + b.","Keywords":"slope-intercept form","Example":"y = mx + b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M120","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 m，先把它理解成“slope，b 是 y-intercept”。","English":"Remember, m is the slope, and b is the y-intercept.","Keywords":"m, b, y-intercept","Example":"y = mx + b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M121","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 y-intercept，先把它理解成“图像与 y 轴的交点”。","English":"Remember: the y-intercept is where the graph crosses the y-axis.","Keywords":"y-intercept","Example":"(0, b)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M122","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 x-intercept，先把它理解成“图像与 x 轴的交点”。","English":"Remember: the x-intercept is where the graph crosses the x-axis.","Keywords":"x-intercept","Example":"(a, 0)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M123","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"parallel lines 有相同的斜率。","English":"For linear functions, explain what the slope and intercept mean in the context.","Keywords":"parallel, slope","Example":"m1 = m2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M124","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"perpendicular lines 的斜率乘积是 -1。","English":"Remember, perpendicular lines have slopes whose product is -1.","Keywords":"perpendicular, slope","Example":"m1m2 = -1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M125","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"point-slope form 适合已知一点和斜率的题。","English":"Remember, point-slope form is useful when a point and a slope are given.","Keywords":"point-slope form","Example":"y - y1 = m(x - x1)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M126","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"standard form 也可以转成斜截式。","English":"Remember, standard form can also be converted into slope-intercept form.","Keywords":"standard form, slope-intercept","Example":"Ax + By + C = 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M127","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"函数图像中，往右走 x 增加；往上走 y 增加。","English":"Remember, on a graph, moving right means x increases, and moving up means y increases.","Keywords":"graph, coordinate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M128","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 positive slope，先想它表示的是x 增加时 y 增加。","English":"Remember, a positive slope means that y increases as x increases.","Keywords":"positive slope","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M129","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 negative slope，先想它表示的是x 增加时 y 减少。","English":"Remember, a negative slope means that y decreases as x increases.","Keywords":"negative slope","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M130","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":1,"Chinese":"看到 zero slope，先想它表示的是y 不随 x 变化。","English":"Remember, a zero slope means y does not change as x changes.","Keywords":"zero slope","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M131","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"解释斜率时，一定要带上单位：每增加 1 个 x，y 改变多少。","English":"Remember, when interpreting slope, include the units: for every 1-unit increase in x, how much y changes.","Keywords":"interpret slope, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M132","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"解释截距时，要说清楚 x = 0 的现实含义。","English":"Remember, when interpreting an intercept, state what x = 0 means in the real-world context.","Keywords":"interpret intercept, context","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M133","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"这里不要把 y-intercept 解释成初始值，除非 x = 0 在语境中有意义。","English":"Don't call the y-intercept the initial value unless x = 0 makes sense in the context.","Keywords":"initial value, intercept","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M134","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"平均变化率和斜率本质上是同一个计算。","English":"Remember, average rate of change and slope are essentially the same calculation.","Keywords":"average rate, slope","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M135","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"看到 constant rate of change，先想到线性函数。","English":"When you see a constant rate of change, think of a linear function first.","Keywords":"constant rate, linear","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M136","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"如果表格中相同的 x 增量对应相同的 y 增量，就是线性关系。","English":"If equal changes in x produce equal changes in y in a table, the relationship is linear.","Keywords":"table, linear","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M137","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"若题目问哪一个方程表示图像，先找斜率，再找截距。","English":"If the problem asks which equation represents the graph, find the slope first and then the intercept.","Keywords":"equation from graph","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M138","Subject":"MathV3","Unit":"Linear Functions, Slope & Intercepts","Level":2,"Chinese":"如果直线垂直于 x 轴，它不是 y = something，而是 x = constant。","English":"If a line is perpendicular to the x-axis, it is not y equals something; it is x equals a constant.","Keywords":"vertical line","Example":"x = a","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M139","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"线性模型中的 slope 描述变化速度。","English":"In a linear model, the slope describes the rate of change.","Keywords":"linear model, slope","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M140","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"线性模型中的 intercept 描述起始值或基准值。","English":"In a linear model, the intercept describes the starting value or baseline value.","Keywords":"linear model, intercept","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M141","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"我们先确定自变量和因变量。","English":"Remember, first, identify the independent variable and the dependent variable.","Keywords":"independent variable, dependent variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M142","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"看到 independent variable，通常在 x 轴或题干的输入量中。","English":"Remember, the independent variable is usually on the x-axis or is the input quantity in the problem.","Keywords":"independent variable, x-axis","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M143","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"看到 dependent variable，先把它理解成“随着自变量变化的量”。","English":"Remember: the dependent variable is the quantity that changes in response to the independent variable.","Keywords":"dependent variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M144","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"coefficient 的实际含义要和变量单位绑定。","English":"Remember, the real-world meaning of a coefficient must be connected to the unit of the variable.","Keywords":"coefficient, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M145","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"看到 constant term，通常是固定费用、初始量或基础值。","English":"Remember: the constant term is often a fixed cost, initial amount, or baseline value.","Keywords":"constant term, initial value","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M146","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"如果变量表示时间，斜率常表示每单位时间的变化量。","English":"If the variable represents time, the slope often represents the change per unit of time.","Keywords":"time, rate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M147","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"如果变量表示数量，斜率常表示每件、每人或每单位的量。","English":"If the variable represents a quantity, the slope often represents the amount per item, per person, or per unit.","Keywords":"per unit","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M148","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"看到 increase by，先想它表示的是加固定量，increase to 表示达到某个总量。","English":"Remember, 'Increase by' means add a fixed amount, while 'increase to' means reach a total amount.","Keywords":"increase by, increase to","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M149","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":1,"Chinese":"看到 decrease by，先想它表示的是减少多少，decrease to 表示减少到多少。","English":"Remember, 'Decrease by' means reduce by an amount, while 'decrease to' means reduce to a final amount.","Keywords":"decrease by, decrease to","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M150","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"解释题不要只说 m 是斜率，要说 m 在这个语境中代表什么。","English":"For interpretation questions, don't just say m is the slope; say what m represents in this context.","Keywords":"interpretation, context","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M151","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"如果选项里有单位错配，哪怕数值对也要排除。","English":"If a choice has mismatched units, eliminate it even if the number looks right.","Keywords":"unit mismatch","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M152","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"模型题里，数字的意义比公式本身更重要。","English":"In modeling questions, the meaning of the numbers is more important than the formula itself.","Keywords":"model meaning","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M153","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"如果题目给实际背景，答案也要回到实际背景，而不是只停在代数。","English":"If the problem gives a real-world context, the answer must return to that context instead of staying only in algebra.","Keywords":"context, interpretation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M154","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"线性模型不能自动用于所有范围，要注意题目给出的 domain。","English":"Remember, a linear model does not automatically apply to all values; pay attention to the domain given in the problem.","Keywords":"domain, model","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M155","Subject":"MathV3","Unit":"Interpreting Linear Models & Coefficients","Level":2,"Chinese":"现实问题中的 intercept 有时只是数学延伸，不一定实际存在。","English":"In real-world problems, the intercept may be a mathematical extension and may not actually exist in the situation.","Keywords":"intercept, real-world","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M156","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"看到 system of equations，先想它表示的是多个方程同时成立。","English":"Remember, a system of equations means that multiple equations must be true at the same time.","Keywords":"system, simultaneous","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M157","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"方程组的解是两条线的交点。","English":"Remember, the solution to a system of linear equations is the intersection point of the two lines.","Keywords":"solution, intersection","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M158","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"一个交点表示 unique solution。","English":"A system is not only about solving. It can also ask whether the lines intersect, are parallel, or overlap.","Keywords":"unique solution","Example":"m1 ≠ m2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M159","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"平行且不同线表示 no solution。","English":"A system is not only about solving. It can also ask whether the lines intersect, are parallel, or overlap.","Keywords":"no solution, parallel","Example":"m1 = m2, b1 ≠ b2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M160","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"两条线重合表示 infinitely many solutions。","English":"A system is not only about solving. It can also ask whether the lines intersect, are parallel, or overlap.","Keywords":"infinitely many solutions","Example":"m1 = m2, b1 = b2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M161","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"代入法适合一个方程已经解出一个变量的情况。","English":"Remember, substitution works well when one equation is already solved for one variable.","Keywords":"substitution","Example":"y = 2x + 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M162","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"消元法适合两个方程同一变量系数容易相消的情况。","English":"Remember, elimination works well when the coefficients of one variable can be easily canceled.","Keywords":"elimination","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M163","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"图像法的核心是判断交点数量。","English":"Remember: the key idea of the graphical method is to determine the number of intersections.","Keywords":"graphical method","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M164","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"如果题目只问解的个数，不必把解算出来。","English":"If the problem asks only for the number of solutions, we don't need to calculate the actual solution.","Keywords":"number of solutions","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M165","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"如果两条线斜率不同，一定有唯一解。","English":"If two lines have different slopes, the system must have a unique solution.","Keywords":"different slopes, unique","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M166","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"如果斜率相同，再比较截距。","English":"If the slopes are the same, compare the intercepts next.","Keywords":"same slope, intercept","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M167","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"如果比例关系完全一样，两个方程代表同一条线。","English":"If all corresponding coefficients are proportional, the two equations represent the same line.","Keywords":"proportional coefficients","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M168","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":1,"Chinese":"如果只有 x 和 y 的系数成比例，但常数不成比例，是无解。","English":"If only the x- and y-coefficients are proportional but the constants are not, there is no solution.","Keywords":"proportional, no solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M169","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"这里不要把解方程组的计算题和判断解个数的结构题混在一起。","English":"Don't confuse a computational system problem with a structural problem about the number of solutions.","Keywords":"structure vs computation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M170","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"一般式下判断解的个数，可以比较 A、B、C 的比例。","English":"In standard form, compare the ratios of A, B, and C to determine the number of solutions.","Keywords":"standard form, ratios","Example":"Ax + By = C","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M171","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"看到参数题，通常让我们让两条线平行或重合。","English":"Remember, parameter problems usually ask us to make the two lines parallel or identical.","Keywords":"parameter, parallel, identical","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M172","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"如果题目问 k 的值让系统无解，就让斜率相同但截距不同。","English":"If the question asks for k that makes the system have no solution, make the slopes the same but the intercepts different.","Keywords":"parameter, no solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M173","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"如果题目问 k 的值让系统有无数解，就让整条方程成比例。","English":"If the question asks for k that gives infinitely many solutions, make the entire equations proportional.","Keywords":"parameter, infinite solutions","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M174","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"文字题中的方程组要先定义变量，不能直接套数字。","English":"For word problems involving systems, define the variables before plugging in numbers.","Keywords":"word problem, system","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M175","Subject":"MathV3","Unit":"Systems of Linear Equations","Level":2,"Chinese":"看到方程组答案，通常是一个有序数对，不是两个孤立数字。","English":"Remember: the solution to a system is usually an ordered pair, not two isolated numbers.","Keywords":"ordered pair","Example":"(x, y)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M176","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 inequality，先把它理解成“不等式”。","English":"Think of inequality as a statement comparing two expressions.","Keywords":"inequality","Example":"x > 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M177","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 greater than，先想它表示的是大于。","English":"For inequalities and absolute value, check the boundary, direction, and distance meaning.","Keywords":"greater than","Example":">","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M178","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 less than，先想它表示的是小于。","English":"For inequalities and absolute value, check the boundary, direction, and distance meaning.","Keywords":"less than","Example":"<","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M179","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 greater than or equal to，先想它表示的是大于等于。","English":"Remember, 'Greater than or equal to' means at least that value.","Keywords":"greater than or equal to","Example":"≥","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M180","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 less than or equal to，先想它表示的是小于等于。","English":"Remember, 'Less than or equal to' means at most that value.","Keywords":"less than or equal to","Example":"≤","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M181","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"不等式两边乘或除以负数时，不等号要反向。","English":"Remember, when multiplying or dividing both sides of an inequality by a negative number, reverse the inequality sign.","Keywords":"negative multiplier, reverse sign","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M182","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"解不等式和解方程类似，但要特别注意方向。","English":"Remember, solving an inequality is similar to solving an equation, but pay special attention to the direction of the sign.","Keywords":"solve inequality","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M183","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"开圆点表示不包含端点。","English":"Think of open circle means the endpoint as not included.","Keywords":"open circle","Example":"x > 2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M184","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"实心圆点表示包含端点。","English":"Think of closed circle means the endpoint as included.","Keywords":"closed circle","Example":"x ≥ 2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M185","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"线性不等式图像先画边界线。","English":"For a linear inequality, draw the boundary line first.","Keywords":"linear inequality, boundary line","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M186","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"严格不等号用虚线边界。","English":"Let's use a dashed boundary line for strict inequalities.","Keywords":"dashed line","Example":"< or >","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M187","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"含等号的不等号用实线边界。","English":"Let's use a solid boundary line for inequalities that include equality.","Keywords":"solid line","Example":"≤ or ≥","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M188","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 y 大于时，通常涂线上方。","English":"For y greater than, usually shade above the line.","Keywords":"shade above","Example":"y > mx+b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M189","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 y 小于时，通常涂线下方。","English":"For y less than, usually shade below the line.","Keywords":"shade below","Example":"y < mx+b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M190","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到 absolute value，先想它表示的是数轴上的距离。","English":"Remember, absolute value represents distance on the number line.","Keywords":"absolute value, distance","Example":"|x - a|","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M191","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"|x-a| 表示 x 到 a 的距离。","English":"Remember, |x-a| represents the distance between x and a.","Keywords":"absolute value, distance","Example":"|x-3|","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M192","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"看到绝对值方程，通常要分成正负两种情况。","English":"Remember, an absolute value equation usually splits into two cases: positive and negative.","Keywords":"absolute value equation, cases","Example":"|x-3|=5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M193","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"绝对值小于某数表示在区间内部。","English":"Remember, an absolute value less than a number represents values inside an interval.","Keywords":"absolute value inequality, inside","Example":"|x| < 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M194","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":1,"Chinese":"绝对值大于某数表示在区间外部。","English":"Remember, an absolute value greater than a number represents values outside an interval.","Keywords":"absolute value inequality, outside","Example":"|x| > 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M195","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"如果不等式已经变成 y 的形式，涂色方向更容易判断。","English":"If the inequality is already solved for y, the shading direction is easier to determine.","Keywords":"shade, y form","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M196","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"测试点法可以检查到底涂哪一边。","English":"Remember, the test-point method can verify which side to shade.","Keywords":"test point","Example":"(0,0)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M197","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"绝对值题不要只机械拆式子，要先理解距离含义。","English":"For absolute value problems, don't split the equation mechanically; first understand the distance meaning.","Keywords":"distance meaning","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M198","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"如果绝对值等于负数，直接无解。","English":"If an absolute value equals a negative number, there is no solution.","Keywords":"absolute value, no solution","Example":"|x| = -2","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M199","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"看到如果题目问解集，答案，通常是区间或数轴区域，而不是一个数。","English":"If the problem asks for the solution set, the answer is usually an interval or region on a number line, not a single number.","Keywords":"solution set, interval","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M200","Subject":"MathV3","Unit":"Inequalities & Absolute Value","Level":2,"Chinese":"线性规划题的难点是同时满足多个不等式。","English":"Remember: the challenge in linear programming is satisfying several inequalities at the same time.","Keywords":"linear programming, feasible region","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M201","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"文字题第一步先定义变量：谁是 x，谁是 y，要说清楚。","English":"For a word problem, define the variables first: what is x, and what is y?","Keywords":"define variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M202","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"变量定义要带单位。","English":"Remember: the variable definition should include units.","Keywords":"variable, units","Example":"Let x be the number of hours.","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M203","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"读长文字题时，先圈数字和单位。","English":"Remember, when reading a long word problem, first circle the numbers and units.","Keywords":"long word problem, units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M204","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"再圈关系词，比如 total、per、for every、difference。","English":"Remember, then circle relationship words such as total, per, for every, and difference.","Keywords":"relationship words","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M205","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"看到总量题，通常可以用单价乘数量。","English":"Remember, total amount problems often use unit price times quantity.","Keywords":"total, unit price","Example":"total cost = price × quantity","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M206","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"平均速度题用距离除以时间。","English":"For average speed, use distance divided by time.","Keywords":"average speed","Example":"rate = distance/time","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M207","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"work rate 题先确定每单位时间完成多少。","English":"For work-rate problems, determine how much is completed per unit of time.","Keywords":"work rate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M208","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"比例题先写出两个比，再交叉相乘。","English":"For proportion problems, write the two ratios first and then cross multiply.","Keywords":"proportion, cross multiply","Example":"a/b = c/d","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M209","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"百分数题先把 percent 变成小数。","English":"In percent problems, convert the percent to a decimal first.","Keywords":"percent, decimal","Example":"15% = 0.15","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M210","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"增长题要区分增加了多少和变成了多少。","English":"For increase problems, distinguish between how much it increased by and what it became.","Keywords":"increase, final value","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M211","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"减少题要区分减少量和剩余量。","English":"For decrease problems, distinguish between the amount decreased and the remaining amount.","Keywords":"decrease, remaining","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M212","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"题目问哪个量，就把哪个量作为最终答案。","English":"Remember, the final answer must match the quantity the question asks for.","Keywords":"target quantity","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M213","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"如果答案有单位，最后不要漏单位。","English":"If the answer has a unit, don't leave out the unit at the end.","Keywords":"units","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M214","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":1,"Chinese":"看到如果变量代表人数或物品数，，通常应该是非负整数。","English":"If a variable represents people or objects, it is usually a nonnegative integer.","Keywords":"integer restriction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M215","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"文字题最容易错在变量定义和实际问题不一致。","English":"Remember, the most common error in word problems is defining a variable in a way that does not match the real situation.","Keywords":"variable definition, context","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M216","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"有时候题目给的数字不是都要用，先判断每个数字的作用。","English":"Remember, sometimes not every number given is needed; first determine the role of each number.","Keywords":"irrelevant numbers","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M217","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"如果一道题能用表格整理，就不要只靠脑子记信息。","English":"If a problem can be organized in a table, don't keep all the information only in your head.","Keywords":"table, organize","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M218","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"单位换算题要让单位在分数中相互抵消。","English":"In unit conversion problems, write the conversion as fractions so that units cancel out.","Keywords":"unit cancellation","Example":"feet × inches/foot","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M219","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"应用题的最后一步是 interpret the solution。","English":"Remember: the last step in an application problem is to interpret the solution.","Keywords":"interpret solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M220","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"如果结果不符合现实语境，要重新检查模型。","English":"If the result does not make sense in the real-world context, check the model again.","Keywords":"model check","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M221","Subject":"MathV3","Unit":"Word Problems & Modeling","Level":2,"Chinese":"同一个背景可以列方程、不等式或函数，关键看题目问什么。","English":"Remember, the same context may lead to an equation, inequality, or function; the key is what the question asks.","Keywords":"equation, inequality, function","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M222","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 quadratic function，先确认最高次数是 2。","English":"For quadratics, check the opening, vertex, axis of symmetry, and zeros.","Keywords":"quadratic function, degree","Example":"y = ax² + bx + c","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M223","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 standard form，先把它理解成“y = ax² + bx + c”。","English":"Remember: the standard form is y equals ax squared plus bx plus c.","Keywords":"standard form","Example":"y = ax² + bx + c","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M224","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 vertex form，先把它理解成“y = a(x-h)² + k”。","English":"Remember: the vertex form is y equals a times x minus h squared plus k.","Keywords":"vertex form","Example":"y = a(x-h)² + k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M225","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 factored form，先把它理解成“y = a(x-r1)(x-r2)”。","English":"Remember, the factored form is y equals a times x minus r one times x minus r two.","Keywords":"factored form","Example":"y = a(x-r1)(x-r2)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M226","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"a 大于 0，抛物线开口向上。","English":"If a is positive, the parabola opens upward.","Keywords":"a positive, opens upward","Example":"a > 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M227","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"a 小于 0，抛物线开口向下。","English":"If a is negative, the parabola opens downward.","Keywords":"a negative, opens downward","Example":"a < 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M228","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"开口向上有 minimum value。","English":"Remember, a parabola opening upward has a minimum value.","Keywords":"minimum, opens upward","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M229","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"开口向下有 maximum value。","English":"Remember, a parabola opening downward has a maximum value.","Keywords":"maximum, opens downward","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M230","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 vertex，先把它理解成“抛物线的最高点或最低点”。","English":"Remember: the vertex is the highest or lowest point of the parabola.","Keywords":"vertex","Example":"(h, k)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M231","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"axis of symmetry 通过 vertex。","English":"Remember, the axis of symmetry passes through the vertex.","Keywords":"axis of symmetry, vertex","Example":"x = h","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M232","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 x-intercepts，先把它理解成“函数值等于 0 的点”。","English":"Remember: the x-intercepts are the points where the function value is zero.","Keywords":"x-intercept, zeros","Example":"f(x)=0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M233","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"zero、root、solution 在二次方程中经常指同一件事。","English":"In quadratic equations, zero, root, and solution often refer to the same idea.","Keywords":"zero, root, solution","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M234","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"factorization 适合可以直接因式分解的题。","English":"Remember, factorization works well when the quadratic can be factored directly.","Keywords":"factorization","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M235","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"completing the square 可以把标准式转成顶点式。","English":"Remember, completing the square can convert standard form into vertex form.","Keywords":"completing the square, vertex form","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M236","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"quadratic formula 可以处理所有二次方程。","English":"Remember, the quadratic formula can solve any quadratic equation.","Keywords":"quadratic formula","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M237","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"看到 discriminant，先把它理解成“b² - 4ac”。","English":"Remember: the discriminant is b squared minus four ac.","Keywords":"discriminant","Example":"b² - 4ac","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M238","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"判别式大于 0，有两个不同实根。","English":"If the discriminant is greater than zero, there are two distinct real solutions.","Keywords":"discriminant, two real roots","Example":"D > 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M239","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"判别式等于 0，有一个重复实根。","English":"If the discriminant equals zero, there is one repeated real solution.","Keywords":"discriminant, repeated root","Example":"D = 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M240","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"判别式小于 0，没有实数解。","English":"If the discriminant is less than zero, there is no real solution.","Keywords":"discriminant, no real solution","Example":"D < 0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M241","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":1,"Chinese":"Vieta's theorem 可以直接联系根与系数。","English":"Remember, vieta's theorem connects the roots directly to the coefficients.","Keywords":"Vieta, roots, coefficients","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M242","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"选择哪种形式取决于题目给出的信息。","English":"Remember, which form we use depends on the information given in the problem.","Keywords":"form choice","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M243","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"如果题目给 vertex，优先考虑 vertex form。","English":"If the problem gives the vertex, consider vertex form first.","Keywords":"vertex form, given vertex","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M244","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"如果题目给 roots 或 x-intercepts，优先考虑 factored form。","English":"If the problem gives roots or x-intercepts, consider factored form first.","Keywords":"factored form, roots","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M245","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"如果题目给 y-intercept 或一般表达式，standard form 更方便。","English":"If the problem gives a y-intercept or a general expression, standard form may be more convenient.","Keywords":"standard form, y-intercept","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M246","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"a 的绝对值越大，抛物线越窄。","English":"Remember, the larger the absolute value of a, the narrower the parabola.","Keywords":"a value, width","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M247","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"两个 x-intercepts 的中点给出对称轴。","English":"Remember, the midpoint of the two x-intercepts gives the axis of symmetry.","Keywords":"x-intercepts, axis","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M248","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"如果题目问最大或最小值，先找 vertex 的 y 坐标。","English":"If the problem asks for a maximum or minimum value, find the y-coordinate of the vertex first.","Keywords":"max, min, vertex","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M249","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"参数题中，常通过判别式控制解的个数。","English":"In parameter problems, the discriminant often controls the number of solutions.","Keywords":"parameter, discriminant","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M250","Subject":"MathV3","Unit":"Quadratic Equations & Functions","Level":2,"Chinese":"二次函数图像题不要只看开口，还要看截距和顶点。","English":"For quadratic graph problems, don't look only at the opening direction; also check intercepts and the vertex.","Keywords":"graph, vertex, intercepts","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M251","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 exponent，先想它表示的是乘方次数。","English":"Think of exponent tells us how many times the base as used as a factor.","Keywords":"exponent, base","Example":"3²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M252","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 base，先把它理解成“被反复相乘的底数”。","English":"Remember: the base is the number being repeatedly multiplied.","Keywords":"base","Example":"3 in 3²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M253","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"a 的 0 次方等于 1，前提是 a 不等于 0。","English":"Remember, a to the zero power equals 1, as long as a is not zero.","Keywords":"zero exponent","Example":"a⁰ = 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M254","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"负指数表示倒数。","English":"Exponential growth is about a constant ratio, not a constant amount.","Keywords":"negative exponent","Example":"a⁻¹ = 1/a","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M255","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"同底数相乘，指数相加。","English":"Remember, when multiplying powers with the same base, add the exponents.","Keywords":"product of powers","Example":"a^x · a^y = a^(x+y)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M256","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"同底数相除，指数相减。","English":"Remember, when dividing powers with the same base, subtract the exponents.","Keywords":"quotient of powers","Example":"a^x/a^y = a^(x-y)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M257","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"幂的幂，指数相乘。","English":"Remember, when raising a power to a power, multiply the exponents.","Keywords":"power of a power","Example":"(a^x)^y = a^(xy)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M258","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 radical，先把它理解成“根式”。","English":"Think of radical as an expression involving a root.","Keywords":"radical, root","Example":"√x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M259","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 square root，先想它表示的是平方根。","English":"Think of square root as a number that squares to the original number.","Keywords":"square root","Example":"√9 = 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M260","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 cube root，先想它表示的是立方根。","English":"Think of cube root as a number that cubes to the original number.","Keywords":"cube root","Example":"∛27 = 3","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M261","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"根号可以改写成分数指数。","English":"Remember, a radical can be rewritten as a fractional exponent.","Keywords":"radical, fractional exponent","Example":"√x = x^(1/2)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M262","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"偶次根下的表达式在实数范围内不能为负。","English":"Remember, under an even root, the expression cannot be negative in the real-number system.","Keywords":"domain, even root","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M263","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到指数函数，通常写成 y = ab^x。","English":"Think of exponential function as often written as y equals a times b to the x.","Keywords":"exponential function","Example":"y = ab^x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M264","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 a，先把它理解成“初始值或 y-intercept”。","English":"Remember, a is the initial value or the y-intercept.","Keywords":"initial value, y-intercept","Example":"y = ab^x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M265","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"看到 b，先把它理解成“growth or decay factor”。","English":"Exponential growth is about a constant ratio, not a constant amount.","Keywords":"growth factor, decay factor","Example":"y = ab^x","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M266","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"b 大于 1 是 exponential growth。","English":"If b is greater than 1, it is exponential growth.","Keywords":"exponential growth","Example":"b > 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M267","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"0 到 1 之间的 b 是 exponential decay。","English":"If b is between 0 and 1, it is exponential decay.","Keywords":"exponential decay","Example":"0 < b < 1","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M268","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"增长率 r 对应增长因子 1+r。","English":"Remember, a growth rate r corresponds to a growth factor of 1 plus r.","Keywords":"growth rate, growth factor","Example":"1 + r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M269","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"减少率 r 对应衰减因子 1-r。","English":"Remember, a decay rate r corresponds to a decay factor of 1 minus r.","Keywords":"decay rate, decay factor","Example":"1 - r","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M270","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"linear growth 每次加相同数量。","English":"Remember, linear growth adds the same amount each time.","Keywords":"linear growth","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M271","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":1,"Chinese":"exponential growth 每次乘相同比例。","English":"Remember, exponential growth multiplies by the same factor each time.","Keywords":"exponential growth, common ratio","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M272","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":2,"Chinese":"指数题先统一底数，再比较指数。","English":"For exponent problems, first rewrite with the same base, then compare exponents.","Keywords":"same base","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M273","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":2,"Chinese":"指数增长题要确认变化次数，不一定等于总时间。","English":"In exponential growth problems, check the number of growth periods; it is not always the same as the total time.","Keywords":"time interval, growth periods","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M274","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":2,"Chinese":"看到如果增长周期是 c，指数，通常是 t/c。","English":"If the growth interval is c, the exponent is usually t divided by c.","Keywords":"time interval","Example":"a(1+r)^(t/c)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M275","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":2,"Chinese":"区分 initial value、growth rate 和 final value。","English":"Remember, distinguish among initial value, growth rate, and final value.","Keywords":"initial value, rate, final value","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M276","Subject":"MathV3","Unit":"Radicals, Exponents & Exponential Functions","Level":2,"Chinese":"表格中如果 y 值每次加同一个数，是线性；每次乘同一个数，是指数。","English":"In a table, if y adds the same amount each time, it is linear; if it multiplies by the same factor, it is exponential.","Keywords":"table, linear vs exponential","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M277","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 polynomial，先把它理解成“多项式”。","English":"Think of polynomial as an expression made of terms with nonnegative integer powers of the variable.","Keywords":"polynomial","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M278","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 degree，先把它理解成“最高次幂”。","English":"Remember: the degree is the highest power of the variable.","Keywords":"degree","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M279","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 leading coefficient，先把它理解成“最高次项的系数”。","English":"Remember: the leading coefficient is the coefficient of the highest-degree term.","Keywords":"leading coefficient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M280","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 zero of a function，先把它理解成“让函数值等于 0 的 x 值”。","English":"Think of zero of a function as an x-value that makes the function equal zero.","Keywords":"zero, function","Example":"f(c)=0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M281","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"如果 c 是 zero，那么 x-c 是因式。","English":"If c is a zero, then x minus c is a factor.","Keywords":"zero, factor","Example":"x-c","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M282","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"如果 x-c 是因式，那么图像在 x=c 处与 x 轴相交或相切。","English":"If x minus c is a factor, the graph meets the x-axis at x equals c.","Keywords":"factor, graph","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M283","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"root、solution、zero 在这里可以相互联系。","English":"Remember, root, solution, and zero are connected in this context.","Keywords":"root, solution, zero","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M284","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"remainder theorem 可以不用长除法求余数。","English":"Remember, the remainder theorem lets us find a remainder without long division.","Keywords":"remainder theorem","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M285","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"P(x) 除以 x-c 的余数是 P(c)。","English":"Remember, when P of x is divided by x minus c, the remainder is P of c.","Keywords":"remainder theorem","Example":"remainder = P(c)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M286","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"如果余数是 0，那么除式是因式。","English":"If the remainder is zero, the divisor is a factor.","Keywords":"factor theorem, remainder","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M287","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 rational function，先把它理解成“分式形式的函数”。","English":"Think of rational function as a function written as a ratio of polynomials.","Keywords":"rational function","Example":"P(x)/Q(x)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M288","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"有理函数的分母不能为零。","English":"Remember, the denominator of a rational function cannot be zero.","Keywords":"domain, denominator","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M289","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"y-intercept 让 x = 0。","English":"Remember, to find the y-intercept, set x equal to zero.","Keywords":"y-intercept","Example":"f(0)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M290","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"x-intercept 让 y 或 f(x) 等于 0。","English":"Remember, to find an x-intercept, set y or f of x equal to zero.","Keywords":"x-intercept","Example":"f(x)=0","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M291","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"end behavior 由最高次项控制。","English":"Remember: the end behavior is controlled by the leading term.","Keywords":"end behavior, leading term","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M292","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到最高次系数为正，右端，通常向上。","English":"If the leading coefficient is positive, the right end usually goes up.","Keywords":"leading coefficient, right end","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M293","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到最高次系数为负，右端，通常向下。","English":"If the leading coefficient is negative, the right end usually goes down.","Keywords":"leading coefficient, right end","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M294","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到 repeated zero，先想它表示的是重复零点。","English":"Think of repeated zero as a zero with multiplicity greater than one.","Keywords":"repeated zero, multiplicity","Example":"(x-a)^k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M295","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到奇数重数，通常穿过 x 轴。","English":"For polynomials and rational functions, track factors, zeros, remainders, and graph features.","Keywords":"odd multiplicity","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M296","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":1,"Chinese":"看到偶数重数，通常碰到 x 轴后反弹。","English":"Remember, an even multiplicity usually touches the x-axis and turns around.","Keywords":"even multiplicity","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M297","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":2,"Chinese":"长除法不是首选，除非题目确实要商。","English":"Remember, long division is not the first choice unless the problem actually requires the quotient.","Keywords":"long division, quotient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M298","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":2,"Chinese":"如果只问余数或某个系数，优先考虑余数定理。","English":"If the question only asks for a remainder or a coefficient, consider the remainder theorem first.","Keywords":"remainder theorem, coefficient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M299","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":2,"Chinese":"图像和表达式对应时，从 leading coefficient、intercepts、repeated zeros 四个角度检查。","English":"Remember, when matching a graph with an expression, check the leading coefficient, intercepts, and repeated zeros.","Keywords":"graph matching","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M300","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":2,"Chinese":"如果选项只有符号不同，先看 end behavior 和截距。","English":"If the choices differ only by signs, check end behavior and intercepts first.","Keywords":"sign, end behavior","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M301","Subject":"MathV3","Unit":"Polynomials, Rational Functions & Remainder Theorem","Level":2,"Chinese":"分式函数题先排除让分母为 0 的值。","English":"For rational function problems, first exclude values that make the denominator zero.","Keywords":"domain, rational function","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M302","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 f(x)，先想它表示的是当输入为 x 时函数的输出。","English":"Remember, f of x means the output of the function when the input is x.","Keywords":"function notation, input, output","Example":"f(3)=9","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M303","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"括号里的数是 input。","English":"Remember: the number inside the parentheses is the input.","Keywords":"input","Example":"f(2)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M304","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"函数值是 output。","English":"Remember: the function value is the output.","Keywords":"output","Example":"f(2)=5","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M305","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"如果给 ordered pair，前面是 input，后面是 output。","English":"If an ordered pair is given, the first coordinate is the input and the second is the output.","Keywords":"ordered pair, input, output","Example":"(3,9)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M306","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"f(3)=9 表示当 x=3 时，y=9。","English":"Remember, f of 3 equals 9 means that when x is 3, y is 9.","Keywords":"function notation","Example":"f(3)=9","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M307","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 domain，先把它理解成“所有允许的输入”。","English":"Remember: the domain is the set of all allowed inputs.","Keywords":"domain","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M308","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 range，先把它理解成“所有可能的输出”。","English":"Remember: the range is the set of all possible outputs.","Keywords":"range","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M309","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 composition，先想它表示的是把一个函数的输出作为另一个函数的输入。","English":"Remember, composition means using the output of one function as the input of another function.","Keywords":"composition","Example":"f(g(x))","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M310","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"piecewise function 要先判断 x 落在哪个区间。","English":"For a piecewise function, first determine which interval x belongs to.","Keywords":"piecewise, interval","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M311","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"vertical shift 改变函数值。","English":"For functions, identify the input, output, and direction of the transformation.","Keywords":"vertical shift","Example":"f(x)+k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M312","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"horizontal shift 改变输入位置。","English":"For functions, identify the input, output, and direction of the transformation.","Keywords":"horizontal shift","Example":"f(x-h)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M313","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"f(x)+k 表示向上平移 k。","English":"Remember, f of x plus k means shifting the graph up by k units.","Keywords":"vertical shift up","Example":"f(x)+k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M314","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 f(x)-k，先想它表示的是向下平移 k。","English":"Remember, f of x minus k means shifting the graph down by k units.","Keywords":"vertical shift down","Example":"f(x)-k","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M315","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 f(x-h)，先想它表示的是向右平移 h。","English":"Remember, f of x minus h means shifting the graph right by h units.","Keywords":"horizontal shift right","Example":"f(x-h)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M316","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"f(x+h) 表示向左平移 h。","English":"Remember, f of x plus h means shifting the graph left by h units.","Keywords":"horizontal shift left","Example":"f(x+h)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M317","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"-f(x) 表示关于 x 轴对称。","English":"Remember, negative f of x means reflecting the graph across the x-axis.","Keywords":"reflection, x-axis","Example":"-f(x)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M318","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":1,"Chinese":"看到 f(-x)，先想它表示的是关于 y 轴对称。","English":"Remember, f of negative x means reflecting the graph across the y-axis.","Keywords":"reflection, y-axis","Example":"f(-x)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M319","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"水平平移最容易方向看反，因为变化发生在输入内部。","English":"Remember, horizontal shifts are the easiest to reverse because the change occurs inside the input.","Keywords":"horizontal shift, direction","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M320","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"我们先判断变化在函数外还是函数内。","English":"Remember, first determine whether the change is outside or inside the function.","Keywords":"transformation, inside, outside","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M321","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"函数外的加减影响 y，函数内的加减影响 x。","English":"Remember, addition or subtraction outside the function affects y; inside the function, it affects x.","Keywords":"outside, inside, x, y","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M322","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"如果题目给图像移动，先写出移动方向，再写函数表达式。","English":"If the problem gives a graph transformation, write the direction first, then write the function expression.","Keywords":"graph transformation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M323","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"函数记号题不要把 f(x) 当成 f 乘 x。","English":"In function notation, don't read f of x as f times x.","Keywords":"function notation, misconception","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M324","Subject":"MathV3","Unit":"Function Notation & Transformations","Level":2,"Chinese":"复合函数要从里面往外算。","English":"For composition, evaluate from the inside out.","Keywords":"composition, order","Example":"f(g(2))","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M325","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"看到 isolating quantities，先想它表示的是把目标量单独留在一边。","English":"Remember, isolating quantities means leaving the target quantity alone on one side.","Keywords":"isolate quantity","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M326","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"我们先确认题目要 isolate 哪个变量。","English":"Remember, first confirm which variable the problem asks us to isolate.","Keywords":"target variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M327","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"我们先把含目标变量的项放在同一边。","English":"Remember, put all terms containing the target variable on the same side.","Keywords":"collect terms","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M328","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"我们先把不含目标变量的项移到另一边。","English":"Remember, move terms that don't contain the target variable to the other side.","Keywords":"move constants","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M329","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"如果目标变量有公因子，先提出来。","English":"If the target variable has a common factor, factor it out first.","Keywords":"factor out","Example":"ax + bx = x(a+b)","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M330","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"最后除以目标变量前面的系数。","English":"Remember, finally, divide by the coefficient of the target variable.","Keywords":"divide coefficient","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M331","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"公式变形和解方程一样，一定要两边做同样操作。","English":"Remember, rearranging a formula works like solving an equation; we must do the same operation on both sides.","Keywords":"formula, equation balance","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M332","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"带分母的公式可以先两边同乘分母。","English":"If a formula contains denominators, multiply both sides by the denominator first.","Keywords":"denominator, clear fractions","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M333","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"带根号的公式可以先隔离根号，再平方。","English":"If a formula contains a radical, isolate the radical first and then square both sides.","Keywords":"radical, isolate","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M334","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"带指数的公式要用对应的根或反向操作。","English":"If a formula contains an exponent, use the corresponding root or inverse operation.","Keywords":"exponent, inverse operation","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M335","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"如果目标变量出现两次，别急着除，要先合并或因式分解。","English":"If the target variable appears twice, don't divide too early; combine or factor first.","Keywords":"target variable appears twice","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M336","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":1,"Chinese":"公式题常常不要代数值，只要变形。","English":"Remember, formula problems often don't require numerical substitution; they require rearrangement.","Keywords":"formula rearrangement","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M337","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":2,"Chinese":"分式变形最容易漏乘某一项，要写成整式再处理。","English":"In fractional rearrangement, it is easy to miss multiplying a term; rewrite it without fractions first.","Keywords":"fraction, rearrangement","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M338","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":2,"Chinese":"平方两边可能引入 extraneous solution，最后要检查。","English":"Remember, squaring both sides may introduce an extraneous solution, so check at the end.","Keywords":"extraneous solution, square","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M339","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":2,"Chinese":"如果要求 solve for y，不要停在含 y 的隐式形式。","English":"If the problem asks to solve for y, don't stop at an implicit form that still contains y mixed with other terms.","Keywords":"solve for y","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M340","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":2,"Chinese":"公式变形题中，选项可以通过代入简单数字来验证。","English":"In formula rearrangement questions, choices can be tested by substituting simple numbers.","Keywords":"plug in, verify","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M341","Subject":"MathV3","Unit":"Isolating Quantities & Formula Rearrangement","Level":2,"Chinese":"这里不要把所有变量都当未知数；这里只有目标变量需要被 isolate。","English":"Don't treat all variables as unknowns; only the target variable needs to be isolated.","Keywords":"target variable","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M342","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到 triangle inequality，先想它表示的是两边之和大于第三边。","English":"Remember, the triangle inequality means that the sum of two sides is greater than the third side.","Keywords":"triangle inequality","Example":"a+b>c","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M343","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"第三边一定要大于两边之差，小于两边之和。","English":"Remember, the third side must be greater than the difference and less than the sum of the other two sides.","Keywords":"third side range","Example":"|a-b| < c < a+b","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M344","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"对顶角相等。","English":"For triangles, decide whether we need side lengths, angles, similarity, or trig.","Keywords":"vertical angles","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M345","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到内错角相等，通常来自平行线。","English":"Remember, alternate interior angles are equal when the lines are parallel.","Keywords":"alternate interior angles, parallel","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M346","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到同位角相等也，通常来自平行线。","English":"Remember, corresponding angles are equal when the lines are parallel.","Keywords":"corresponding angles, parallel","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M347","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"三角形内角和是 180 度。","English":"Remember: the sum of the interior angles of a triangle is 180 degrees.","Keywords":"angle sum","Example":"180°","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M348","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"大边对大角，小边对小角。","English":"Remember, the larger side is opposite the larger angle, and the smaller side is opposite the smaller angle.","Keywords":"side angle relationship","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M349","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"right triangle 有一个 90 度角。","English":"For triangles, decide whether we need side lengths, angles, similarity, or trig.","Keywords":"right triangle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M350","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到 hypotenuse，先把它理解成“直角三角形中最长的边”。","English":"Remember: the hypotenuse is the longest side in a right triangle.","Keywords":"hypotenuse","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M351","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"Pythagorean theorem 用于直角三角形。","English":"For triangles, decide whether we need side lengths, angles, similarity, or trig.","Keywords":"Pythagorean theorem","Example":"a²+b²=c²","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M352","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"similar triangles 有相等的对应角和成比例的对应边。","English":"Remember, similar triangles have equal corresponding angles and proportional corresponding sides.","Keywords":"similar triangles","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M353","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"congruent triangles 形状和大小都相同。","English":"Remember, congruent triangles have the same shape and the same size.","Keywords":"congruent triangles","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M354","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到 perimeter，先把它理解成“周长”。","English":"Remember, perimeter is the total distance around a figure.","Keywords":"perimeter","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M355","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"看到 area，先把它理解成“面积”。","English":"Remember, area is the amount of space inside a two-dimensional figure.","Keywords":"area","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M356","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"height 一定要垂直于 base。","English":"Remember, the height must be perpendicular to the base.","Keywords":"height, base, perpendicular","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M357","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"isosceles triangle 有两条相等的边。","English":"For triangles, decide whether we need side lengths, angles, similarity, or trig.","Keywords":"isosceles triangle","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M358","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":1,"Chinese":"equilateral triangle 三条边相等，三个角都是 60 度。","English":"Remember, an equilateral triangle has three equal sides and three 60-degree angles.","Keywords":"equilateral triangle","Example":"60°","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M359","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"相似三角形题先配对应边，不要直接把看到的数字相除。","English":"In similar triangle problems, match corresponding sides first; don't divide random visible lengths.","Keywords":"corresponding sides","Example":"","Source":"SAT初级阶段数学_教师版_知识点版"},{"ID":"M360","Subject":"MathV3","Unit":"Geometry Foundations & Triangles","Level":2,"Chinese":"如果题目给图不按比例，不能凭视觉判断长度。","English":"If the figure is not drawn to scale, we cannot judge lengths by s

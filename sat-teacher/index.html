<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SAT教学语言" />
<meta name="theme-color" content="#3157d5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>SAT教学语言练习</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#70758a;--line:#e6e7ef;--primary:#3157d5;--good:#0a8f5a;--bad:#ce2f45;--chip:#eef2ff;--warn:#fff8df;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.94);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:4px 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
button,select,input{font:inherit}
.tab,.btn{border:0;border-radius:14px;padding:11px 10px;background:#fff;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.tab.active,.btn.primary{background:var(--primary);color:#fff}
.btn{width:100%;margin:6px 0;font-weight:650}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(28,32,54,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--chip);padding:5px 9px;font-size:12px;color:#293b8f;margin:3px}
.promptLabel{color:var(--muted);font-size:13px;margin-top:12px}
.term{font-size:30px;font-weight:800;line-height:1.22;margin:18px 0 14px;overflow-wrap:anywhere}
.answer{font-size:22px;line-height:1.42;margin:16px 0;color:#213f98;font-weight:760;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;line-height:1.55;background:#fafafd;border-radius:14px;padding:10px;margin-top:10px}
select,input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.num{font-size:22px;font-weight:800}
.label{font-size:12px;color:var(--muted)}
.option{width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;line-height:1.35;overflow-wrap:anywhere}
.option.correct{border-color:var(--good);background:#eefaf5}
.option.wrong{border-color:var(--bad);background:#fff0f2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn.star{background:var(--warn);border:1px solid #f0d36a;color:#765a00}
.btn.done{background:#eefaf5;border:1px solid #9dddbf;color:#075f3b}
.listItem{padding:12px 0;border-bottom:1px solid var(--line)}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
.center{text-align:center}
.speakBtn{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;font-size:13px;background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none;margin:2px 0 8px}
.content-top{display:none;align-items:center;gap:12px;margin:0 0 10px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.content-top .btn{width:auto;margin:0;padding:8px 12px}
.content-title{font-weight:800;color:var(--muted)}
body.subject-view .panel,body.subject-view .content-top{display:none}
body.subject-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.subject-view .tabs,body.subject-view .subject-back{display:none}
.subject-menu{display:none}
body.subject-view .subject-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:28px 0 0}
.subject-card{min-height:190px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);text-align:left;box-shadow:0 16px 34px rgba(28,32,54,.08)}
.subject-card-title{font-size:24px;font-weight:800;line-height:1.15}
.subject-card-meta{color:var(--muted);font-size:14px;line-height:1.5}
.subject-card-action{display:inline-flex;align-items:center;justify-content:center;width:fit-content;min-height:40px;border-radius:6px;background:var(--primary);color:#fff;padding:0 16px;font-size:16px;font-weight:700}
.subject-back{display:inline-flex;width:auto;margin:18px 0 0;padding:8px 12px}
body.menu-view .panel{display:none}
body.content-view header{display:none}
body.content-view .content-top{display:flex}
body.content-view #study .study-setup{display:block}
body.subject-view .app{max-width:980px;padding:44px 18px 28px}
body.subject-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.subject-view .sub{font-size:16px;max-width:780px}
body.menu-view .app{max-width:980px;padding:44px 18px 28px}
body.menu-view header{position:static;background:transparent;backdrop-filter:none;border-bottom:0;padding:0}
body.menu-view h1{font-size:34px;line-height:1.08;margin:0 0 10px}
body.menu-view .sub{font-size:16px;max-width:780px}
body.menu-view .tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0 0}
body.menu-view .tab{min-height:92px;display:flex;align-items:flex-end;justify-content:flex-start;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:18px;font-weight:800;text-align:left;box-shadow:0 10px 26px rgba(28,32,54,.06)}
@media (min-width:900px){
  .app{max-width:980px;padding:14px 18px 28px}
  h1{font-size:20px;margin:2px 0 4px}
  .sub{font-size:12px}
  .tabs{gap:8px;margin:10px 0 8px}
  .tab,.btn{border-radius:12px;padding:8px 9px;font-size:14px}
  .card{border-radius:18px;padding:14px;margin:10px 0}
  .term{font-size:26px;margin:14px 0 12px;line-height:1.18}
  .answer{font-size:18px;margin:10px 0}
  .note{font-size:13px;line-height:1.4;padding:8px;margin-top:8px}
  select,input{padding:9px;border-radius:12px;margin:4px 0 8px;font-size:14px}
  .stats{gap:8px}
  .stat{border-radius:14px;padding:8px}
  .num{font-size:18px}
  .label{font-size:11px}
  .option{margin:6px 0;padding:10px 12px;border-radius:13px;font-size:15px;line-height:1.3}
  .actions{gap:8px;margin-top:8px}
  .actions .btn{font-size:14px;padding:8px 9px}
  .pill{font-size:11px;padding:4px 8px}
  .listItem{padding:9px 0}
  body.menu-view .app{padding-top:38px}
}
@media (max-width:480px){
  .app{padding:14px 12px 36px}
  .term{font-size:26px}
  .answer{font-size:20px}
  .option{padding:13px;font-size:16px}
  .stats{gap:7px}
  .stat{padding:9px 5px}
  .label{font-size:11px}
  body.subject-view .app{padding:24px 14px 24px}
  body.subject-view h1{font-size:28px}
  body.subject-view .sub{font-size:14px}
  body.menu-view .app{padding:24px 14px 24px}
  body.menu-view h1{font-size:28px}
  body.menu-view .sub{font-size:14px}
  body.menu-view .tabs{grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  body.menu-view .tab{min-height:74px;border-radius:16px;padding:14px;font-size:16px}
  body.subject-view .subject-menu{grid-template-columns:1fr;gap:10px;margin-top:20px}
  .subject-card{min-height:172px;padding:18px}
}
</style>
</head>
<body class="menu-view"><div class="app">
<header>
  <h1 id="appTitle">SAT教学语言练习</h1>
  <div class="sub" id="appSub">请选择科目：Reading / Writing / Math / Reading 7.0 / Writing 7.0 / Math 7.0</div>
  <button class="btn ghost subject-back" id="subjectBackBtn" type="button">返回科目选择</button>
  <div class="tabs">
    <button class="tab" data-tab="study">背诵</button>
    <button class="tab" data-tab="quiz">测验</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="wrong">错题</button>
    <button class="tab" data-tab="list">句表</button>
  </div>
</header>
<section class="subject-menu" id="subjectMenu" aria-label="选择科目"></section>
<div class="content-top"><button class="btn ghost" id="backToMenu" type="button">返回Teacher主页</button><div class="content-title" id="contentTitle"></div></div>

<section id="study" class="panel">
  <div class="card study-setup">
    <label for="scope">选择范围</label>
    <select id="scope"></select>
    <div class="stats">
      <div class="stat"><div class="num" id="totalN">0</div><div class="label">待练</div></div>
      <div class="stat"><div class="num" id="knownN">0</div><div class="label">已掌握</div></div>
      <div class="stat"><div class="num" id="wrongN">0</div><div class="label">错题</div></div>
      <div class="stat"><div class="num" id="dueN">0</div><div class="label">今日复习</div></div>
    </div>
  </div>
  <div class="card center">
    <div id="cardMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="studyTerm">-</div>
    <button class="btn primary" id="showBtn">显示英文</button>
    <div id="answerBox" class="hidden">
      <div class="answer" id="studyMeaning"></div>
      <button class="speakBtn" id="studySpeakBtn" type="button">朗读英文</button>
      <div class="note" id="studyNote"></div>
      <button class="btn good" id="knowBtn">已掌握</button>
      <button class="btn bad" id="dontKnowBtn">还不熟 / 加入错题</button>
    </div>
    <button class="btn ghost" id="nextBtn">下一张</button>
  </div>
</section>

<section id="quiz" class="panel">
  <div class="hidden">
    <label for="quizScope">测验范围</label>
    <select id="quizScope"></select>
    <button class="btn primary" id="startQuiz">开始 / 下一题</button>
  </div>
  <div class="card">
    <div id="quizMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="quizTerm">点击开始</div>
    <div id="options"></div>
    <div class="actions">
      <button class="btn bad" id="favQuizBtn">未掌握</button>
      <button class="btn done" id="knownQuizBtn">已掌握</button>
    </div>
    <div id="quizFeedback" class="note hidden"></div>
  </div>
</section>

<section id="review" class="panel">
  <div class="card">
    <div class="row"><strong>间隔复习</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="startReview">开始今日复习</button></div>
  </div>
  <div class="card">
    <div id="reviewMeta"></div>
    <div class="promptLabel">中文提示</div>
    <div class="term" id="reviewTerm">今日到期表达会显示在这里</div>
    <div id="reviewOptions"></div>
    <div id="reviewFeedback" class="note hidden"></div>
  </div>
  <div class="card" id="reviewList"></div>
</section>

<section id="wrong" class="panel">
  <div class="card">
    <div class="row"><strong>错题本</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="wrongQuizBtn">错题集中测验</button><button class="btn ghost" style="width:auto;padding:9px 12px" id="clearWrong">清空</button></div>
  </div>
  <div class="card" id="wrongList"></div>
</section>

<section id="list" class="panel">
  <div class="card">
    <input id="search" placeholder="搜索中文 / 英文 / Unit / ID" />
    <select id="listScope"></select>
  </div>
  <div class="card" id="cardList"></div>
</section>
</div>

<script>
const SOURCE_CARDS = [{"ID":"G001","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先观察选项之间的区别。","English":"First, compare the answer choices.","Keywords":"","Example":""},{"ID":"G002","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"你注意到了什么区别？","English":"What differences do you notice?","Keywords":"","Example":""},{"ID":"G003","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"仔细比较选项。","English":"Compare the choices carefully.","Keywords":"","Example":""},{"ID":"G004","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要急着选答案。","English":"Don't rush to choose an answer.","Keywords":"","Example":""},{"ID":"G005","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注选项中变化的部分。","English":"Pay attention to what changes from one option to another.","Keywords":"","Example":""},{"ID":"G006","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"这道题考什么？","English":"What is being tested here?","Keywords":"","Example":""},{"ID":"G007","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"我们一步一步来。","English":"Let's work through it step by step.","Keywords":"","Example":""},{"ID":"G008","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先判断考点。","English":"Let's identify the issue first.","Keywords":"","Example":""},{"ID":"G009","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格前面的词。","English":"Look at the word immediately before the blank.","Keywords":"","Example":""},{"ID":"G010","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"关注空格后面的词。","English":"Look at the word immediately after the blank.","Keywords":"","Example":""},{"ID":"G011","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"把句子大声读出来。","English":"Read the sentence aloud.","Keywords":"","Example":""},{"ID":"G012","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先不要依赖语感。","English":"Don't rely on your ear alone.","Keywords":"","Example":""},{"ID":"G013","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"语法优先，意思其次。","English":"Grammar comes first; meaning comes second.","Keywords":"","Example":""},{"ID":"G014","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"先保证句子结构正确。","English":"Make sure the sentence structure is correct first.","Keywords":"","Example":""},{"ID":"G015","Subject":"Grammar","Unit":"General","Level":1,"Chinese":"然后再检查意思是否通顺。","English":"Then check whether the meaning works.","Keywords":"","Example":""},{"ID":"G016","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"这道题考察句子边界。","English":"This question tests sentence boundaries.","Keywords":"","Example":""},{"ID":"G017","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先分析句子结构。","English":"Let's analyze the sentence structure first.","Keywords":"","Example":""},{"ID":"G018","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"我们有一个独立分句还是两个独立分句？","English":"Do we have one independent clause or two independent clauses?","Keywords":"","Example":""},{"ID":"G019","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个完整句吗？","English":"Is this a complete sentence?","Keywords":"","Example":""},{"ID":"G020","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句可以独立成句。","English":"This clause can stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G021","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个分句不能独立成句。","English":"This clause cannot stand alone as a sentence.","Keywords":"","Example":""},{"ID":"G022","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个残句。","English":"This is a sentence fragment.","Keywords":"","Example":""},{"ID":"G023","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个连写句。","English":"This is a run-on sentence.","Keywords":"","Example":""},{"ID":"G024","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这是一个逗号拼接错误。","English":"This is a comma splice.","Keywords":"","Example":""},{"ID":"G025","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句子已经完整了。","English":"The sentence is already complete.","Keywords":"","Example":""},{"ID":"G026","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要句号。","English":"We do not need a period here.","Keywords":"","Example":""},{"ID":"G027","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不需要分号。","English":"We do not need a semicolon here.","Keywords":"","Example":""},{"ID":"G028","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"句号可以分隔两个完整句。","English":"A period can separate two complete sentences.","Keywords":"","Example":""},{"ID":"G029","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"分号可以连接两个相关的独立分句。","English":"A semicolon can join two closely related independent clauses.","Keywords":"","Example":""},{"ID":"G030","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"逗号不能单独连接两个独立分句。","English":"A comma alone cannot join two independent clauses.","Keywords":"","Example":""},{"ID":"G031","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里需要更强的停顿。","English":"We need a stronger break here.","Keywords":"","Example":""},{"ID":"G032","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这里不应该断开句子。","English":"We should not break the sentence here.","Keywords":"","Example":""},{"ID":"G033","Subject":"Grammar","Unit":"Sentence Boundaries","Level":1,"Chinese":"先找主句在哪里。","English":"First, find the main clause.","Keywords":"","Example":""},{"ID":"G034","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"哪个部分承载句子的主要意思？","English":"Which part carries the main meaning of the sentence?","Keywords":"","Example":""},{"ID":"G035","Subject":"Grammar","Unit":"Sentence Boundaries","Level":2,"Chinese":"这个结构在语法上不完整。","English":"This structure is grammatically incomplete.","Keywords":"","Example":""},{"ID":"G036","Subject":"Grammar","Unit":"Punctuation","Level":1,"Chinese":"这道题考察标点。","English":"This question tests punctuation.","Keywords":"","Example":""},{"ID":"G037","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"标点不是随机的。","English":"Punctuation is not random.","Keywords":"","Example":""},{"ID":"G038","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"每个标点都有语法功能。","English":"Every punctuation mark has a grammatical function.","Keywords":"","Example":""},{"ID":"G039","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号前面必须是完整句。","English":"A colon must follow a complete sentence.","Keywords":"","Example":""},{"ID":"G040","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"冒号后面通常是解释、例子或列表。","English":"A colon usually introduces an explanation, an example, or a list.","Keywords":"","Example":""},{"ID":"G041","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"破折号可以强调补充信息。","English":"A dash can emphasize additional information.","Keywords":"","Example":""},{"ID":"G042","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"一对破折号可以插入非必要信息。","English":"A pair of dashes can set off nonessential information.","Keywords":"","Example":""},{"ID":"G043","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"逗号可以隔开非必要信息。","English":"Commas can set off nonessential information.","Keywords":"","Example":""},{"ID":"G044","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"如果这里有一个逗号，通常还需要另一个逗号。","English":"If we have one comma here, we usually need another comma.","Keywords":"","Example":""},{"ID":"G045","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个插入语应该被逗号隔开。","English":"This interruption should be set off by commas.","Keywords":"","Example":""},{"ID":"G046","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子仍然成立。","English":"If we remove this part, the sentence still works.","Keywords":"","Example":""},{"ID":"G047","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是非必要信息。","English":"Therefore, this information is nonessential.","Keywords":"","Example":""},{"ID":"G048","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"去掉这个部分，句子意思不完整。","English":"If we remove this part, the sentence becomes incomplete.","Keywords":"","Example":""},{"ID":"G049","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"所以这个信息是必要信息。","English":"Therefore, this information is essential.","Keywords":"","Example":""},{"ID":"G050","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这里的逗号会打断主语和动词。","English":"This comma would separate the subject from the verb.","Keywords":"","Example":""},{"ID":"G051","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"主语和动词之间通常不需要逗号。","English":"We normally do not put a comma between the subject and the verb.","Keywords":"","Example":""},{"ID":"G052","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"动词和宾语之间不能随便加逗号。","English":"We should not place a comma between the verb and its object.","Keywords":"","Example":""},{"ID":"G053","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个标点会制造不必要的停顿。","English":"This punctuation creates an unnecessary break.","Keywords":"","Example":""},{"ID":"G054","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点使用正确。","English":"This option uses punctuation correctly.","Keywords":"","Example":""},{"ID":"G055","Subject":"Grammar","Unit":"Punctuation","Level":2,"Chinese":"这个选项的标点破坏了句子结构。","English":"This punctuation breaks the sentence structure.","Keywords":"","Example":""},{"ID":"G056","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"这道题考察主谓一致。","English":"This question tests subject-verb agreement.","Keywords":"","Example":""},{"ID":"G057","Subject":"Grammar","Unit":"Agreement","Level":1,"Chinese":"先找主语。","English":"Let's identify the subject first.","Keywords":"","Example":""},{"ID":"G058","Subject":"Grammar","Unit":"Agreement","Level":2,"Chinese":"不要看离动词最近的名词。","English":"Don't look at the noun closest to the verb.","Keywords":"","Example":" function displaySubjectName(subject){return subject === "Grammar" ? "Writing" : subject === "GrammarV7" ? "Writing 7.0" : subject === "ReadingV7" ? "Reading 7.0" : subject === "MathV7" ? "Math 7.0" : subject;}
const SUBJECT_GROUPS = [
  {key:"Reading",label:"Reading",subjects:["Reading"],description:"阅读讲解与文本分析课堂表达"},
  {key:"Writing",label:"Writing",subjects:["Grammar"],description:"文法与表达题课堂语言"},
  {key:"Math",label:"Math",subjects:["Math"],description:"数学题讲解课堂表达"},
  {key:"ReadingV7",label:"Reading 7.0",subjects:["ReadingV7"],description:"阅读教师语言1.0口吻全知识点扩展版"},
  {key:"GrammarV7",label:"Writing 7.0",subjects:["GrammarV7"],description:"写作教师语言1.0口吻全知识点扩展版"},
  {key:"MathV7",label:"Math 7.0",subjects:["MathV7"],description:"数学教师语言1.0口吻全知识点扩展版"}
];
let activeSubjectKey = null;
const CARDS = SOURCE_CARDS.map((c, i) => ({
  id: i + 1,
  code: c.ID,
  subject: c.Subject,
  unit: c.Unit,
  level: Number(c.Level) || 0,
  term: c.Chinese,
  meaning: c.English,
  note: displaySubjectName(c.Subject) + " · " + c.Unit + " · Level " + c.Level + " · " + c.ID
}));
const STORAGE_KEY = "sat_teacher_language_state_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"known":[],"wrong":[],"favorite":[],"idx":0,"correctCounts":{},"review":{}}');
state.known ||= [];
state.wrong ||= [];
state.favorite ||= [];
state.idx ||= 0;
state.correctCounts ||= {};
state.review ||= {};

function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
function byId(id){return document.getElementById(id);}
function escapeHtml(str){return String(str || "").replace(/[&<>"']/g, function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
function enc(str){return encodeURIComponent(str);}
function dec(str){return decodeURIComponent(str);}
function sample(arr,n){return [...arr].sort(function(){return Math.random() - 0.5;}).slice(0,n);}
function uniqueByMeaning(arr){const seen = new Set(); return arr.filter(function(w){if(seen.has(w.meaning)) return false; seen.add(w.meaning); return true;});}
function activeSubjectGroup(){return SUBJECT_GROUPS.find(function(g){return g.key === activeSubjectKey;}) || null;}
function activeSubjectLabel(){const group = activeSubjectGroup(); return group ? group.label : "";}
function currentCards(){const group = activeSubjectGroup(); return group ? CARDS.filter(function(w){return group.subjects.includes(w.subject);}) : CARDS;}
function subjects(){return [...new Set(currentCards().map(function(w){return w.subject;}))];}
function unitsForSubject(subject){return [...new Set(currentCards().filter(function(w){return w.subject === subject;}).map(function(w){return w.unit;}))];}

function speakEnglish(text, silent){
  if(!("speechSynthesis" in window)){if(!silent) alert("当前浏览器不支持发音功能"); return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.86;
  speechSynthesis.speak(u);
}
function speakButton(text){return '<button class="speakBtn" type="button" data-speak="' + escapeHtml(text) + '">朗读英文</button>';}

function scopeOptions(sel){
  const prefix = activeSubjectLabel() || "全部";
  let html = '<option value="all">' + escapeHtml(prefix) + ' 全部表达</option><option value="level:1">Level 1 必须会</option><option value="level:2">Level 2 高频补充</option><option value="favorite">收藏句</option><option value="wrong">错题本</option><option value="due">今日复习</option>';
  subjects().forEach(function(subject){
    const subjectLabel = displaySubjectName(subject);
    html += '<optgroup label="' + escapeHtml(subjectLabel) + '">';
    html += '<option value="subject:' + enc(subject) + '">' + escapeHtml(subjectLabel) + ' 全部</option>';
    unitsForSubject(subject).forEach(function(unit){
      html += '<option value="unit:' + enc(subject) + '|' + enc(unit) + '">' + escapeHtml(subjectLabel + ' · ' + unit) + '</option>';
    });
    html += '</optgroup>';
  });
  sel.innerHTML = html;
}
function refreshScopes(){["scope","quizScope","listScope"].forEach(function(id){scopeOptions(byId(id));});}
refreshScopes();

function baseFiltered(scope){
  const source = currentCards();
  let arr = source;
  if(scope === "favorite") arr = source.filter(function(w){return state.favorite.includes(w.id);});
  else if(scope === "wrong") arr = source.filter(function(w){return state.wrong.includes(w.id);});
  else if(scope === "due") arr = dueReviewCards();
  else if(scope && scope.indexOf("level:") === 0){
    const level = Number(scope.split(":")[1]);
    arr = source.filter(function(w){return w.level === level;});
  } else if(scope && scope.indexOf("subject:") === 0){
    const subject = dec(scope.slice(8));
    arr = source.filter(function(w){return w.subject === subject;});
  } else if(scope && scope.indexOf("unit:") === 0){
    const parts = scope.slice(5).split("|");
    const subject = dec(parts[0]);
    const unit = dec(parts[1] || "");
    arr = source.filter(function(w){return w.subject === subject && w.unit === unit;});
  }
  return arr;
}
function filtered(scope){return baseFiltered(scope);}
function practiceFiltered(scope){return baseFiltered(scope).filter(function(w){return !state.known.includes(w.id);});}
function correctCount(id){return Math.min(state.correctCounts[id] || 0, 5);}
const REVIEW_INTERVALS = [1,3,7,15,30];
function todayStart(){const d = new Date(); d.setHours(0,0,0,0); return d.getTime();}
function addDays(days){const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + days); return d.getTime();}
function reviewInfo(id){return state.review[id] || null;}
function isDue(w){const r = reviewInfo(w.id); return r && r.due <= todayStart() && state.known.includes(w.id);}
function dueReviewCards(){return currentCards().filter(isDue);}
function scheduleReview(id, stage){const safeStage = stage || 0; const interval = REVIEW_INTERVALS[Math.min(safeStage, REVIEW_INTERVALS.length - 1)]; state.review[id] = {stage:safeStage,due:addDays(interval),last:Date.now()};}
function markKnown(id){state.known = [...new Set([...state.known,id])]; state.correctCounts[id] = 5; state.wrong = state.wrong.filter(function(x){return x !== id;}); if(!state.review[id]) scheduleReview(id,0);}
function failReview(id){state.wrong = [...new Set([...state.wrong,id])]; state.known = state.known.filter(function(x){return x !== id;}); state.correctCounts[id] = 0; delete state.review[id];}
function chip(w){
  return '<span class="pill">' + escapeHtml(displaySubjectName(w.subject)) + '</span><span class="pill">' + escapeHtml(w.unit) + '</span><span class="pill">Level ' + w.level + '</span><span class="pill">' + escapeHtml(w.code) + '</span>' +
    (state.favorite.includes(w.id) ? '<span class="pill">已收藏</span>' : '') +
    (state.known.includes(w.id) ? '<span class="pill">已掌握</span>' : '<span class="pill">正确 ' + correctCount(w.id) + '/5</span>') +
    (isDue(w) ? '<span class="pill">今日复习</span>' : '');
}
function updateStats(){
  const scope = byId("scope").value;
  const arr = filtered(scope);
  byId("totalN").textContent = practiceFiltered(scope).length;
  byId("knownN").textContent = arr.filter(function(w){return state.known.includes(w.id);}).length;
  byId("wrongN").textContent = currentCards().filter(function(w){return state.wrong.includes(w.id);}).length;
  byId("dueN").textContent = dueReviewCards().length;
}

let current = null;
function pickStudy(){
  const arr = practiceFiltered(byId("scope").value);
  if(!arr.length){
    current = null;
    byId("cardMeta").innerHTML = "";
    byId("studyTerm").textContent = "当前范围没有待练表达";
    byId("studyMeaning").textContent = "";
    byId("studyNote").textContent = "已掌握的表达不会再显示。";
    byId("answerBox").classList.add("hidden");
    updateStats();
    return;
  }
  state.idx = (state.idx || 0) % arr.length;
  current = arr[state.idx++];
  save();
  byId("cardMeta").innerHTML = chip(current);
  byId("studyTerm").textContent = current.term;
  byId("studyMeaning").textContent = current.meaning;
  byId("studySpeakBtn").onclick = function(){speakEnglish(current.meaning);};
  byId("studyNote").textContent = current.note;
  byId("answerBox").classList.add("hidden");
  updateStats();
}
byId("showBtn").onclick = function(){byId("answerBox").classList.remove("hidden");};
byId("nextBtn").onclick = pickStudy;
byId("scope").onchange = function(){state.idx = 0; pickStudy(); renderWrong();};
byId("knowBtn").onclick = function(){if(current){markKnown(current.id); save(); pickStudy(); renderWrong(); renderReview(); renderList();}};
byId("dontKnowBtn").onclick = function(){if(current){state.wrong = [...new Set([...state.wrong,current.id])]; save(); pickStudy(); renderWrong(); updateStats(); renderList();}};

let quizCurrent = null;
let quizAutoTimer = null;
function optionMeaningsFor(card){
  let pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning && w.subject === card.subject;}));
  if(pool.length < 3) pool = uniqueByMeaning(CARDS.filter(function(w){return w.id !== card.id && w.meaning !== card.meaning;}));
  return sample([card.meaning].concat(sample(pool,3).map(function(w){return w.meaning;})),4);
}
function updateQuizActionButtons(){
  const disabled = !quizCurrent;
  byId("favQuizBtn").textContent = "未掌握";
  byId("knownQuizBtn").textContent = "已掌握";
  byId("favQuizBtn").disabled = disabled;
  byId("knownQuizBtn").disabled = disabled;
}
function startQuiz(){
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  const arr = practiceFiltered(byId("quizScope").value);
  if(arr.length < 1){
    quizCurrent = null;
    byId("quizTerm").textContent = "待测表达不足";
    byId("quizMeta").innerHTML = "已掌握的表达不会再显示。";
    byId("options").innerHTML = "";
    byId("quizFeedback").classList.add("hidden");
    updateQuizActionButtons();
    return;
  }
  quizCurrent = sample(arr,1)[0];
  byId("quizMeta").innerHTML = chip(quizCurrent);
  byId("quizTerm").textContent = quizCurrent.term;
  byId("options").innerHTML = "";
  byId("quizFeedback").classList.add("hidden");
  byId("quizFeedback").innerHTML = "";
  updateQuizActionButtons();
}
byId("startQuiz").onclick = startQuiz;
byId("favQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  state.wrong = [...new Set([...state.wrong,quizCurrent.id])];
  state.known = state.known.filter(function(x){return x !== quizCurrent.id;});
  state.correctCounts[quizCurrent.id] = 0;
  delete state.review[quizCurrent.id];
  save();
  byId("quizFeedback").innerHTML = "英文：" + escapeHtml(quizCurrent.meaning) + " " + speakButton(quizCurrent.meaning);
  byId("quizFeedback").classList.remove("hidden");
  byId("quizMeta").innerHTML = chip(quizCurrent);
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  quizAutoTimer = setTimeout(startQuiz, 1100);
};
byId("knownQuizBtn").onclick = function(){
  if(!quizCurrent) return;
  markKnown(quizCurrent.id);
  save();
  renderWrong();
  renderList();
  renderReview();
  updateStats();
  startQuiz();
};

let reviewCurrent = null;
function startReview(){
  const arr = dueReviewCards();
  if(!arr.length){
    reviewCurrent = null;
    byId("reviewTerm").textContent = "今天没有到期复习表达";
    byId("reviewMeta").innerHTML = "";
    byId("reviewOptions").innerHTML = "";
    byId("reviewFeedback").classList.add("hidden");
    renderReview();
    updateStats();
    return;
  }
  reviewCurrent = sample(arr,1)[0];
  byId("reviewMeta").innerHTML = chip(reviewCurrent);
  byId("reviewTerm").textContent = reviewCurrent.term;
  const opts = optionMeaningsFor(reviewCurrent);
  byId("reviewOptions").innerHTML = opts.map(function(o){return '<button class="option reviewOption">' + escapeHtml(o) + '</button>';}).join("");
  byId("reviewFeedback").classList.add("hidden");
  [...document.querySelectorAll(".reviewOption")].forEach(function(b){
    b.onclick = function(){
      const ok = b.textContent === reviewCurrent.meaning;
      [...document.querySelectorAll(".reviewOption")].forEach(function(x){x.disabled = true;});
      b.classList.add(ok ? "correct" : "wrong");
      if(ok){
        const r = reviewInfo(reviewCurrent.id) || {stage:0};
        const nextStage = Math.min((r.stage || 0) + 1, REVIEW_INTERVALS.length - 1);
        scheduleReview(reviewCurrent.id, nextStage);
        byId("reviewFeedback").innerHTML = "复习正确，下次间隔：" + REVIEW_INTERVALS[nextStage] + " 天。 " + speakButton(reviewCurrent.meaning);
        setTimeout(startReview, 900);
      } else {
        failReview(reviewCurrent.id);
        [...document.querySelectorAll(".reviewOption")].forEach(function(x){if(x.textContent === reviewCurrent.meaning)x.classList.add("correct");});
        byId("reviewFeedback").innerHTML = "复习错误，已放回错题本。正确答案：" + escapeHtml(reviewCurrent.meaning) + " " + speakButton(reviewCurrent.meaning);
      }
      byId("reviewFeedback").classList.remove("hidden");
      save();
      renderWrong();
      renderReview();
      updateStats();
      renderList();
    };
  });
}
function renderReview(){
  const arr = dueReviewCards();
  byId("reviewList").innerHTML = arr.length ? '<div class="small">今日到期 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '</div>';}).join("") : '<div class="small">今天没有到期复习表达。</div>';
}
byId("startReview").onclick = startReview;

function renderWrong(){
  const arr = currentCards().filter(function(w){return state.wrong.includes(w.id);});
  byId("wrongList").innerHTML = arr.length ? arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("") : "暂无错题。";
}
byId("clearWrong").onclick = function(){
  const activeIds = new Set(currentCards().map(function(w){return w.id;}));
  state.wrong = state.wrong.filter(function(id){return !activeIds.has(id);});
  save(); renderWrong(); updateStats(); renderList();
};
byId("wrongQuizBtn").onclick = function(){
  openPanel("quiz", {scope:"wrong"});
};

function renderList(){
  const scope = byId("listScope").value;
  const kw = byId("search").value.trim().toLowerCase();
  const arr = filtered(scope).filter(function(w){return (w.term + " " + w.meaning + " " + displaySubjectName(w.subject) + " " + w.subject + " " + w.unit + " " + w.code).toLowerCase().includes(kw);});
  byId("cardList").innerHTML = '<div class="small">显示 ' + arr.length + ' 张</div>' + arr.map(function(w){return '<div class="listItem">' + chip(w) + '<div><b>' + escapeHtml(w.term) + '</b></div><div>' + escapeHtml(w.meaning) + '</div>' + speakButton(w.meaning) + '<div class="small">' + escapeHtml(w.note) + '</div></div>';}).join("");
}
byId("search").oninput = renderList;
byId("listScope").onchange = renderList;
const PANEL_TITLES = {study:"背诵",quiz:"测验",review:"复习",wrong:"错题",list:"句表"};
function renderSubjectMenu(){
  byId("subjectMenu").innerHTML = SUBJECT_GROUPS.map(function(group){
    const groupCards = CARDS.filter(function(w){return group.subjects.includes(w.subject);});
    const unitCount = new Set(groupCards.map(function(w){return w.unit;})).size;
    return '<button class="subject-card" type="button" data-subject-entry="' + escapeHtml(group.key) + '">' +
      '<div><div class="subject-card-title">' + escapeHtml(group.label) + '</div>' +
      '<div class="subject-card-meta">' + escapeHtml(group.description) + '，共 ' + groupCards.length + ' 张表达卡，' + unitCount + ' 个知识点。</div></div>' +
      '<span class="subject-card-action">进入练习</span></button>';
  }).join("");
}
function updateHeader(){
  const group = activeSubjectGroup();
  if(group){
    byId("appTitle").textContent = group.label + " 教学语言练习";
    byId("appSub").textContent = group.description + " · " + currentCards().length + " 张课堂表达卡";
  } else {
    byId("appTitle").textContent = "SAT教学语言练习";
    byId("appSub").textContent = "请选择科目：Reading / Writing / Math / Reading 7.0 / Writing 7.0 / Math 7.0";
  }
}
function showSubjectMenu(){
  activeSubjectKey = null;
  updateHeader();
  document.body.classList.add("subject-view");
  document.body.classList.remove("menu-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
}
function selectSubject(key){
  if(!SUBJECT_GROUPS.some(function(group){return group.key === key;})) return;
  activeSubjectKey = key;
  refreshScopes();
  state.idx = 0;
  updateHeader();
  showMenu();
}
function openPanel(tabName, opts){
  opts = opts || {};
  if(!PANEL_TITLES[tabName]) return;
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  document.body.classList.remove("menu-view","subject-view");
  document.body.classList.add("content-view");
  document.body.classList.toggle("study-view", tabName === "study");
  document.body.classList.toggle("quiz-view", tabName === "quiz");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  const tab = document.querySelector('[data-tab="' + tabName + '"]');
  if(tab) tab.classList.add("active");
  byId(tabName).classList.add("active");
  byId("contentTitle").textContent = PANEL_TITLES[tabName];
  if(tabName === "study"){
    byId("scope").value = opts.scope || "all";
    if(!byId("scope").value) byId("scope").value = "all";
    state.idx = opts.keepPosition ? state.idx : state.idx || 0;
    pickStudy();
  }
  if(tabName === "quiz"){
    byId("quizScope").value = opts.scope || "all";
    if(!byId("quizScope").value) byId("quizScope").value = "all";
    startQuiz();
  }
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
function showMenu(){
  if(!activeSubjectGroup()){showSubjectMenu(); return;}
  refreshScopes();
  updateHeader();
  document.body.classList.add("menu-view");
  document.body.classList.remove("subject-view","content-view","study-view","quiz-view");
  document.querySelectorAll(".tab,.panel").forEach(function(x){x.classList.remove("active");});
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer = null;}
  renderList();
  renderWrong();
  renderReview();
  updateStats();
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    openPanel(t.dataset.tab);
  };
});
byId("subjectMenu").addEventListener("click", function(e){
  const btn = e.target.closest("[data-subject-entry]");
  if(btn) selectSubject(btn.dataset.subjectEntry);
});
byId("subjectBackBtn").onclick = showSubjectMenu;
byId("backToMenu").onclick = showMenu;
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-speak]");
  if(btn){e.preventDefault(); speakEnglish(btn.dataset.speak);}
});
renderList();
renderWrong();
renderReview();
updateStats();
renderSubjectMenu();
showSubjectMenu();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>
</body></html>

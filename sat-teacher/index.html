sually a modifier; do not treat it as the core structure.","Keywords":"prepositional phrase, modifier","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R049","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"定语从句先看它修饰谁。","English":"For a relative clause, first identify what it modifies.","Keywords":"relative clause, modifier","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R050","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"同位语是在解释前面的名词。","English":"An appositive explains the noun before it.","Keywords":"appositive, explanation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R051","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"看到 and，要判断它连接的是词、短语还是句子。","English":"When you see 'and,' decide whether it connects words, phrases, or clauses.","Keywords":"parallelism, and","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R052","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"看到 than 或 as...as，要找比较对象。","English":"When you see 'than' or 'as...as,' identify the items being compared.","Keywords":"comparison, than, as as","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R053","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"主语后面如果有很长修饰语，不要急着找新主语。","English":"If a long modifier follows the subject, do not look for a new subject too quickly.","Keywords":"subject separation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R054","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":1,"Chinese":"科学文本的长句常把目的、方法和结果塞在一起。","English":"In scientific texts, a long sentence often packs the purpose, method, and result together.","Keywords":"science, purpose, method, result","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R055","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"先判断哪个动词控制整个句子，哪个动词只在从句里工作。","English":"First decide which verb controls the whole sentence and which verb only works inside a clause.","Keywords":"finite verb, clause","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R056","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"不要被第一个名词误导，真正的主语可能在结构上更早或更后。","English":"Do not be misled by the first noun; the real subject depends on the structure.","Keywords":"subject, structure","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R057","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"长句分析的目标不是逐词翻译，而是确定信息层级。","English":"The goal of long-sentence analysis is not word-for-word translation; it is to identify information hierarchy.","Keywords":"information hierarchy","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R058","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"非必要修饰语可以略读，但它的逻辑方向不能读反。","English":"A nonessential modifier can be skimmed, but its logical direction must not be reversed.","Keywords":"nonessential modifier, direction","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R059","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"如果修饰语里有转折词，它可能改变整句话的重点。","English":"If a modifier contains a contrast signal, it may change the emphasis of the sentence.","Keywords":"modifier, contrast","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R060","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"并列项通常在同一语义层级，选项也要保留这种层级关系。","English":"Parallel items usually belong to the same semantic level, and the choice must preserve that hierarchy.","Keywords":"parallel items, hierarchy","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R061","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"比较结构要同时检查对象、维度和方向。","English":"In a comparison, check the objects, the dimension, and the direction at the same time.","Keywords":"comparison, object, dimension, direction","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R062","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"名词化结构常把动作藏进名词里，要把它还原成谁做了什么。","English":"Nominalization often hides an action inside a noun; restore it as who did what.","Keywords":"nominalization, action","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R063","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"被动句要问：什么被做了？由谁做不一定重要。","English":"In a passive sentence, ask: what was done? The doer may not be important.","Keywords":"passive voice, action","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R064","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"长难句里最重要的是主干和逻辑，不是每个陌生词。","English":"In a difficult sentence, the core structure and logic matter more than every unfamiliar word.","Keywords":"core structure, logic","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R065","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"如果学生卡住了，让他先说出 subject-verb-object。","English":"If a student is stuck, ask them to state the subject-verb-object first.","Keywords":"SVO, student prompt","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R066","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"这句话的后半部分是在限制前半部分，不是另起一个新话题。","English":"The second half of this sentence limits the first half; it does not start a new topic.","Keywords":"limitation, sentence relation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R067","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"文学文本的长句要额外关注情绪和评价词。","English":"In literary texts, pay extra attention to emotion and evaluative words in long sentences.","Keywords":"literature, emotion, evaluation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R068","Subject":"ReadingV2","Unit":"Long Sentences & Core Structure","Level":2,"Chinese":"人文文本的长句常有抽象评论，要把评论对象找出来。","English":"In humanities texts, long sentences often contain abstract commentary; identify what is being commented on.","Keywords":"humanities, commentary","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R069","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"正确答案常常换了说法，但没有换意思。","English":"The correct answer often changes the wording, but not the meaning.","Keywords":"paraphrase, meaning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R070","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"先找原文信息，再看选项有没有同义改写。","English":"Find the information in the text first, then check whether the choice paraphrases it.","Keywords":"text evidence, paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R071","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"不要因为选项用了原词就认为它正确。","English":"Do not assume a choice is correct just because it uses words from the text.","Keywords":"original wording trap","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R072","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"原文具体，选项可能更抽象。","English":"The text may be specific, while the choice may be more abstract.","Keywords":"specific to abstract","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R073","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"原文抽象，选项可能用一个具体例子来表达。","English":"The text may be abstract, while the choice may express it through a specific example.","Keywords":"abstract to specific","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R074","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"近义词不一定等于同义改写，还要看逻辑位置。","English":"A synonym is not automatically a paraphrase; check the logical position too.","Keywords":"synonym, logic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R075","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"反义线索出现时，答案方向要反过来。","English":"When an opposite clue appears, the answer direction must be reversed.","Keywords":"antonym, opposite clue","Example":"however, although, despite","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R076","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"上义词和下义词之间也可能构成改写。","English":"Hypernyms and hyponyms can also form a paraphrase relationship.","Keywords":"hypernym, hyponym","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R077","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"词性改变了，意思不一定改变。","English":"A change in part of speech does not necessarily change the meaning.","Keywords":"part of speech, paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R078","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":1,"Chinese":"先判断这句话的核心动作，再看选项怎么表达这个动作。","English":"Identify the core action of the sentence first, then see how the choice expresses that action.","Keywords":"core action, paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R079","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"同义改写要同时保持事实、态度和范围。","English":"A paraphrase must preserve the fact, attitude, and scope at the same time.","Keywords":"fact, attitude, scope","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R080","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"选项如果加入了原文没有的原因，就是过度改写。","English":"If a choice adds a cause that the text does not give, it is an over-paraphrase.","Keywords":"added cause, over-paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R081","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"选项如果把可能性改成必然性，范围就变了。","English":"If a choice changes possibility into certainty, the scope has changed.","Keywords":"possibility, certainty, scope","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R082","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"选项如果把一个研究结果扩大成所有情况，就过宽了。","English":"If a choice expands one research finding into all cases, it is too broad.","Keywords":"overgeneralization","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R083","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"细节题里的正确答案经常是隐含意义的合理概括。","English":"In detail questions, the correct answer is often a reasonable summary of the implied meaning.","Keywords":"implied meaning, detail","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R084","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"证据题里的正确答案必须能完整证明 claim 的关键要素。","English":"In evidence questions, the correct answer must fully prove the key elements of the claim.","Keywords":"claim, key elements","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R085","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"图表题里的改写要同时保留数据对象和比较方向。","English":"In data questions, the paraphrase must preserve both the data object and the comparison direction.","Keywords":"data object, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R086","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"推断题里的改写可以前进一步，但不能跳两步。","English":"In inference questions, the paraphrase can move one step forward, but not two steps beyond the text.","Keywords":"inference, limit","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R087","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"主动被动转换时，要看动作接受者有没有变。","English":"When active voice changes to passive voice, check whether the receiver of the action stays the same.","Keywords":"active, passive","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R088","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"名词化改写时，要还原出原来的动词关系。","English":"When a choice uses nominalization, restore the original verb relationship.","Keywords":"nominalization, verb relationship","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R089","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"如果选项只匹配一个词而不匹配整句话，它通常不够好。","English":"If a choice matches one word but not the whole sentence, it is usually not good enough.","Keywords":"word match, sentence meaning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R090","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"学生说‘差不多’时，要追问：哪一处同义？哪一处不同？","English":"When a student says 'about the same,' ask: which part is the same, and which part is different?","Keywords":"student prompt, precision","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R091","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"把原文和选项各压缩成一句中文，再比较是否同向。","English":"Compress the text and the choice into one Chinese sentence each, then compare whether they point in the same direction.","Keywords":"compression, direction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R092","Subject":"ReadingV2","Unit":"Paraphrase & Evidence Matching","Level":2,"Chinese":"正确答案的改写通常更克制，不会比原文说得更重。","English":"The correct paraphrase is usually restrained; it does not make a stronger claim than the text.","Keywords":"restrained wording","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R093","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 however，重点通常转向后面。","English":"When you see 'however,' the emphasis usually shifts to what follows.","Keywords":"however, contrast","Example":"however, nevertheless","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R094","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 although，先让步，后面通常是重点。","English":"When you see 'although,' the sentence makes a concession first, and the later point is usually the focus.","Keywords":"although, concession","Example":"although, though, even though","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R095","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 because，要找原因和结果。","English":"When you see 'because,' identify the cause and the effect.","Keywords":"cause, effect","Example":"because, since, due to","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R096","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 therefore，要把前面的信息推成结论。","English":"When you see 'therefore,' turn the previous information into a conclusion.","Keywords":"therefore, conclusion","Example":"therefore, thus, consequently","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R097","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 for example，不要把例子当成主旨。","English":"When you see 'for example,' do not treat the example as the main idea.","Keywords":"example, main idea","Example":"for example, for instance","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R098","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 similarly，找相同点。","English":"When you see 'similarly,' look for the similarity.","Keywords":"similarity","Example":"similarly, likewise","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R099","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 by contrast，找差异。","English":"When you see 'by contrast,' look for the difference.","Keywords":"contrast","Example":"by contrast, whereas, while","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R100","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 before 或 after，要先排时间顺序。","English":"When you see 'before' or 'after,' organize the time sequence first.","Keywords":"time sequence","Example":"before, after, predate","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R101","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 especially 或 in particular，后面可能是具体化。","English":"When you see 'especially' or 'in particular,' what follows may specify the point.","Keywords":"specific detail","Example":"especially, in particular","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R102","Subject":"ReadingV2","Unit":"Logic Relations","Level":1,"Chinese":"看到 in other words，后面通常是在改写前文。","English":"When you see 'in other words,' the later phrase usually paraphrases the earlier point.","Keywords":"restatement","Example":"in other words, that is","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R103","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"逻辑词不是装饰，它告诉我们答案应该同向还是反向。","English":"Logical signals are not decoration; they tell us whether the answer should go in the same or opposite direction.","Keywords":"direction, signal","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R104","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"没有明显逻辑词时，要用语义关系判断。","English":"When there is no obvious signal word, use the semantic relationship to judge the logic.","Keywords":"implicit logic","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R105","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"递进关系要求后文比前文更具体、更强或更深入。","English":"An addition or progression relationship means the later information is more specific, stronger, or deeper.","Keywords":"addition, progression","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R106","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"转折关系不是简单相反，而是重点转移。","English":"A contrast relationship is not just opposition; it often signals a shift in emphasis.","Keywords":"contrast, emphasis shift","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R107","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"让步句通常承认一部分事实，再推出更重要的观点。","English":"A concession usually admits part of a fact and then leads to a more important point.","Keywords":"concession, important point","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R108","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"因果关系要分清文本给出的原因和我们自己想象的原因。","English":"In a causal relationship, distinguish the cause given by the text from a cause we imagine.","Keywords":"given cause, imagined cause","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R109","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"例证关系中，例子要回到它服务的论点。","English":"In an example relationship, the example must be connected back to the point it serves.","Keywords":"example, claim","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R110","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"比较关系要问：比较的是谁？在哪个维度上比较？","English":"In a comparison, ask: who or what is being compared, and on what dimension?","Keywords":"comparison, dimension","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R111","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"时间关系题最容易把 earlier/later 读反。","English":"In time-sequence questions, it is easy to reverse earlier and later.","Keywords":"earlier, later","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R112","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"双篇题中，态度词往往建立观点关系。","English":"In cross-text questions, attitude words often establish the relationship between viewpoints.","Keywords":"attitude, cross-text","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R113","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"推断题中，结论必须沿着文本逻辑自然推出。","English":"In inference questions, the conclusion must follow naturally from the text logic.","Keywords":"inference, conclusion","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R114","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"图表题中，趋势本身也是一种逻辑关系。","English":"In data questions, a trend itself is a logical relationship.","Keywords":"trend, data","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R115","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"如果选项方向和逻辑词相反，即使词汇相关也要排除。","English":"If a choice goes against the logical signal, eliminate it even if the vocabulary seems related.","Keywords":"elimination, direction","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R116","Subject":"ReadingV2","Unit":"Logic Relations","Level":2,"Chinese":"学生解释答案时必须说出关系词或隐含关系。","English":"When students explain an answer, they must name the signal word or the implied relationship.","Keywords":"student explanation, relation","Example":"","Source":"SAT阅读所有知识点汇总_基于启航班卓越班PPT"},{"ID":"R117","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项太窄，只覆盖了文本的一小部分。","English":"This choice is too narrow; it covers only a small part of the text.","Keywords":"too narrow","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R118","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项太宽，比原文说得更大。","English":"This choice is too broad; it says more than the text does.","Keywords":"too broad","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R119","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项方向反了。","English":"This choice goes in the opposite direction.","Keywords":"opposite direction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R120","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项有原文词，但关系错了。","English":"This choice uses words from the text, but the relationship is wrong.","Keywords":"word trap, wrong relation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R121","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项说的是事实，但没有回答题干。","English":"This choice may be true, but it does not answer the question.","Keywords":"true but irrelevant","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R122","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项加入了原文没有的新信息。","English":"This choice adds new information that is not in the text.","Keywords":"new information","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R123","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项偷换了对象。","English":"This choice switches the object being discussed.","Keywords":"object shift","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R124","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项把可能性说成了必然性。","English":"This choice turns a possibility into a certainty.","Keywords":"possibility, certainty","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R125","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项只证明了一半。","English":"This choice proves only half of the claim.","Keywords":"partial evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R126","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":1,"Chinese":"这个选项只是主题相关，不等于证据相关。","English":"This choice is topic-related, but not evidence-related.","Keywords":"topic-related, evidence-related","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R127","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"排除选项时要说出错因类型，而不是只说不喜欢。","English":"When eliminating a choice, name the error type instead of just saying you do not like it.","Keywords":"error type, elimination","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R128","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"主旨题的干扰项常常过窄、过宽或抓错重点。","English":"Distractors in central idea questions are often too narrow, too broad, or focused on the wrong emphasis.","Keywords":"central idea distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R129","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"细节题的干扰项常常是原文词加错误关系。","English":"Distractors in detail questions often combine original wording with a wrong relationship.","Keywords":"detail distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R130","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"证据题的干扰项常常相关但不能证明。","English":"Distractors in evidence questions are often related but unable to prove the claim.","Keywords":"evidence distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R131","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"图表题的干扰项常常数据对，但比较对象错。","English":"Distractors in data questions often have correct numbers but wrong comparison objects.","Keywords":"data distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R132","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"推断题的干扰项常常推得太远。","English":"Distractors in inference questions often go too far beyond the text.","Keywords":"inference distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R133","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"词汇题的干扰项常常是常见义，不是语境义。","English":"Distractors in vocabulary questions often use the common meaning, not the contextual meaning.","Keywords":"common meaning, contextual meaning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R134","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"双篇题的干扰项常常混淆两位作者的立场。","English":"Distractors in cross-text questions often confuse the two authors' positions.","Keywords":"author position, cross-text","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R135","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"文学题的干扰项常常情绪过度或人物关系错位。","English":"Distractors in literary questions often exaggerate emotion or misrepresent character relationships.","Keywords":"literary distractor","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R136","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"科学题的干扰项常常把实验设计和实验结果混在一起。","English":"Distractors in science questions often mix up the experimental design and the result.","Keywords":"experiment design, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R137","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"如果一个选项需要很多额外假设，它通常不是最佳答案。","English":"If a choice requires many extra assumptions, it is usually not the best answer.","Keywords":"extra assumption","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R138","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"错题复盘要记录：错在词义、长句、逻辑、定位、证据还是选项。","English":"In error review, record whether the error came from vocabulary, long sentences, logic, locating, evidence, or choices.","Keywords":"error log","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R139","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"同一道错题至少要问两遍：为什么错？为什么正确答案更好？","English":"For each wrong answer, ask twice: why is this wrong, and why is the correct answer better?","Keywords":"review, correct answer","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R140","Subject":"ReadingV2","Unit":"Wrong Answer Analysis","Level":2,"Chinese":"不要只记答案，要记住它属于哪一种陷阱。","English":"Do not just memorize the answer; remember what type of trap it represents.","Keywords":"trap type","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R141","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"空格词的意思由上下文决定，不由词典第一个意思决定。","English":"The meaning of the blank is decided by the context, not by the first dictionary definition.","Keywords":"contextual meaning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R142","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"先预测语义方向，再看选项。","English":"Predict the semantic direction before looking at the choices.","Keywords":"semantic direction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R143","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"这个空格需要一个正向词还是负向词？","English":"Does this blank need a positive word or a negative word?","Keywords":"positive, negative","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R144","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"看空格前后有没有解释线索。","English":"Check whether there is an explanation clue before or after the blank.","Keywords":"explanation clue","Example":":, that is, in other words","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R145","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"看空格前后有没有近义线索。","English":"Check whether there is a synonym clue around the blank.","Keywords":"synonym clue","Example":"similarly, likewise","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R146","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"看空格前后有没有反义线索。","English":"Check whether there is an antonym clue around the blank.","Keywords":"antonym clue","Example":"however, although, despite","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R147","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"看空格前后有没有因果线索。","English":"Check whether there is a cause-and-effect clue around the blank.","Keywords":"cause-effect clue","Example":"because, therefore, due to","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R148","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"不要只认识单词，要看它在这里精不精准。","English":"Do not only ask whether you know the word; ask whether it is precise here.","Keywords":"precision","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R149","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"熟词僻义题要特别小心常见义陷阱。","English":"For a familiar word with an unfamiliar meaning, be careful with the common-meaning trap.","Keywords":"familiar word, uncommon meaning","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R150","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"选项都认识时，比较搭配和语气。","English":"When you know all the choices, compare collocation and tone.","Keywords":"collocation, tone","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R151","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"空格前后如果有 but，答案方向通常和前文相反。","English":"If there is 'but' around the blank, the answer direction is usually opposite to the earlier idea.","Keywords":"but, contrast","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R152","Subject":"ReadingV2","Unit":"Words in Context","Level":1,"Chinese":"空格前后如果有 because，答案要符合因果链。","English":"If there is 'because' around the blank, the answer must fit the causal chain.","Keywords":"because, causal chain","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R153","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"logical 是方向正确，precise 是语义精确。","English":"'Logical' means the direction is correct; 'precise' means the meaning is exact.","Keywords":"logical, precise","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R154","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"词汇题常常考逻辑，不只是考词汇量。","English":"Vocabulary questions often test logic, not just vocabulary size.","Keywords":"logic, vocabulary","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R155","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"如果两个词都差不多，要看哪一个和宾语搭配更自然。","English":"If two words seem similar, check which one collocates more naturally with the object.","Keywords":"object, collocation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R156","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"如果空格描述的是作者态度，要先判断态度是赞成、质疑还是中立。","English":"If the blank describes the author's attitude, first decide whether the attitude is positive, skeptical, or neutral.","Keywords":"author attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R157","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"如果空格连接两个观点，要看它是强化、削弱还是转向。","English":"If the blank connects two ideas, decide whether it strengthens, weakens, or shifts the idea.","Keywords":"connect ideas","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R158","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"反义词不是随便选相反词，而是选和语境准确相反的词。","English":"An antonym clue does not mean choosing any opposite word; choose the word that is accurately opposite in context.","Keywords":"antonym, context","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R159","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"解释线索常常在冒号、破折号或后一句里。","English":"Explanation clues often appear after a colon, a dash, or in the next sentence.","Keywords":"colon, dash, explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R160","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"文学词汇题要看修饰对象和情感色彩。","English":"For literary vocabulary questions, check the modified object and emotional coloring.","Keywords":"literature, connotation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R161","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"科学词汇题要看术语关系和因果链。","English":"For scientific vocabulary questions, check the technical relationship and causal chain.","Keywords":"science, term, causality","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R162","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"选项如果只和主题相关，但不能完成逻辑，它就是干扰项。","English":"If a choice is only related to the topic but does not complete the logic, it is a distractor.","Keywords":"topic-related, logic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R163","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"这不是问哪个词最高级，而是问哪个词最贴合上下文。","English":"The question is not asking which word is the most advanced; it asks which word best fits the context.","Keywords":"fit, context","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R164","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"让学生先用中文说出空格大意，再回到英文选项。","English":"Ask students to state the general meaning of the blank in Chinese first, then return to the English choices.","Keywords":"student prompt, prediction","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R165","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"预测词不必和答案完全一样，但方向和语义范围要一致。","English":"The predicted word does not need to match the answer exactly, but its direction and semantic range should match.","Keywords":"prediction, semantic range","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R166","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"最后把答案放回原句，检查语法搭配和逻辑都通不通。","English":"Finally, put the answer back into the sentence and check whether both grammar and logic work.","Keywords":"plug back, check","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R167","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"如果答案放进去读起来顺，但逻辑不顺，仍然不能选。","English":"If the answer sounds smooth but the logic does not work, we still cannot choose it.","Keywords":"sounds right, logic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R168","Subject":"ReadingV2","Unit":"Words in Context","Level":2,"Chinese":"这类题的错题要记录：错在词义、逻辑词，还是搭配。","English":"For this type, record whether the error came from meaning, logical signals, or collocation.","Keywords":"error log, WIC","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R169","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"function 题问的是作用，不是这句话的内容翻译。","English":"A function question asks about the role, not a translation of the sentence.","Keywords":"function, role","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R170","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"先看被问部分本身，再看它和前后句的关系。","English":"Look at the referenced portion itself first, then its relationship with the surrounding sentences.","Keywords":"underlined portion, surrounding sentences","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R171","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在引入话题吗？","English":"Is this sentence introducing the topic?","Keywords":"introduce, topic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R172","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在定义概念吗？","English":"Is this sentence defining a concept?","Keywords":"define, concept","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R173","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在举例吗？","English":"Is this sentence giving an example?","Keywords":"example","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R174","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在解释前一句吗？","English":"Is this sentence explaining the previous sentence?","Keywords":"explain, previous sentence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R175","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在支持前面的观点吗？","English":"Is this sentence supporting the previous claim?","Keywords":"support, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R176","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在让步吗？","English":"Is this sentence making a concession?","Keywords":"concession","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R177","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在转向新观点吗？","English":"Is this sentence shifting to a new idea?","Keywords":"shift, new idea","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R178","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"这句话是在总结结论吗？","English":"Is this sentence summarizing the conclusion?","Keywords":"conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R179","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"如果被问的是句内部分，先看它修饰或解释什么。","English":"If the referenced portion is inside a sentence, first ask what it modifies or explains.","Keywords":"sentence part, modifies","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R180","Subject":"ReadingV2","Unit":"Sentence Function","Level":1,"Chinese":"如果被问的是整句，重点看前后句连接。","English":"If the referenced portion is a whole sentence, focus on how it connects with the previous and next sentences.","Keywords":"whole sentence, connection","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R181","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"正确选项要描述结构功能，而不是复述细节内容。","English":"The correct choice describes the structural function, not just the detailed content.","Keywords":"structural function, detail","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R182","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"It..., then... 的选项常常先说内容，再说功能，要两半都对。","English":"In an 'It..., then...' choice, the first half often states content and the second half states function; both halves must be correct.","Keywords":"It then, two-part choice","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R183","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"如果一个选项的功能词错了，即使内容对也不能选。","English":"If the function word in a choice is wrong, we cannot choose it even if the content is correct.","Keywords":"function word","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R184","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"支持句通常提供事实、例子、数据或解释。","English":"A supporting sentence usually gives a fact, example, data point, or explanation.","Keywords":"supporting sentence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R185","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"让步句通常先承认限制，再引出更重要的信息。","English":"A concession sentence usually acknowledges a limitation before introducing a more important point.","Keywords":"concession, limitation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R186","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"定义句的功能是建立术语基础，不是提出最终结论。","English":"A definition sentence establishes the term, not the final conclusion.","Keywords":"definition, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R187","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"引入句通常提出问题、现象、研究对象或背景。","English":"An introductory sentence often presents a problem, phenomenon, research object, or background.","Keywords":"introduction, background","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R188","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"回应句通常回答前文的问题或反驳前文的观点。","English":"A response sentence usually answers a previous question or challenges a previous view.","Keywords":"response, challenge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R189","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"强调句常通过评价词、重复或总结来强化观点。","English":"An emphasis sentence often strengthens a point through evaluative words, repetition, or summary.","Keywords":"emphasis, evaluation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R190","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"如果划线部分是插入解释，它的作用通常是 clarify 或 specify。","English":"If the underlined portion is an inserted explanation, its role is usually to clarify or specify.","Keywords":"clarify, specify","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R191","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"不要选文本中也正确但不是该句功能的选项。","English":"Do not choose an option that is true of the text but not the function of this sentence.","Keywords":"true but wrong function","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R192","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"先用动词概括功能：introduce, define, support, contrast, qualify, conclude。","English":"Use a verb to summarize the function first: introduce, define, support, contrast, qualify, or conclude.","Keywords":"function verbs","Example":"introduce, define, support, contrast, qualify, conclude","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R193","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"让学生回答：这句话如果删掉，文本少了什么功能？","English":"Ask students: if this sentence were removed, what function would the text lose?","Keywords":"student prompt, removal test","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R194","Subject":"ReadingV2","Unit":"Sentence Function","Level":2,"Chinese":"function 题不要过度分析作者心理，先抓文本结构。","English":"In function questions, do not overanalyze the author's psychology; focus on text structure first.","Keywords":"structure, author psychology","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R195","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"structure 题问的是整段怎么组织。","English":"A structure question asks how the whole text is organized.","Keywords":"structure, organization","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R196","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"先逐句概括，再合并成结构。","English":"Summarize sentence by sentence first, then combine the summaries into a structure.","Keywords":"sentence summary, structure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R197","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是先背景后研究吗？","English":"Does the text present background first and then a study?","Keywords":"background, study","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R198","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是先问题后解决方案吗？","English":"Does the text present a problem first and then a solution?","Keywords":"problem, solution","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R199","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是先观点后例子吗？","English":"Does the text present a claim first and then an example?","Keywords":"claim, example","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R200","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是先旧观点后新发现吗？","English":"Does the text present an old view first and then a new finding?","Keywords":"old view, new finding","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R201","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是比较两个对象吗？","English":"Does the text compare two objects?","Keywords":"comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R202","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是按时间顺序展开吗？","English":"Is the text organized chronologically?","Keywords":"chronological order","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R203","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"这段是先现象后解释吗？","English":"Does the text present a phenomenon first and then an explanation?","Keywords":"phenomenon, explanation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R204","Subject":"ReadingV2","Unit":"Text Structure","Level":1,"Chinese":"结构题不要被一个例子带偏。","English":"In structure questions, do not be distracted by one example.","Keywords":"example, structure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R205","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"结构是文本为了实现目的而采用的组织方式。","English":"Structure is the organization the text uses to achieve its purpose.","Keywords":"structure, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R206","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"正确选项通常比较抽象，不会只重复一个具体细节。","English":"The correct choice is usually abstract; it does not merely repeat one specific detail.","Keywords":"abstract, detail","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R207","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"先给每句话贴标签：background, claim, evidence, contrast, conclusion。","English":"Label each sentence first: background, claim, evidence, contrast, or conclusion.","Keywords":"sentence labels","Example":"background / claim / evidence / contrast / conclusion","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R208","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"general-to-specific 是先给大观点，再给具体细节。","English":"General-to-specific means the text gives a broad point first and then details.","Keywords":"general to specific","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R209","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"specific-to-general 是先给例子，再抽象成观点。","English":"Specific-to-general means the text gives examples first and then abstracts a point.","Keywords":"specific to general","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R210","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"contrast/comparison 结构要找两个对象和比较维度。","English":"In a contrast or comparison structure, identify the two objects and the dimension of comparison.","Keywords":"contrast, comparison","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R211","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"problem/solution 结构要分清问题本身和解决动作。","English":"In a problem/solution structure, distinguish the problem itself from the action taken to solve it.","Keywords":"problem, solution","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R212","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"chronological 结构要按事件顺序而不是句子长度理解。","English":"In a chronological structure, understand events by time order, not sentence length.","Keywords":"chronological","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R213","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"如果选项把结果说成原因，结构关系就错了。","English":"If a choice calls a result a cause, the structural relationship is wrong.","Keywords":"cause, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R214","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"如果选项把背景说成主张，结构关系就错了。","English":"If a choice calls background a claim, the structural relationship is wrong.","Keywords":"background, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R215","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"结构题的答案要能覆盖文本的大部分句子。","English":"The answer to a structure question must account for most of the sentences in the text.","Keywords":"coverage, structure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R216","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"Text Structure 和 Text Purpose 可以相关，但不能混为一谈。","English":"Text Structure and Text Purpose can be related, but they are not the same.","Keywords":"structure, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R217","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"让学生用箭头写出结构：背景 → 研究 → 发现 → 意义。","English":"Ask students to write the structure with arrows: background → study → finding → significance.","Keywords":"arrow structure","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R218","Subject":"ReadingV2","Unit":"Text Structure","Level":2,"Chinese":"如果学生只说主题，要追问：作者是怎样展开这个主题的？","English":"If students only state the topic, ask: how does the author develop that topic?","Keywords":"student prompt, development","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R219","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"purpose 题问作者为什么写这段。","English":"A purpose question asks why the author wrote the text.","Keywords":"purpose, why","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R220","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"不要把文本讲了什么和作者为什么讲混在一起。","English":"Do not confuse what the text says with why the author says it.","Keywords":"content, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R221","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"先判断这段主要是在介绍、解释、证明还是反驳。","English":"First decide whether the text mainly introduces, explains, proves, or challenges something.","Keywords":"introduce, explain, prove, challenge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R222","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"科学文本的目的可能是介绍发现。","English":"The purpose of a scientific text may be to introduce a finding.","Keywords":"science, finding","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R223","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"科学文本的目的也可能是解释一个现象。","English":"The purpose of a scientific text may also be to explain a phenomenon.","Keywords":"science, phenomenon","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R224","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"人文文本的目的可能是挑战一个观点。","English":"The purpose of a humanities text may be to challenge a view.","Keywords":"humanities, challenge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R225","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"文学文本的目的常常和人物、场景或情感有关。","English":"The purpose of a literary text often relates to character, setting, or emotion.","Keywords":"literature, character, setting","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R226","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"例子是为目的服务的，不要把例子本身当目的。","English":"Examples serve the purpose; do not treat the example itself as the purpose.","Keywords":"example, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R227","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"背景信息通常不是作者的最终目的。","English":"Background information is usually not the author's final purpose.","Keywords":"background, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R228","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"转折后信息常常更接近作者目的。","English":"Information after a contrast often gets closer to the author's purpose.","Keywords":"contrast, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R229","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"选项里的动词很关键。","English":"The verb in the choice is very important.","Keywords":"rhetorical verb","Example":"describe, explain, argue, illustrate","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R230","Subject":"ReadingV2","Unit":"Text Purpose","Level":1,"Chinese":"先给文本目的配一个动词。","English":"Match the text purpose with a verb first.","Keywords":"purpose verb","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R231","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"describe 是描述，explain 是解释原因或机制，argue 是提出立场。","English":"'Describe' means to present features; 'explain' means to give causes or mechanisms; 'argue' means to make a claim.","Keywords":"describe, explain, argue","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R232","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"illustrate 通常表示用例子说明一个观点。","English":"'Illustrate' usually means to use an example to clarify a point.","Keywords":"illustrate, example","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R233","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"emphasize 表示作者在强化某个重点。","English":"'Emphasize' means the author is stressing a particular point.","Keywords":"emphasize","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R234","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"challenge 表示作者质疑或反驳已有观点。","English":"'Challenge' means the author questions or argues against an existing view.","Keywords":"challenge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R235","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"qualify 表示作者限制或修正一个说法。","English":"'Qualify' means the author limits or modifies a claim.","Keywords":"qualify","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R236","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"establish 表示先建立背景、概念或依据。","English":"'Establish' means to set up background, a concept, or a basis.","Keywords":"establish","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R237","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"如果选项动词太强，比如 prove，要看文本有没有真的证明。","English":"If the verb in the choice is too strong, such as 'prove,' check whether the text actually proves it.","Keywords":"strong verb, prove","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R238","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"目的题要排除只描述局部细节的选项。","English":"In purpose questions, eliminate choices that describe only local details.","Keywords":"local detail, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R239","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"科学实验文本要区分研究目的、实验结果和作者提到研究的目的。","English":"In scientific research texts, distinguish the research purpose, the experimental result, and the author's purpose in mentioning the study.","Keywords":"research purpose, author purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R240","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"文学目的题不能随意上升到人生哲理，必须贴合文本。","English":"In literary purpose questions, do not jump to a broad life lesson; stay close to the text.","Keywords":"literary purpose, overinterpretation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R241","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"诗歌目的题要看标题、导言、情感转折和重复意象。","English":"For a poem purpose question, look at the title, introduction, emotional shift, and repeated imagery.","Keywords":"poem, imagery","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R242","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"如果答案只说 what，却没有 why，它通常不是 purpose。","English":"If a choice only states what, but not why, it is usually not the purpose.","Keywords":"what vs why","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R243","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"让学生用 Because the author wants to... 来测试选项。","English":"Ask students to test the choice with: Because the author wants to...","Keywords":"test phrase, purpose","Example":"Because the author wants to...","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R244","Subject":"ReadingV2","Unit":"Text Purpose","Level":2,"Chinese":"目的题最后要检查：这个目的能不能解释整段材料的存在？","English":"Finally, check whether this purpose can explain why the whole text exists.","Keywords":"whole text, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R245","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"双篇题先分别概括 Text 1 和 Text 2 的观点。","English":"For a cross-text question, summarize the viewpoint of Text 1 and Text 2 separately first.","Keywords":"Text 1, Text 2, viewpoint","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R246","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"先看题干问谁回应谁。","English":"First check who is responding to whom in the question stem.","Keywords":"responder, target","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R247","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"Text 2 是支持 Text 1，还是质疑 Text 1？","English":"Does Text 2 support Text 1, or challenge Text 1?","Keywords":"support, challenge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R248","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"两篇文本的共同点是什么？","English":"What do the two texts have in common?","Keywords":"common point","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R249","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"两篇文本的差异点是什么？","English":"What is the difference between the two texts?","Keywords":"difference","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R250","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"如果题干有 both，就找共同点。","English":"If the stem uses 'both,' look for a shared point.","Keywords":"both, shared point","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R251","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"如果题干有 whereas 或 while，就找差异。","English":"If the stem uses 'whereas' or 'while,' look for a contrast.","Keywords":"whereas, while, contrast","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R252","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"先用 Text 1 排除，再用 Text 2 定答案。","English":"Use Text 1 to eliminate choices first, then use Text 2 to confirm the answer.","Keywords":"elimination, confirmation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R253","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"不要把 Text 1 的观点放到 Text 2 作者嘴里。","English":"Do not put Text 1's view into the mouth of the author of Text 2.","Keywords":"author confusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R254","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":1,"Chinese":"双篇题最怕立场混淆。","English":"The biggest risk in cross-text questions is confusing the positions.","Keywords":"position, cross-text","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R255","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"response 类题目要判断回应方会如何评价被回应方的具体观点。","English":"In a response question, decide how the responding author would evaluate the specific view of the other text.","Keywords":"response, evaluation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R256","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"支持不一定是完全支持，也可能是部分支持加补充。","English":"Support does not have to be total support; it may be partial support plus an addition.","Keywords":"partial support","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R257","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"质疑不一定是完全反驳，也可能是认为证据不充分。","English":"Challenge does not have to be total rejection; it may mean the evidence is insufficient.","Keywords":"insufficient evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R258","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"with concessions 表示有让步的态度，不是简单正或负。","English":"'With concessions' means an attitude with qualifications, not a simple positive or negative stance.","Keywords":"concession, attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R259","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"neutral 态度可能只是补充信息，不直接评价。","English":"A neutral attitude may simply add information without directly evaluating the other text.","Keywords":"neutral attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R260","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"valid, reasonable, rigorous 通常提示认可或支持。","English":"Words like 'valid,' 'reasonable,' and 'rigorous' usually suggest approval or support.","Keywords":"positive evaluation","Example":"valid, reasonable, rigorous","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R261","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"insufficient, questionable, premature 通常提示质疑。","English":"Words like 'insufficient,' 'questionable,' and 'premature' usually suggest skepticism or challenge.","Keywords":"negative evaluation","Example":"insufficient, questionable, premature","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R262","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"biased 在研究语境中常指数据或方法有偏差。","English":"In a research context, 'biased' often means that the data or method is skewed or unreliable.","Keywords":"biased, research","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R263","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"empirical 指实证或实验数据，不是日常经验感受。","English":"'Empirical' refers to evidence from observation or experiment, not just personal experience.","Keywords":"empirical, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R264","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"不要只根据态度词选答案，态度词必须和完整选项匹配。","English":"Do not choose based only on an attitude word; the attitude must match the whole choice.","Keywords":"attitude word, full choice","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R265","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"如果 Text 2 提供新证据，问它会怎样改变 Text 1 的结论。","English":"If Text 2 provides new evidence, ask how it would affect Text 1's conclusion.","Keywords":"new evidence, conclusion","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R266","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"如果两篇都讨论同一主题，先找它们的切入角度是否不同。","English":"If both texts discuss the same topic, first see whether they approach it from different angles.","Keywords":"same topic, different angle","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R267","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"双篇共同点题不能选只符合一篇的内容。","English":"For a shared-point question, do not choose something that fits only one text.","Keywords":"both, one text only","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R268","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"双篇差异题不能选两篇都同意的内容。","English":"For a difference question, do not choose something that both texts agree on.","Keywords":"difference, shared view","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R269","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"让学生用 Text 1 says..., while Text 2 says... 造句。","English":"Ask students to use the frame: Text 1 says..., while Text 2 says...","Keywords":"student prompt, frame","Example":"Text 1 says..., while Text 2 says...","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R270","Subject":"ReadingV2","Unit":"Cross-text Connections","Level":2,"Chinese":"最后检查回应关系是否具体指向题干里的观点，而不是泛泛谈主题。","English":"Finally, check whether the response addresses the specific claim in the stem, not just the general topic.","Keywords":"specific claim, topic","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R271","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"central idea 要覆盖全文大部分信息。","English":"The central idea must cover most of the text.","Keywords":"central idea, coverage","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R272","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"主旨不是第一句话的简单复制。","English":"The main idea is not simply a copy of the first sentence.","Keywords":"main idea, first sentence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R273","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"先抓每句话的主干，再合并。","English":"Find the core of each sentence first, then combine them.","Keywords":"sentence core, combine","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R274","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"信息类文本要抓研究发现或主要论点。","English":"For informational texts, identify the research finding or main claim.","Keywords":"informational text, finding, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R275","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"文学文本要抓人物、情境和变化。","English":"For literary texts, identify the character, situation, and change.","Keywords":"literature, character, change","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R276","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"诗歌要抓对象、情感和主要目的。","English":"For poems, identify the object, emotion, and main purpose.","Keywords":"poem, emotion, purpose","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R277","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"过窄的选项只说了一个细节。","English":"A too-narrow choice states only one detail.","Keywords":"too narrow","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R278","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"过宽的选项超出了文本范围。","English":"A too-broad choice goes beyond the text.","Keywords":"too broad","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R279","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"矛盾选项和文本方向相反。","English":"A contradictory choice goes against the direction of the text.","Keywords":"contradictory","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R280","Subject":"ReadingV2","Unit":"Central Ideas","Level":1,"Chinese":"主旨题要避免凭常识补充。","English":"In central idea questions, avoid adding outside knowledge.","Keywords":"outside knowledge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R281","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"主旨要体现 majority of details and particular emphasis。","English":"The main idea should reflect the majority of details and the text's particular emphasis.","Keywords":"majority, emphasis","Example":"majority of details and particular emphasis","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R282","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"如果文本先背景后转折，主旨通常更接近转折后的重点。","English":"If the text gives background and then a contrast, the main idea is usually closer to the later emphasis.","Keywords":"contrast, emphasis","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R283","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"如果文本主要是实验，主旨通常围绕研究发现而不是实验器材。","English":"If the text is mainly about an experiment, the central idea usually centers on the finding, not the equipment.","Keywords":"experiment, finding","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R284","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"如果文本主要是观点争议，主旨要保留争议双方或作者立场。","English":"If the text is about a debate, the central idea should preserve the opposing views or the author's position.","Keywords":"debate, position","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R285","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"如果选项只说例子，没有说例子服务的观点，它太窄。","English":"If a choice states only the example but not the point it serves, it is too narrow.","Keywords":"example, point","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R286","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"如果选项加入作者没有表达的态度，它就是过度推断。","English":"If a choice adds an attitude the author does not express, it is an over-inference.","Keywords":"attitude, over-inference","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R287","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"倒推检查：这个选项能解释文本中大多数句子吗？","English":"Reverse-check: can this choice explain most sentences in the text?","Keywords":"reverse check","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R288","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"主旨题中，最准确的答案往往语气更稳、更有限。","English":"In central idea questions, the most accurate answer is often more moderate and limited.","Keywords":"moderate, limited","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R289","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"文学主旨不能只说人物感觉，还要说感觉来自什么情境。","English":"A literary central idea should not only state a feeling; it should state the situation behind that feeling.","Keywords":"literary central idea","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R290","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"诗歌主旨不能只抓一个意象，要看意象共同指向的情感或主题。","English":"A poem's central idea should not focus on one image only; it should capture the emotion or theme the images point to.","Keywords":"imagery, theme","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R291","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"主旨选项如果没有提到文本的核心矛盾或发现，通常不够完整。","English":"If a central idea choice misses the core conflict or finding, it is usually incomplete.","Keywords":"conflict, finding","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R292","Subject":"ReadingV2","Unit":"Central Ideas","Level":2,"Chinese":"让学生用一句话回答：这段主要想让读者知道什么？","English":"Ask students to answer in one sentence: what does this text mainly want the reader to know?","Keywords":"student prompt, one-sentence summary","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R293","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"细节题先找题干里的定位词。","English":"For a detail question, first find the locator in the stem.","Keywords":"detail, locator","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R294","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"定位后要读完整句，不要只看关键词。","English":"After locating the information, read the whole sentence, not just the keyword.","Keywords":"whole sentence, keyword","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R295","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"必要时读前一句和后一句。","English":"Read the previous and next sentences when necessary.","Keywords":"adjacent sentences","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R296","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"题干问什么，就只回答什么。","English":"Answer exactly what the question asks.","Keywords":"exact answer","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R297","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"不要把局部细节扩大成全文结论。","English":"Do not turn a local detail into a conclusion about the whole text.","Keywords":"local detail, whole text","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R298","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"正确答案常常是原文细节的同义改写。","English":"The correct answer is often a paraphrase of a detail from the text.","Keywords":"detail, paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R299","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"如果选项有原文词，也要检查关系是否对。","English":"Even if a choice uses original words, check whether the relationship is correct.","Keywords":"word trap, relation","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R300","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"细节题不能凭常识补充。","English":"In detail questions, do not add outside knowledge.","Keywords":"outside knowledge","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R301","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"看清限定词，比如 some, most, may, only。","English":"Pay attention to qualifiers such as 'some,' 'most,' 'may,' and 'only.'","Keywords":"qualifier","Example":"some / most / may / only","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R302","Subject":"ReadingV2","Unit":"Details","Level":1,"Chinese":"看清比较对象，别把 A 和 B 换了。","English":"Pay attention to the comparison objects; do not switch A and B.","Keywords":"comparison objects","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R303","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"定位只是第一步，验证选项才是关键。","English":"Locating the line is only the first step; verifying the choice is the key.","Keywords":"locate, verify","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R304","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"细节题证据可以是同义词、上义词、下义词或相同态度。","English":"Evidence in detail questions can appear as a synonym, hypernym, hyponym, or similar attitude.","Keywords":"synonym, hypernym, hyponym, attitude","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R305","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"选项如果改变了时间、地点、人物或条件，就是错位。","English":"If a choice changes the time, place, person, or condition, it is mismatched.","Keywords":"mismatch, condition","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R306","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"选项如果改变了因果关系，即使主题相同也错。","English":"If a choice changes the causal relationship, it is wrong even if the topic is the same.","Keywords":"causality, detail","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R307","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"选项如果只对应定位句的一半，通常不完整。","English":"If a choice matches only half of the located sentence, it is usually incomplete.","Keywords":"partial match","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R308","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"相同语义场不等于相同答案，要看题干需求。","English":"A shared semantic field does not automatically mean the same answer; check the stem's demand.","Keywords":"semantic field","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R309","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"细节题的 correct answer 要能被原文直接支持。","English":"The correct answer to a detail question must be directly supported by the text.","Keywords":"direct support","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R310","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"如果要解释学生为什么错，让他指出原文哪几个词支持他的选项。","English":"To explain an error, ask the student to point to the exact words in the text that support the choice.","Keywords":"student prompt, text support","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R311","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"如果找不到直接支持，就不能靠印象选。","English":"If we cannot find direct support, we cannot choose based on impression.","Keywords":"direct support, impression","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R312","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"细节题最后检查：选项是否完整、准确、没有新增信息？","English":"Final check for details: is the choice complete, accurate, and free of new information?","Keywords":"final check","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R313","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"不要把作者提到的他人观点当成作者自己的观点。","English":"Do not treat another person's view mentioned in the text as the author's own view.","Keywords":"reported view, author view","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R314","Subject":"ReadingV2","Unit":"Details","Level":2,"Chinese":"如果文本用否定表达，选项可能用正向改写，需要小心。","English":"If the text uses a negative expression, the choice may paraphrase it positively; be careful.","Keywords":"negative, positive paraphrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R315","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"证据题先找 claim。","English":"In an evidence question, identify the claim first.","Keywords":"claim, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R316","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"claim 是要被证明的核心。","English":"The claim is the core idea that needs to be proven.","Keywords":"claim, prove","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R317","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"正确引文必须直接支持 claim。","English":"The correct quotation must directly support the claim.","Keywords":"quotation, direct support","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R318","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"不要选只是主题相关的引文。","English":"Do not choose a quotation that is merely related to the topic.","Keywords":"topic-related","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R319","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"如果 claim 有两个要素，证据也要覆盖两个要素。","English":"If the claim has two elements, the evidence must cover both.","Keywords":"two elements, claim","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R320","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"先把 claim 改写成一个可测试短语。","English":"First rewrite the claim as a testable phrase.","Keywords":"test phrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R321","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"再问每个引文能不能证明这个短语。","English":"Then ask whether each quotation can prove that phrase.","Keywords":"prove, test phrase","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R322","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"引文证据题不是问哪句话最好听。","English":"A quotation evidence question is not asking which sentence sounds best.","Keywords":"quotation, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R323","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"文学证据要看人物情感、动作和场景细节。","English":"For literary evidence, look at character emotion, actions, and setting details.","Keywords":"literary evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R324","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":1,"Chinese":"信息类证据要看事实、发现或解释是否对应 claim。","English":"For informational evidence, check whether the fact, finding, or explanation matches the claim.","Keywords":"informational evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R325","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"Text Purpose/Structure 常是 Description → Generalization；CTE 是 Generalization → Specific Evidence。","English":"Text Purpose or Structure often moves from Description to Generalization; CTE moves from Generalization to Specific Evidence.","Keywords":"Description to Generalization, CTE","Example":"Description → Generalization / Generalization → Specific Evidence","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R326","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"claim 中的形容词和态度词也需要被证据支持。","English":"Adjectives and attitude words in the claim also need to be supported by the evidence.","Keywords":"attitude word, adjective","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R327","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果引文只证明主题存在，但不能证明 claim 的评价，它不够。","English":"If a quotation only proves the topic exists but not the claim's evaluation, it is not enough.","Keywords":"evaluation, evidence","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R328","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"如果引文只支持 claim 的背景，不支持核心判断，它是干扰项。","English":"If a quotation supports only the background of the claim but not the core judgment, it is a distractor.","Keywords":"background, core judgment","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R329","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"双重否定的 claim 要先转成正向意思。","English":"For a claim with double negatives, convert it into a positive meaning first.","Keywords":"double negative","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R330","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"人物心理的证据可以来自动作、语言、环境反应，不一定直接说情绪。","English":"Evidence for a character's psychology can come from actions, speech, or reactions to setting, not only direct emotion words.","Keywords":"character psychology","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R331","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"场景证据只有在它能说明人物或主题时才有用。","English":"Setting evidence is useful only when it explains the character or theme.","Keywords":"setting, theme","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R332","Subject":"ReadingV2","Unit":"Textual Evidence - Quotation","Level":2,"Chinese":"科学证据要检查对象和结果是否都对应 claim。","English":"For scientific evidence, check whether both the object and the result match the claim.","Keywords":"science, object, result","Example":"","Source":"SAT阅读知识点汇总 + 差异对照报告"},{"ID":"R333","Subject":"ReadingV2","U

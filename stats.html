<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thinkcloze Stats</title>
  <meta name="description" content="Thinkcloze usage statistics.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --ink: #202020;
      --muted: #666666;
      --teal: #168a83;
      --border: #d9d9d9;
      --soft: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #ffffff;
      font-family: Arial, Helvetica, "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(820px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    a {
      color: var(--teal);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    th,
    td {
      border-bottom: 1px solid #ececec;
      padding: 15px 0;
      text-align: left;
    }

    th {
      color: #111111;
      font-size: 14px;
      font-weight: 800;
    }

    td:last-child,
    th:last-child {
      text-align: right;
    }

    .value {
      font-size: 20px;
      font-weight: 800;
    }

    .status {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      color: #9b3b3b;
    }

    @media (max-width: 560px) {
      main {
        width: min(100vw - 28px, 820px);
        padding: 24px 0;
      }

      .top {
        flex-direction: column;
        gap: 8px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>Usage Stats</h1>
        <p>Simple counts for current Thinkcloze usage.</p>
      </div>
      <a href="./index.html">Back Home</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>指标</th>
          <th>数量</th>
        </tr>
      </thead>
      <tbody id="statsRows">
        <tr>
          <td>加载中</td>
          <td class="value">...</td>
        </tr>
      </tbody>
    </table>
    <div class="status" id="statusText"></div>
  </main>

  <script>
    const appConfig = window.THINKCLOZE_CONFIG || {};
    const supabaseUrl = appConfig.SUPABASE_URL || "https://ceqdjnljlfrybjyjqgse.supabase.co";
    const supabasePublishableKey = appConfig.SUPABASE_PUBLISHABLE_KEY || "sb_publishable_YTOBM7PpJ5lq7rWBcby14Q_T1-PtSj6";
    const supabaseClient = window.supabase && supabaseUrl && supabasePublishableKey
      ? window.supabase.createClient(supabaseUrl, supabasePublishableKey)
      : null;

    const labels = [
      { key: "users", label: "用户" },
      { key: "quiz_started", label: "点击题目" },
      { key: "half_complete", label: "填写超过5空" },
      { key: "submitted", label: "提交" },
      { key: "attempts", label: "答题记录" }
    ];

    loadStats();

    async function loadStats() {
      const rows = document.getElementById("statsRows");
      const status = document.getElementById("statusText");
      if (!supabaseClient) {
        rows.innerHTML = "";
        status.textContent = "Supabase is not configured.";
        status.classList.add("error");
        return;
      }

      const { data, error } = await supabaseClient.rpc("get_public_stats");
      if (error) {
        rows.innerHTML = "";
        status.textContent = error.message;
        status.classList.add("error");
        return;
      }

      const values = Object.fromEntries((data || []).map(item => [item.metric, item.value]));
      rows.innerHTML = labels.map(item => `
        <tr>
          <td>${item.label}</td>
          <td class="value">${Number(values[item.key] || 0)}</td>
        </tr>
      `).join("");
      status.textContent = `Updated ${new Date().toLocaleString()}`;
    }
  </script>
</body>
</html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SAT阅读词汇" />
<meta name="theme-color" content="#3157d5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>SAT阅读词汇</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#70758a;--line:#e6e7ef;--primary:#3157d5;--good:#0a8f5a;--bad:#ce2f45;--chip:#eef2ff;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:18px 14px 40px;} header{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.92);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:4px 0 6px} .sub{color:var(--muted);font-size:13px;line-height:1.45} .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
.list-switch{display:grid;grid-template-columns:auto minmax(0,240px);gap:8px;align-items:center;margin:10px 0 0}.list-switch label{font-size:13px;color:var(--muted);font-weight:700}.list-switch select{margin:0}
button,select,input{font:inherit} .tab,.btn{border:0;border-radius:14px;padding:11px 10px;background:#fff;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.04);}
.tab.active,.btn.primary{background:var(--primary);color:white} .btn{width:100%;margin:6px 0;font-weight:650} .btn.ghost{background:#fff;border:1px solid var(--line)} .btn.good{background:var(--good);color:white} .btn.bad{background:var(--bad);color:white}
.panel{display:none} .panel.active{display:block} .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(28,32,54,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap} .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--chip);padding:5px 9px;font-size:12px;color:#293b8f;margin:3px}
.word{font-size:34px;font-weight:800;line-height:1.15;margin:24px 0 18px;word-break:break-word} .meaning{font-size:22px;line-height:1.45;margin:16px 0} .note{color:var(--muted);font-size:14px;line-height:1.55;background:#fafafd;border-radius:14px;padding:10px;margin-top:10px}
select,input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;margin:6px 0 10px} .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center} .num{font-size:22px;font-weight:800} .label{font-size:12px;color:var(--muted)}
.option{width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff} .option.correct{border-color:var(--good);background:#eefaf5} .option.wrong{border-color:var(--bad);background:#fff0f2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.btn.star{background:#fff8df;border:1px solid #f0d36a;color:#765a00}.btn.done{background:#eefaf5;border:1px solid #9dddbf;color:#075f3b}
.listItem{padding:12px 0;border-bottom:1px solid var(--line)} .small{font-size:12px;color:var(--muted)} .hidden{display:none} .center{text-align:center} a{color:var(--primary)} .phonetic{color:var(--muted);font-size:16px;margin:-8px 0 10px;line-height:1.35}.speakBtn{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;font-size:13px;background:#fff;border:1px solid var(--line);box-shadow:none;margin:2px 0 8px}

@media (min-width: 900px){
  .app{max-width:980px;padding:14px 18px 28px;}
  h1{font-size:20px;margin:2px 0 4px;}
  .sub{font-size:12px;}
  .tabs{gap:8px;margin:10px 0 8px;}
  .tab,.btn{border-radius:12px;padding:8px 9px;font-size:14px;}
  .card{border-radius:18px;padding:14px;margin:10px 0;}
  .word{font-size:26px;margin:14px 0 12px;line-height:1.12;}
  .meaning{font-size:18px;margin:10px 0;}
  .note{font-size:13px;line-height:1.4;padding:8px;margin-top:8px;}
  select,input{padding:9px;border-radius:12px;margin:4px 0 8px;font-size:14px;}
  .stats{gap:8px;}
  .stat{border-radius:14px;padding:8px;}
  .num{font-size:18px;}
  .label{font-size:11px;}
  .option{margin:6px 0;padding:10px 12px;border-radius:13px;font-size:15px;line-height:1.3;}
  .phonetic{font-size:14px;margin:-6px 0 8px}.speakBtn{font-size:12px;padding:6px 10px;}
  .actions{gap:8px;margin-top:8px}.actions .btn{font-size:14px;padding:8px 9px;}
  .pill{font-size:11px;padding:4px 8px;}
  .listItem{padding:9px 0;}
}
@media (max-width: 480px){
  .word{font-size:30px;}
  .meaning{font-size:20px;}
  .option{padding:13px;font-size:16px;}
}

</style>
</head>
<body><div class="app">
<header><h1 id="appTitle">SAT阅读词汇</h1><div class="sub" id="appSub">数据保存在本机浏览器，不上传。</div><div class="list-switch"><label for="datasetSelect">词表</label><select id="datasetSelect"></select></div>
<div class="tabs"><button class="tab active" data-tab="study">背词</button><button class="tab" data-tab="quiz">测验</button><button class="tab" data-tab="review">复习</button><button class="tab" data-tab="wrong">错题</button><button class="tab" data-tab="list">词表</button></div></header>

<section id="study" class="panel active">
<div class="card"><label>选择范围</label><select id="scope"></select><div class="stats"><div class="stat"><div class="num" id="totalN">0</div><div class="label">当前词数</div></div><div class="stat"><div class="num" id="knownN">0</div><div class="label">已掌握</div></div><div class="stat"><div class="num" id="wrongN">0</div><div class="label">错题</div></div><div class="stat"><div class="num" id="dueN">0</div><div class="label">今日复习</div></div></div></div>
<div class="card center"><div id="cardMeta"></div><div class="word" id="studyTerm">—</div><div class="phonetic" id="studyPhonetic"></div><button class="speakBtn" id="studySpeakBtn" type="button">🔊 发音</button><button class="btn primary" id="showBtn">显示答案</button><div id="answerBox" class="hidden"><div class="meaning" id="studyMeaning"></div><div class="note" id="studyNote"></div><button class="btn good" id="knowBtn">认识 / 掌握</button><button class="btn bad" id="dontKnowBtn">不认识 / 加入错题</button></div><button class="btn ghost" id="nextBtn">下一个</button></div>
</section>

<section id="quiz" class="panel">
<div class="card"><label>测验范围</label><select id="quizScope"></select><button class="btn primary" id="startQuiz">开始 / 下一题</button></div>
<div class="card"><div id="quizMeta"></div><div class="word" id="quizTerm">点击开始</div><div class="phonetic" id="quizPhonetic"></div><button class="speakBtn" id="quizSpeakBtn" type="button">🔊 发音</button><div id="options"></div><div class="actions"><button class="btn star" id="favQuizBtn">☆ 收藏</button><button class="btn done" id="knownQuizBtn">认识 / 不再显示</button></div><div id="quizFeedback" class="note hidden"></div></div>
</section>


<section id="review" class="panel">
<div class="card"><div class="row"><strong>艾宾浩斯复习</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="startReview">开始今日复习</button></div><div class="small">单词达到“已掌握”后，会按 1 天、3 天、7 天、15 天、30 天的间隔进入复习。复习答对进入下一轮；答错会回到错题本并重新计算。</div></div>
<div class="card"><div id="reviewMeta"></div><div class="word" id="reviewTerm">今日到期词会显示在这里</div><div class="phonetic" id="reviewPhonetic"></div><button class="speakBtn hidden" id="reviewSpeakBtn" type="button">🔊 发音</button><div id="reviewOptions"></div><div id="reviewFeedback" class="note hidden"></div></div>
<div class="card" id="reviewList"></div>
</section>
<section id="wrong" class="panel"><div class="card"><div class="row"><strong>错题本</strong><button class="btn primary" style="width:auto;padding:9px 12px" id="wrongQuizBtn">错题集中测验</button><button class="btn ghost" style="width:auto;padding:9px 12px" id="clearWrong">清空</button></div><div class="small">答错或点“不认识”的词会自动出现在这里；点击“错题集中测验”可以只练错题。手动标记已掌握，或测试正确累计 5 次后，该词会从后续测试中排除。</div></div><div class="card" id="wrongList"></div></section>
<section id="list" class="panel"><div class="card"><input id="search" placeholder="搜索单词、中文意思、题号…"/><select id="listScope"></select></div><div class="card" id="wordList"></div></section>
</div>

state.known ||= []; state.wrong ||= []; state.favorite ||= []; state.idx ||= 0; state.correctCounts ||= {}; state.review ||= {};

const REVIEW_INTERVALS=[1,3,7,15,30];

function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
let quizCurrent=null;
let quizAutoTimer=null;
function startQuiz(){
  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer=null;}
  let arr=practiceFiltered(byId('quizScope').value);
  if(arr.length<2){byId('quizTerm').textContent='待测词数不足'; byId('quizPhonetic').textContent=''; byId('quizSpeakBtn').classList.add('hidden'); byId('quizMeta').innerHTML='已掌握的词不会再显示。'; byId('options').innerHTML=''; byId('quizFeedback').classList.add('hidden'); return}
  quizCurrent=sample(arr,1)[0];
  byId('quizMeta').innerHTML=chip(quizCurrent);
  byId('quizTerm').textContent=quizCurrent.term;
  byId('quizPhonetic').textContent=phonetic(quizCurrent);
  byId('quizSpeakBtn').classList.remove('hidden');
  byId('quizSpeakBtn').onclick=()=>speakTerm(quizCurrent.term);
  autoSpeakTerm(quizCurrent.term);
  updateQuizActionButtons();
  let wrongs=sample(WORDS.filter(w=>w.id!==quizCurrent.id),3).map(w=>w.meaning);

    if(!ok){
      state.wrong=[...new Set([...state.wrong,quizCurrent.id])];
      [...document.querySelectorAll('.option')].forEach(x=>{if(x.textContent===quizCurrent.meaning)x.classList.add('correct');});

      state.correctCounts[quizCurrent.id]=(state.correctCounts[quizCurrent.id]||0)+1;
      if(state.correctCounts[quizCurrent.id]>=5){
        markKnown(quizCurrent.id);

    save();
    byId('quizFeedback').classList.remove('hidden');
    if(ok){

    updateStats();
    if(ok){quizAutoTimer=setTimeout(startQuiz,650);}
  })
}

  if(!quizCurrent) return;
  markKnown(quizCurrent.id);
  save(); renderWrong(); renderList(); updateStats(); startQuiz();
};
byId('startQuiz').onclick=startQuiz;

let reviewCurrent=null;
function startReview(){
  let arr=dueReviewWords();
  if(arr.length<1){reviewCurrent=null; byId('reviewTerm').textContent='今天没有到期复习词'; byId('reviewPhonetic').textContent=''; byId('reviewSpeakBtn').classList.add('hidden'); byId('reviewMeta').innerHTML=''; byId('reviewOptions').innerHTML=''; byId('reviewFeedback').classList.add('hidden'); renderReview(); updateStats(); return;}
  reviewCurrent=sample(arr,1)[0];
  byId('reviewMeta').innerHTML=chip(reviewCurrent);
  byId('reviewTerm').textContent=reviewCurrent.term;
  byId('reviewPhonetic').textContent=phonetic(reviewCurrent);
  byId('reviewSpeakBtn').classList.remove('hidden');
  byId('reviewSpeakBtn').onclick=()=>speakTerm(reviewCurrent.term);
  autoSpeakTerm(reviewCurrent.term);
  let wrongs=sample(WORDS.filter(w=>w.id!==reviewCurrent.id),3).map(w=>w.meaning);
  let opts=sample([reviewCurrent.meaning,...wrongs],4);
  byId('reviewOptions').innerHTML=opts.map(o=>`<button class="option reviewOption">${o}</button>`).join('');
  byId('reviewFeedback').classList.add('hidden');
  [...document.querySelectorAll('.reviewOption')].forEach(b=>b.onclick=()=>{
    let ok=b.textContent===reviewCurrent.meaning;
    [...document.querySelectorAll('.reviewOption')].forEach(x=>x.disabled=true);
    b.classList.add(ok?'correct':'wrong');
    if(ok){
      const r=reviewInfo(reviewCurrent.id) || {stage:0};
      const nextStage=Math.min((r.stage||0)+1, REVIEW_INTERVALS.length-1);
      scheduleReview(reviewCurrent.id,nextStage);
      byId('reviewFeedback').textContent=`复习正确！下次复习间隔：${REVIEW_INTERVALS[nextStage]} 天。正在进入下一题…`;
      setTimeout(startReview,750);
    }else{
      failReview(reviewCurrent.id);
      [...document.querySelectorAll('.reviewOption')].forEach(x=>{if(x.textContent===reviewCurrent.meaning)x.classList.add('correct');});
      byId('reviewFeedback').textContent='复习错误，已放回错题本。正确答案：'+reviewCurrent.meaning;
    }
    byId('reviewFeedback').classList.remove('hidden');
    save(); renderWrong(); renderReview(); updateStats(); renderList();
  });
}
function renderReview(){
  let arr=dueReviewWords();
  byId('reviewList').innerHTML = arr.length ? `<div class="small">今日到期 ${arr.length} 个</div>` + arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div></div>`).join('') : '<div class="small">今天没有到期复习词。已掌握词会按 1/3/7/15/30 天自动进入这里。</div>';
}
byId('startReview').onclick=startReview;

function renderWrong(){let arr=WORDS.filter(w=>state.wrong.includes(w.id)); byId('wrongList').innerHTML=arr.length?arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div><div class="small">${w.note||''}</div></div>`).join(''):'暂无错题。';}
byId('clearWrong').onclick=()=>{const activeIds=new Set(WORDS.map(w=>w.id)); state.wrong=state.wrong.filter(id=>!activeIds.has(id));save();renderWrong();updateStats();}
byId('wrongQuizBtn').onclick=()=>{byId('quizScope').value='wrong'; document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active')); document.querySelector('[data-tab="quiz"]').classList.add('active'); byId('quiz').classList.add('active'); startQuiz();};
function renderList(){let scope=byId('listScope').value, kw=byId('search').value.trim().toLowerCase(); let arr=filtered(scope).filter(w=>(w.term+w.meaning+w.question+w.note).toLowerCase().includes(kw)); byId('wordList').innerHTML=`<div class="small">显示 ${arr.length} 个</div>`+arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div><div class="small">${w.note||''}</div></div>`).join('');}
byId('search').oninput=renderList; byId('listScope').onchange=renderList;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active')); t.classList.add('active'); byId(t.dataset.tab).classList.add('active'); renderList(); renderWrong(); renderReview(); updateStats();});
document.addEventListener('click', e=>{const btn=e.target.closest('[data-speak]'); if(btn){e.preventDefault(); speakTerm(btn.dataset.speak);}});
pickStudy(); renderList(); renderWrong(); renderReview();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

</script>
</body></html>

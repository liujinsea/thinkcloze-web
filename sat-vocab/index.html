<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base href="/sat-vocab/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAT Vocabulary</title>
  <meta name="description" content="SAT vocabulary lists for flashcards, quizzes, mistakes, favorites, and spaced review.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#3157d5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #171827;
      --muted: #686f82;
      --line: #e1e5ef;
      --primary: #3157d5;
      --primary-dark: #2444ad;
      --shadow: 0 14px 36px rgba(27, 35, 68, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    header {
      margin-bottom: 28px;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .home-link {
      display: inline-flex;
      width: fit-content;
      margin: 0 0 14px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 190px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .auth-actions {
      display: flex;
      gap: 8px;
    }

    .auth-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(23, 24, 39, 0.45);
      backdrop-filter: blur(6px);
    }

    .auth-panel {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 18px 44px rgba(23, 24, 39, 0.22);
      padding: 20px;
    }

    .auth-panel h2 {
      margin: 0;
      font-size: 22px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }

    .auth-tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .auth-field label {
      display: block;
      margin: 10px 0 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .auth-field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
    }

    .auth-message {
      min-height: 20px;
      margin: 10px 0;
      color: #ce2f45;
      font-size: 13px;
      line-height: 1.45;
    }

    .auth-message.success {
      color: #0a8f5a;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.05;
      font-weight: 800;
    }

    .intro {
      max-width: 620px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .list-card {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
    }

    .list-card:hover,
    .list-card:focus-visible {
      border-color: rgba(49, 87, 213, 0.45);
      outline: none;
      transform: translateY(-1px);
    }

    .list-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }

    .list-meta {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
    }

    .list-card:hover .start,
    .list-card:focus-visible .start {
      background: var(--primary-dark);
    }

    @media (max-width: 520px) {
      main {
        padding: 30px 14px 44px;
      }

      .intro {
        font-size: 15px;
      }

      .top-row,
      .auth-box {
        align-items: flex-start;
        flex-direction: column;
      }

      .list-card {
        min-height: 172px;
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-panel">
      <h2 id="authTitle">登录后保存进度</h2>
      <p class="intro">登录后，测验记录、错题和复习进度会保存到你的账号。</p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" type="button">登录</button>
        <button class="auth-tab" id="registerTab" type="button">注册</button>
      </div>
      <form id="authForm">
        <div class="auth-field">
          <label for="authEmail">邮箱</label>
          <input id="authEmail" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input id="authPassword" type="password" autocomplete="current-password" required minlength="6">
        </div>
        <div class="auth-message" id="authMessage"></div>
        <div class="auth-actions">
          <button class="auth-btn primary" id="authSubmit" type="submit">登录</button>
          <button class="auth-btn" id="authCancel" type="button">取消</button>
        </div>
      </form>
    </div>
  </div>

  <main>
    <header>
      <a class="home-link" href="/">返回 ThinkCloze</a>
      <div class="top-row">
        <div>
          <h1>SAT Vocabulary</h1>
          <p class="intro">选择一个词表开始背诵。后续新增的 SAT 词表会继续放在这里。</p>
        </div>
        <div class="auth-box">
          <span id="authStatus">正在检查登录状态...</span>
          <div class="auth-actions">
            <button class="auth-btn primary" id="loginBtn" type="button">登录 / 注册</button>
            <button class="auth-btn hidden" id="logoutBtn" type="button">退出</button>
          </div>
        </div>
      </div>
    </header>

    <section class="list-grid" aria-label="Vocabulary lists">
      <a class="list-card" href="/sat-vocab/SAT2020605A/?mode=overall-review&amp;list=202505A&amp;lang=zh">
        <div>
          <h2 class="list-title">Overall Review</h2>
          <p class="list-meta">复习已经测过、但还没有达到 5 次正确或没有标记为已掌握的词。</p>
        </div>
        <span class="start">开始复习</span>
      </a>

      <a class="list-card" href="/sat-vocab/SAT2020605A/?list=202505A&amp;lang=zh">
        <div>
          <h2 class="list-title">202505A</h2>
          <p class="list-meta">206 个词和短语，包含背词、测验、收藏、错题本和艾宾浩斯复习。</p>
        </div>
        <span class="start">开始背词</span>
      </a>

      <a class="list-card" href="/sat-vocab/SAT2020605A/?list=%E8%AF%8D%E6%B1%87%E9%A2%98&amp;lang=zh">
        <div>
          <h2 class="list-title">词汇题</h2>
          <p class="list-meta">186 个词和短语，包含所有词汇题选项、词性和英文释义。</p>
        </div>
        <span class="start">开始背词</span>
      </a>
    </section>
  </main>

  <script>
    const appConfig = window.THINKCLOZE_CONFIG || {};
    const supabaseClient = window.supabase && appConfig.SUPABASE_URL && appConfig.SUPABASE_PUBLISHABLE_KEY
      ? window.supabase.createClient(appConfig.SUPABASE_URL, appConfig.SUPABASE_PUBLISHABLE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true }
        })
      : null;
    let authMode = "login";
    let currentUser = null;
    const byId = id => document.getElementById(id);
    function isAnonymousUser() {
      return !!currentUser && (currentUser.is_anonymous || !currentUser.email);
    }
    function isAuthenticated() {
      return !!currentUser && !!currentUser.email && !isAnonymousUser();
    }
    function setAuthMessage(message, type) {
      byId("authMessage").textContent = message || "";
      byId("authMessage").classList.toggle("success", type === "success");
    }
    function renderAuthStatus() {
      if (!supabaseClient) {
        byId("authStatus").textContent = "云端登录暂不可用";
        byId("loginBtn").classList.add("hidden");
        byId("logoutBtn").classList.add("hidden");
        return;
      }
      if (isAuthenticated()) {
        byId("authStatus").textContent = "已登录：" + currentUser.email;
        byId("loginBtn").classList.add("hidden");
        byId("logoutBtn").classList.remove("hidden");
        return;
      }
      byId("authStatus").textContent = "游客模式：背词可用；登录后保存测验和复习进度";
      byId("loginBtn").classList.remove("hidden");
      byId("logoutBtn").classList.add("hidden");
    }
    function setAuthMode(mode) {
      authMode = mode === "register" ? "register" : "login";
      byId("loginTab").classList.toggle("active", authMode === "login");
      byId("registerTab").classList.toggle("active", authMode === "register");
      byId("authSubmit").textContent = authMode === "register" ? "注册" : "登录";
      byId("authPassword").autocomplete = authMode === "register" ? "new-password" : "current-password";
      setAuthMessage("");
    }
    function showAuth(mode) {
      byId("authModal").classList.remove("hidden");
      setAuthMode(mode || "login");
      setTimeout(() => byId("authEmail").focus(), 60);
    }
    function hideAuth() {
      byId("authModal").classList.add("hidden");
      setAuthMessage("");
    }
    async function initAuth() {
      if (!supabaseClient) {
        renderAuthStatus();
        return;
      }
      const { data } = await supabaseClient.auth.getSession();
      currentUser = data.session ? data.session.user : null;
      renderAuthStatus();
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        currentUser = session ? session.user : null;
        renderAuthStatus();
      });
    }
    async function handleAuthSubmit(event) {
      event.preventDefault();
      const email = byId("authEmail").value.trim().toLowerCase();
      const password = byId("authPassword").value;
      if (!email || !password) {
        setAuthMessage("请输入邮箱和密码。");
        return;
      }
      byId("authSubmit").disabled = true;
      setAuthMessage(authMode === "register" ? "正在创建账号..." : "正在登录...", "success");
      try {
        const result = authMode === "register" && isAnonymousUser()
          ? await supabaseClient.auth.updateUser({ email, password })
          : authMode === "register"
            ? await supabaseClient.auth.signUp({ email, password })
            : await supabaseClient.auth.signInWithPassword({ email, password });
        if (result.error) throw result.error;
        const sessionResult = await supabaseClient.auth.getSession();
        currentUser = sessionResult.data.session ? sessionResult.data.session.user : result.data.user;
        if (!isAuthenticated()) {
          setAuthMessage("请先完成邮箱验证，然后再登录保存进度。", "success");
          return;
        }
        byId("authForm").reset();
        hideAuth();
        renderAuthStatus();
      } catch (error) {
        setAuthMessage(error.message || "登录失败，请稍后再试。");
      } finally {
        byId("authSubmit").disabled = false;
      }
    }
    byId("loginBtn").onclick = () => showAuth("login");
    byId("logoutBtn").onclick = async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      renderAuthStatus();
    };
    byId("loginTab").onclick = () => setAuthMode("login");
    byId("registerTab").onclick = () => setAuthMode("register");
    byId("authForm").onsubmit = handleAuthSubmit;
    byId("authCancel").onclick = hideAuth;
    byId("authModal").addEventListener("click", event => {
      if (event.target === byId("authModal")) hideAuth();
    });
    initAuth();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sat-vocab/service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>

  if(quizAutoTimer){clearTimeout(quizAutoTimer); quizAutoTimer=null;}
  let arr=practiceFiltered(byId('quizScope').value);
  if(arr.length<2){byId('quizTerm').textContent='待测词数不足'; byId('quizPhonetic').textContent=''; byId('quizSpeakBtn').classList.add('hidden'); byId('quizMeta').innerHTML='已掌握的词不会再显示。'; byId('options').innerHTML=''; byId('quizFeedback').classList.add('hidden'); return}
  quizCurrent=sample(arr,1)[0];
  byId('quizMeta').innerHTML=chip(quizCurrent);
  byId('quizTerm').textContent=quizCurrent.term;
  byId('quizPhonetic').textContent=phonetic(quizCurrent);
  byId('quizSpeakBtn').classList.remove('hidden');
  byId('quizSpeakBtn').onclick=()=>speakTerm(quizCurrent.term);
  autoSpeakTerm(quizCurrent.term);
  updateQuizActionButtons();
  let wrongs=sample(WORDS.filter(w=>w.id!==quizCurrent.id),3).map(w=>w.meaning);
  let opts=sample([quizCurrent.meaning,...wrongs],4);
  byId('options').innerHTML=opts.map(o=>`<button class="option">${o}</button>`).join('');
  byId('quizFeedback').classList.add('hidden');
  byId('quizFeedback').textContent='';
  [...document.querySelectorAll('.option')].forEach(b=>b.onclick=()=>{
    let ok=b.textContent===quizCurrent.meaning;
    [...document.querySelectorAll('.option')].forEach(x=>x.disabled=true);
    b.classList.add(ok?'correct':'wrong');
    if(!ok){
      state.wrong=[...new Set([...state.wrong,quizCurrent.id])];
      [...document.querySelectorAll('.option')].forEach(x=>{if(x.textContent===quizCurrent.meaning)x.classList.add('correct');});
    } else {
      state.correctCounts[quizCurrent.id]=(state.correctCounts[quizCurrent.id]||0)+1;
      if(state.correctCounts[quizCurrent.id]>=5){
        markKnown(quizCurrent.id);
      }
    }
    save();
    byId('quizFeedback').classList.remove('hidden');
    if(ok){
      const c=correctCount(quizCurrent.id);
      byId('quizFeedback').textContent = c>=5 ? '正确！已累计 5/5，自动标记为已掌握。正在进入下一题…' : `正确！已累计 ${c}/5。正在进入下一题…`;
    } else {
      byId('quizFeedback').textContent='正确答案：'+quizCurrent.meaning;
    }
    renderWrong();
    updateStats();
    if(ok){quizAutoTimer=setTimeout(startQuiz,650);}
  })
}

function updateQuizActionButtons(){
  if(!quizCurrent){byId('favQuizBtn').textContent='☆ 收藏'; return;}
  byId('favQuizBtn').textContent = state.favorite.includes(quizCurrent.id) ? '★ 已收藏' : '☆ 收藏';
}
byId('favQuizBtn').onclick=()=>{
  if(!quizCurrent) return;
  if(state.favorite.includes(quizCurrent.id)) state.favorite=state.favorite.filter(x=>x!==quizCurrent.id);
  else state.favorite=[...new Set([...state.favorite,quizCurrent.id])];
  save(); updateQuizActionButtons(); byId('quizMeta').innerHTML=chip(quizCurrent); renderList();
};
byId('knownQuizBtn').onclick=()=>{
  if(!quizCurrent) return;
  markKnown(quizCurrent.id);
  save(); renderWrong(); renderList(); updateStats(); startQuiz();
};
byId('startQuiz').onclick=startQuiz;

let reviewCurrent=null;
function startReview(){
  let arr=dueReviewWords();
  if(arr.length<1){reviewCurrent=null; byId('reviewTerm').textContent='今天没有到期复习词'; byId('reviewPhonetic').textContent=''; byId('reviewSpeakBtn').classList.add('hidden'); byId('reviewMeta').innerHTML=''; byId('reviewOptions').innerHTML=''; byId('reviewFeedback').classList.add('hidden'); renderReview(); updateStats(); return;}
  reviewCurrent=sample(arr,1)[0];
  byId('reviewMeta').innerHTML=chip(reviewCurrent);
  byId('reviewTerm').textContent=reviewCurrent.term;
  byId('reviewPhonetic').textContent=phonetic(reviewCurrent);
  byId('reviewSpeakBtn').classList.remove('hidden');
  byId('reviewSpeakBtn').onclick=()=>speakTerm(reviewCurrent.term);
  autoSpeakTerm(reviewCurrent.term);
  let wrongs=sample(WORDS.filter(w=>w.id!==reviewCurrent.id),3).map(w=>w.meaning);
  let opts=sample([reviewCurrent.meaning,...wrongs],4);
  byId('reviewOptions').innerHTML=opts.map(o=>`<button class="option reviewOption">${o}</button>`).join('');
  byId('reviewFeedback').classList.add('hidden');
  [...document.querySelectorAll('.reviewOption')].forEach(b=>b.onclick=()=>{
    let ok=b.textContent===reviewCurrent.meaning;
    [...document.querySelectorAll('.reviewOption')].forEach(x=>x.disabled=true);
    b.classList.add(ok?'correct':'wrong');
    if(ok){
      const r=reviewInfo(reviewCurrent.id) || {stage:0};
      const nextStage=Math.min((r.stage||0)+1, REVIEW_INTERVALS.length-1);
      scheduleReview(reviewCurrent.id,nextStage);
      byId('reviewFeedback').textContent=`复习正确！下次复习间隔：${REVIEW_INTERVALS[nextStage]} 天。正在进入下一题…`;
      setTimeout(startReview,750);
    }else{
      failReview(reviewCurrent.id);
      [...document.querySelectorAll('.reviewOption')].forEach(x=>{if(x.textContent===reviewCurrent.meaning)x.classList.add('correct');});
      byId('reviewFeedback').textContent='复习错误，已放回错题本。正确答案：'+reviewCurrent.meaning;
    }
    byId('reviewFeedback').classList.remove('hidden');
    save(); renderWrong(); renderReview(); updateStats(); renderList();
  });
}
function renderReview(){
  let arr=dueReviewWords();
  byId('reviewList').innerHTML = arr.length ? `<div class="small">今日到期 ${arr.length} 个</div>` + arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div></div>`).join('') : '<div class="small">今天没有到期复习词。已掌握词会按 1/3/7/15/30 天自动进入这里。</div>';
}
byId('startReview').onclick=startReview;

function renderWrong(){let arr=WORDS.filter(w=>state.wrong.includes(w.id)); byId('wrongList').innerHTML=arr.length?arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div><div class="small">${w.note||''}</div></div>`).join(''):'暂无错题。';}
byId('clearWrong').onclick=()=>{state.wrong=[];save();renderWrong();updateStats();}
byId('wrongQuizBtn').onclick=()=>{byId('quizScope').value='wrong'; document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active')); document.querySelector('[data-tab="quiz"]').classList.add('active'); byId('quiz').classList.add('active'); startQuiz();};
function renderList(){let scope=byId('listScope').value, kw=byId('search').value.trim().toLowerCase(); let arr=filtered(scope).filter(w=>(w.term+w.meaning+w.question+w.note).toLowerCase().includes(kw)); byId('wordList').innerHTML=`<div class="small">显示 ${arr.length} 个</div>`+arr.map(w=>`<div class="listItem">${chip(w)}<div><b>${w.term}</b></div><div class="phonetic">${phonetic(w)}</div>${speakButton(w)}<div>${w.meaning}</div><div class="small">${w.note||''}</div></div>`).join('');}
byId('search').oninput=renderList; byId('listScope').onchange=renderList;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active')); t.classList.add('active'); byId(t.dataset.tab).classList.add('active'); renderList(); renderWrong(); renderReview(); updateStats();});
document.addEventListener('click', e=>{const btn=e.target.closest('[data-speak]'); if(btn){e.preventDefault(); speakTerm(btn.dataset.speak);}});
pickStudy(); renderList(); renderWrong(); renderReview();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

</script>
</body></html>
